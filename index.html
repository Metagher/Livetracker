/* ============================================================
   @section CONFIG — Supabase/Anthropic-Zugangsdaten (localStorage, pro Gerät)
   STANDALONE-KONFIGURATION (Supabase + Anthropic API-Key)
   Wird einmalig über den Setup-Screen abgefragt und lokal im
   Browser (localStorage) auf DIESEM Gerät gespeichert. Diese
   Werte selbst werden NICHT synchronisiert - nur die App-Daten.
   ============================================================ */
const CONFIG_KEY = "lifetracker-config";
// Entfernt versehentlich mit eingegebene /rest/v1-Pfade und trailing Slashes,
// damit die App auch dann funktioniert, wenn die volle REST-URL statt nur
// der Projekt-URL eingetragen wurde.
function normalizeSupabaseUrl(url) {
  if (!url) return url;
  return url.trim().replace(/\/rest\/v1\/?.*$/i, "").replace(/\/+$/, "");
}
function getConfig() {
  try {
    const cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || "null");
    if (cfg?.supabaseUrl) cfg.supabaseUrl = normalizeSupabaseUrl(cfg.supabaseUrl);
    return cfg;
  } catch { return null; }
}
function setConfig(cfg) {
  const clean = { ...cfg, supabaseUrl: normalizeSupabaseUrl(cfg.supabaseUrl) };
  localStorage.setItem(CONFIG_KEY, JSON.stringify(clean));
}
function getAnthropicKey() {
  return getConfig()?.anthropicKey || "";
}

/* ============================================================
   @section STORAGE-SHIM — window.storage-Ersatz über Supabase REST (KV-Tabelle)
   STORAGE-SHIM: ersetzt Claudes window.storage 1:1 durch
   Aufrufe an eine Supabase-Tabelle "lifetracker_kv_store" (key/value/updated_at).
   Dieselbe Schnittstelle (get/set liefern {key, value}) wie zuvor,
   damit der komplette App-Code unverändert bleibt.
   ============================================================ */
function installStorageShim() {
  window.storage = {
    get: async (key) => {
      const cfg = getConfig();
      if (!cfg?.supabaseUrl || !cfg?.supabaseKey) throw new Error("Nicht konfiguriert");
      const res = await fetch(
        `${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
        { headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` } }
      );
      if (!res.ok) throw new Error("Supabase-Fehler: " + res.status);
      const rows = await res.json();
      if (!rows.length) throw new Error("Kein Eintrag für " + key);
      return { key, value: rows[0].value, shared: false };
    },
    getMany: async (keys) => {
      const cfg = getConfig();
      if (!cfg?.supabaseUrl || !cfg?.supabaseKey) throw new Error("Nicht konfiguriert");
      const filter = keys.map((key) => encodeURIComponent(key)).join(",");
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?key=in.(${filter})&select=key,value`, {
        headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` },
      });
      if (!res.ok) throw new Error("Supabase-Fehler: " + res.status);
      const rows = await res.json();
      return Object.fromEntries(rows.map((row) => [row.key, row.value]));
    },
    set: async (key, value) => {
      const cfg = getConfig();
      if (!cfg?.supabaseUrl || !cfg?.supabaseKey) throw new Error("Nicht konfiguriert");
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store`, {
        method: "POST",
        headers: {
          apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=representation",
        },
        body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
      });
      if (!res.ok) throw new Error("Supabase-Fehler: " + res.status);
      const data = await res.json();
      return { key, value: data[0]?.value ?? value, shared: false };
    },
    delete: async (key) => {
      const cfg = getConfig();
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?key=eq.${encodeURIComponent(key)}`, {
        method: "DELETE",
        headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` },
      });
      return { key, deleted: res.ok, shared: false };
    },
    list: async (prefix) => {
      const cfg = getConfig();
      const q = prefix ? `&key=like.${encodeURIComponent(prefix)}*` : "";
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?select=key${q}`, {
        headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` },
      });
      const rows = res.ok ? await res.json() : [];
      return { keys: rows.map((r) => r.key), prefix, shared: false };
    },
  };
}
installStorageShim();

/* ============================================================
   @section SETUP-GATE — Einmaliger Einrichtungsscreen vor App-Start
   SETUP-SCREEN: fragt Supabase- und Anthropic-Zugangsdaten ab,
   bevor die eigentliche App startet.
   ============================================================ */
function SetupGate({ children }) {
  const [cfg, setCfgState] = useState(() => getConfig());
  const [supabaseUrl, setSupabaseUrl] = useState(cfg?.supabaseUrl || "");
  const [supabaseKey, setSupabaseKey] = useState(cfg?.supabaseKey || "");
  const [anthropicKey, setAnthropicKey] = useState(cfg?.anthropicKey || "");
  const [testErr, setTestErr] = useState(null);
  const [testing, setTesting] = useState(false);

  if (cfg?.supabaseUrl && cfg?.supabaseKey) return children;

  const save = async () => {
    setTesting(true);
    setTestErr(null);
    try {
      const cleanUrl = normalizeSupabaseUrl(supabaseUrl);
      const res = await fetch(`${cleanUrl}/rest/v1/lifetracker_kv_store?select=key&limit=1`, {
        headers: { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}` },
      });
      if (!res.ok) throw new Error("Verbindung fehlgeschlagen (" + res.status + "). Prüfe URL/Key und ob die Tabelle lifetracker_kv_store existiert.");
      const next = { supabaseUrl: cleanUrl, supabaseKey, anthropicKey };
      setConfig(next);
      setCfgState(next);
    } catch (e) {
      setTestErr(e.message || "Verbindung fehlgeschlagen.");
    } finally {
      setTesting(false);
    }
  };

  return (
    <div style={{
      minHeight: "100vh", background: "#15161B", color: "#F1EFE9", display: "flex",
      alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "Inter, sans-serif",
    }}>
      <div style={{ maxWidth: 440, width: "100%", background: "#1E2027", border: "1px solid #31333D", borderRadius: 18, padding: 26 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600, marginBottom: 6 }}>Lifetracker einrichten</h1>
        <p style={{ fontSize: 13, color: "#93949F", lineHeight: 1.6, marginBottom: 20 }}>
          Einmalige Einrichtung auf diesem Gerät. Trage deine Supabase-Zugangsdaten ein (für die Cloud-Synchronisation über alle Geräte)
          und optional deinen Anthropic API-Key (für den KI-Coach).
        </p>

        <label style={{ fontSize: 11.5, fontWeight: 600, color: "#93949F", textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 6 }}>Supabase-Projekt-URL</label>
        <input value={supabaseUrl} onChange={(e) => setSupabaseUrl(e.target.value)} placeholder="https://xxxxx.supabase.co"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #31333D", background: "#15161B", color: "#F1EFE9", fontSize: 13.5, marginBottom: 6 }} />
        <div style={{ fontSize: 11, color: "#5B5D68", marginBottom: 14 }}>Nur die Basis-URL, ohne "/rest/v1" am Ende (wird automatisch ergänzt).</div>

        <label style={{ fontSize: 11.5, fontWeight: 600, color: "#93949F", textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 6 }}>Supabase anon Public Key</label>
        <input value={supabaseKey} onChange={(e) => setSupabaseKey(e.target.value)} placeholder="eyJhbGciOi..." type="password"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #31333D", background: "#15161B", color: "#F1EFE9", fontSize: 13.5, marginBottom: 14 }} />

        <label style={{ fontSize: 11.5, fontWeight: 600, color: "#93949F", textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 6 }}>Anthropic API-Key (optional, für den Coach)</label>
        <input value={anthropicKey} onChange={(e) => setAnthropicKey(e.target.value)} placeholder="sk-ant-..." type="password"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #31333D", background: "#15161B", color: "#F1EFE9", fontSize: 13.5, marginBottom: 18 }} />

        {testErr && <div style={{ color: "#FF6F91", fontSize: 12.5, marginBottom: 14 }}>{testErr}</div>}

        <button onClick={save} disabled={testing || !supabaseUrl || !supabaseKey} style={{
          width: "100%", padding: "11px 0", borderRadius: 9, border: "none", fontWeight: 700, fontSize: 14,
          background: "linear-gradient(135deg, #FF7A45, #FFC15E)", color: "#1A1305",
          cursor: testing ? "not-allowed" : "pointer", opacity: testing || !supabaseUrl || !supabaseKey ? 0.6 : 1,
        }}>
          {testing ? "Verbinde …" : "Verbindung testen & speichern"}
        </button>

        <p style={{ fontSize: 11.5, color: "#5B5D68", marginTop: 16, lineHeight: 1.6 }}>
          Anleitung: supabase.com → kostenloses Projekt anlegen → SQL-Editor → Tabelle "lifetracker_kv_store" mit Spalten
          key (text, primary key), value (text), updated_at (timestamptz) anlegen → Row Level Security für diese Tabelle
          deaktivieren (nur für den Eigengebrauch!) → URL und "anon public" Key aus Project Settings → API hier eintragen.
        </p>
      </div>
    </div>
  );
}

/* ============================================================
   @section DESIGN-TOKENS — Farben, Fonts, Icon-/Habit-Farbpalette
   DESIGN TOKENS
   Bg: warm charcoal (nicht reines Schwarz) · Ember-Akzent für Streaks
   Serif-Ziffern (Fraunces) für große Kennzahlen, Inter für UI,
   JetBrains Mono für Kalender/Statistik-Zahlen
   ============================================================ */
const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');`;

const COLORS = {
  bg: "#15161B",
  bgSoft: "#1A1C22",
  surface: "#1E2027",
  surfaceRaised: "#262933",
  border: "#31333D",
  borderSoft: "#2A2C34",
  text: "#F1EFE9",
  textMuted: "#93949F",
  textFaint: "#5B5D68",
  ember1: "#FF7A45",
  ember2: "#FFC15E",
  mint: "#4ADE9E",
  coral: "#FF6F91",
  violet: "#9B8CFF",
};

const HABIT_COLORS = ["#FF7A45", "#4ADE9E", "#9B8CFF", "#FF6F91", "#5EC8FF", "#FFD166", "#C77DFF", "#6EE7B7"];

const ICONS = [
  { key: "dumbbell", Icon: Dumbbell }, { key: "book", Icon: BookOpen },
  { key: "brain", Icon: Brain }, { key: "droplet", Icon: Droplet },
  { key: "moon", Icon: Moon }, { key: "sun", Icon: Sun },
  { key: "wine", Icon: Wine }, { key: "phone", Icon: Smartphone },
  { key: "candy", Icon: Candy }, { key: "food", Icon: Utensils },
  { key: "music", Icon: Music }, { key: "pen", Icon: Pen },
  { key: "code", Icon: Code }, { key: "heart", Icon: Heart },
];
/* ============================================================
   @section POINTS-HELPERS — Icon-/Kategorie-Zuordnung, Goal-/Task-Punktesummen
   ============================================================ */
const iconFor = (key) => (ICONS.find((i) => i.key === key) || ICONS[0]).Icon;

const UNCATEGORIZED = "Ohne Kategorie";
function categoryOf(habit) {
  return (habit.category || "").trim() || UNCATEGORIZED;
}
function categoryColor(category) {
  if (!category || category === UNCATEGORIZED) return COLORS.textFaint;
  let hash = 0;
  for (let i = 0; i < category.length; i++) hash = category.charCodeAt(i) + ((hash << 5) - hash);
  return HABIT_COLORS[Math.abs(hash) % HABIT_COLORS.length];
}
// Gruppiert Habits nach Kategorie; "Ohne Kategorie" steht immer zuletzt
function groupHabitsByCategory(habits) {
  const map = {};
  habits.forEach((h) => {
    const cat = categoryOf(h);
    if (!map[cat]) map[cat] = [];
    map[cat].push(h);
  });
  const keys = Object.keys(map).sort((a, b) => {
    if (a === UNCATEGORIZED) return 1;
    if (b === UNCATEGORIZED) return -1;
    return a.localeCompare(b, "de");
  });
  return keys.map((category) => ({ category, habits: map[category] }));
}

// Punkte aus erreichten Zielen (Goals) - zählen genauso zu den Gesamtpunkten
// wie Habit-Punkte, gutgeschrieben am Tag der Erreichung
function totalGoalPoints(goals) {
  return (goals || []).filter((g) => g.achieved).reduce((s, g) => s + g.points, 0);
}
function goalPointsOnDate(goals, dateKey) {
  return (goals || []).filter((g) => g.achieved && g.achievedAt === dateKey).reduce((s, g) => s + g.points, 0);
}
function goalPointsInRange(goals, dateKeys) {
  return (goals || []).filter((g) => g.achieved && dateKeys.includes(g.achievedAt)).reduce((s, g) => s + g.points, 0);
}

// Punkte aus erledigten Tasks - zählen genauso zu den Gesamtpunkten wie
// Habit- und Ziel-Punkte, gutgeschrieben am Tag der Erledigung
// Krönchen-Kennzeichnung für Aufgaben mit hoher Punktzahl
function crownCount(points) {
  if (points >= 20) return 3;
  if (points >= 10) return 2;
  if (points >= 5) return 1;
  return 0;
}
function CrownBadge({ points, size = 10 }) {
  const count = crownCount(points);
  if (count === 0) return null;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 1 }} title={`${points} Punkte`}>
      {Array.from({ length: count }).map((_, i) => (
        <Crown key={i} size={size} style={{ color: "#FFC15E", fill: "#FFC15E" }} />
      ))}
    </span>
  );
}

function totalTaskPoints(tasks) {
  return (tasks || []).filter((t) => t.completed).reduce((s, t) => s + t.points, 0);
}
function taskPointsOnDate(tasks, dateKey) {
  return (tasks || []).filter((t) => t.completed && t.completedAt === dateKey).reduce((s, t) => s + t.points, 0);
}
function taskPointsInRange(tasks, dateKeys) {
  return (tasks || []).filter((t) => t.completed && dateKeys.includes(t.completedAt)).reduce((s, t) => s + t.points, 0);
}

/* ============================================================
   @section DATE-HELPERS — Datumsformatierung, Wochen-/Monatsgrenzen, ISO-Kalenderwoche
   ============================================================ */
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => toKey(new Date());
function useCurrentDateKey() {
  const [dateKey, setDateKey] = useState(todayKey);
  useEffect(() => {
    let timer;
    const scheduleNextDay = () => {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
      timer = setTimeout(() => { setDateKey(todayKey()); scheduleNextDay(); }, Math.max(1000, next - now));
    };
    scheduleNextDay();
    return () => clearTimeout(timer);
  }, []);
  return dateKey;
}
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const keyToDate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const isValidDateKey = (key) => {
  if (typeof key !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
  const date = keyToDate(key);
  return !Number.isNaN(date.getTime()) && toKey(date) === key;
};
const dayLabel = (k) => keyToDate(k).toLocaleDateString("de-DE", { weekday: "short" });
const shortDate = (k) => keyToDate(k).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
const longDate = (k) => keyToDate(k).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const WEEKDAY_LABELS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day; // Woche beginnt Montag
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function isoWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
}

/* ============================================================
   @section POINTS-ENGINE — Streak-/Punkteberechnung inkl. Meilenstein-Boni (simulateHabit)
   ============================================================ */
const DIFFICULTY_BASE = { leicht: 2, mittel: 5, schwer: 10 };
const DIFFICULTY_LABELS = { leicht: "Leicht", mittel: "Mittel", schwer: "Schwer" };
const DIFFICULTY_COLORS = { leicht: COLORS.mint, mittel: COLORS.ember2, schwer: COLORS.coral };

function streakPoints(day, base = 10) {
  if (day <= 0) return 0;
  if (day === 1) return base;
  return Math.round(base * (1 + (Math.min(day * 2, 20) + Math.sqrt(Math.max(day - 10, 0)) * 5) / 10));
}

// Meilensteine: einmaliger Bonus pro Streak-Lauf, wenn die Streak diese
// Länge erreicht. Der Bonus wird mit der Schwierigkeit des Habits skaliert,
// damit "Schwer"-Habits die Streak-Konstanz stärker belohnen als "Leicht".
const STREAK_MILESTONES = [
  { days: 3, mult: 2 },
  { days: 7, mult: 5 },
  { days: 14, mult: 10 },
  { days: 30, mult: 20 },
  { days: 60, mult: 40 },
  { days: 100, mult: 75 },
  { days: 200, mult: 150 },
  { days: 365, mult: 300 },
];
function milestoneBonus(days, base) {
  const m = STREAK_MILESTONES.find((x) => x.days === days);
  return m ? Math.round(base * m.mult) : 0;
}
function nextMilestoneFor(currentStreak) {
  return STREAK_MILESTONES.find((m) => m.days > currentStreak) || null;
}

function isSuccess(habit, value) {
  if (value === undefined || value === null || value === false) return false;
  if (habit.trackingType === "boolean") return value === true;
  if (habit.trackingType === "count") return Number(value) >= Number(habit.target || 1);
  if (habit.trackingType === "time") return Number(value) >= Number(habit.target || 1);
  // "clock": Uhrzeit-Vergleich (Minuten seit Mitternacht) gegen eine Vorgabe -
  // je nach timeDirection ist "früher als" oder "später als" die Vorgabe erfüllt.
  if (habit.trackingType === "clock") {
    if (typeof value !== "number" || Number.isNaN(value)) return false;
    return habit.timeDirection === "after" ? value >= Number(habit.target || 0) : value <= Number(habit.target || 0);
  }
  // "value" bleibt aus Kompatibilitätsgründen für bereits bestehende Habits
  // erhalten (jede eingetragene Zahl zählt als erfüllt), ist aber im Habit-
  // Modal nicht mehr neu auswählbar - siehe "Anzahl" mit optionaler Einheit.
  if (habit.trackingType === "value") return typeof value === "number" && !Number.isNaN(value);
  return false;
}

// Minuten seit Mitternacht <-> "HH:MM" für die Uhrzeit-Tracking-Art.
function minutesToClock(mins) {
  if (typeof mins !== "number" || Number.isNaN(mins)) return "";
  const h = Math.floor(mins / 60) % 24;
  const m = Math.round(mins % 60);
  return `${pad(h)}:${pad(m)}`;
}
function clockToMinutes(hhmm) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
}

// Sentinel-Wert für übersprungene Tage (z. B. Urlaub) - unabhängig von der
// Tracking-Art des Habits, da echte Werte dort immer boolean/number sind.
const SKIP_VALUE = "skip";

function dayStatus(habit, entries, dateKey) {
  const v = entries?.[dateKey]?.[habit.id];
  if (v === SKIP_VALUE) return "skip";
  if (v === undefined || v === null) return "empty";
  return isSuccess(habit, v) ? "success" : "fail";
}

// Findet den frühesten Tag, an dem für diesen Habit rückwirkend ein Eintrag
// gemacht wurde (auch vor dem ursprünglichen Startdatum) - so zählen
// nachträglich abgehakte Tage korrekt in Streak & Punkte hinein.
function earliestTrackedDate(habit, entries) {
  let earliest = null;
  for (const dateKey in entries) {
    if (entries[dateKey] && entries[dateKey][habit.id] !== undefined) {
      if (!earliest || dateKey < earliest) earliest = dateKey;
    }
  }
  return earliest;
}
function earliestTrackedDatesByHabit(entries) {
  const result = {};
  Object.entries(entries || {}).forEach(([dateKey, day]) => {
    Object.keys(day || {}).forEach((habitId) => {
      if (!result[habitId] || dateKey < result[habitId]) result[habitId] = dateKey;
    });
  });
  return result;
}

// Simuliert einen Habit chronologisch ab Erstellung (bzw. ab dem frühesten
// rückwirkenden Eintrag) und liefert tägliche Streak-/Punktewerte.
// Positive und negative Streaks wachsen symmetrisch: je länger am Stück
// erfüllt bzw. nicht erfüllt wurde, desto größer der Punktegewinn/-verlust.
function simulateHabit(habit, entries, untilKey, knownEarliest) {
  const base = DIFFICULTY_BASE[habit.difficulty] || DIFFICULTY_BASE.mittel;
  const startKey = habit.startDate || habit.createdAt;
  const earliest = knownEarliest === undefined ? earliestTrackedDate(habit, entries) : knownEarliest;
  const effectiveStartKey = earliest && earliest < startKey ? earliest : startKey;
  const start = keyToDate(effectiveStartKey);
  const end = keyToDate(untilKey);
  let cursor = new Date(start);
  let streak = 0;
  let negStreak = 0;
  let longest = 0;
  let longestNeg = 0;
  let totalSuccess = 0;
  let totalFail = 0;
  let points = 0;
  let totalMilestoneBonus = 0;
  let totalNegativeMilestonePenalty = 0;
  const daily = [];

  const currentDayKey = todayKey();
  while (cursor <= end) {
    const k = toKey(cursor);
    const status = dayStatus(habit, entries, k);
    let delta = 0;
    let milestoneHit = 0;
    let negMilestoneHit = 0;
    let dayPoints = 0;
    let bonusPoints = 0;
    let malusPoints = 0;
    if (status === "success") {
      streak += 1;
      negStreak = 0;
      dayPoints = streakPoints(streak, base);
      const bonus = milestoneBonus(streak, base);
      if (bonus > 0) { bonusPoints = bonus; totalMilestoneBonus += bonus; milestoneHit = streak; }
      delta = dayPoints + bonusPoints;
      points += delta;
      totalSuccess += 1;
      if (streak > longest) longest = streak;
    } else if (status === "fail") {
      negStreak += 1;
      streak = 0;
      dayPoints = -streakPoints(negStreak, base);
      const malus = milestoneBonus(negStreak, base);
      if (malus > 0) { malusPoints = -malus; totalNegativeMilestonePenalty += malus; negMilestoneHit = negStreak; }
      delta = dayPoints + malusPoints;
      points += delta;
      totalFail += 1;
      if (negStreak > longestNeg) longestNeg = negStreak;
    } else if (status === "skip") {
      // Übersprungener Tag (z. B. Urlaub): gilt als nicht existent - weder
      // Streak noch Punkte werden verändert, und er zählt nicht zu Erfolgs-
      // quote/Tracked-Days. Streak & negStreak bleiben also unangetastet.
    } else {
      // "empty": nur heute zählt als "noch offen" (bricht nichts).
      // Vergangene ungetrackte Tage sind neutral (0 Punkte), brechen aber
      // sowohl positive als auch negative Streaks.
      if (k !== currentDayKey) {
        streak = 0;
        negStreak = 0;
      }
    }
    daily.push({ date: k, status, streak, negStreak, delta, points, milestoneHit, negMilestoneHit, dayPoints, bonusPoints, malusPoints });
    cursor = addDays(cursor, 1);
  }

  const trackedDays = totalSuccess + totalFail;
  const successRate = trackedDays > 0 ? Math.round((totalSuccess / trackedDays) * 100) : 0;
  const nextMilestone = nextMilestoneFor(streak);

  return {
    daily,
    currentStreak: streak,
    currentNegStreak: negStreak,
    longestStreak: longest,
    longestNegStreak: longestNeg,
    totalSuccess,
    totalFail,
    successRate,
    totalPoints: points,
    totalMilestoneBonus,
    totalNegativeMilestonePenalty,
    nextMilestone: nextMilestone ? { days: nextMilestone.days, daysLeft: nextMilestone.days - streak, bonus: milestoneBonus(nextMilestone.days, base) } : null,
  };
}

function windowSum(dailyTotals, size) {
  let best = -Infinity;
  for (let i = 0; i <= dailyTotals.length - size; i++) {
    let sum = 0;
    for (let j = i; j < i + size; j++) sum += dailyTotals[j].points;
    if (sum > best) best = sum;
  }
  return best === -Infinity ? 0 : best;
}
function lastWindowSum(dailyTotals, size) {
  const slice = dailyTotals.slice(-size);
  return slice.reduce((a, d) => a + d.points, 0);
}

function useLifeOSData() {
  const [habits, setHabits] = useState([]);
  const [entries, setEntries] = useState({});

  const [coach, setCoach] = useState(null);
  const [journal, setJournal] = useState({});
  const [weeklyReports, setWeeklyReports] = useState({});
  const [goals, setGoals] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [persons, setPersons] = useState([]);
  const [categories, setCategories] = useState([]);
  const [personGroups, setPersonGroups] = useState([]);
  const [moods, setMoods] = useState({});
  const [consumables, setConsumables] = useState([]);
  const [shoppingList, setShoppingList] = useState([]);
  const [notes, setNotes] = useState([]);
  const [noteFolders, setNoteFolders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [error, setError] = useState(null);
  const writeQueuesRef = useRef({});
  const readStoredJSON = (stored, key, fallback) => {
    if (!Object.prototype.hasOwnProperty.call(stored, key)) return fallback;
    try { return JSON.parse(stored[key]); } catch { throw new Error(`Ungültige gespeicherte Daten: ${key}`); }
  };
  const enqueueWrite = useCallback((key, value) => {
    const previous = writeQueuesRef.current[key] || Promise.resolve();
    const job = previous.catch(() => {}).then(() => window.storage.set(key, JSON.stringify(value)));
    writeQueuesRef.current[key] = job;
    return job.catch(() => { setError("Eine Änderung konnte nicht gespeichert werden. Bitte Verbindung prüfen und erneut versuchen."); });
  }, []);

  const loadAll = useCallback(async ({ silent } = {}) => {
    if (silent) setRefreshing(true);
    try {
      const keys = ["los-habits", "los-entries", "los-achievements", "los-coach", "los-journal", "los-weekly-reports", "los-goals", "los-tasks", "los-persons", "los-categories", "los-person-groups", "los-moods", "los-consumables", "los-shopping-list", "los-notes", "los-note-folders"];
      const stored = await window.storage.getMany(keys);
      setHabits(readStoredJSON(stored, "los-habits", []));
      setEntries(readStoredJSON(stored, "los-entries", {}));
      setAchievements(readStoredJSON(stored, "los-achievements", []));
      setCoach(readStoredJSON(stored, "los-coach", null));
      setJournal(readStoredJSON(stored, "los-journal", {}));
      setWeeklyReports(readStoredJSON(stored, "los-weekly-reports", {}));
      setGoals(readStoredJSON(stored, "los-goals", []));
      setTasks(readStoredJSON(stored, "los-tasks", []));
      setPersons(readStoredJSON(stored, "los-persons", []));
      setCategories(readStoredJSON(stored, "los-categories", []));
      setPersonGroups(readStoredJSON(stored, "los-person-groups", []));
      setMoods(readStoredJSON(stored, "los-moods", {}));
      setConsumables(readStoredJSON(stored, "los-consumables", []));
      setShoppingList(readStoredJSON(stored, "los-shopping-list", []));
      setNotes(readStoredJSON(stored, "los-notes", []));
      setNoteFolders(readStoredJSON(stored, "los-note-folders", []));
      setError(null);
    } catch (err) {
      setError("Deine Daten konnten nicht geladen werden.");
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
  }, []);

  useEffect(() => {
    loadAll();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const refresh = useCallback(() => loadAll({ silent: true }), [loadAll]);

  const persistHabits = useCallback(async (next) => {
    setHabits(next);
    await enqueueWrite("los-habits", next);
  }, [enqueueWrite]);
  const persistEntries = useCallback(async (next) => {
    setEntries(next);
    await enqueueWrite("los-entries", next);
  }, [enqueueWrite]);
  const persistAchievements = useCallback(async (next) => {
    setAchievements(next);
    await enqueueWrite("los-achievements", next);
  }, [enqueueWrite]);
  const persistCoach = useCallback(async (next) => {
    setCoach(next);
    await enqueueWrite("los-coach", next);
  }, [enqueueWrite]);
  const persistJournal = useCallback(async (next) => {
    setJournal(next);
    await enqueueWrite("los-journal", next);
  }, [enqueueWrite]);
  const persistWeeklyReports = useCallback(async (next) => {
    setWeeklyReports(next);
    await enqueueWrite("los-weekly-reports", next);
  }, [enqueueWrite]);
  const persistGoals = useCallback(async (next) => {
    setGoals(next);
    await enqueueWrite("los-goals", next);
  }, [enqueueWrite]);
  const persistTasks = useCallback(async (next) => {
    setTasks(next);
    await enqueueWrite("los-tasks", next);
  }, [enqueueWrite]);
  const persistPersons = useCallback(async (next) => {
    setPersons(next);
    await enqueueWrite("los-persons", next);
  }, [enqueueWrite]);
  const persistCategories = useCallback(async (next) => {
    setCategories(next);
    await enqueueWrite("los-categories", next);
  }, [enqueueWrite]);
  const persistPersonGroups = useCallback(async (next) => {
    setPersonGroups(next);
    await enqueueWrite("los-person-groups", next);
  }, [enqueueWrite]);
  const persistMoods = useCallback(async (next) => {
    setMoods(next);
    await enqueueWrite("los-moods", next);
  }, [enqueueWrite]);
  const persistConsumables = useCallback(async (next) => {
    setConsumables(next);
    await enqueueWrite("los-consumables", next);
  }, [enqueueWrite]);
  const persistShoppingList = useCallback(async (next) => {
    setShoppingList(next);
    await enqueueWrite("los-shopping-list", next);
  }, [enqueueWrite]);
  const persistNotes = useCallback(async (next) => {
    setNotes(next);
    await enqueueWrite("los-notes", next);
  }, [enqueueWrite]);
  const persistNoteFolders = useCallback(async (next) => {
    setNoteFolders(next);
    await enqueueWrite("los-note-folders", next);
  }, [enqueueWrite]);

  return {
    habits, entries, achievements, coach, journal, weeklyReports, goals, tasks, persons, categories, personGroups, moods, consumables, shoppingList, notes, noteFolders, loading, refreshing, error,
    persistHabits, persistEntries, persistAchievements, persistCoach, persistJournal, persistWeeklyReports, persistGoals, persistTasks, persistPersons, persistCategories, persistPersonGroups, persistMoods, persistConsumables, persistShoppingList, persistNotes, persistNoteFolders,
    refresh,
  };
}

      onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = danger ? COLORS.coral : COLORS.textMuted; }}

// Kleine Tages-Kacheln: erfüllt = Grün, nicht erfüllt = Rot, übersprungen (z. B. Urlaub) = Blau.
const TILE_SUCCESS = COLORS.mint;
const TILE_FAIL = "#F0454D";
const TILE_SKIP = "#4DA6FF";

function EmberDot({ level, size = 9, negative = false, skip = false }) {
  // level 0..1 -> Intensität (Glow-Stärke) für erfüllte bzw. nicht erfüllte Tage
  const glow = 4 + level * 14;
  let bg = COLORS.borderSoft;
  if (skip) bg = TILE_SKIP;
  else if (level > 0) bg = negative ? TILE_FAIL : TILE_SUCCESS;
  return (
    <div style={{
      width: size, height: size, borderRadius: 3, background: bg,
      boxShadow: skip ? "none" : level > 0 ? `0 0 ${glow}px ${negative ? "rgba(240,69,77," : "rgba(74,222,158,"}${0.25 + level * 0.35})` : "none",
      opacity: skip ? 0.85 : level <= 0 ? 0.5 : negative ? 0.9 : 1,
    }} />
  );
}

/* ============================================================
   @section CONFETTI — Feier-Animation beim Abhaken eines Habits
   ============================================================ */
function Confetti({ trigger }) {
  const pieces = useMemo(() => Array.from({ length: 26 }, (_, i) => ({
    id: i,
    left: 45 + Math.random() * 10,
    delay: Math.random() * 0.15,
    dur: 0.9 + Math.random() * 0.6,
    dx: (Math.random() - 0.5) * 220,
    rot: Math.random() * 360,
    color: [COLORS.ember1, COLORS.ember2, COLORS.mint, COLORS.violet, COLORS.coral][i % 5],
  })), [trigger]);

  if (!trigger) return null;
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 200, overflow: "hidden" }}>
      {pieces.map((p) => (
        <span key={p.id + "-" + trigger} style={{
          position: "absolute", top: "40%", left: `${p.left}%`, width: 7, height: 10,
          background: p.color, borderRadius: 2,
          animation: `los-confetti ${p.dur}s ease-out ${p.delay}s forwards`,
          "--dx": `${p.dx}px`, "--rot": `${p.rot}deg`,
        }} />
      ))}
    </div>
  );
}

   ============================================================ */
function CategoryPicker({ value, categories, onChange, onAddCategory }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");

  const confirmAdd = () => {
    const trimmed = newName.trim();
    setAdding(false);
    setNewName("");
    if (!trimmed) return;
    if (!categories.includes(trimmed)) onAddCategory(trimmed);
    onChange(trimmed);
  };

  if (adding) {
    return (
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>

          value={newName} onChange={(e) => setNewName(e.target.value)}

        <button type="button" onClick={() => { setAdding(false); setNewName(""); }} style={ghostBtn}>Abbrechen</button>
      </div>
    );
  }

  return (
    <select
      value={value || ""}
      onChange={(e) => (e.target.value === "__new__" ? setAdding(true) : onChange(e.target.value))}
      style={{ ...inputStyle, cursor: "pointer" }}

  position: "fixed", left: 0, right: 0, bottom: "auto", background: "rgba(10,10,12,0.6)", backdropFilter: "blur(3px)",
  // Muss über MobileHeader (150) und BottomNav (200) liegen, sonst verdeckt die

  paddingRight: 12,

  boxSizing: "border-box", overflow: "hidden",
};
// Fixer Rahmen (Kopf+Body+Footer als Flex-Spalte) statt "position: sticky" für den
// Footer: sticky erwies sich auf iOS bei langen Formularen + eingeblendeter Tastatur
// als unzuverlässig. Jetzt ist NUR modalBodyStyle scrollbar, modalFooterStyle liegt
// als normales Flex-Geschwisterelement immer sichtbar darunter.
const modalStyle = {
  background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 18,

};
const modalBodyStyle = {
  padding: 24, overflowY: "auto", overscrollBehaviorY: "contain", flex: "1 1 auto", minHeight: 0,
};
const labelStyle = { display: "block", fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, marginBottom: 6, marginTop: 2, textTransform: "uppercase", letterSpacing: "0.04em" };
const modalFooterStyle = {

  gap: 10, flexWrap: "wrap",

  flexShrink: 0,

};
const inputStyle = {

  background: COLORS.bgSoft, color: COLORS.text, fontSize: 14, marginBottom: 14, outline: "none", fontFamily: "Inter, sans-serif",
};
const primaryBtn = {
  padding: "10px 18px", borderRadius: 9, border: "none",
  background: `linear-gradient(135deg, ${COLORS.ember1}, ${COLORS.ember2})`,
  color: "#1A1305", fontWeight: 700, fontSize: 13.5, cursor: "pointer",
};
const ghostBtn = {
  padding: "10px 16px", borderRadius: 9, border: `1px solid ${COLORS.border}`,
  background: "transparent", color: COLORS.textMuted, fontWeight: 600, fontSize: 13.5, cursor: "pointer",
};

// iOS Safari verkleinert bei eingeblendeter Tastatur nur den "visual viewport", nicht
// den Layout-Viewport - ein "position: fixed"-Overlay bleibt also auf volle Bildschirmhöhe
// gestreckt und rutscht mitsamt seinem unteren Rand (und damit den Speichern/Schließen-
// Buttons) hinter die Tastatur. Dieser Hook liefert Höhe + Offset des tatsächlich
// sichtbaren Bereichs, damit die Modal-Overlays sich live daran ausrichten können.
function useVisualViewport() {
  const getSnapshot = () => {
    if (typeof window === "undefined") return { height: 0, top: 0 };
    if (!window.visualViewport) return { height: window.innerHeight, top: 0 };
    return { height: window.visualViewport.height, top: window.visualViewport.offsetTop };
  };
  const [viewport, setViewport] = useState(getSnapshot);
  useEffect(() => {
    if (typeof window === "undefined" || !window.visualViewport) return;
    const update = () => setViewport(getSnapshot());
    window.visualViewport.addEventListener("resize", update);
    window.visualViewport.addEventListener("scroll", update);
    update();
    return () => {
      window.visualViewport.removeEventListener("resize", update);
      window.visualViewport.removeEventListener("scroll", update);
    };
  }, []);
  return viewport;
}

/* ============================================================
   @section DATE-PICKER — Monats-Kalender als Popover (für Ziel-/Aufgaben-Termine)
   DATE PICKER (Monats-Kalender als Popover)
   ============================================================ */
function DatePicker({ value, onChange, placeholder = "Datum wählen" }) {
  const [open, setOpen] = useState(false);
  const [viewMonth, setViewMonth] = useState(() => startOfMonth(value ? keyToDate(value) : new Date()));
  const [coords, setCoords] = useState(null);
  const wrapRef = useRef(null);
  const btnRef = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  useEffect(() => {
    if (!open) return;
    const close = () => setOpen(false);
    window.addEventListener("scroll", close, true);
    window.addEventListener("resize", close);
    return () => { window.removeEventListener("scroll", close, true); window.removeEventListener("resize", close); };
  }, [open]);

  const openPicker = () => {
    setViewMonth(startOfMonth(value ? keyToDate(value) : new Date()));
    if (btnRef.current) {
      const rect = btnRef.current.getBoundingClientRect();
      const width = 260;
      const popoverHeight = 340;
      const spaceBelow = window.innerHeight - rect.bottom;
      const openUpward = spaceBelow < popoverHeight && rect.top > popoverHeight;
      setCoords({
        top: openUpward ? Math.max(12, rect.top - popoverHeight - 6) : rect.bottom + 6,
        left: Math.max(12, Math.min(rect.left, window.innerWidth - width - 12)),
        width: rect.width,
      });
    }
    setOpen((o) => !o);
  };

  const monthLabel = viewMonth.toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  const firstWeekday = (viewMonth.getDay() + 6) % 7; // Montag = 0
  const totalDays = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d));

  return (
    <div ref={wrapRef} style={{ marginBottom: 14 }}>
      <button
        ref={btnRef}
        type="button"
        onClick={openPicker}
        style={{
          ...inputStyle, marginBottom: 0, textAlign: "left", cursor: "pointer", width: "100%",
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}
      >
        <span style={{ color: value ? COLORS.text : COLORS.textFaint }}>{value ? longDate(value) : placeholder}</span>
        <CalendarDays size={15} style={{ color: COLORS.textFaint, flexShrink: 0 }} />
      </button>

      {open && coords && (
        <div style={{
          position: "fixed", top: coords.top, left: coords.left, zIndex: 500, width: 260,
          background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 12,
          padding: 12, boxShadow: "0 20px 40px rgba(0,0,0,0.45)",
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <IconButton onClick={() => setViewMonth((m) => new Date(m.getFullYear(), m.getMonth() - 1, 1))} title="Vorheriger Monat"><ChevronLeft size={14} /></IconButton>
            <span style={{ fontSize: 12.5, fontWeight: 600, textTransform: "capitalize" }}>{monthLabel}</span>
            <IconButton onClick={() => setViewMonth((m) => new Date(m.getFullYear(), m.getMonth() + 1, 1))} title="Nächster Monat"><ChevronRight size={14} /></IconButton>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 4 }}>
            {WEEKDAY_LABELS.map((l) => (
              <div key={l} style={{ fontSize: 9.5, fontWeight: 700, textAlign: "center", color: COLORS.textFaint }}>{l}</div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: value ? 10 : 0 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const k = toKey(d);
              const isSelected = k === value;
              const isToday = k === todayKey();
              return (
                <button
                  key={i} type="button"
                  onClick={() => { onChange(k); setOpen(false); }}
                  style={{
                    aspectRatio: "1", borderRadius: 7, fontSize: 12, cursor: "pointer",
                    fontFamily: "JetBrains Mono, monospace",
                    border: isSelected ? `1.5px solid ${COLORS.violet}` : isToday ? `1px solid ${COLORS.textMuted}` : "1px solid transparent",
                    background: isSelected ? COLORS.violet + "26" : "transparent",
                    color: isSelected ? COLORS.text : COLORS.textMuted,
                  }}
                >
                  {d.getDate()}
                </button>
              );
            })}
          </div>

          {value && (
            <button type="button" onClick={() => { onChange(""); setOpen(false); }} style={{ ...ghostBtn, width: "100%", padding: "6px 0", fontSize: 12 }}>
              Datum entfernen
            </button>
          )}
        </div>
      )}
    </div>
  );
}
