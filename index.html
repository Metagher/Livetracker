        </p>
        <ResponsiveContainer width="100%" height={200}>
          <LineChart data={weeklySuccessRate}>
            <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
            <XAxis dataKey="week" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} minTickGap={20} />
            <YAxis domain={[0, 100]} tickFormatter={(v) => `${v}%`} tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={false} tickLine={false} />
            <Tooltip
              contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }}
              labelStyle={{ color: COLORS.text }}
              formatter={(value, _name, props) => [value === null ? "keine Daten" : `${value}% (${props.payload.tracked} Einträge)`, "Erfüllungsquote"]}
            />
            <Line type="monotone" dataKey="rate" stroke={COLORS.mint} strokeWidth={2.5} dot={{ r: 3, fill: COLORS.mint }} connectNulls />

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>

        <p style={{ fontSize: 12, color: COLORS.textFaint, marginTop: -4, marginBottom: 12 }}>
          Pro Kalenderwoche kumuliert - je heller, desto größer der Anteil erfüllter Habits in dieser Woche.
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(52px, 1fr))", gap: 6 }}>
          {yearWeeklyHeatmap.map((w) => (
            <div
              key={w.weekStart}
              title={`KW ${w.weekNum}: ${w.ratio === null ? "keine Daten" : Math.round(w.ratio * 100) + "% erfüllt"}`}
              style={{
                background: w.ratio === null ? COLORS.bgSoft : COLORS.ember2 + alphaHex(0.15 + w.ratio * 0.75),
                border: `1px solid ${COLORS.borderSoft}`, borderRadius: 8, padding: "6px 4px", textAlign: "center",
              }}
            >
              <div style={{ fontSize: 9, fontWeight: 700, color: COLORS.textFaint, letterSpacing: "0.02em" }}>KW{w.weekNum}</div>
              <div style={{ fontSize: 11, fontWeight: 700, fontFamily: "JetBrains Mono, monospace", color: w.ratio === null ? COLORS.textFaint : COLORS.text }}>

      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <SectionLabel>Jahresübersicht</SectionLabel>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <IconButton onClick={() => setViewYear((y) => y - 1)} title="Vorheriges Jahr"><ChevronLeft size={14} /></IconButton>

            <IconButton onClick={() => setViewYear((y) => Math.min(y + 1, currentYear))} title="Nächstes Jahr"><ChevronRight size={14} /></IconButton>
          </div>

        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16,

          background: `linear-gradient(135deg, ${COLORS.ember1}14, ${COLORS.ember2}0a)`, border: `1px solid ${COLORS.ember1}33`,
        }}>
          <span style={{ fontSize: 12.5, color: COLORS.textMuted, fontWeight: 600 }}>Punkte im Filter · {viewYear}</span>
          <span style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600, color: filteredYearData.yearTotal < 0 ? COLORS.coral : COLORS.ember2 }}>
            {filteredYearData.yearTotal >= 0 ? "+" : ""}{filteredYearData.yearTotal}
          </span>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(3, 1fr)" : "repeat(4, 1fr)", gap: 10 }}>
          {filteredYearData.months.map((m) => {
            const isFutureMonth = viewYear === currentYear && m.month > new Date().getMonth();
            const barPct = Math.max(3, Math.round((Math.abs(m.points) / filteredMaxAbsMonthPoints) * 100));
            const color = m.points > 0 ? COLORS.ember2 : m.points < 0 ? COLORS.coral : COLORS.textFaint;
            const monthCats = monthlyCategoryStats[m.month];
            const maxAbsMonthCat = Math.max(1, ...monthCats.map((c) => Math.abs(c.points)));
            return (
              <div
                key={m.month}
                onMouseEnter={() => setHoveredMonth(m.month)}
                onMouseLeave={() => setHoveredMonth((h) => (h === m.month ? null : h))}
                onClick={() => setHoveredMonth((h) => (h === m.month ? null : m.month))}
                style={{ position: "relative", cursor: "pointer" }}
              >
                <div style={{
                  background: COLORS.bgSoft, border: `1px solid ${hoveredMonth === m.month ? COLORS.violet : COLORS.borderSoft}`, borderRadius: 10,
                  padding: "10px 10px 8px", opacity: isFutureMonth ? 0.4 : 1, cursor: "default", transition: "border-color .15s",
                }}>
                  <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 4 }}>
                    {MONTH_LABELS[m.month]}
                  </div>
                  <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 14, fontWeight: 700, color, marginBottom: 6 }}>
                    {m.points >= 0 ? "+" : ""}{m.points}
                  </div>
                  <div style={{ height: 4, borderRadius: 2, background: COLORS.surfaceRaised, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${barPct}%`, borderRadius: 2, background: color }} />
                  </div>
                </div>

                {hoveredMonth === m.month && (
                  <div style={{
                    position: "absolute", top: "calc(100% + 6px)", zIndex: 60, width: 220,
                    ...(m.month % (isMobile ? 3 : 4) === (isMobile ? 2 : 3) ? { right: 0 } : { left: 0 }),
                    background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 12,
                    padding: 12, boxShadow: "0 20px 40px rgba(0,0,0,0.45)",
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>
                      Punkte nach Gruppe · {MONTH_LABELS[m.month]} {viewYear}
                    </div>
                    {monthCats.length === 0 ? (
                      <div style={{ fontSize: 12, color: COLORS.textFaint }}>Keine Punkte in diesem Monat.</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {monthCats.map((c) => {
                          const catColor = categoryColor(c.category);
                          const widthPct = Math.max(3, Math.round((Math.abs(c.points) / maxAbsMonthCat) * 100));
                          return (
                            <div key={c.category}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}>
                                <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 600 }}>
                                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: catColor }} />
                                  {c.category}
                                </span>
                                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: c.points < 0 ? COLORS.coral : catColor }}>
                                  {c.points >= 0 ? "+" : ""}{c.points}
                                </span>
                              </div>
                              <div style={{ height: 5, borderRadius: 3, background: COLORS.bgSoft, overflow: "hidden" }}>
                                <div style={{ height: "100%", width: `${widthPct}%`, borderRadius: 3, background: c.points < 0 ? COLORS.coral : catColor }} />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <SectionLabel>Habits im Detail</SectionLabel>
        <p style={{ fontSize: 12, color: COLORS.textFaint, marginTop: -4, marginBottom: 14 }}>Quote und Veränderung beziehen sich auf den oben gewählten Zeitraum. Damit werden aktuelle Verbesserungen nicht mehr von alten Daten verdeckt.</p>
        {periodAnalysis.habitRows.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>In diesem Zeitraum wurden noch keine Habits getrackt.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 4 }}>
            {periodAnalysis.habitRows.map(({ habit, stats, rate, tracked, delta }) => {
              const Icon = iconFor(habit.icon);
              return (
                <div key={habit.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5, gap: 8 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 500, minWidth: 0 }}>
                      <Icon size={13} style={{ color: habit.color, flexShrink: 0 }} />
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{habit.name}</span>
                      {stats.currentStreak > 0 && (
                        <span style={{ display: "flex", alignItems: "center", gap: 2, color: COLORS.ember2, fontSize: 11, fontFamily: "JetBrains Mono, monospace", flexShrink: 0 }}>
                          <Flame size={10} style={{ color: COLORS.ember1 }} />{stats.currentStreak}
                        </span>
                      )}
                    </span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0, fontFamily: "JetBrains Mono, monospace", fontSize: 11.5 }}>
                      <span style={{ color: COLORS.textFaint }}>{tracked} Einträge</span>
                      {delta !== null && <span style={{ color: delta >= 0 ? COLORS.mint : COLORS.coral }}>{delta > 0 ? "+" : ""}{delta} %-Pkt.</span>}
                      <strong style={{ color: habit.color, fontSize: 12.5 }}>{rate}%</strong>
                    </span>
                  </div>
                  <div style={{ height: 7, borderRadius: 4, background: COLORS.bgSoft, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${rate}%`, borderRadius: 4, background: habit.color }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {(goals || []).length > 0 && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
          <SectionLabel>Ziele</SectionLabel>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 14 }}>
            <StatCard label="Erreicht" value={achievedGoals.length} suffix="" accent={COLORS.mint} />
            <StatCard label="Aktuell offen" value={openGoalsCount} suffix="" accent={COLORS.textFaint} />
            <StatCard label="Punkte aus Zielen" value={goalPointsSum} suffix="" accent={COLORS.ember2} />
          </div>
          {achievedGoals.length === 0 ? (
            <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch kein Ziel erreicht.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {achievedGoals.map((g) => (
                <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                  <Target size={13} style={{ color: COLORS.violet, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{g.title}</span>
                  {g.achievedAt && <span style={{ fontSize: 11, color: COLORS.textFaint, fontFamily: "JetBrains Mono, monospace" }}>{shortDate(g.achievedAt)}</span>}
                  <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2, minWidth: 46, textAlign: "right" }}>+{g.points}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{ marginBottom: 8 }}>
        <SectionLabel>Freigeschaltete Erfolge im gewählten Zeitraum</SectionLabel>
        {periodAchievements.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>In diesem Zeitraum wurde kein neuer Erfolg freigeschaltet.</div>
        ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
          {periodAchievements.map((unlocked) => {
            const a = ACHIEVEMENT_DEFS.find((definition) => definition.id === unlocked.id);
            if (!a) return null;
            const AIcon = a.icon;
            return (
              <div key={a.id} style={{
                display: "flex", flexDirection: "column", gap: 8, padding: 14, borderRadius: 14,
                background: a.color + "14", border: `1px solid ${a.color + "55"}`,
              }}>
                <AIcon size={20} style={{ color: a.color }} />
                <div style={{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.3 }}>{a.label}</div>
                <div style={{ fontSize: 10.5, color: COLORS.textFaint, fontFamily: "JetBrains Mono, monospace" }}>{shortDate(unlocked.date)}</div>
              </div>
            );
          })}
        </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   @section COACH — Gesamtanalyse via Anthropic API (fetchCoachAnalysis, CoachPage). Tages-/Wochenfeedback siehe @section JOURNAL.
   KI-COACH
   Fasst die aktuelle Habit-Situation zusammen und lässt Claude
   eine kurze, ehrliche und motivierende Einschätzung schreiben.
   ============================================================ */
function buildCoachSummary(habits, entries, goals, tasks, journal) {
  const active = habits;
  const today = todayKey();
  const allStats = active.map((h) => ({ h, s: simulateHabit(h, entries, today) }));

  const openToday = active.filter((h) => dayStatus(h, entries, today) !== "success").length;

  const lines = allStats.map(({ h, s }) => {
    const streakInfo = s.currentStreak > 0
      ? `positive Streak: ${s.currentStreak} Tage (längste: ${s.longestStreak})`
      : s.currentNegStreak > 0
        ? `NEGATIVE Streak: ${s.currentNegStreak} Tage in Folge nicht erfüllt`
        : "aktuell keine Streak";
    const linkedTitles = (h.goalIds || []).map((gid) => (goals || []).find((g) => g.id === gid)?.title).filter(Boolean);
    const goalLink = linkedTitles.length > 0 ? `, zahlt ein auf Ziel(e): ${linkedTitles.map((t) => `"${t}"`).join(", ")}` : "";
    return `- "${h.name}"${h.description ? ` — was es für die Person bedeutet: "${h.description}"` : ""}: ${streakInfo}, Erfolgsquote ${s.successRate}%, heute ${dayStatus(h, entries, today) === "success" ? "bereits erfüllt" : "noch offen"}${goalLink}`;
  }).join("\n");

  const goalLines = (goals || []).map((g) =>
    `- "${g.title}"${g.description ? ` — ${g.description}` : ""} [${g.achieved ? "bereits erreicht" : "noch offen"}, ${g.points} Punkte bei Erfüllung]`
  ).join("\n");

  const openTasks = (tasks || []).filter((t) => !t.completed);
  const completedTasksCount = (tasks || []).filter((t) => t.completed).length;
  const taskLines = openTasks.map((t) =>
    `- "${t.title}"${t.category ? ` [${t.category}]` : ""}${t.dueDate ? `, fällig am ${shortDate(t.dueDate)}` : ""}, ${t.points} Punkte bei Erledigung`
  ).join("\n");

  const last7 = Array.from({ length: 7 }, (_, i) => toKey(addDays(new Date(), -i)));
  const journalLines = last7
    .map((k) => { const text = stripHtml(journal?.[k]?.text); return text ? `${longDate(k)}: ${text}` : null; })
    .filter(Boolean).join("\n");

  return `Aktive Habits (${active.length}), heute noch ${openToday} offen:\n${lines || "(noch keine Habits angelegt)"}\n\nLangfristige Ziele der Person:\n${goalLines || "(noch keine Ziele angelegt)"}\n\nOffene Aufgaben (${openTasks.length}, ${completedTasksCount} bereits erledigt):\n${taskLines || "(keine offenen Aufgaben)"}\n\nJournal-Notizen der letzten 7 Tage:\n${journalLines || "(keine Journal-Einträge in den letzten 7 Tagen)"}`;
}

const COACH_SYSTEM_PROMPT = `Du bist der eingebaute KI-Coach einer persönlichen Habit-Tracking-App ("Lifetracker"). Das übergeordnete Ziel der Person, dem alles andere untergeordnet ist, lautet: ein besserer Mensch werden. Du bekommst eine vollständige Datenzusammenfassung: die Habits (inklusive der Beschreibung, die die Person selbst hinterlegt hat und die erklärt, was das jeweilige Habit für sie bedeutet), ihre langfristigen Ziele (Goals), ihre offenen und erledigten Aufgaben (Tasks), sowie ihre Journal-Notizen der letzten Tage. Nutze all diese Quellen gemeinsam, um ein möglichst vollständiges Bild der aktuellen Situation der Person zu bekommen.

Nutze die Beschreibung jedes Habits, um zu verstehen, wofür es im Leben der Person eigentlich steht (z. B. Disziplin, Gesundheit, Beziehungen, Ruhe, Wachstum), und sprich in deiner Einschätzung genau DAS an - was es für die Person bedeutet, dieses Habit erfüllt oder nicht erfüllt zu haben, bezogen auf das Ziel, ein besserer Mensch zu werden. Punkte und Streak-Zahlen sind nur ein Hilfsmittel im Hintergrund, nicht die eigentliche Botschaft - vermeide es, dich in Zahlen zu verlieren.

Setze außerdem, wenn Ziele vorhanden sind, die Habits in Bezug zu diesen langfristigen Zielen: welche Habits bringen die Person ihren Zielen näher, und was müsste sie konkret tun, um ihre Ziele zu erreichen? Beziehe offene Aufgaben und auffällige Punkte aus den Journal-Notizen mit ein, wenn sie für die Einschätzung relevant sind.

Antworte AUSSCHLIESSLICH mit einem JSON-Objekt (kein Markdown-Codeblock, kein einleitender Text, keine Erklärung) exakt im Format {"analysis": "...", "quote": "..."}.

"analysis": eine kurze, ehrliche und motivierende Einschätzung auf Deutsch (max. 130 Wörter, Fließtext, keine Überschriften, keine Einleitung wie "Klar" oder "Hier ist"). Sprich die Person direkt mit "du" an. Gehe inhaltlich auf die Bedeutung der Habits ein statt auf reine Zahlen, beziehe wenn möglich die Ziele, offenen Aufgaben und Journal-Notizen der Person mit ein, und gib zum Schluss einen konkreten, handlungsorientierten Ansporn für heute. Kein Smalltalk, keine Emojis, kein Fazit-Absatz.

"quote": ein einzelner, kurzer und einprägsamer Motivationsspruch auf Deutsch (max. 12 Wörter), passend zur aktuellen Situation und zum übergeordneten Ziel, ein besserer Mensch zu werden. Ohne Anführungszeichen, ohne Emoji, kein Fließtext, wie ein Spruch auf einer Trainingskarte.`;

async function fetchCoachAnalysis(summary) {
  const anthropicKey = getAnthropicKey();
  if (!anthropicKey) throw new Error("Kein Anthropic API-Key hinterlegt (siehe Einstellungen).");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 500,
      system: COACH_SYSTEM_PROMPT,
      messages: [{ role: "user", content: summary }],
    }),
  });
  if (!response.ok) throw new Error("API-Fehler " + response.status);
  const data = await response.json();
  const raw = (data.content || [])
    .filter((c) => c.type === "text")
    .map((c) => c.text)
    .join("\n")
    .trim();
  if (!raw) throw new Error("Leere Antwort");
  const cleaned = raw.replace(/```json|```/g, "").trim();
  let analysis = cleaned;
  let quote = "";
  try {
    const parsed = JSON.parse(cleaned);
    analysis = (parsed.analysis || "").trim();
    quote = (parsed.quote || "").trim();
  } catch {
    // Fallback, falls kein valides JSON zurückkam: ganzen Text als Analyse verwenden
  }
  if (!analysis) throw new Error("Leere Antwort");
  return { analysis, quote };
}

    setLoadingAnalysis(true);
    setErr(null);

    } finally {

    try {

      persistWeeklyReports(next);

        <div style={{
          position: "absolute", top: -40, right: -40, width: 140, height: 140, borderRadius: "50%",
          background: `radial-gradient(circle, ${COLORS.ember1}22, transparent 70%)`,
        }} />
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, position: "relative" }}>
          <div style={{
            width: 36, height: 36, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center",
            background: `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.ember1})`,
          }}>
            <Brain size={18} style={{ color: "#fff" }} />
          </div>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14.5 }}>Dein Coach</div>
            {generatedLabel && <div style={{ fontSize: 11, color: COLORS.textFaint }}>Analyse vom {generatedLabel} Uhr</div>}

        </div>

/* ============================================================
   @section JOURNAL — Tagebuch (RTF), Tages-Feedback + Wochenbericht via Anthropic API
   JOURNAL
   Tageseintrag mit Habit-Zusammenfassung, Freitext (RTF) und
   optionalem Tages-Feedback vom KI-Coach.
   ============================================================ */
function stripHtml(html) {
  if (!html) return "";
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("br").forEach((br) => br.replaceWith("\n"));
  tmp.querySelectorAll("p, div, li").forEach((el) => el.append("\n"));
  return (tmp.textContent || tmp.innerText || "").replace(/\n{3,}/g, "\n\n").trim();
}

function buildDaySummary(dateKey, habitRows, journalHtml, goals, tasksForDay) {
  const lines = habitRows.map(({ habit, entry }) => {
    const linkedTitles = (habit.goalIds || []).map((gid) => (goals || []).find((g) => g.id === gid)?.title).filter(Boolean);
    const goalLink = linkedTitles.length > 0 ? `, zahlt ein auf Ziel(e): ${linkedTitles.map((t) => `"${t}"`).join(", ")}` : "";
    const statusText = entry.status === "success" ? "erfüllt" : entry.status === "fail" ? "nicht erfüllt" : entry.status === "skip" ? "bewusst übersprungen (z. B. Urlaub) - zählt nicht negativ" : "kein Eintrag";
    return `- "${habit.name}"${habit.description ? ` — Bedeutung für die Person: "${habit.description}"` : ""}: ${statusText}${goalLink}`;
  }).join("\n");
  const journalText = stripHtml(journalHtml);
  const goalLines = (goals || []).map((g) =>
    `- "${g.title}"${g.description ? ` — ${g.description}` : ""} [${g.achieved ? "bereits erreicht" : "noch offen"}]`
  ).join("\n");
  const taskLines = (tasksForDay || []).map((t) =>
    `- "${t.title}"${t.category ? ` [${t.category}]` : ""}: ${t.completed ? "erledigt" : "offen"}`
  ).join("\n");
  return `Datum: ${longDate(dateKey)}\nHabits an diesem Tag:\n${lines || "(keine aktiven Habits)"}${journalText ? `\n\nTagebucheintrag der Person zu diesem Tag:\n${journalText}` : "\n\n(Kein Tagebucheintrag vorhanden.)"}\n\nLangfristige Ziele der Person:\n${goalLines || "(noch keine Ziele angelegt)"}\n\nAufgaben mit Termin an diesem Tag:\n${taskLines || "(keine Aufgaben mit Termin an diesem Tag)"}`;
}

const DAILY_COACH_SYSTEM_PROMPT = `Du bist der eingebaute KI-Coach einer Habit-Tracking-App ("Lifetracker"). Das übergeordnete Ziel der Person lautet: ein besserer Mensch werden. Du bekommst die Habit-Ergebnisse eines einzelnen Tages (inklusive der Beschreibung, was jedes Habit der Person bedeutet), ggf. einen Tagebucheintrag zu diesem Tag, ihre langfristigen Ziele (Goals) sowie ihre Aufgaben (Tasks) mit Termin an diesem Tag. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt (kein Markdown-Codeblock, kein einleitender Text) exakt im Format {"feedback": "..."}. "feedback": ein kurzes, ehrliches und motivierendes Feedback zu genau diesem einen Tag auf Deutsch (max. 90 Wörter, Fließtext, sprich die Person mit "du" an, keine Einleitung wie "Klar" oder "Hier ist"). Konzentriere dich darauf, was das Erfüllen oder Nicht-Erfüllen der Habits an diesem Tag für die Person bedeutet - bezogen auf die Bedeutung, die sie dem Habit selbst gegeben hat, und auf ihre langfristigen Ziele - statt auf Punktzahlen einzugehen. Geh, wenn ein Tagebucheintrag vorhanden ist, konkret darauf ein, und erwähne offene Aufgaben, wenn sie relevant sind. Kein Smalltalk, keine Emojis.`;

// Baut eine Wochenzusammenfassung (pro Habit + pro Tag inkl. Tagebuch) für den Wochenbericht
function buildWeekSummary(weekDays, perHabitDailyMap, journal, goals, tasksForWeek) {
  const habitTotals = perHabitDailyMap.map(({ habit, map }) => {
    const weekEntries = weekDays.map((k) => map[k]).filter(Boolean);
    const successCount = weekEntries.filter((e) => e.status === "success").length;
    return { habit, successCount, tracked: weekEntries.length };
  }).filter((h) => h.tracked > 0);

  const habitLines = habitTotals
    .map((h) => {
      const linkedTitles = (h.habit.goalIds || []).map((gid) => (goals || []).find((g) => g.id === gid)?.title).filter(Boolean);
      const goalLink = linkedTitles.length > 0 ? `, zahlt ein auf Ziel(e): ${linkedTitles.map((t) => `"${t}"`).join(", ")}` : "";
      return `- "${h.habit.name}"${h.habit.description ? ` — Bedeutung für die Person: "${h.habit.description}"` : ""}: ${h.successCount}/${h.tracked} Tage erfüllt${goalLink}`;
    })
    .join("\n");

  const dayLines = weekDays.map((k) => {
    const rows = perHabitDailyMap.map(({ habit, map }) => ({ habit, entry: map[k] })).filter(({ entry }) => entry !== undefined);
    const habitLine = rows.map(({ habit, entry }) =>
      `${habit.name}: ${entry.status === "success" ? "erfüllt" : entry.status === "fail" ? "nicht erfüllt" : entry.status === "skip" ? "übersprungen (Urlaub)" : "offen"}`
    ).join(", ");
    const journalText = stripHtml(journal[k]?.text);
    return `${longDate(k)}${habitLine ? ` — ${habitLine}` : ""}${journalText ? `\nTagebuch: ${journalText}` : ""}`;
  }).join("\n\n");

  const goalLines = (goals || []).map((g) =>
    `- "${g.title}"${g.description ? ` — ${g.description}` : ""} [${g.achieved ? "bereits erreicht" : "noch offen"}]`
  ).join("\n");

  const taskLines = (tasksForWeek || []).map((t) =>
    `- "${t.title}"${t.category ? ` [${t.category}]` : ""}, fällig am ${shortDate(t.dueDate)}: ${t.completed ? "erledigt" : "offen"}`
  ).join("\n");

  return `Wochenübersicht (${shortDate(weekDays[0])} – ${shortDate(weekDays[6])}):\n\nPro Habit:\n${habitLines || "(keine Habits getrackt)"}\n\nTage im Detail:\n${dayLines}\n\nLangfristige Ziele der Person:\n${goalLines || "(noch keine Ziele angelegt)"}\n\nAufgaben mit Termin in dieser Woche:\n${taskLines || "(keine Aufgaben mit Termin in dieser Woche)"}`;
}

const WEEKLY_COACH_SYSTEM_PROMPT = `Du bist der eingebaute KI-Coach einer Habit-Tracking-App ("Lifetracker"). Das übergeordnete Ziel der Person lautet: ein besserer Mensch werden. Du bekommst eine Zusammenfassung einer ganzen Woche: pro Habit die Erfolge (inklusive der Beschreibung, was jedes Habit der Person bedeutet), tageweise Details inklusive eventueller Tagebucheinträge, ihre langfristigen Ziele (Goals), sowie ihre Aufgaben (Tasks) mit Termin in dieser Woche. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt (kein Markdown-Codeblock, kein einleitender Text) exakt im Format {"report": "..."}. "report": ein ehrlicher, motivierender Wochenbericht auf Deutsch (ca. 150-200 Wörter, Fließtext mit 1-2 kurzen Absätzen, sprich die Person mit "du" an, keine Einleitung wie "Klar" oder "Hier ist"). Konzentriere dich darauf, was das Einhalten oder Nicht-Einhalten der Habits in dieser Woche für die Person bedeutet - bezogen auf die Bedeutung, die sie den Habits selbst gegeben hat - statt auf Punktzahlen. Setze die Habits in Bezug zu ihren langfristigen Zielen: welche Fortschritte wurden gemacht, was fehlt noch, was müsste die Person konkret tun, um ihren Zielen näherzukommen? Geh auf auffällige Punkte aus den Tagebucheinträgen und auf offene oder erledigte Aufgaben der Woche ein, wenn relevant. Schließe mit einem konkreten Fokus oder Vorsatz für die kommende Woche. Kein Smalltalk, keine Emojis, keine Zwischenüberschriften.`;

async function fetchWeeklyReport(summary) {
  const anthropicKey = getAnthropicKey();
  if (!anthropicKey) throw new Error("Kein Anthropic API-Key hinterlegt (siehe Einstellungen).");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 700,
      system: WEEKLY_COACH_SYSTEM_PROMPT,
      messages: [{ role: "user", content: summary }],
    }),
  });
  if (!response.ok) throw new Error("API-Fehler " + response.status);
  const data = await response.json();
  const raw = (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n").trim();
  if (!raw) throw new Error("Leere Antwort");
  const cleaned = raw.replace(/```json|```/g, "").trim();
  let report = cleaned;
  try {
    const parsed = JSON.parse(cleaned);
    report = (parsed.report || "").trim();
  } catch {
    // Fallback: Rohtext verwenden, falls kein valides JSON zurückkam
  }
  if (!report) throw new Error("Leere Antwort");
  return report;
}

function RichTextEditor({ editorRef, initialHtml }) {
  const exec = (cmd) => {
    editorRef.current?.focus();
    document.execCommand(cmd, false, null);
  };
  return (
    <div style={{ border: `1px solid ${COLORS.border}`, borderRadius: 10, overflow: "hidden" }}>
      <div style={{ display: "flex", gap: 2, padding: 6, background: COLORS.bgSoft, borderBottom: `1px solid ${COLORS.border}` }}>
        <button type="button" onMouseDown={(e) => { e.preventDefault(); exec("bold"); }} style={rtfBtnStyle} title="Fett"><Bold size={13} /></button>
        <button type="button" onMouseDown={(e) => { e.preventDefault(); exec("italic"); }} style={rtfBtnStyle} title="Kursiv"><Italic size={13} /></button>
        <button type="button" onMouseDown={(e) => { e.preventDefault(); exec("underline"); }} style={rtfBtnStyle} title="Unterstrichen"><Underline size={13} /></button>
        <button type="button" onMouseDown={(e) => { e.preventDefault(); exec("insertUnorderedList"); }} style={rtfBtnStyle} title="Liste"><List size={13} /></button>
      </div>
      <div
        ref={editorRef}
        contentEditable
        suppressContentEditableWarning
        style={{
          padding: "12px 14px", minHeight: 140, fontSize: 14, lineHeight: 1.6, color: COLORS.text,
          background: COLORS.bgSoft, outline: "none",
        }}
      />
    </div>
  );
}
const rtfBtnStyle = {

function JournalPage({ habits, entries, journal, persistJournal, goals, tasks, hasCoach, moods, persistMoods, statsByHabitId, isMobile, currentDateKey }) {
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [selectedDay, setSelectedDay] = useState(todayKey());
  const [loadingFeedback, setLoadingFeedback] = useState(false);
  const [feedbackErr, setFeedbackErr] = useState(null);
  const [saved, setSaved] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [exportFrom, setExportFrom] = useState(() => toKey(new Date(new Date().getFullYear(), new Date().getMonth(), 1)));
  const [exportTo, setExportTo] = useState(() => todayKey());
  const [exportErr, setExportErr] = useState(null);
  const editorRef = useRef(null);

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const weekRangeLabel = `${shortDate(weekDays[0])} – ${shortDate(weekDays[6])} ${keyToDate(weekDays[6]).getFullYear()}`;
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);
  const isFuture = (k) => k > todayKey();

  const perHabitDailyMap = useMemo(() => habits.map((h) => {
    const s = statsByHabitId[h.id];
    return { habit: h, map: Object.fromEntries(s.daily.map((d) => [d.date, d])) };
  }), [habits, statsByHabitId]);

  const buildExportMarkdown = (fromKey, toKeyStr) => {
    if (!fromKey || !toKeyStr || fromKey > toKeyStr) return null;
    const days = [];
    let cursor = keyToDate(fromKey);
    const end = keyToDate(toKeyStr);
    while (cursor <= end) {
      days.push(toKey(cursor));
      cursor = addDays(cursor, 1);
    }

    const sections = days.map((k) => {
      const entry = journal[k];
      const journalText = entry ? stripHtml(entry.text) : "";
      const hasContent = journalText.length > 0 || !!entry?.feedback;
      if (!hasContent) return null;

      const rows = perHabitDailyMap.map(({ habit, map }) => ({ habit, entry: map[k] })).filter(({ entry }) => entry !== undefined);
      const total = rows.reduce((s, { entry }) => s + entry.delta, 0);
      const habitLines = rows.map(({ habit, entry }) =>
        `- ${habit.name}: ${entry.status === "success" ? "erfüllt" : entry.status === "fail" ? "nicht erfüllt" : entry.status === "skip" ? "übersprungen (Urlaub)" : "offen"} (${entry.delta >= 0 ? "+" : ""}${entry.delta})`
      ).join("\n");

      let md = `## ${longDate(k)}\n\n`;
      if (rows.length > 0) md += `**Punkte des Tages:** ${total >= 0 ? "+" : ""}${total}\n\n**Habits:**\n${habitLines}\n\n`;
      if (journalText) md += `**Tagebuch:**\n\n${journalText}\n\n`;
      if (entry?.feedback) md += `**Coach-Feedback:**\n\n${entry.feedback}\n\n`;
      return md;
    }).filter(Boolean);

    if (sections.length === 0) return null;
    return `# Journal-Export\n\nZeitraum: ${shortDate(fromKey)} – ${shortDate(toKeyStr)}\n\n${sections.join("---\n\n")}`;
  };

  const runExport = () => {
    setExportErr(null);
    const md = buildExportMarkdown(exportFrom, exportTo);
    if (!md) {
      setExportErr("Keine Tagebucheinträge in diesem Zeitraum gefunden.");
      return;
    }
    downloadFile(`journal-export-${exportFrom}-bis-${exportTo}.md`, md, "text/markdown");
    setShowExport(false);
  };

  const dayTotal = (dateKey) => perHabitDailyMap.reduce((sum, { map }) => sum + (map[dateKey]?.delta || 0), 0);

  const selectedHabitRows = useMemo(() => perHabitDailyMap
    .map(({ habit, map }) => ({ habit, entry: map[selectedDay] }))
    .filter(({ entry }) => entry !== undefined), [perHabitDailyMap, selectedDay]);

  const selectedTotal = selectedHabitRows.reduce((s, { entry }) => s + entry.delta, 0);
  const dayEntry = journal[selectedDay] || {};

  const tasksCompletedThisDay = (tasks || []).filter((t) => t.completed && t.completedAt === selectedDay);
  const goalsAchievedThisDay = (goals || []).filter((g) => g.achieved && g.achievedAt === selectedDay);
  const milestonesHitThisDay = selectedHabitRows.filter(({ entry }) => entry.milestoneHit > 0);

  useEffect(() => {
    if (editorRef.current) editorRef.current.innerHTML = dayEntry.text || "";
    setSaved(false);
    setFeedbackErr(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedDay]);

  const saveEntry = () => {
    const html = editorRef.current ? editorRef.current.innerHTML : "";
    const next = { ...journal, [selectedDay]: { ...(journal[selectedDay] || {}), text: html } };
    persistJournal(next);
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  const runFeedback = async () => {
    setLoadingFeedback(true);
    setFeedbackErr(null);
    try {
      const html = editorRef.current ? editorRef.current.innerHTML : (dayEntry.text || "");
      const tasksForDay = (tasks || []).filter((t) => t.dueDate === selectedDay);
      const summary = buildDaySummary(selectedDay, selectedHabitRows, html, goals, tasksForDay);
      const feedback = await fetchDailyFeedback(summary);
      const next = { ...journal, [selectedDay]: { ...(journal[selectedDay] || {}), text: html, feedback, feedbackAt: new Date().toISOString() } };
      persistJournal(next);
    } catch (e) {
      setFeedbackErr("Feedback konnte gerade nicht geladen werden. Versuch es gleich noch einmal.");
    } finally {
      setLoadingFeedback(false);
    }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>

            <div style={{ flex: "1 1 180px" }}>
              <label style={labelStyle}>Von</label>
              <DatePicker value={exportFrom} onChange={setExportFrom} placeholder="Startdatum" />
            </div>
            <div style={{ flex: "1 1 180px" }}>
              <label style={labelStyle}>Bis</label>
              <DatePicker value={exportTo} onChange={setExportTo} placeholder="Enddatum" />
            </div>
          </div>
          {exportErr && <div style={{ color: COLORS.coral, fontSize: 12.5, marginBottom: 10 }}>{exportErr}</div>}
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => setShowExport(false)} style={ghostBtn}>Abbrechen</button>
            <button onClick={runExport} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 7 }}>
              <Download size={14} /> Als Markdown exportieren
            </button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>Woche</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, -7))} title="Vorherige Woche"><ChevronLeft size={14} /></IconButton>
          <span style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, minWidth: 128, textAlign: "center", fontFamily: "JetBrains Mono, monospace" }}>
            KW {isoWeekNumber(keyToDate(weekDays[0]))} · {weekRangeLabel}
          </span>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, 7))} title="Nächste Woche"><ChevronRight size={14} /></IconButton>
          {!isCurrentWeek && (
            <button onClick={() => { setWeekStart(startOfWeek(new Date())); setSelectedDay(todayKey()); }} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Heute</button>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: isMobile ? 4 : 6, marginBottom: 20 }}>
        {weekDays.map((k, i) => {
          const isToday = k === todayKey();
          const isSelected = k === selectedDay;
          const weekend = i >= 5;
          const future = isFuture(k);
          const d = keyToDate(k);
          const total = dayTotal(k);
          const hasEntry = !!journal[k]?.text && stripHtml(journal[k].text).length > 0;
          return (
            <div key={k}>
              <div style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: weekend ? COLORS.ember2 : COLORS.textFaint, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>
                {WEEKDAY_LABELS[i]}
              </div>
              <button
                onClick={() => !future && setSelectedDay(k)}
                disabled={future}
                title={shortDate(k)}
                style={{
                  width: "100%", aspectRatio: "1", borderRadius: 11, cursor: future ? "default" : "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", gap: 2,
                  background: weekend ? COLORS.bgSoft : COLORS.surfaceRaised,
                  border: isSelected ? `2px solid ${COLORS.violet}` : isToday ? `1.5px solid ${COLORS.textMuted}` : `1px solid ${COLORS.borderSoft}`,

                <span style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, color: COLORS.text }}>{d.getDate()}</span>
                {total !== 0 && (

      <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>

      {moods && persistMoods && (

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <SectionLabel>Habits an diesem Tag</SectionLabel>
          <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13, fontWeight: 700, color: selectedTotal < 0 ? COLORS.coral : COLORS.ember2 }}>
            {selectedTotal >= 0 ? "+" : ""}{selectedTotal} Punkte
          </span>
        </div>
        {selectedHabitRows.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Keine Habits an diesem Tag verfolgt.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {selectedHabitRows.map(({ habit, entry }) => {
              const Icon = iconFor(habit.icon);

                <div key={habit.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>

                  <span style={{
                    fontSize: 10.5, fontWeight: 700, padding: "2px 7px", borderRadius: 6, textTransform: "uppercase", letterSpacing: "0.03em",
                    color: st === "success" ? habit.color : st === "fail" ? COLORS.coral : st === "skip" ? COLORS.violet : COLORS.textFaint,
                    background: st === "success" ? habit.color + "1f" : st === "fail" ? COLORS.coral + "1f" : st === "skip" ? COLORS.violet + "1f" : COLORS.surfaceRaised,
                  }}>
                    {st === "success" ? "Erfüllt" : st === "fail" ? "Nicht erfüllt" : st === "skip" ? "Übersprungen" : "Offen"}
                  </span>
                  <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 600, minWidth: 34, textAlign: "right", color: entry.delta > 0 ? habit.color : entry.delta < 0 ? COLORS.coral : COLORS.textFaint }}>
                    {entry.delta >= 0 ? "+" : ""}{entry.delta}

                </div>

      {(tasksCompletedThisDay.length > 0 || goalsAchievedThisDay.length > 0 || milestonesHitThisDay.length > 0) && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <SectionLabel>Erledigt an diesem Tag</SectionLabel>

            {goalsAchievedThisDay.map((g) => (
              <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>

                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2 }}>+{g.points}</span>
              </div>
            ))}
            {tasksCompletedThisDay.map((t) => (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                <ClipboardList size={14} style={{ color: COLORS.mint, flexShrink: 0 }} />
                <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>Aufgabe erledigt: {t.title}</span>
                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2 }}>+{t.points}</span>
              </div>
            ))}
            {milestonesHitThisDay.map(({ habit, entry }) => (
              <div key={habit.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>

            </div>
          ) : dayEntry.feedback ? (
            <p style={{ fontSize: 13.5, lineHeight: 1.6, color: COLORS.text, margin: 0, marginBottom: 10 }}>{dayEntry.feedback}</p>
          ) : (

          )}

          {feedbackErr && <div style={{ color: COLORS.coral, fontSize: 12, marginBottom: 8 }}>{feedbackErr}</div>}

          <button onClick={runFeedback} disabled={loadingFeedback} style={{
            ...primaryBtn, display: "flex", alignItems: "center", gap: 7,
            opacity: loadingFeedback ? 0.6 : 1, cursor: loadingFeedback ? "not-allowed" : "pointer",
          }}>
            <Sparkles size={13} /> {dayEntry.feedback ? "Feedback neu holen" : "Feedback holen"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   @section GOALS-PAGE — Langfristige Ziele, verknüpfte Habits, Erreichen mit Punktebonus
   GOALS
   Langfristige Ziele mit Beschreibung und Punktebelohnung bei
   Erfüllung. Werden dem Coach als Kontext für die Habits gegeben.
   ============================================================ */
function GoalsPage({ goals, persistGoals, habits, persistHabits, entries, categories, onAddCategory, statsByHabitId, currentDateKey }) {
  const [showModal, setShowModal] = useState(false);
  const [modalGoal, setModalGoal] = useState(undefined);

  const achievedCount = goals.filter((g) => g.achieved).length;
  const totalGoalPoints = goals.filter((g) => g.achieved).reduce((s, g) => s + g.points, 0);

  const last7Keys = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(keyToDate(currentDateKey), -(6 - i)))), [currentDateKey]);

  const linkedHabitsByGoal = useMemo(() => {
    const map = {};
    goals.forEach((g) => { map[g.id] = habits.filter((h) => (h.goalIds || []).includes(g.id)); });
    return map;
  }, [goals, habits]);

  // Simuliert jeden Habit nur einmal (statt einmal pro verknüpftem Ziel) - ein
  // Habit kann an mehrere Ziele gekoppelt sein und wurde vorher pro Ziel neu simuliert.
  const dailyMapByHabitId = useMemo(() => {
    const map = {};
    habits.forEach((h) => {
      const s = statsByHabitId[h.id];
      map[h.id] = Object.fromEntries(s.daily.map((d) => [d.date, d]));
    });
    return map;
  }, [habits, statsByHabitId]);

  const weekDataByGoal = useMemo(() => {
    const map = {};
    goals.forEach((g) => {
      const linked = linkedHabitsByGoal[g.id] || [];
      if (linked.length === 0) { map[g.id] = { series: [], total: 0 }; return; }
      const dailyMaps = linked.map((h) => dailyMapByHabitId[h.id]).filter(Boolean);
      const series = last7Keys.map((k) => ({ date: k, points: dailyMaps.reduce((sum, m) => sum + (m[k]?.delta || 0), 0) }));
      map[g.id] = { series, total: series.reduce((s, d) => s + d.points, 0) };
    });
    return map;
  }, [goals, linkedHabitsByGoal, dailyMapByHabitId, last7Keys]);

  const toggleAchieved = (goal) => {
    const next = goals.map((g) => g.id === goal.id
      ? { ...g, achieved: !g.achieved, achievedAt: !g.achieved ? todayKey() : null }
      : g);
    persistGoals(next);
  };

  const handleSave = (goal) => {
    const exists = goals.some((g) => g.id === goal.id);
    const next = exists ? goals.map((g) => (g.id === goal.id ? goal : g)) : [...goals, goal];
    persistGoals(next);
    setShowModal(false);
    setModalGoal(undefined);
  };

  const handleDelete = (id) => {
    persistGoals(goals.filter((g) => g.id !== id));
    // Entfernt die Verknüpfung bei Habits, die auf das gelöschte Ziel zeigten,
    // statt eine verwaiste Goal-ID in habit.goalIds zurückzulassen.
    persistHabits(habits.map((h) => (h.goalIds || []).includes(id)
      ? { ...h, goalIds: h.goalIds.filter((gid) => gid !== id) }
      : h));
    setShowModal(false);
    setModalGoal(undefined);
  };

  const openGoals = goals.filter((g) => !g.achieved);
  const doneGoals = goals.filter((g) => g.achieved);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Goals</h1>
        <button onClick={() => { setModalGoal(undefined); setShowModal(true); }} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 6 }}>
          <Plus size={15} /> Neues Ziel
        </button>
      </div>

      {goals.length > 0 && (

/* ============================================================

function TasksPage({ tasks, persistTasks, categories, onAddCategory }) {
  const [showModal, setShowModal] = useState(false);
  const [modalTask, setModalTask] = useState(undefined);

  const doneCount = tasks.filter((t) => t.completed).length;
  const earnedPoints = tasks.filter((t) => t.completed).reduce((s, t) => s + t.points, 0);

  const toggleCompleted = (task) => {
    const completing = !task.completed;
    const next = tasks.map((t) => t.id === task.id
      ? { ...t, completed: completing, completedAt: completing ? todayKey() : null }
      : t);
    persistTasks(next);
  };

  const handleSave = (task) => {
    const exists = tasks.some((t) => t.id === task.id);
    const next = exists ? tasks.map((t) => (t.id === task.id ? task : t)) : [...tasks, task];
    persistTasks(next);
    setShowModal(false);
    setModalTask(undefined);
  };

  const handleDelete = (id) => {
    persistTasks(tasks.filter((t) => t.id !== id));
    setShowModal(false);
    setModalTask(undefined);
  };

  const openTasks = tasks.filter((t) => !t.completed);
  const doneTasks = tasks.filter((t) => t.completed);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Tasks</h1>

function CompletedTasksCalendar({ doneTasks, onToggle, onEdit }) {
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [selectedDay, setSelectedDay] = useState(todayKey());

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);
  const weekMonthYearLabel = keyToDate(weekDays[0]).toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  const weekNum = isoWeekNumber(keyToDate(weekDays[0]));
  const isFuture = (k) => k > todayKey();

  const byDate = useMemo(() => {
    const map = {};
    doneTasks.forEach((t) => {
      if (!t.completedAt) return;
      if (!map[t.completedAt]) map[t.completedAt] = [];
      map[t.completedAt].push(t);
    });
    return map;
  }, [doneTasks]);

  const selectedTasks = byDate[selectedDay] || [];

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontSize: 11, color: COLORS.textFaint }}>Wann wurde was erledigt?</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, -7))} title="Vorherige Woche"><ChevronLeft size={14} /></IconButton>
          <span style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, minWidth: 150, textAlign: "center", fontFamily: "JetBrains Mono, monospace", textTransform: "capitalize" }}>
            {weekMonthYearLabel} · KW {weekNum}
          </span>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, 7))} title="Nächste Woche"><ChevronRight size={14} /></IconButton>
          {!isCurrentWeek && (
            <button onClick={() => { setWeekStart(startOfWeek(new Date())); setSelectedDay(todayKey()); }} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Heute</button>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 16 }}>
        {weekDays.map((k, i) => {
          const isToday = k === todayKey();
          const isSelected = k === selectedDay;
          const weekend = i >= 5;
          const future = isFuture(k);
          const d = keyToDate(k);
          const count = (byDate[k] || []).length;
          return (
            <div key={k}>
              <div style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: weekend ? COLORS.ember2 : COLORS.textFaint, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>
                {WEEKDAY_LABELS[i]}
              </div>
              <button
                onClick={() => !future && setSelectedDay(k)}
                disabled={future}
                title={shortDate(k)}
                style={{
                  width: "100%", aspectRatio: "1", borderRadius: 11, cursor: future ? "default" : "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", gap: 2,
                  background: weekend ? COLORS.bgSoft : COLORS.surfaceRaised,
                  border: isSelected ? `2px solid ${COLORS.mint}` : isToday ? `1.5px solid ${COLORS.textMuted}` : `1px solid ${COLORS.borderSoft}`,
                  opacity: future ? 0.35 : 1,
                }}>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, color: COLORS.text }}>{d.getDate()}</span>
                {count > 0 && (
                  <span style={{
                    fontFamily: "JetBrains Mono, monospace", fontSize: 9.5, fontWeight: 700, color: COLORS.mint,
                    display: "flex", alignItems: "center", gap: 2,
                  }}>
                    <Check size={9} strokeWidth={3} /> {count}
                  </span>
                )}
              </button>
            </div>
          );
        })}
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>
        {selectedDay === todayKey() ? "Heute" : longDate(selectedDay)}
      </div>

      {selectedTasks.length === 0 ? (
        <div style={{ fontSize: 12.5, color: COLORS.textFaint, background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
          An diesem Tag wurde keine Aufgabe erledigt.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {selectedTasks.map((t) => <TaskRow key={t.id} task={t} onToggle={() => onToggle(t)} onEdit={() => onEdit(t)} />)}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   @section CONSUMABLES-PAGE — Bestände, Beschaffungsaufgaben und Haltbarkeit

function consumableAverageDays(item) {
  const history = (item.history || []).filter((event) => isValidDateKey(event.date)).slice().sort((a, b) => a.date.localeCompare(b.date));
  const durations = [];
  let availableSince = item.createdAt || null;
  history.forEach((event) => {
    if (event.available) availableSince = event.date;
    else if (availableSince) { durations.push(Math.max(0, Math.round((keyToDate(event.date) - keyToDate(availableSince)) / 86400000))); availableSince = null; }
  });
  return durations.length ? Math.round(durations.reduce((sum, days) => sum + days, 0) / durations.length) : null;
}
function ConsumableHistoryModal({ item, onClose, onUpdate, onDelete }) {
  const viewport = useVisualViewport();
  const [editingIndex, setEditingIndex] = useState(null);
  const [editDate, setEditDate] = useState("");
  const [editAvailable, setEditAvailable] = useState(true);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const entries = (item.history || [])
    .map((event, index) => ({ ...event, index }))
    .sort((a, b) => b.date.localeCompare(a.date) || b.index - a.index);
  const startEdit = (entry) => {
    setEditingIndex(entry.index); setEditDate(entry.date); setEditAvailable(entry.available); setConfirmDelete(null);
  };
  const saveEdit = () => {
    if (!isValidDateKey(editDate) || editDate > todayKey()) return;
    onUpdate(editingIndex, { date: editDate, available: editAvailable }); setEditingIndex(null);
  };
  return (
    <div style={{ ...overlayStyle, height: viewport.height, top: viewport.top }} onClick={onClose}>
      <div style={{ ...modalStyle, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
        <div style={modalBodyStyle}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
            <div style={{ flex: 1 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 21, margin: 0 }}>Verlauf bearbeiten</h2><div style={{ fontSize: 12, color: COLORS.textFaint, marginTop: 3 }}>{item.name}</div></div>
            <IconButton onClick={onClose} title="Schließen"><X size={16} /></IconButton>
          </div>
          {entries.length === 0 ? <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Keine Einträge vorhanden.</div> : (
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {entries.map((entry) => <div key={entry.index} style={{ padding: "9px 10px", borderRadius: 10, background: COLORS.bgSoft }}>
                {editingIndex === entry.index ? <div style={{ display: "flex", gap: 7, alignItems: "center", flexWrap: "wrap" }}>
                  <input type="date" max={todayKey()} value={editDate} onChange={(e) => setEditDate(e.target.value)} style={{ ...inputStyle, width: "auto", flex: "1 1 145px", marginBottom: 0 }} />
                  <select value={editAvailable ? "available" : "unavailable"} onChange={(e) => setEditAvailable(e.target.value === "available")} style={{ ...inputStyle, width: "auto", flex: "1 1 150px", marginBottom: 0, cursor: "pointer" }}><option value="available">Vorhanden</option><option value="unavailable">Nicht vorhanden</option></select>
                  <button onClick={saveEdit} disabled={!isValidDateKey(editDate) || editDate > todayKey()} style={{ ...primaryBtn, padding: "8px 11px", opacity: !isValidDateKey(editDate) || editDate > todayKey() ? 0.5 : 1 }}>Speichern</button>
                  <button onClick={() => setEditingIndex(null)} style={{ ...ghostBtn, padding: "8px 11px" }}>Abbrechen</button>
                </div> : <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 12.5, fontWeight: 600 }}>{longDate(entry.date)}</div><div style={{ fontSize: 11, color: entry.available ? COLORS.mint : COLORS.coral }}>{entry.available ? "Vorhanden / aufgefüllt" : "Nicht vorhanden / verbraucht"}</div></div>
                  <IconButton onClick={() => startEdit(entry)} title="Eintrag bearbeiten"><Pencil size={13} /></IconButton>
                  {confirmDelete === entry.index ? <div style={{ display: "flex", gap: 5 }}><button onClick={() => setConfirmDelete(null)} style={{ ...ghostBtn, padding: "6px 8px", fontSize: 11 }}>Abbrechen</button><button onClick={() => { onDelete(entry.index); setConfirmDelete(null); }} style={{ ...ghostBtn, padding: "6px 8px", fontSize: 11, color: COLORS.coral, borderColor: COLORS.coral }}>Löschen</button></div> : <IconButton onClick={() => { setConfirmDelete(entry.index); setEditingIndex(null); }} title="Eintrag löschen" danger><Trash2 size={13} /></IconButton>}
                </div>}
              </div>)}
            </div>
          )}
        </div>
        <div style={modalFooterStyle}><span /><button onClick={onClose} style={ghostBtn}>Schließen</button></div>
      </div>
    </div>
  );

  const openEntries = shoppingList.filter((entry) => !entry.completed);

    </div>
