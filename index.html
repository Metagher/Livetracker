      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
        <button onClick={saveKey} style={primaryBtn}>Speichern</button>
        {saved && <span style={{ fontSize: 12, color: COLORS.mint }}>Gespeichert</span>}
      </div>

      <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 10 }}>
          Setzt die Supabase-Verbindung auf diesem Gerät zurück (z. B. um ein anderes Projekt zu verbinden). Deine Daten in Supabase bleiben erhalten.
        </div>
        <button onClick={() => (confirmReset ? resetSetup() : setConfirmReset(true))} style={{
          ...ghostBtn, color: COLORS.coral,
          border: `1px solid ${confirmReset ? COLORS.coral : COLORS.border}`,
          background: confirmReset ? COLORS.coral + "1f" : "transparent",
        }}>
          {confirmReset ? "Wirklich zurücksetzen?" : "Verbindung zurücksetzen"}
        </button>
      </div>
    </div>
  );
}

   ============================================================ */
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.innerWidth <= 760);
  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth <= 760);
    check();
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);
  return isMobile;
}

/* ============================================================
   @section ROOT — LifeOS: Seiten-Routing, globaler State, Achievement-Checks
   ============================================================ */
export default function LifeOS() {
  const {
    habits, entries, achievements, coach, journal, weeklyReports, goals, tasks, persons, categories, personGroups, moods, consumables, shoppingList, notes, noteFolders, loading, refreshing, error,
    persistHabits, persistEntries, persistAchievements, persistCoach, persistJournal, persistWeeklyReports, persistGoals, persistTasks, persistPersons, persistCategories, persistPersonGroups, persistMoods, persistConsumables, persistShoppingList, persistNotes, persistNoteFolders,
    refresh,
  } = useLifeOSData();
  const isMobile = useIsMobile();
  const currentDateKey = useCurrentDateKey();
  const addCategory = (name) => {
    if (!name || categories.includes(name)) return;
    persistCategories([...categories, name]);
  };
  const addPersonGroup = (name) => {
    if (!name || personGroups.includes(name)) return;
    persistPersonGroups([...personGroups, name]);
  };
  const [hasCoachKey, setHasCoachKey] = useState(() => !!getAnthropicKey());
  const refreshCoachKey = useCallback(() => setHasCoachKey(!!getAnthropicKey()), []);
  const [page, setPage] = useState("dashboard");
  const [modalHabit, setModalHabit] = useState(undefined);
  const [showModal, setShowModal] = useState(false);
  const [detailHabit, setDetailHabit] = useState(null);
  const [celebrateId, setCelebrateId] = useState(null);
  const [milestoneToast, setMilestoneToast] = useState(null);

  const activeHabits = habits;
  const earliestByHabit = useMemo(() => earliestTrackedDatesByHabit(entries), [entries]);
  const allStats = useMemo(() => activeHabits.map((habit) => simulateHabit(habit, entries, currentDateKey, earliestByHabit[habit.id] || null)), [activeHabits, entries, currentDateKey, earliestByHabit]);
  const statsByHabitId = useMemo(() => Object.fromEntries(activeHabits.map((habit, index) => [habit.id, allStats[index]])), [activeHabits, allStats]);
  const totalPoints = allStats.reduce((s, st) => s + st.totalPoints, 0) + totalGoalPoints(goals) + totalTaskPoints(tasks);

  // Globale Bestands-Invariante: jeder fehlende Artikel hat genau einen offenen
  // Einkaufseintrag. Alte, automatisch erzeugte Tasks werden einmalig migriert.
  useEffect(() => {
    if (loading) return;
    const legacyTasks = tasks.filter((task) => task.sourceConsumableId && !task.completed);
    const legacyByConsumable = new Map(legacyTasks.map((task) => [task.sourceConsumableId, task]));
    const openShoppingIds = new Set(shoppingList.filter((entry) => !entry.completed).map((entry) => entry.sourceConsumableId));
    const missing = consumables.flatMap((area) => (area.items || []).filter((item) => !item.available).map((item) => ({ area, item })));
    const needed = missing.filter(({ item }) => !openShoppingIds.has(item.id));
    if (needed.length) persistShoppingList([...shoppingList, ...needed.map(({ area, item }) => {
      const legacy = legacyByConsumable.get(item.id);
      return createConsumableShoppingItem(area, item, legacy?.createdAt || todayKey());
    })]);
    if (legacyTasks.length) persistTasks(tasks.filter((task) => task.completed || !task.sourceConsumableId));
  }, [consumables, shoppingList, tasks, loading, persistShoppingList, persistTasks]);

  // Achievement-Check
  useEffect(() => {
    if (loading) return;
    const unlockedIds = new Set(achievements.map((a) => a.id));
    const newly = [];

    if (allStats.some((s) => s.currentStreak > 0 && s.currentStreak === s.longestStreak && s.currentStreak >= 3) && !unlockedIds.has("best")) newly.push("best");
    if (allStats.some((s) => s.longestStreak >= 30) && !unlockedIds.has("streak30")) newly.push("streak30");
    if (totalPoints >= 1000 && !unlockedIds.has("points1000")) newly.push("points1000");

    const last7 = Array.from({ length: 7 }, (_, i) => toKey(addDays(new Date(), -i)));
    const perfect7 = activeHabits.length > 0 && last7.every((k) => activeHabits.every((h) => dayStatus(h, entries, k) === "success"));
    if (perfect7 && !unlockedIds.has("perfect7")) newly.push("perfect7");

    const combined = {};
    allStats.forEach((s) => s.daily.forEach((d) => { combined[d.date] = (combined[d.date] || 0) + d.delta; }));
    const dailyArr = Object.keys(combined).sort().map((k) => ({ date: k, points: combined[k] }));
    if (dailyArr.length >= 7) {
      const curWeek = lastWindowSum(dailyArr, 7);
      const bestWeek = windowSum(dailyArr, 7);
      if (curWeek > 0 && curWeek >= bestWeek && !unlockedIds.has("bestweek")) newly.push("bestweek");
    }
    if (dailyArr.length >= 30) {
      const curMonth = lastWindowSum(dailyArr, 30);
      const bestMonth = windowSum(dailyArr, 30);
      if (curMonth > 0 && curMonth >= bestMonth && !unlockedIds.has("monthrecord")) newly.push("monthrecord");
    }

    if (newly.length > 0) {
      persistAchievements([...achievements, ...newly.map((id) => ({ id, date: todayKey() }))]);
    }
  }, [totalPoints, loading, allStats, activeHabits, entries, achievements, persistAchievements]);

  useEffect(() => {
    if (page === "coach" && !hasCoachKey) setPage("dashboard");
  }, [page, hasCoachKey]);

  const handleToggle = (habitId, dateKey, value) => {
    const next = { ...entries, [dateKey]: { ...(entries[dateKey] || {}), [habitId]: value } };
    persistEntries(next);
    const h = habits.find((x) => x.id === habitId);
    if (h && dateKey === todayKey() && isSuccess(h, value)) {
      setCelebrateId(habitId);
      setTimeout(() => setCelebrateId(null), 1200);

      const updatedStats = simulateHabit(h, next, todayKey());
      const todayEntry = updatedStats.daily[updatedStats.daily.length - 1];
      if (todayEntry && todayEntry.milestoneHit > 0) {
        const bonus = milestoneBonus(todayEntry.milestoneHit, DIFFICULTY_BASE[h.difficulty] || DIFFICULTY_BASE.mittel);
        setMilestoneToast({ name: h.name, days: todayEntry.milestoneHit, bonus });
        setTimeout(() => setMilestoneToast(null), 3600);
      }
    }
  };

  const handleSaveHabit = (habit) => {
    const exists = habits.some((h) => h.id === habit.id);
    const next = exists ? habits.map((h) => (h.id === habit.id ? habit : h)) : [...habits, habit];
    persistHabits(next);
    setShowModal(false);
    setModalHabit(undefined);
  };

  const handleDeleteHabit = (id) => {
    persistHabits(habits.filter((h) => h.id !== id));
    // Räumt auch die Tages-Einträge des gelöschten Habits auf, statt sie als
    // verwaiste Datensätze in Supabase zurückzulassen.
    const nextEntries = {};
    Object.keys(entries).forEach((dateKey) => {
      const day = { ...entries[dateKey] };
      delete day[id];
      if (Object.keys(day).length > 0) nextEntries[dateKey] = day;
    });
    persistEntries(nextEntries);
    setShowModal(false);
    setModalHabit(undefined);
  };

  if (loading) {
    return (
      <div style={{ ...appShellStyle, alignItems: "center", justifyContent: "center", color: COLORS.textMuted, fontSize: 13 }}>
        <style>{FONT_IMPORT}</style>
        Lade deine Daten …
      </div>
    );
  }

  return (
    <div style={{ ...appShellStyle, flexDirection: isMobile ? "column" : "row" }}>
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        @keyframes los-confetti {
          0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
          100% { transform: translate(var(--dx), 160px) rotate(var(--rot)); opacity: 0; }
        }
        @keyframes los-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${COLORS.border}; border-radius: 4px; }
        button:focus-visible, input:focus-visible { outline: 2px solid ${COLORS.ember2}; outline-offset: 1px; }
      `}</style>

      {error && (
        <div style={{ position: "fixed", top: 14, left: "50%", transform: "translateX(-50%)", background: COLORS.coral, color: "#2B0810", padding: "8px 16px", borderRadius: 9, fontSize: 12.5, fontWeight: 600, zIndex: 300 }}>
          {error}
        </div>
      )}

      {milestoneToast && (
        <div style={{
          position: "fixed", top: 18, left: "50%", transform: "translateX(-50%)", zIndex: 300,
          display: "flex", alignItems: "center", gap: 10, padding: "10px 18px", borderRadius: 12,
          background: `linear-gradient(135deg, ${COLORS.ember1}, ${COLORS.ember2})`, color: "#1A1305",
          boxShadow: "0 10px 30px rgba(255,122,69,0.35)", fontWeight: 700, fontSize: 13.5,
          maxWidth: "calc(100vw - 32px)", textAlign: "center",
        }}>
          <Flame size={16} style={{ flexShrink: 0 }} />
          {milestoneToast.days}-Tage-Streak bei „{milestoneToast.name}“ · +{milestoneToast.bonus} Bonus-Punkte
        </div>
      )}

      {isMobile ? <MobileHeader totalPoints={totalPoints} onRefresh={refresh} refreshing={refreshing} /> : <Sidebar page={page} setPage={setPage} totalPoints={totalPoints} onRefresh={refresh} refreshing={refreshing} hasCoach={hasCoachKey} />}

      <div style={{
        flex: 1, overflowY: "auto", overscrollBehaviorY: "contain",
        padding: isMobile ? "14px 14px calc(76px + env(safe-area-inset-bottom, 0px))" : "26px 34px",
      }}>
        <div style={{ maxWidth: isMobile ? "100%" : 720, margin: "0 auto" }}>
          {page === "dashboard" && (
            <Dashboard
              habits={habits} entries={entries}
              onToggle={handleToggle}
              onOpenDetail={setDetailHabit}
              onEdit={(h) => { setModalHabit(h); setShowModal(true); }}
              onCreate={() => { setModalHabit(undefined); setShowModal(true); }}
              celebrateId={celebrateId}
              coach={coach}
              onOpenCoach={() => setPage("coach")}
              hasCoach={hasCoachKey}
              goals={goals}
              tasks={tasks}
              persons={persons}
              persistTasks={persistTasks}
              onOpenTasks={() => setPage("tasks")}
              moods={moods}
              persistMoods={persistMoods}
              onOpenMood={() => setPage("mood")}
              allStats={allStats}
              statsByHabitId={statsByHabitId}
              isMobile={isMobile}
              currentDateKey={currentDateKey}
            />
          )}
          {page === "habits" && (
            <HabitsPage
              habits={habits} entries={entries}
              onToggle={handleToggle}
              onOpenDetail={setDetailHabit}
              onEdit={(h) => { setModalHabit(h); setShowModal(true); }}
              onCreate={() => { setModalHabit(undefined); setShowModal(true); }}
              statsByHabitId={statsByHabitId}
              isMobile={isMobile}
            />
          )}
          {page === "progress" && <ProgressPage habits={habits} entries={entries} achievements={achievements} goals={goals} tasks={tasks} persons={persons} allStats={allStats} isMobile={isMobile} />}
          {page === "mood" && <MoodPage moods={moods} persistMoods={persistMoods} currentDateKey={currentDateKey} />}
          {page === "consumables" && <ConsumablesPage consumables={consumables} persistConsumables={persistConsumables} shoppingList={shoppingList} persistShoppingList={persistShoppingList} />}
          {page === "shopping" && <ShoppingListPage shoppingList={shoppingList} persistShoppingList={persistShoppingList} consumables={consumables} persistConsumables={persistConsumables} />}
          {page === "coach" && hasCoachKey && <CoachPage habits={habits} entries={entries} coach={coach} persistCoach={persistCoach} goals={goals} tasks={tasks} journal={journal} weeklyReports={weeklyReports} persistWeeklyReports={persistWeeklyReports} statsByHabitId={statsByHabitId} />}
          {page === "journal" && <JournalPage habits={habits} entries={entries} journal={journal} persistJournal={persistJournal} goals={goals} tasks={tasks} hasCoach={hasCoachKey} moods={moods} persistMoods={persistMoods} statsByHabitId={statsByHabitId} isMobile={isMobile} currentDateKey={currentDateKey} />}
          {page === "goals" && <GoalsPage goals={goals} persistGoals={persistGoals} habits={habits} persistHabits={persistHabits} entries={entries} categories={categories} onAddCategory={addCategory} statsByHabitId={statsByHabitId} currentDateKey={currentDateKey} />}
          {page === "tasks" && <TasksPage tasks={tasks} persistTasks={persistTasks} categories={categories} onAddCategory={addCategory} />}
          {page === "persons" && <PersonsPage persons={persons} persistPersons={persistPersons} personGroups={personGroups} onAddPersonGroup={addPersonGroup} />}
          {page === "notes" && <NotesPage notes={notes} persistNotes={persistNotes} noteFolders={noteFolders} persistNoteFolders={persistNoteFolders} />}
          {page === "settings" && (
            <SettingsPage
              habits={habits} entries={entries} achievements={achievements} coach={coach}
              journal={journal} weeklyReports={weeklyReports} goals={goals} tasks={tasks} persons={persons} categories={categories} personGroups={personGroups} moods={moods} consumables={consumables} shoppingList={shoppingList} notes={notes} noteFolders={noteFolders}
              persistHabits={persistHabits} persistEntries={persistEntries} persistAchievements={persistAchievements}
              persistCoach={persistCoach} persistJournal={persistJournal} persistWeeklyReports={persistWeeklyReports}
              persistGoals={persistGoals} persistTasks={persistTasks} persistPersons={persistPersons} persistCategories={persistCategories} persistPersonGroups={persistPersonGroups} persistMoods={persistMoods} persistConsumables={persistConsumables} persistShoppingList={persistShoppingList} persistNotes={persistNotes} persistNoteFolders={persistNoteFolders}
              onAnthropicKeyChange={refreshCoachKey}
            />
          )}
        </div>
      </div>

      {showModal && (
        <HabitModal
          initial={modalHabit}
          goals={goals}
          categories={categories}
          onAddCategory={addCategory}
          onClose={() => { setShowModal(false); setModalHabit(undefined); }}
          onSave={handleSaveHabit}
          onDelete={handleDeleteHabit}
        />
      )}
      {detailHabit && (
        <HabitDetail
          habit={habits.find((h) => h.id === detailHabit.id) || detailHabit}
          entries={entries}
          onClose={() => setDetailHabit(null)}
          onToggle={handleToggle}
        />
      )}
      {isMobile && <BottomNav page={page} setPage={setPage} hasCoach={hasCoachKey} />}
    </div>
  );
}

const appShellStyle = {
  display: "flex", height: "100vh", width: "100%", background: COLORS.bg, color: COLORS.text,
  fontFamily: "Inter, sans-serif", fontSize: 14,
};

/* ============================================================
   @section ENTRYPOINT — AppRoot (SetupGate + LifeOS) + ReactDOM-Mount
   ROOT: zeigt Setup-Screen bis Supabase konfiguriert ist,
   danach die eigentliche App.
   ============================================================ */
function AppRoot() {
  return (
    <SetupGate>
      <LifeOS />
    </SetupGate>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot />);

</script>
