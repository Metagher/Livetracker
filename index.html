/* ============================================================
   PROGRESS PAGE (Diagramme + Erfolge)
   ============================================================ */
function ProgressPage({ habits, entries, achievements, goals, tasks }) {
  const isMobile = useIsMobile();
  const active = habits;
  const allStats = useMemo(() => active.map((h) => simulateHabit(h, entries, todayKey())), [active, entries]);

  const dailyPointsMap = useMemo(() => {
    const map = {};
    allStats.forEach((s) => s.daily.forEach((d) => {
      map[d.date] = (map[d.date] || 0) + d.delta;
    }));
    (goals || []).filter((g) => g.achieved && g.achievedAt).forEach((g) => {
      map[g.achievedAt] = (map[g.achievedAt] || 0) + g.points;
    });
    (tasks || []).filter((t) => t.completed && t.completedAt).forEach((t) => {
      map[t.completedAt] = (map[t.completedAt] || 0) + t.points;
    });
    return map;
  }, [allStats, goals, tasks]);

  const combinedDaily = useMemo(() => {
    const keys = Object.keys(dailyPointsMap).sort();
    let running = 0;
    return keys.map((k) => {
      running += dailyPointsMap[k];
      return { key: k, date: shortDate(k), points: dailyPointsMap[k], total: running };
    });
  }, [dailyPointsMap]);

  const [viewYear, setViewYear] = useState(() => new Date().getFullYear());
  const currentYear = new Date().getFullYear();
  const MONTH_LABELS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  const yearData = useMemo(() => {
    const monthMap = {};
    Object.keys(dailyPointsMap).forEach((k) => {
      const ym = k.slice(0, 7);
      monthMap[ym] = (monthMap[ym] || 0) + dailyPointsMap[k];
    });
    const months = Array.from({ length: 12 }, (_, i) => ({
      month: i,
      points: monthMap[`${viewYear}-${pad(i + 1)}`] || 0,
    }));
    const yearTotal = months.reduce((s, m) => s + m.points, 0);
    return { months, yearTotal };
  }, [dailyPointsMap, viewYear]);
  const maxAbsMonthPoints = Math.max(1, ...yearData.months.map((m) => Math.abs(m.points)));

  const monthlyCategoryStats = useMemo(() => {
    return Array.from({ length: 12 }, (_, m) => {
      const prefix = `${viewYear}-${pad(m + 1)}`;
      const map = {};
      active.forEach((h, i) => {
        const pts = allStats[i].daily.filter((d) => d.date.startsWith(prefix)).reduce((s, d) => s + d.delta, 0);
        if (pts !== 0) {
          const cat = categoryOf(h);
          map[cat] = (map[cat] || 0) + pts;
        }
      });
      (tasks || []).forEach((t) => {
        if (t.completed && t.completedAt && t.completedAt.startsWith(prefix)) {
          const cat = categoryOf(t);
          map[cat] = (map[cat] || 0) + t.points;
        }
      });
      (goals || []).forEach((g) => {
        if (g.achieved && g.achievedAt && g.achievedAt.startsWith(prefix)) {
          const cat = categoryOf(g);
          map[cat] = (map[cat] || 0) + g.points;
        }
      });
      return Object.entries(map).map(([category, points]) => ({ category, points })).sort((a, b) => b.points - a.points);
    });
  }, [active, allStats, tasks, goals, viewYear]);
  const [hoveredMonth, setHoveredMonth] = useState(null);

  const achievedGoals = (goals || []).filter((g) => g.achieved).sort((a, b) => (b.achievedAt || "").localeCompare(a.achievedAt || ""));
  const openGoalsCount = (goals || []).filter((g) => !g.achieved).length;
  const goalPointsSum = achievedGoals.reduce((s, g) => s + g.points, 0);

  return (
    <div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, marginBottom: 20 }}>Fortschritt</h1>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <SectionLabel>Gesamtpunkte über Zeit</SectionLabel>
        <ResponsiveContainer width="100%" height={220}>
          <LineChart data={combinedDaily}>
            <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
            <XAxis dataKey="date" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} minTickGap={30} />
            <YAxis tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={false} tickLine={false} />
            <Tooltip contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} labelStyle={{ color: COLORS.text }} />
            <Line type="monotone" dataKey="total" stroke={COLORS.ember2} strokeWidth={2.5} dot={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <SectionLabel>Jahresübersicht</SectionLabel>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <IconButton onClick={() => setViewYear((y) => y - 1)} title="Vorheriges Jahr"><ChevronLeft size={14} /></IconButton>
            <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13.5, fontWeight: 700, minWidth: 50, textAlign: "center" }}>{viewYear}</span>
            <IconButton onClick={() => setViewYear((y) => Math.min(y + 1, currentYear))} title="Nächstes Jahr"><ChevronRight size={14} /></IconButton>
          </div>
        </div>

        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16,
          padding: "12px 14px", borderRadius: 12,
          background: `linear-gradient(135deg, ${COLORS.ember1}14, ${COLORS.ember2}0a)`, border: `1px solid ${COLORS.ember1}33`,
        }}>
          <span style={{ fontSize: 12.5, color: COLORS.textMuted, fontWeight: 600 }}>Jahrespunkte {viewYear}</span>
          <span style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600, color: yearData.yearTotal < 0 ? COLORS.coral : COLORS.ember2 }}>
            {yearData.yearTotal >= 0 ? "+" : ""}{yearData.yearTotal}
          </span>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(3, 1fr)" : "repeat(4, 1fr)", gap: 10 }}>
          {yearData.months.map((m) => {
            const isFutureMonth = viewYear === currentYear && m.month > new Date().getMonth();
            const barPct = Math.max(3, Math.round((Math.abs(m.points) / maxAbsMonthPoints) * 100));
            const color = m.points > 0 ? COLORS.ember2 : m.points < 0 ? COLORS.coral : COLORS.textFaint;
            const monthCats = monthlyCategoryStats[m.month];
            const maxAbsMonthCat = Math.max(1, ...monthCats.map((c) => Math.abs(c.points)));
            return (
              <div
                key={m.month}
                onMouseEnter={() => setHoveredMonth(m.month)}
                onMouseLeave={() => setHoveredMonth((h) => (h === m.month ? null : h))}
                onClick={() => setHoveredMonth((h) => (h === m.month ? null : m.month))}
                style={{ position: "relative", cursor: "pointer" }}
              >
                <div style={{
                  background: COLORS.bgSoft, border: `1px solid ${hoveredMonth === m.month ? COLORS.violet : COLORS.borderSoft}`, borderRadius: 10,
                  padding: "10px 10px 8px", opacity: isFutureMonth ? 0.4 : 1, cursor: "default", transition: "border-color .15s",
                }}>
                  <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 4 }}>
                    {MONTH_LABELS[m.month]}
                  </div>
                  <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 14, fontWeight: 700, color, marginBottom: 6 }}>
                    {m.points >= 0 ? "+" : ""}{m.points}
                  </div>
                  <div style={{ height: 4, borderRadius: 2, background: COLORS.surfaceRaised, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${barPct}%`, borderRadius: 2, background: color }} />
                  </div>
                </div>

                {hoveredMonth === m.month && (
                  <div style={{
                    position: "absolute", top: "calc(100% + 6px)", zIndex: 60, width: 220,
                    ...(m.month % (isMobile ? 3 : 4) === (isMobile ? 2 : 3) ? { right: 0 } : { left: 0 }),
                    background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 12,
                    padding: 12, boxShadow: "0 20px 40px rgba(0,0,0,0.45)",
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>
                      Punkte nach Gruppe · {MONTH_LABELS[m.month]} {viewYear}
                    </div>
                    {monthCats.length === 0 ? (
                      <div style={{ fontSize: 12, color: COLORS.textFaint }}>Keine Punkte in diesem Monat.</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {monthCats.map((c) => {
                          const catColor = categoryColor(c.category);
                          const widthPct = Math.max(3, Math.round((Math.abs(c.points) / maxAbsMonthCat) * 100));
                          return (
                            <div key={c.category}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}>
                                <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 600 }}>
                                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: catColor }} />
                                  {c.category}
                                </span>
                                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: c.points < 0 ? COLORS.coral : catColor }}>
                                  {c.points >= 0 ? "+" : ""}{c.points}
                                </span>
                              </div>
                              <div style={{ height: 5, borderRadius: 3, background: COLORS.bgSoft, overflow: "hidden" }}>
                                <div style={{ height: "100%", width: `${widthPct}%`, borderRadius: 3, background: c.points < 0 ? COLORS.coral : catColor }} />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {(goals || []).length > 0 && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
          <SectionLabel>Ziele</SectionLabel>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 14 }}>
            <StatCard label="Erreicht" value={achievedGoals.length} suffix="" accent={COLORS.mint} />
            <StatCard label="Offen" value={openGoalsCount} suffix="" accent={COLORS.textFaint} />
            <StatCard label="Punkte aus Zielen" value={goalPointsSum} suffix="" accent={COLORS.ember2} />
          </div>
          {achievedGoals.length === 0 ? (
            <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch kein Ziel erreicht.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {achievedGoals.map((g) => (
                <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                  <Target size={13} style={{ color: COLORS.violet, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{g.title}</span>
                  {g.achievedAt && <span style={{ fontSize: 11, color: COLORS.textFaint, fontFamily: "JetBrains Mono, monospace" }}>{shortDate(g.achievedAt)}</span>}
                  <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2, minWidth: 46, textAlign: "right" }}>+{g.points}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{ marginBottom: 8 }}>
        <SectionLabel>Erfolge</SectionLabel>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
          {ACHIEVEMENT_DEFS.map((a) => {
            const unlocked = achievements.find((u) => u.id === a.id);
            const AIcon = a.icon;
            return (
              <div key={a.id} style={{
                display: "flex", flexDirection: "column", gap: 8, padding: 14, borderRadius: 14,
                background: unlocked ? a.color + "14" : COLORS.surface,
                border: `1px solid ${unlocked ? a.color + "55" : COLORS.borderSoft}`,
                opacity: unlocked ? 1 : 0.45,
              }}>
                <AIcon size={20} style={{ color: a.color }} />
                <div style={{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.3 }}>{a.label}</div>
                {unlocked && <div style={{ fontSize: 10.5, color: COLORS.textFaint, fontFamily: "JetBrains Mono, monospace" }}>{shortDate(unlocked.date)}</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   KI-COACH
   Fasst die aktuelle Habit-Situation zusammen und lässt Claude
   eine kurze, ehrliche und motivierende Einschätzung schreiben.
   ============================================================ */
function buildCoachSummary(habits, entries, goals, tasks, journal) {
  const active = habits;
  const today = todayKey();
  const allStats = active.map((h) => ({ h, s: simulateHabit(h, entries, today) }));

  const openToday = active.filter((h) => dayStatus(h, entries, today) !== "success").length;

  const lines = allStats.map(({ h, s }) => {
    const streakInfo = s.currentStreak > 0
      ? `positive Streak: ${s.currentStreak} Tage (längste: ${s.longestStreak})`
      : s.currentNegStreak > 0
        ? `NEGATIVE Streak: ${s.currentNegStreak} Tage in Folge nicht erfüllt`
        : "aktuell keine Streak";
    const linkedTitles = (h.goalIds || []).map((gid) => (goals || []).find((g) => g.id === gid)?.title).filter(Boolean);
    const goalLink = linkedTitles.length > 0 ? `, zahlt ein auf Ziel(e): ${linkedTitles.map((t) => `"${t}"`).join(", ")}` : "";
    return `- "${h.name}"${h.description ? ` — was es für die Person bedeutet: "${h.description}"` : ""}: ${streakInfo}, Erfolgsquote ${s.successRate}%, heute ${dayStatus(h, entries, today) === "success" ? "bereits erfüllt" : "noch offen"}${goalLink}`;
  }).join("\n");

  const goalLines = (goals || []).map((g) =>
    `- "${g.title}"${g.description ? ` — ${g.description}` : ""} [${g.achieved ? "bereits erreicht" : "noch offen"}, ${g.points} Punkte bei Erfüllung]`
  ).join("\n");

  const openTasks = (tasks || []).filter((t) => !t.completed);
  const completedTasksCount = (tasks || []).filter((t) => t.completed).length;
  const taskLines = openTasks.map((t) =>
    `- "${t.title}"${t.category ? ` [${t.category}]` : ""}${t.dueDate ? `, fällig am ${shortDate(t.dueDate)}` : ""}, ${t.points} Punkte bei Erledigung`
  ).join("\n");

  const last7 = Array.from({ length: 7 }, (_, i) => toKey(addDays(new Date(), -i)));
  const journalLines = last7
    .map((k) => { const text = stripHtml(journal?.[k]?.text); return text ? `${longDate(k)}: ${text}` : null; })
    .filter(Boolean).join("\n");

  return `Aktive Habits (${active.length}), heute noch ${openToday} offen:\n${lines || "(noch keine Habits angelegt)"}\n\nLangfristige Ziele der Person:\n${goalLines || "(noch keine Ziele angelegt)"}\n\nOffene Aufgaben (${openTasks.length}, ${completedTasksCount} bereits erledigt):\n${taskLines || "(keine offenen Aufgaben)"}\n\nJournal-Notizen der letzten 7 Tage:\n${journalLines || "(keine Journal-Einträge in den letzten 7 Tagen)"}`;
}

const COACH_SYSTEM_PROMPT = `Du bist der eingebaute KI-Coach einer persönlichen Habit-Tracking-App ("Lifetracker"). Das übergeordnete Ziel der Person, dem alles andere untergeordnet ist, lautet: ein besserer Mensch werden. Du bekommst eine vollständige Datenzusammenfassung: die Habits (inklusive der Beschreibung, die die Person selbst hinterlegt hat und die erklärt, was das jeweilige Habit für sie bedeutet), ihre langfristigen Ziele (Goals), ihre offenen und erledigten Aufgaben (Tasks), sowie ihre Journal-Notizen der letzten Tage. Nutze all diese Quellen gemeinsam, um ein möglichst vollständiges Bild der aktuellen Situation der Person zu bekommen.

Nutze die Beschreibung jedes Habits, um zu verstehen, wofür es im Leben der Person eigentlich steht (z. B. Disziplin, Gesundheit, Beziehungen, Ruhe, Wachstum), und sprich in deiner Einschätzung genau DAS an - was es für die Person bedeutet, dieses Habit erfüllt oder nicht erfüllt zu haben, bezogen auf das Ziel, ein besserer Mensch zu werden. Punkte und Streak-Zahlen sind nur ein Hilfsmittel im Hintergrund, nicht die eigentliche Botschaft - vermeide es, dich in Zahlen zu verlieren.

Setze außerdem, wenn Ziele vorhanden sind, die Habits in Bezug zu diesen langfristigen Zielen: welche Habits bringen die Person ihren Zielen näher, und was müsste sie konkret tun, um ihre Ziele zu erreichen? Beziehe offene Aufgaben und auffällige Punkte aus den Journal-Notizen mit ein, wenn sie für die Einschätzung relevant sind.

Antworte AUSSCHLIESSLICH mit einem JSON-Objekt (kein Markdown-Codeblock, kein einleitender Text, keine Erklärung) exakt im Format {"analysis": "...", "quote": "..."}.

"analysis": eine kurze, ehrliche und motivierende Einschätzung auf Deutsch (max. 130 Wörter, Fließtext, keine Überschriften, keine Einleitung wie "Klar" oder "Hier ist"). Sprich die Person direkt mit "du" an. Gehe inhaltlich auf die Bedeutung der Habits ein statt auf reine Zahlen, beziehe wenn möglich die Ziele, offenen Aufgaben und Journal-Notizen der Person mit ein, und gib zum Schluss einen konkreten, handlungsorientierten Ansporn für heute. Kein Smalltalk, keine Emojis, kein Fazit-Absatz.

"quote": ein einzelner, kurzer und einprägsamer Motivationsspruch auf Deutsch (max. 12 Wörter), passend zur aktuellen Situation und zum übergeordneten Ziel, ein besserer Mensch zu werden. Ohne Anführungszeichen, ohne Emoji, kein Fließtext, wie ein Spruch auf einer Trainingskarte.`;

async function fetchCoachAnalysis(summary) {
  const anthropicKey = getAnthropicKey();
  if (!anthropicKey) throw new Error("Kein Anthropic API-Key hinterlegt (siehe Einstellungen).");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 500,
      system: COACH_SYSTEM_PROMPT,
      messages: [{ role: "user", content: summary }],
    }),
  });
  if (!response.ok) throw new Error("API-Fehler " + response.status);
  const data = await response.json();
  const raw = (data.content || [])
    .filter((c) => c.type === "text")
    .map((c) => c.text)
    .join("\n")
    .trim();
  if (!raw) throw new Error("Leere Antwort");
  const cleaned = raw.replace(/```json|```/g, "").trim();
  let analysis = cleaned;
  let quote = "";
  try {
    const parsed = JSON.parse(cleaned);
    analysis = (parsed.analysis || "").trim();
    quote = (parsed.quote || "").trim();
  } catch {
    // Fallback, falls kein valides JSON zurückkam: ganzen Text als Analyse verwenden
  }
  if (!analysis) throw new Error("Leere Antwort");
  return { analysis, quote };
}

function CoachPage({ habits, entries, coach, persistCoach, goals, tasks, journal, weeklyReports, persistWeeklyReports }) {
  const [loadingAnalysis, setLoadingAnalysis] = useState(false);
  const [err, setErr] = useState(null);
  const active = habits;

  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [loadingReport, setLoadingReport] = useState(false);
  const [reportErr, setReportErr] = useState(null);

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);
  const weekMonthYearLabel = keyToDate(weekDays[0]).toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  const weekNum = isoWeekNumber(keyToDate(weekDays[0]));
  const weekKey = toKey(weekStart);
  const weekReport = (weeklyReports || {})[weekKey];

  const perHabitDailyMap = useMemo(() => habits.map((h) => {
    const s = simulateHabit(h, entries, todayKey());
    return { habit: h, map: Object.fromEntries(s.daily.map((d) => [d.date, d])) };
  }), [habits, entries]);

  const runAnalysis = async () => {
    setLoadingAnalysis(true);
    setErr(null);
    try {
      const summary = buildCoachSummary(habits, entries, goals, tasks, journal);
      const { analysis, quote } = await fetchCoachAnalysis(summary);
      persistCoach({ text: analysis, quote, generatedAt: new Date().toISOString() });
    } catch (e) {
      setErr("Die Analyse konnte gerade nicht geladen werden. Versuch es gleich noch einmal.");
    } finally {
      setLoadingAnalysis(false);
    }
  };

  const runWeeklyReport = async () => {
    setLoadingReport(true);
    setReportErr(null);
    try {
      const tasksForWeek = (tasks || []).filter((t) => t.dueDate && weekDays.includes(t.dueDate));
      const summary = buildWeekSummary(weekDays, perHabitDailyMap, journal || {}, goals, tasksForWeek);
      const report = await fetchWeeklyReport(summary);
      const next = { ...(weeklyReports || {}), [weekKey]: { text: report, generatedAt: new Date().toISOString(), weekStart: weekKey, weekEnd: weekDays[6] } };
      persistWeeklyReports(next);
    } catch (e) {
      setReportErr("Der Wochenbericht konnte gerade nicht erstellt werden. Versuch es gleich noch einmal.");
    } finally {
      setLoadingReport(false);
    }
  };

  const generatedLabel = coach?.generatedAt
    ? new Date(coach.generatedAt).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
    : null;

  return (
    <div>

/* ============================================================
   JOURNAL
   Tageseintrag mit Habit-Zusammenfassung, Freitext (RTF) und
   optionalem Tages-Feedback vom KI-Coach.
   ============================================================ */
function stripHtml(html) {
  if (!html) return "";
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("br").forEach((br) => br.replaceWith("\n"));
  tmp.querySelectorAll("p, div, li").forEach((el) => el.append("\n"));
  return (tmp.textContent || tmp.innerText || "").replace(/\n{3,}/g, "\n\n").trim();
}

function buildDaySummary(dateKey, habitRows, journalHtml, goals, tasksForDay) {
  const lines = habitRows.map(({ habit, entry }) => {
    const linkedTitles = (habit.goalIds || []).map((gid) => (goals || []).find((g) => g.id === gid)?.title).filter(Boolean);
    const goalLink = linkedTitles.length > 0 ? `, zahlt ein auf Ziel(e): ${linkedTitles.map((t) => `"${t}"`).join(", ")}` : "";
    return `- "${habit.name}"${habit.description ? ` — Bedeutung für die Person: "${habit.description}"` : ""}: ${entry.status === "success" ? "erfüllt" : entry.status === "fail" ? "nicht erfüllt" : "kein Eintrag"}${goalLink}`;
  }).join("\n");
  const journalText = stripHtml(journalHtml);
  const goalLines = (goals || []).map((g) =>
    `- "${g.title}"${g.description ? ` — ${g.description}` : ""} [${g.achieved ? "bereits erreicht" : "noch offen"}]`
  ).join("\n");
  const taskLines = (tasksForDay || []).map((t) =>
    `- "${t.title}"${t.category ? ` [${t.category}]` : ""}: ${t.completed ? "erledigt" : "offen"}`
  ).join("\n");
  return `Datum: ${longDate(dateKey)}\nHabits an diesem Tag:\n${lines || "(keine aktiven Habits)"}${journalText ? `\n\nTagebucheintrag der Person zu diesem Tag:\n${journalText}` : "\n\n(Kein Tagebucheintrag vorhanden.)"}\n\nLangfristige Ziele der Person:\n${goalLines || "(noch keine Ziele angelegt)"}\n\nAufgaben mit Termin an diesem Tag:\n${taskLines || "(keine Aufgaben mit Termin an diesem Tag)"}`;
}

const DAILY_COACH_SYSTEM_PROMPT = `Du bist der eingebaute KI-Coach einer Habit-Tracking-App ("Lifetracker"). Das übergeordnete Ziel der Person lautet: ein besserer Mensch werden. Du bekommst die Habit-Ergebnisse eines einzelnen Tages (inklusive der Beschreibung, was jedes Habit der Person bedeutet), ggf. einen Tagebucheintrag zu diesem Tag, ihre langfristigen Ziele (Goals) sowie ihre Aufgaben (Tasks) mit Termin an diesem Tag. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt (kein Markdown-Codeblock, kein einleitender Text) exakt im Format {"feedback": "..."}. "feedback": ein kurzes, ehrliches und motivierendes Feedback zu genau diesem einen Tag auf Deutsch (max. 90 Wörter, Fließtext, sprich die Person mit "du" an, keine Einleitung wie "Klar" oder "Hier ist"). Konzentriere dich darauf, was das Erfüllen oder Nicht-Erfüllen der Habits an diesem Tag für die Person bedeutet - bezogen auf die Bedeutung, die sie dem Habit selbst gegeben hat, und auf ihre langfristigen Ziele - statt auf Punktzahlen einzugehen. Geh, wenn ein Tagebucheintrag vorhanden ist, konkret darauf ein, und erwähne offene Aufgaben, wenn sie relevant sind. Kein Smalltalk, keine Emojis.`;

async function fetchDailyFeedback(summary) {
  const anthropicKey = getAnthropicKey();
  if (!anthropicKey) throw new Error("Kein Anthropic API-Key hinterlegt (siehe Einstellungen).");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 400,
      system: DAILY_COACH_SYSTEM_PROMPT,
      messages: [{ role: "user", content: summary }],
    }),
  });
  if (!response.ok) throw new Error("API-Fehler " + response.status);
  const data = await response.json();
  const raw = (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n").trim();
  if (!raw) throw new Error("Leere Antwort");
  const cleaned = raw.replace(/```json|```/g, "").trim();
  let feedback = cleaned;
  try {
    const parsed = JSON.parse(cleaned);
    feedback = (parsed.feedback || "").trim();
  } catch {
    // Fallback: Rohtext verwenden, falls kein valides JSON zurückkam
  }
  if (!feedback) throw new Error("Leere Antwort");
  return feedback;
}

// Baut eine Wochenzusammenfassung (pro Habit + pro Tag inkl. Tagebuch) für den Wochenbericht
function buildWeekSummary(weekDays, perHabitDailyMap, journal, goals, tasksForWeek) {
  const habitTotals = perHabitDailyMap.map(({ habit, map }) => {
    const weekEntries = weekDays.map((k) => map[k]).filter(Boolean);
    const successCount = weekEntries.filter((e) => e.status === "success").length;
    return { habit, successCount, tracked: weekEntries.length };
  }).filter((h) => h.tracked > 0);

  const habitLines = habitTotals
    .map((h) => {
      const linkedTitles = (h.habit.goalIds || []).map((gid) => (goals || []).find((g) => g.id === gid)?.title).filter(Boolean);
      const goalLink = linkedTitles.length > 0 ? `, zahlt ein auf Ziel(e): ${linkedTitles.map((t) => `"${t}"`).join(", ")}` : "";
      return `- "${h.habit.name}"${h.habit.description ? ` — Bedeutung für die Person: "${h.habit.description}"` : ""}: ${h.successCount}/${h.tracked} Tage erfüllt${goalLink}`;
    })
    .join("\n");

  const dayLines = weekDays.map((k) => {
    const rows = perHabitDailyMap.map(({ habit, map }) => ({ habit, entry: map[k] })).filter(({ entry }) => entry !== undefined);
    const habitLine = rows.map(({ habit, entry }) =>
      `${habit.name}: ${entry.status === "success" ? "erfüllt" : entry.status === "fail" ? "nicht erfüllt" : "offen"}`
    ).join(", ");
    const journalText = stripHtml(journal[k]?.text);
    return `${longDate(k)}${habitLine ? ` — ${habitLine}` : ""}${journalText ? `\nTagebuch: ${journalText}` : ""}`;
  }).join("\n\n");

  const goalLines = (goals || []).map((g) =>
    `- "${g.title}"${g.description ? ` — ${g.description}` : ""} [${g.achieved ? "bereits erreicht" : "noch offen"}]`
  ).join("\n");

  const taskLines = (tasksForWeek || []).map((t) =>
    `- "${t.title}"${t.category ? ` [${t.category}]` : ""}, fällig am ${shortDate(t.dueDate)}: ${t.completed ? "erledigt" : "offen"}`
  ).join("\n");

  return `Wochenübersicht (${shortDate(weekDays[0])} – ${shortDate(weekDays[6])}):\n\nPro Habit:\n${habitLines || "(keine Habits getrackt)"}\n\nTage im Detail:\n${dayLines}\n\nLangfristige Ziele der Person:\n${goalLines || "(noch keine Ziele angelegt)"}\n\nAufgaben mit Termin in dieser Woche:\n${taskLines || "(keine Aufgaben mit Termin in dieser Woche)"}`;
}

function JournalPage({ habits, entries, journal, persistJournal, goals, tasks, hasCoach }) {
  const isMobile = useIsMobile();
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [selectedDay, setSelectedDay] = useState(todayKey());
  const [loadingFeedback, setLoadingFeedback] = useState(false);
  const [feedbackErr, setFeedbackErr] = useState(null);
  const [saved, setSaved] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [exportFrom, setExportFrom] = useState(() => toKey(new Date(new Date().getFullYear(), new Date().getMonth(), 1)));
  const [exportTo, setExportTo] = useState(() => todayKey());
  const [exportErr, setExportErr] = useState(null);
  const editorRef = useRef(null);

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const weekRangeLabel = `${shortDate(weekDays[0])} – ${shortDate(weekDays[6])} ${keyToDate(weekDays[6]).getFullYear()}`;
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);
  const isFuture = (k) => k > todayKey();

  const perHabitDailyMap = useMemo(() => habits.map((h) => {
    const s = simulateHabit(h, entries, todayKey());
    return { habit: h, map: Object.fromEntries(s.daily.map((d) => [d.date, d])) };
  }), [habits, entries]);

  const buildExportMarkdown = (fromKey, toKeyStr) => {
    if (!fromKey || !toKeyStr || fromKey > toKeyStr) return null;
    const days = [];
    let cursor = keyToDate(fromKey);
    const end = keyToDate(toKeyStr);
    while (cursor <= end) {
      days.push(toKey(cursor));
      cursor = addDays(cursor, 1);
    }

    const sections = days.map((k) => {
      const entry = journal[k];
      const journalText = entry ? stripHtml(entry.text) : "";
      const hasContent = journalText.length > 0 || !!entry?.feedback;
      if (!hasContent) return null;

      const rows = perHabitDailyMap.map(({ habit, map }) => ({ habit, entry: map[k] })).filter(({ entry }) => entry !== undefined);
      const total = rows.reduce((s, { entry }) => s + entry.delta, 0);
      const habitLines = rows.map(({ habit, entry }) =>
        `- ${habit.name}: ${entry.status === "success" ? "erfüllt" : entry.status === "fail" ? "nicht erfüllt" : "offen"} (${entry.delta >= 0 ? "+" : ""}${entry.delta})`
      ).join("\n");

      let md = `## ${longDate(k)}\n\n`;
      if (rows.length > 0) md += `**Punkte des Tages:** ${total >= 0 ? "+" : ""}${total}\n\n**Habits:**\n${habitLines}\n\n`;
      if (journalText) md += `**Tagebuch:**\n\n${journalText}\n\n`;
      if (entry?.feedback) md += `**Coach-Feedback:**\n\n${entry.feedback}\n\n`;
      return md;
    }).filter(Boolean);

    if (sections.length === 0) return null;
    return `# Journal-Export\n\nZeitraum: ${shortDate(fromKey)} – ${shortDate(toKeyStr)}\n\n${sections.join("---\n\n")}`;
  };

  const runExport = () => {
    setExportErr(null);
    const md = buildExportMarkdown(exportFrom, exportTo);
    if (!md) {
      setExportErr("Keine Tagebucheinträge in diesem Zeitraum gefunden.");
      return;
    }
    downloadFile(`journal-export-${exportFrom}-bis-${exportTo}.md`, md, "text/markdown");
    setShowExport(false);
  };

  const dayTotal = (dateKey) => perHabitDailyMap.reduce((sum, { map }) => sum + (map[dateKey]?.delta || 0), 0);

  const selectedHabitRows = useMemo(() => perHabitDailyMap
    .map(({ habit, map }) => ({ habit, entry: map[selectedDay] }))
    .filter(({ entry }) => entry !== undefined), [perHabitDailyMap, selectedDay]);

  const selectedTotal = selectedHabitRows.reduce((s, { entry }) => s + entry.delta, 0);
  const dayEntry = journal[selectedDay] || {};

  const tasksCompletedThisDay = (tasks || []).filter((t) => t.completed && t.completedAt === selectedDay);
  const goalsAchievedThisDay = (goals || []).filter((g) => g.achieved && g.achievedAt === selectedDay);
  const milestonesHitThisDay = selectedHabitRows.filter(({ entry }) => entry.milestoneHit > 0);

  useEffect(() => {
    if (editorRef.current) editorRef.current.innerHTML = dayEntry.text || "";
    setSaved(false);
    setFeedbackErr(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedDay]);

  const saveEntry = () => {
    const html = editorRef.current ? editorRef.current.innerHTML : "";
    const next = { ...journal, [selectedDay]: { ...(journal[selectedDay] || {}), text: html } };
    persistJournal(next);
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  const runFeedback = async () => {
    setLoadingFeedback(true);
    setFeedbackErr(null);
    try {
      const html = editorRef.current ? editorRef.current.innerHTML : (dayEntry.text || "");
      const tasksForDay = (tasks || []).filter((t) => t.dueDate === selectedDay);
      const summary = buildDaySummary(selectedDay, selectedHabitRows, html, goals, tasksForDay);
      const feedback = await fetchDailyFeedback(summary);
      const next = { ...journal, [selectedDay]: { ...(journal[selectedDay] || {}), text: html, feedback, feedbackAt: new Date().toISOString() } };
      persistJournal(next);
    } catch (e) {
      setFeedbackErr("Feedback konnte gerade nicht geladen werden. Versuch es gleich noch einmal.");
    } finally {
      setLoadingFeedback(false);
    }
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Journal</h1>
        <button onClick={() => setShowExport((s) => !s)} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6 }}>
          <Download size={14} /> Exportieren
        </button>
      </div>

      {showExport && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
          <SectionLabel>Tagesberichte exportieren</SectionLabel>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
            <div style={{ flex: "1 1 180px" }}>
              <label style={labelStyle}>Von</label>
              <DatePicker value={exportFrom} onChange={setExportFrom} placeholder="Startdatum" />
            </div>
            <div style={{ flex: "1 1 180px" }}>
              <label style={labelStyle}>Bis</label>
              <DatePicker value={exportTo} onChange={setExportTo} placeholder="Enddatum" />
            </div>
          </div>
          {exportErr && <div style={{ color: COLORS.coral, fontSize: 12.5, marginBottom: 10 }}>{exportErr}</div>}
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => setShowExport(false)} style={ghostBtn}>Abbrechen</button>
            <button onClick={runExport} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 7 }}>
              <Download size={14} /> Als Markdown exportieren
            </button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>Woche</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, -7))} title="Vorherige Woche"><ChevronLeft size={14} /></IconButton>
          <span style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, minWidth: 128, textAlign: "center", fontFamily: "JetBrains Mono, monospace" }}>
            KW {isoWeekNumber(keyToDate(weekDays[0]))} · {weekRangeLabel}
          </span>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, 7))} title="Nächste Woche"><ChevronRight size={14} /></IconButton>
          {!isCurrentWeek && (
            <button onClick={() => { setWeekStart(startOfWeek(new Date())); setSelectedDay(todayKey()); }} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Heute</button>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: isMobile ? 4 : 6, marginBottom: 20 }}>
        {weekDays.map((k, i) => {
          const isToday = k === todayKey();
          const isSelected = k === selectedDay;
          const weekend = i >= 5;
          const future = isFuture(k);
          const d = keyToDate(k);
          const total = dayTotal(k);
          const hasEntry = !!journal[k]?.text && stripHtml(journal[k].text).length > 0;
          return (
            <div key={k}>
              <div style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: weekend ? COLORS.ember2 : COLORS.textFaint, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>
                {WEEKDAY_LABELS[i]}
              </div>
              <button
                onClick={() => !future && setSelectedDay(k)}
                disabled={future}
                title={shortDate(k)}
                style={{
                  width: "100%", aspectRatio: "1", borderRadius: 11, cursor: future ? "default" : "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", gap: 2,
                  background: weekend ? COLORS.bgSoft : COLORS.surfaceRaised,
                  border: isSelected ? `2px solid ${COLORS.violet}` : isToday ? `1.5px solid ${COLORS.textMuted}` : `1px solid ${COLORS.borderSoft}`,
                  opacity: future ? 0.35 : 1,
                }}>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, color: COLORS.text }}>{d.getDate()}</span>
                {total !== 0 && (
                  <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 9.5, fontWeight: 600, color: total > 0 ? COLORS.ember2 : COLORS.coral }}>
                    {total > 0 ? "+" : ""}{total}
                  </span>
                )}
                {hasEntry && <span style={{ position: "absolute", top: 4, right: 4, width: 5, height: 5, borderRadius: "50%", background: COLORS.violet }} />}
              </button>
            </div>
          );
        })}
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>
        {selectedDay === todayKey() ? "Heute" : longDate(selectedDay)}
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <SectionLabel>Habits an diesem Tag</SectionLabel>
          <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13, fontWeight: 700, color: selectedTotal < 0 ? COLORS.coral : COLORS.ember2 }}>
            {selectedTotal >= 0 ? "+" : ""}{selectedTotal} Punkte
          </span>
        </div>
        {selectedHabitRows.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Keine Habits an diesem Tag verfolgt.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {selectedHabitRows.map(({ habit, entry }) => {
              const Icon = iconFor(habit.icon);
              const st = entry.status;
              return (
                <div key={habit.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                  <Icon size={14} style={{ color: habit.color, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{habit.name}</span>
                  <span style={{
                    fontSize: 10.5, fontWeight: 700, padding: "2px 7px", borderRadius: 6, textTransform: "uppercase", letterSpacing: "0.03em",
                    color: st === "success" ? habit.color : st === "fail" ? COLORS.coral : COLORS.textFaint,
                    background: st === "success" ? habit.color + "1f" : st === "fail" ? COLORS.coral + "1f" : COLORS.surfaceRaised,
                  }}>
                    {st === "success" ? "Erfüllt" : st === "fail" ? "Nicht erfüllt" : "Offen"}
                  </span>
                  <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 600, minWidth: 34, textAlign: "right", color: entry.delta > 0 ? habit.color : entry.delta < 0 ? COLORS.coral : COLORS.textFaint }}>
                    {entry.delta >= 0 ? "+" : ""}{entry.delta}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {(tasksCompletedThisDay.length > 0 || goalsAchievedThisDay.length > 0 || milestonesHitThisDay.length > 0) && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <SectionLabel>Erledigt an diesem Tag</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {goalsAchievedThisDay.map((g) => (
              <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                <Target size={14} style={{ color: COLORS.violet, flexShrink: 0 }} />
                <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>Ziel erreicht: {g.title}</span>
                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2 }}>+{g.points}</span>
              </div>
            ))}
            {tasksCompletedThisDay.map((t) => (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                <ClipboardList size={14} style={{ color: COLORS.mint, flexShrink: 0 }} />
                <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>Aufgabe erledigt: {t.title}</span>
                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2 }}>+{t.points}</span>
              </div>
            ))}
            {milestonesHitThisDay.map(({ habit, entry }) => (
              <div key={habit.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
                <Award size={14} style={{ color: COLORS.ember2, flexShrink: 0 }} />
                <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>Meilenstein bei "{habit.name}": {entry.milestoneHit}-Tage-Streak</span>
                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: COLORS.ember2 }}>+{entry.bonusPoints}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <SectionLabel>Dein Tag</SectionLabel>
      <div style={{ marginBottom: 16 }}>
        <RichTextEditor editorRef={editorRef} initialHtml={dayEntry.text} />
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 10 }}>
          {saved && <span style={{ fontSize: 12, color: COLORS.mint, alignSelf: "center" }}>Gespeichert</span>}
          <button onClick={saveEntry} style={ghostBtn}>Eintrag speichern</button>
        </div>
      </div>

      {hasCoach && (
        <div style={{
          background: `linear-gradient(160deg, ${COLORS.surface}, ${COLORS.bgSoft})`,
          border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14, padding: 16,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 10 }}>
            <div style={{
              width: 28, height: 28, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center",
              background: `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.ember1})`,
            }}>
              <Brain size={14} style={{ color: "#fff" }} />
            </div>
            <span style={{ fontWeight: 700, fontSize: 13.5 }}>Coach-Feedback zu diesem Tag</span>
          </div>

          {loadingFeedback ? (
            <div style={{ color: COLORS.textMuted, fontSize: 13.5, display: "flex", alignItems: "center", gap: 8 }}>
              <Sparkles size={14} style={{ color: COLORS.ember2 }} /> Analysiert deinen Tag …
            </div>
          ) : dayEntry.feedback ? (
            <p style={{ fontSize: 13.5, lineHeight: 1.6, color: COLORS.text, margin: 0, marginBottom: 10 }}>{dayEntry.feedback}</p>
          ) : (
            <div style={{ color: COLORS.textMuted, fontSize: 13, marginBottom: 10 }}>Noch kein Feedback für diesen Tag.</div>
          )}

          {feedbackErr && <div style={{ color: COLORS.coral, fontSize: 12, marginBottom: 8 }}>{feedbackErr}</div>}

          <button onClick={runFeedback} disabled={loadingFeedback} style={{
            ...primaryBtn, display: "flex", alignItems: "center", gap: 7,
            opacity: loadingFeedback ? 0.6 : 1, cursor: loadingFeedback ? "not-allowed" : "pointer",
          }}>
            <Sparkles size={13} /> {dayEntry.feedback ? "Feedback neu holen" : "Feedback holen"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   GOALS
   Langfristige Ziele mit Beschreibung und Punktebelohnung bei
   Erfüllung. Werden dem Coach als Kontext für die Habits gegeben.
   ============================================================ */
function GoalsPage({ goals, persistGoals, habits, entries, categories, onAddCategory }) {
  const [showModal, setShowModal] = useState(false);
  const [modalGoal, setModalGoal] = useState(undefined);

  const achievedCount = goals.filter((g) => g.achieved).length;
  const totalGoalPoints = goals.filter((g) => g.achieved).reduce((s, g) => s + g.points, 0);

  const last7Keys = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(new Date(), -(6 - i)))), []);

  const linkedHabitsByGoal = useMemo(() => {
    const map = {};
    goals.forEach((g) => { map[g.id] = habits.filter((h) => (h.goalIds || []).includes(g.id)); });
    return map;
  }, [goals, habits]);

  const weekDataByGoal = useMemo(() => {
    const map = {};
    goals.forEach((g) => {
      const linked = linkedHabitsByGoal[g.id] || [];
      if (linked.length === 0) { map[g.id] = { series: [], total: 0 }; return; }
      const dailyMaps = linked.map((h) => {
        const s = simulateHabit(h, entries, todayKey());
        return Object.fromEntries(s.daily.map((d) => [d.date, d]));
      });
      const series = last7Keys.map((k) => ({ date: k, points: dailyMaps.reduce((sum, m) => sum + (m[k]?.delta || 0), 0) }));
      map[g.id] = { series, total: series.reduce((s, d) => s + d.points, 0) };
    });
    return map;
  }, [goals, linkedHabitsByGoal, entries, last7Keys]);

  const toggleAchieved = (goal) => {
    const next = goals.map((g) => g.id === goal.id
      ? { ...g, achieved: !g.achieved, achievedAt: !g.achieved ? todayKey() : null }
      : g);
    persistGoals(next);
  };

  const handleSave = (goal) => {
    const exists = goals.some((g) => g.id === goal.id);
    const next = exists ? goals.map((g) => (g.id === goal.id ? goal : g)) : [...goals, goal];
    persistGoals(next);
    setShowModal(false);
    setModalGoal(undefined);
  };

  const handleDelete = (id) => {
    persistGoals(goals.filter((g) => g.id !== id));
    setShowModal(false);
    setModalGoal(undefined);
  };

  const openGoals = goals.filter((g) => !g.achieved);
  const doneGoals = goals.filter((g) => g.achieved);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Goals</h1>
        <button onClick={() => { setModalGoal(undefined); setShowModal(true); }} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 6 }}>
          <Plus size={15} /> Neues Ziel
        </button>
      </div>

      {goals.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 26 }}>
          <StatCard label="Ziele gesamt" value={goals.length} suffix="" accent={COLORS.violet} />
          <StatCard label="Erreicht" value={achievedCount} suffix="" accent={COLORS.mint} />
          <StatCard label="Zielpunkte erhalten" value={totalGoalPoints} suffix="" accent={COLORS.ember2} />
        </div>
      )}

      {goals.length === 0 ? (
        <div style={{ textAlign: "center", padding: "48px 20px", border: `1px dashed ${COLORS.border}`, borderRadius: 16, color: COLORS.textMuted }}>
          <Target size={28} style={{ color: COLORS.violet, marginBottom: 10 }} />
          <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text, marginBottom: 4 }}>Noch keine Ziele</div>
          <div style={{ fontSize: 13, marginBottom: 16 }}>Leg dein erstes langfristiges Ziel an – dein Coach setzt deine Habits dann in Bezug dazu.</div>
          <button onClick={() => { setModalGoal(undefined); setShowModal(true); }} style={primaryBtn}>Erstes Ziel anlegen</button>
        </div>
      ) : (
        <>
          {openGoals.length > 0 && (
            <div style={{ marginBottom: 22 }}>
              <SectionLabel>Offen</SectionLabel>
              <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                {groupHabitsByCategory(openGoals).map(({ category, habits: groupGoals }) => (
                  <div key={category}>
                    <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
                      <span style={{ width: 6, height: 6, borderRadius: "50%", background: categoryColor(category) }} />
                      <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{category}</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {groupGoals.map((g) => (
                        <GoalRow key={g.id} goal={g} onToggle={() => toggleAchieved(g)} onEdit={() => { setModalGoal(g); setShowModal(true); }}
                          linkedHabits={linkedHabitsByGoal[g.id] || []} weekSeries={weekDataByGoal[g.id]?.series || []} weekTotal={weekDataByGoal[g.id]?.total || 0} />
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {doneGoals.length > 0 && (
            <div>
              <SectionLabel>Erreicht</SectionLabel>
              <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                {groupHabitsByCategory(doneGoals).map(({ category, habits: groupGoals }) => (
                  <div key={category}>
                    <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
                      <span style={{ width: 6, height: 6, borderRadius: "50%", background: categoryColor(category) }} />
                      <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{category}</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {groupGoals.map((g) => (
                        <GoalRow key={g.id} goal={g} onToggle={() => toggleAchieved(g)} onEdit={() => { setModalGoal(g); setShowModal(true); }}
                          linkedHabits={linkedHabitsByGoal[g.id] || []} weekSeries={weekDataByGoal[g.id]?.series || []} weekTotal={weekDataByGoal[g.id]?.total || 0} />
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}

      {showModal && (
        <GoalModal
          initial={modalGoal}
          categories={categories}
          onAddCategory={onAddCategory}
          onClose={() => { setShowModal(false); setModalGoal(undefined); }}
          onSave={handleSave}
          onDelete={handleDelete}
        />
      )}
    </div>
  );
}

function GoalRow({ goal, onToggle, onEdit, linkedHabits, weekSeries, weekTotal }) {
  const maxAbs = Math.max(1, ...weekSeries.map((d) => Math.abs(d.points)));
  return (
    <div style={{
      display: "flex", alignItems: "flex-start", gap: 12, padding: "14px 16px",
      background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14,
      opacity: goal.achieved ? 0.75 : 1,
    }}>
      <button onClick={onToggle} style={{
        width: 26, height: 26, borderRadius: "50%", flexShrink: 0, cursor: "pointer", marginTop: 2,
        border: goal.achieved ? "none" : `1.5px solid ${COLORS.border}`,
        background: goal.achieved ? `linear-gradient(135deg, ${COLORS.mint}, #2DBE83)` : "transparent",
        color: goal.achieved ? "#0A1F14" : COLORS.textMuted,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Check size={14} strokeWidth={2.8} />
      </button>

      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontWeight: 600, fontSize: 14.5, textDecoration: goal.achieved ? "line-through" : "none" }}>{goal.title}</span>
          <span style={{
            fontSize: 11, fontWeight: 700, padding: "2px 7px", borderRadius: 6,
            color: COLORS.ember2, background: COLORS.ember2 + "1a",
          }}>
            {goal.points} Pkt.
          </span>
        </div>
        {goal.description && <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 4, lineHeight: 1.5 }}>{goal.description}</div>}
        {goal.achieved && goal.achievedAt && (
          <div style={{ fontSize: 11, color: COLORS.textFaint, marginTop: 4 }}>Erreicht am {shortDate(goal.achievedAt)}</div>
        )}

        {linkedHabits.length > 0 && (
          <div style={{ marginTop: 10 }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
              {linkedHabits.map((h) => {
                const Icon = iconFor(h.icon);
                return (
                  <span key={h.id} style={{
                    display: "flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 500,
                    padding: "3px 8px", borderRadius: 6, background: h.color + "1a", color: h.color,
                  }}>
                    <Icon size={10} /> {h.name}
                  </span>
                );
              })}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <span style={{ fontSize: 10, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em" }}>Punkte der letzten 7 Tage</span>
              <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 700, color: weekTotal < 0 ? COLORS.coral : COLORS.ember2 }}>
                {weekTotal >= 0 ? "+" : ""}{weekTotal}
              </span>
            </div>
            <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 30 }}>
              {weekSeries.map((d) => {
                const h = Math.max(3, Math.round((Math.abs(d.points) / maxAbs) * 26));
                return (
                  <div key={d.date} title={`${shortDate(d.date)}: ${d.points >= 0 ? "+" : ""}${d.points}`} style={{
                    flex: 1, height: h, borderRadius: 3,
                    background: d.points > 0 ? COLORS.ember2 : d.points < 0 ? COLORS.coral : COLORS.borderSoft,
                  }} />
                );
              })}
            </div>
          </div>
        )}
      </div>

      <IconButton onClick={onEdit} title="Bearbeiten"><Pencil size={14} /></IconButton>
    </div>
  );
}

/* ============================================================
   TASKS
   Einfache Aufgabenverwaltung mit Punktebelohnung bei Erledigung
   ============================================================ */
function TasksPage({ tasks, persistTasks, categories, onAddCategory }) {
  const [showModal, setShowModal] = useState(false);
  const [modalTask, setModalTask] = useState(undefined);

  const doneCount = tasks.filter((t) => t.completed).length;
  const earnedPoints = tasks.filter((t) => t.completed).reduce((s, t) => s + t.points, 0);

  const toggleCompleted = (task) => {
    const next = tasks.map((t) => t.id === task.id
      ? { ...t, completed: !t.completed, completedAt: !t.completed ? todayKey() : null }
      : t);
    persistTasks(next);
  };

  const handleSave = (task) => {
    const exists = tasks.some((t) => t.id === task.id);
    const next = exists ? tasks.map((t) => (t.id === task.id ? task : t)) : [...tasks, task];
    persistTasks(next);
    setShowModal(false);
    setModalTask(undefined);
  };

  const handleDelete = (id) => {
    persistTasks(tasks.filter((t) => t.id !== id));
    setShowModal(false);
    setModalTask(undefined);
  };

  const openTasks = tasks.filter((t) => !t.completed);
  const doneTasks = tasks.filter((t) => t.completed);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>

function CompletedTasksCalendar({ doneTasks, onToggle, onEdit }) {
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [selectedDay, setSelectedDay] = useState(todayKey());

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);
  const weekMonthYearLabel = keyToDate(weekDays[0]).toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  const weekNum = isoWeekNumber(keyToDate(weekDays[0]));
  const isFuture = (k) => k > todayKey();

  const byDate = useMemo(() => {
    const map = {};
    doneTasks.forEach((t) => {
      if (!t.completedAt) return;
      if (!map[t.completedAt]) map[t.completedAt] = [];
      map[t.completedAt].push(t);
    });
    return map;
  }, [doneTasks]);

  const selectedTasks = byDate[selectedDay] || [];

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontSize: 11, color: COLORS.textFaint }}>Wann wurde was erledigt?</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, -7))} title="Vorherige Woche"><ChevronLeft size={14} /></IconButton>
          <span style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, minWidth: 150, textAlign: "center", fontFamily: "JetBrains Mono, monospace", textTransform: "capitalize" }}>
            {weekMonthYearLabel} · KW {weekNum}
          </span>
          <IconButton onClick={() => setWeekStart(addDays(weekStart, 7))} title="Nächste Woche"><ChevronRight size={14} /></IconButton>
          {!isCurrentWeek && (
            <button onClick={() => { setWeekStart(startOfWeek(new Date())); setSelectedDay(todayKey()); }} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Heute</button>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 16 }}>
        {weekDays.map((k, i) => {
          const isToday = k === todayKey();
          const isSelected = k === selectedDay;
          const weekend = i >= 5;
          const future = isFuture(k);
          const d = keyToDate(k);
          const count = (byDate[k] || []).length;
          return (
            <div key={k}>
              <div style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: weekend ? COLORS.ember2 : COLORS.textFaint, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>
                {WEEKDAY_LABELS[i]}
              </div>
              <button
                onClick={() => !future && setSelectedDay(k)}
                disabled={future}
                title={shortDate(k)}
                style={{
                  width: "100%", aspectRatio: "1", borderRadius: 11, cursor: future ? "default" : "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", gap: 2,
                  background: weekend ? COLORS.bgSoft : COLORS.surfaceRaised,
                  border: isSelected ? `2px solid ${COLORS.mint}` : isToday ? `1.5px solid ${COLORS.textMuted}` : `1px solid ${COLORS.borderSoft}`,
                  opacity: future ? 0.35 : 1,
                }}>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, color: COLORS.text }}>{d.getDate()}</span>
                {count > 0 && (
                  <span style={{
                    fontFamily: "JetBrains Mono, monospace", fontSize: 9.5, fontWeight: 700, color: COLORS.mint,
                    display: "flex", alignItems: "center", gap: 2,
                  }}>
                    <Check size={9} strokeWidth={3} /> {count}
                  </span>
                )}
              </button>
            </div>
          );
        })}
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>
        {selectedDay === todayKey() ? "Heute" : longDate(selectedDay)}
      </div>

      {selectedTasks.length === 0 ? (
        <div style={{ fontSize: 12.5, color: COLORS.textFaint, background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
          An diesem Tag wurde keine Aufgabe erledigt.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {selectedTasks.map((t) => <TaskRow key={t.id} task={t} onToggle={() => onToggle(t)} onEdit={() => onEdit(t)} />)}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   EINSTELLUNGEN / DATENSICHERUNG
   Export als JSON-Download, Import mit Vorschau + Bestätigung
   ============================================================ */
function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadJSON(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function SettingsPage({
  habits, entries, achievements, coach, journal, weeklyReports, goals, tasks, categories,
  persistHabits, persistEntries, persistAchievements, persistCoach, persistJournal, persistWeeklyReports, persistGoals, persistTasks, persistCategories,
  onAnthropicKeyChange,
}) {
  const fileInputRef = useRef(null);
  const [pendingImport, setPendingImport] = useState(null);
  const [importError, setImportError] = useState(null);
  const [importSuccess, setImportSuccess] = useState(false);

  const handleExport = () => {
    const payload = {
      app: "life-os", version: 1, exportedAt: new Date().toISOString(),
      data: { habits, entries, achievements, coach, journal, weeklyReports, goals, tasks },
    };
    downloadJSON(`life-os-backup-${todayKey()}.json`, payload);
  };

  const handleFileSelect = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError(null);
    setImportSuccess(false);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const data = parsed && typeof parsed === "object" && parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
        if (!data || typeof data !== "object") throw new Error("invalid");
        setPendingImport(data);
      } catch {
        setImportError("Diese Datei konnte nicht gelesen werden. Ist es eine gültige Life-OS-Sicherung (.json)?");
      }
    };
    reader.onerror = () => setImportError("Die Datei konnte nicht gelesen werden.");
    reader.readAsText(file);
    e.target.value = "";
  };

  const cancelImport = () => setPendingImport(null);

  const confirmImport = async () => {
    if (!pendingImport) return;
    await persistHabits(Array.isArray(pendingImport.habits) ? pendingImport.habits : []);
    await persistEntries(pendingImport.entries && typeof pendingImport.entries === "object" ? pendingImport.entries : {});
    await persistAchievements(Array.isArray(pendingImport.achievements) ? pendingImport.achievements : []);
    await persistCoach(pendingImport.coach || null);
    await persistJournal(pendingImport.journal && typeof pendingImport.journal === "object" ? pendingImport.journal : {});
    await persistWeeklyReports(pendingImport.weeklyReports && typeof pendingImport.weeklyReports === "object" ? pendingImport.weeklyReports : {});
    await persistGoals(Array.isArray(pendingImport.goals) ? pendingImport.goals : []);
    await persistTasks(Array.isArray(pendingImport.tasks) ? pendingImport.tasks : []);
    setPendingImport(null);
    setImportSuccess(true);
    setTimeout(() => setImportSuccess(false), 4000);
  };

  const counts = pendingImport ? {
    habits: Array.isArray(pendingImport.habits) ? pendingImport.habits.length : 0,
    goals: Array.isArray(pendingImport.goals) ? pendingImport.goals.length : 0,
    tasks: Array.isArray(pendingImport.tasks) ? pendingImport.tasks.length : 0,
    journalDays: pendingImport.journal && typeof pendingImport.journal === "object" ? Object.keys(pendingImport.journal).length : 0,
  } : null;

  return (
    <div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, marginBottom: 20 }}>Einstellungen</h1>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
          <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.mint + "1f" }}>
            <Download size={15} style={{ color: COLORS.mint }} />
          </div>
          <span style={{ fontWeight: 700, fontSize: 14.5 }}>Daten exportieren</span>
        </div>
        <p style={{ fontSize: 13, color: COLORS.textMuted, lineHeight: 1.6, marginBottom: 14 }}>
          Lädt eine JSON-Datei mit allen deinen Habits, Einträgen, Zielen, Aufgaben, Journal- und Coach-Daten herunter. Damit kannst du deine Daten sichern oder auf ein anderes Gerät übertragen.
        </p>
        <button onClick={handleExport} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 7 }}>
          <Download size={14} /> Daten exportieren
        </button>
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
          <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.violet + "1f" }}>
            <Upload size={15} style={{ color: COLORS.violet }} />
          </div>
          <span style={{ fontWeight: 700, fontSize: 14.5 }}>Daten importieren</span>
        </div>
        <p style={{ fontSize: 13, color: COLORS.textMuted, lineHeight: 1.6, marginBottom: 14 }}>
          Spielt eine zuvor exportierte Sicherung wieder ein. Das überschreibt alle aktuell in dieser App gespeicherten Daten.
        </p>

        <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={handleFileSelect} style={{ display: "none" }} />
        <button onClick={() => fileInputRef.current?.click()} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 7 }}>
          <Upload size={14} /> Datei auswählen
        </button>

        {importError && (
          <div style={{ display: "flex", alignItems: "center", gap: 7, color: COLORS.coral, fontSize: 12.5, marginTop: 12 }}>
            <AlertTriangle size={14} /> {importError}
          </div>
        )}
        {importSuccess && (
          <div style={{ display: "flex", alignItems: "center", gap: 7, color: COLORS.mint, fontSize: 12.5, marginTop: 12 }}>
            <Check size={14} /> Import erfolgreich abgeschlossen.
          </div>
        )}

        {pendingImport && (
          <div style={{
            marginTop: 16, padding: 14, borderRadius: 12,
            background: COLORS.coral + "0f", border: `1px solid ${COLORS.coral}44`,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8, color: COLORS.coral, fontWeight: 700, fontSize: 13 }}>
              <AlertTriangle size={15} /> Import bestätigen
            </div>
            <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 10, lineHeight: 1.6 }}>
              Gefunden: {counts.habits} Habits, {counts.goals} Ziele, {counts.tasks} Aufgaben, {counts.journalDays} Journal-Tage.
              Das überschreibt <strong style={{ color: COLORS.text }}>alle</strong> aktuell gespeicherten Daten unwiderruflich.
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={cancelImport} style={ghostBtn}>Abbrechen</button>
              <button onClick={confirmImport} style={{ ...primaryBtn, background: `linear-gradient(135deg, ${COLORS.coral}, #FF9B85)`, color: "#2B0810" }}>
                Import bestätigen &amp; überschreiben
              </button>
            </div>
          </div>
        )}
      </div>

      <CategoryManager
        categories={categories} persistCategories={persistCategories}
        habits={habits} tasks={tasks} goals={goals}
        persistHabits={persistHabits} persistTasks={persistTasks} persistGoals={persistGoals}
      />

      <ConnectionSettings onKeyChange={onAnthropicKeyChange} />
    </div>
  );
}

function CategoryManager({ categories, persistCategories, habits, tasks, goals, persistHabits, persistTasks, persistGoals }) {
  const [newCat, setNewCat] = useState("");
  const [renaming, setRenaming] = useState(null);
  const [renameValue, setRenameValue] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null);

  const addCategory = () => {
    const trimmed = newCat.trim();
    setNewCat("");
    if (!trimmed || categories.includes(trimmed)) return;
    persistCategories([...categories, trimmed]);
  };

  const startRename = (cat) => { setRenaming(cat); setRenameValue(cat); };
  const confirmRename = () => {
    const trimmed = renameValue.trim();
    setRenaming(null);
    if (!trimmed || trimmed === renaming) return;
    persistCategories(categories.map((c) => (c === renaming ? trimmed : c)));
    persistHabits(habits.map((h) => (h.category === renaming ? { ...h, category: trimmed } : h)));
    persistTasks(tasks.map((t) => (t.category === renaming ? { ...t, category: trimmed } : t)));
    persistGoals(goals.map((g) => (g.category === renaming ? { ...g, category: trimmed } : g)));
  };

  const deleteCategory = (cat) => {
    persistCategories(categories.filter((c) => c !== cat));
    setConfirmDelete(null);
  };

  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginTop: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
        <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.mint + "1f" }}>
          <ListChecks size={15} style={{ color: COLORS.mint }} />
        </div>
        <span style={{ fontWeight: 700, fontSize: 14.5 }}>Kategorien verwalten</span>
      </div>
      <p style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
        Zentrale Liste der Kategorien für Habits, Aufgaben und Ziele. Umbenennen aktualisiert automatisch alle Einträge, die diese Kategorie nutzen.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <input
          style={{ ...inputStyle, marginBottom: 0, flex: 1 }} value={newCat}
          onChange={(e) => setNewCat(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addCategory(); }}
          placeholder="Neue Kategorie"
        />
        <button onClick={addCategory} style={primaryBtn}>Hinzufügen</button>
      </div>

      {categories.length === 0 ? (
        <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch keine Kategorien angelegt.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {categories.map((cat) => (
            <div key={cat} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: categoryColor(cat), flexShrink: 0 }} />
              {renaming === cat ? (
                <>
                  <input
                    autoFocus style={{ ...inputStyle, marginBottom: 0, flex: 1 }} value={renameValue}
                    onChange={(e) => setRenameValue(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") confirmRename(); if (e.key === "Escape") setRenaming(null); }}
                  />
                  <button onClick={confirmRename} style={{ ...primaryBtn, padding: "6px 12px" }}>OK</button>
                  <button onClick={() => setRenaming(null)} style={{ ...ghostBtn, padding: "6px 12px" }}>Abbrechen</button>
                </>
              ) : (
                <>
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{cat}</span>
                  <IconButton onClick={() => startRename(cat)} title="Umbenennen"><Pencil size={13} /></IconButton>
                  {confirmDelete === cat ? (
                    <button onClick={() => deleteCategory(cat)} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5, color: COLORS.coral, border: `1px solid ${COLORS.coral}` }}>
                      Wirklich löschen?
                    </button>
                  ) : (
                    <IconButton onClick={() => setConfirmDelete(cat)} title="Löschen" danger><Trash2 size={13} /></IconButton>
                  )}
                </>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
        <button onClick={saveKey} style={primaryBtn}>Speichern</button>
        {saved && <span style={{ fontSize: 12, color: COLORS.mint }}>Gespeichert</span>}
      </div>

      <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 10 }}>
          Setzt die Supabase-Verbindung auf diesem Gerät zurück (z. B. um ein anderes Projekt zu verbinden). Deine Daten in Supabase bleiben erhalten.
        </div>
        <button onClick={() => (confirmReset ? resetSetup() : setConfirmReset(true))} style={{
          ...ghostBtn, color: COLORS.coral,
          border: `1px solid ${confirmReset ? COLORS.coral : COLORS.border}`,
          background: confirmReset ? COLORS.coral + "1f" : "transparent",
        }}>
          {confirmReset ? "Wirklich zurücksetzen?" : "Verbindung zurücksetzen"}
        </button>
      </div>
    </div>
  );
}

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.innerWidth <= 760);
  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth <= 760);
    check();
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);
  return isMobile;
}
