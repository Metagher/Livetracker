  (function () {

      var size = 180;
      var canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext("2d");
      var r = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.arcTo(size, 0, size, size, r);
      ctx.arcTo(size, size, 0, size, r);
      ctx.arcTo(0, size, 0, 0, r);
      ctx.arcTo(0, 0, size, 0, r);
      ctx.closePath();
      var grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, "#FF7A45");

      ctx.font = "700 " + Math.round(size * 0.56) + "px Georgia, serif";

        { rel: "apple-touch-icon", sizes: "180x180" },
        { rel: "icon", sizes: "180x180" },
      ].forEach(function (cfg) {
        var link = document.createElement("link");
        link.rel = cfg.rel;
        link.sizes = cfg.sizes;
        link.href = dataUrl;

/* ============================================================
   STANDALONE-KONFIGURATION (Supabase + Anthropic API-Key)
   Wird einmalig über den Setup-Screen abgefragt und lokal im
   Browser (localStorage) auf DIESEM Gerät gespeichert. Diese
   Werte selbst werden NICHT synchronisiert - nur die App-Daten.
   ============================================================ */
const CONFIG_KEY = "lifetracker-config";
// Entfernt versehentlich mit eingegebene /rest/v1-Pfade und trailing Slashes,
// damit die App auch dann funktioniert, wenn die volle REST-URL statt nur
// der Projekt-URL eingetragen wurde.
function normalizeSupabaseUrl(url) {
  if (!url) return url;
  return url.trim().replace(/\/rest\/v1\/?.*$/i, "").replace(/\/+$/, "");
}
function getConfig() {
  try {
    const cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || "null");
    if (cfg?.supabaseUrl) cfg.supabaseUrl = normalizeSupabaseUrl(cfg.supabaseUrl);
    return cfg;
  } catch { return null; }
}
function setConfig(cfg) {
  const clean = { ...cfg, supabaseUrl: normalizeSupabaseUrl(cfg.supabaseUrl) };
  localStorage.setItem(CONFIG_KEY, JSON.stringify(clean));
}
function getAnthropicKey() {
  return getConfig()?.anthropicKey || "";
}

/* ============================================================
   STORAGE-SHIM: ersetzt Claudes window.storage 1:1 durch
   Aufrufe an eine Supabase-Tabelle "lifetracker_kv_store" (key/value/updated_at).
   Dieselbe Schnittstelle (get/set liefern {key, value}) wie zuvor,
   damit der komplette App-Code unverändert bleibt.
   ============================================================ */
function installStorageShim() {
  window.storage = {
    get: async (key) => {
      const cfg = getConfig();
      if (!cfg?.supabaseUrl || !cfg?.supabaseKey) throw new Error("Nicht konfiguriert");
      const res = await fetch(
        `${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
        { headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` } }
      );
      if (!res.ok) throw new Error("Supabase-Fehler: " + res.status);
      const rows = await res.json();
      if (!rows.length) throw new Error("Kein Eintrag für " + key);
      return { key, value: rows[0].value, shared: false };
    },
    set: async (key, value) => {
      const cfg = getConfig();
      if (!cfg?.supabaseUrl || !cfg?.supabaseKey) throw new Error("Nicht konfiguriert");
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store`, {
        method: "POST",
        headers: {
          apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=representation",
        },
        body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
      });
      if (!res.ok) throw new Error("Supabase-Fehler: " + res.status);
      const data = await res.json();
      return { key, value: data[0]?.value ?? value, shared: false };
    },
    delete: async (key) => {
      const cfg = getConfig();
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?key=eq.${encodeURIComponent(key)}`, {
        method: "DELETE",
        headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` },
      });
      return { key, deleted: res.ok, shared: false };
    },
    list: async (prefix) => {
      const cfg = getConfig();
      const q = prefix ? `&key=like.${encodeURIComponent(prefix)}*` : "";
      const res = await fetch(`${cfg.supabaseUrl}/rest/v1/lifetracker_kv_store?select=key${q}`, {
        headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}` },
      });
      const rows = res.ok ? await res.json() : [];
      return { keys: rows.map((r) => r.key), prefix, shared: false };
    },
  };
}
installStorageShim();

/* ============================================================
   SETUP-SCREEN: fragt Supabase- und Anthropic-Zugangsdaten ab,
   bevor die eigentliche App startet.
   ============================================================ */
function SetupGate({ children }) {
  const [cfg, setCfgState] = useState(() => getConfig());
  const [supabaseUrl, setSupabaseUrl] = useState(cfg?.supabaseUrl || "");
  const [supabaseKey, setSupabaseKey] = useState(cfg?.supabaseKey || "");
  const [anthropicKey, setAnthropicKey] = useState(cfg?.anthropicKey || "");
  const [testErr, setTestErr] = useState(null);
  const [testing, setTesting] = useState(false);

  if (cfg?.supabaseUrl && cfg?.supabaseKey) return children;

  const save = async () => {
    setTesting(true);
    setTestErr(null);
    try {
      const cleanUrl = normalizeSupabaseUrl(supabaseUrl);
      const res = await fetch(`${cleanUrl}/rest/v1/lifetracker_kv_store?select=key&limit=1`, {
        headers: { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}` },
      });
      if (!res.ok) throw new Error("Verbindung fehlgeschlagen (" + res.status + "). Prüfe URL/Key und ob die Tabelle lifetracker_kv_store existiert.");
      const next = { supabaseUrl: cleanUrl, supabaseKey, anthropicKey };
      setConfig(next);
      setCfgState(next);
    } catch (e) {
      setTestErr(e.message || "Verbindung fehlgeschlagen.");
    } finally {
      setTesting(false);
    }
  };

  return (
    <div style={{
      minHeight: "100vh", background: "#15161B", color: "#F1EFE9", display: "flex",
      alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "Inter, sans-serif",
    }}>
      <div style={{ maxWidth: 440, width: "100%", background: "#1E2027", border: "1px solid #31333D", borderRadius: 18, padding: 26 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600, marginBottom: 6 }}>Lifetracker einrichten</h1>
        <p style={{ fontSize: 13, color: "#93949F", lineHeight: 1.6, marginBottom: 20 }}>
          Einmalige Einrichtung auf diesem Gerät. Trage deine Supabase-Zugangsdaten ein (für die Cloud-Synchronisation über alle Geräte)
          und optional deinen Anthropic API-Key (für den KI-Coach).
        </p>

        <label style={{ fontSize: 11.5, fontWeight: 600, color: "#93949F", textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 6 }}>Supabase-Projekt-URL</label>
        <input value={supabaseUrl} onChange={(e) => setSupabaseUrl(e.target.value)} placeholder="https://xxxxx.supabase.co"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #31333D", background: "#15161B", color: "#F1EFE9", fontSize: 13.5, marginBottom: 6 }} />
        <div style={{ fontSize: 11, color: "#5B5D68", marginBottom: 14 }}>Nur die Basis-URL, ohne "/rest/v1" am Ende (wird automatisch ergänzt).</div>

        <label style={{ fontSize: 11.5, fontWeight: 600, color: "#93949F", textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 6 }}>Supabase anon Public Key</label>
        <input value={supabaseKey} onChange={(e) => setSupabaseKey(e.target.value)} placeholder="eyJhbGciOi..." type="password"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #31333D", background: "#15161B", color: "#F1EFE9", fontSize: 13.5, marginBottom: 14 }} />

        <label style={{ fontSize: 11.5, fontWeight: 600, color: "#93949F", textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 6 }}>Anthropic API-Key (optional, für den Coach)</label>
        <input value={anthropicKey} onChange={(e) => setAnthropicKey(e.target.value)} placeholder="sk-ant-..." type="password"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #31333D", background: "#15161B", color: "#F1EFE9", fontSize: 13.5, marginBottom: 18 }} />

        {testErr && <div style={{ color: "#FF6F91", fontSize: 12.5, marginBottom: 14 }}>{testErr}</div>}

        <button onClick={save} disabled={testing || !supabaseUrl || !supabaseKey} style={{
          width: "100%", padding: "11px 0", borderRadius: 9, border: "none", fontWeight: 700, fontSize: 14,
          background: "linear-gradient(135deg, #FF7A45, #FFC15E)", color: "#1A1305",
          cursor: testing ? "not-allowed" : "pointer", opacity: testing || !supabaseUrl || !supabaseKey ? 0.6 : 1,
        }}>
          {testing ? "Verbinde …" : "Verbindung testen & speichern"}
        </button>

        <p style={{ fontSize: 11.5, color: "#5B5D68", marginTop: 16, lineHeight: 1.6 }}>
          Anleitung: supabase.com → kostenloses Projekt anlegen → SQL-Editor → Tabelle "lifetracker_kv_store" mit Spalten
          key (text, primary key), value (text), updated_at (timestamptz) anlegen → Row Level Security für diese Tabelle
          deaktivieren (nur für den Eigengebrauch!) → URL und "anon public" Key aus Project Settings → API hier eintragen.
        </p>
      </div>
    </div>
  );
}

/* ============================================================
   DESIGN TOKENS
   Bg: warm charcoal (nicht reines Schwarz) · Ember-Akzent für Streaks
   Serif-Ziffern (Fraunces) für große Kennzahlen, Inter für UI,
   JetBrains Mono für Kalender/Statistik-Zahlen
   ============================================================ */
const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');`;

const COLORS = {
  bg: "#15161B",
  bgSoft: "#1A1C22",
  surface: "#1E2027",
  surfaceRaised: "#262933",
  border: "#31333D",
  borderSoft: "#2A2C34",
  text: "#F1EFE9",
  textMuted: "#93949F",
  textFaint: "#5B5D68",
  ember1: "#FF7A45",
  ember2: "#FFC15E",
  mint: "#4ADE9E",
  coral: "#FF6F91",
  violet: "#9B8CFF",
};

const HABIT_COLORS = ["#FF7A45", "#4ADE9E", "#9B8CFF", "#FF6F91", "#5EC8FF", "#FFD166", "#C77DFF", "#6EE7B7"];

const ICONS = [
  { key: "dumbbell", Icon: Dumbbell }, { key: "book", Icon: BookOpen },
  { key: "brain", Icon: Brain }, { key: "droplet", Icon: Droplet },
  { key: "moon", Icon: Moon }, { key: "sun", Icon: Sun },
  { key: "wine", Icon: Wine }, { key: "phone", Icon: Smartphone },
  { key: "candy", Icon: Candy }, { key: "food", Icon: Utensils },
  { key: "music", Icon: Music }, { key: "pen", Icon: Pen },
  { key: "code", Icon: Code }, { key: "heart", Icon: Heart },
];
const iconFor = (key) => (ICONS.find((i) => i.key === key) || ICONS[0]).Icon;

const UNCATEGORIZED = "Ohne Kategorie";
function categoryOf(habit) {
  return (habit.category || "").trim() || UNCATEGORIZED;
}
function categoryColor(category) {
  if (!category || category === UNCATEGORIZED) return COLORS.textFaint;
  let hash = 0;
  for (let i = 0; i < category.length; i++) hash = category.charCodeAt(i) + ((hash << 5) - hash);
  return HABIT_COLORS[Math.abs(hash) % HABIT_COLORS.length];
}
// Gruppiert Habits nach Kategorie; "Ohne Kategorie" steht immer zuletzt
function groupHabitsByCategory(habits) {
  const map = {};
  habits.forEach((h) => {
    const cat = categoryOf(h);
    if (!map[cat]) map[cat] = [];
    map[cat].push(h);
  });
  const keys = Object.keys(map).sort((a, b) => {
    if (a === UNCATEGORIZED) return 1;
    if (b === UNCATEGORIZED) return -1;
    return a.localeCompare(b, "de");
  });
  return keys.map((category) => ({ category, habits: map[category] }));
}

// Punkte aus erreichten Zielen (Goals) - zählen genauso zu den Gesamtpunkten
// wie Habit-Punkte, gutgeschrieben am Tag der Erreichung
function totalGoalPoints(goals) {
  return (goals || []).filter((g) => g.achieved).reduce((s, g) => s + g.points, 0);
}
function goalPointsOnDate(goals, dateKey) {
  return (goals || []).filter((g) => g.achieved && g.achievedAt === dateKey).reduce((s, g) => s + g.points, 0);
}
function goalPointsInRange(goals, dateKeys) {
  return (goals || []).filter((g) => g.achieved && dateKeys.includes(g.achievedAt)).reduce((s, g) => s + g.points, 0);
}

// Punkte aus erledigten Tasks - zählen genauso zu den Gesamtpunkten wie
// Habit- und Ziel-Punkte, gutgeschrieben am Tag der Erledigung
// Krönchen-Kennzeichnung für Aufgaben mit hoher Punktzahl
function crownCount(points) {
  if (points >= 20) return 3;
  if (points >= 10) return 2;
  if (points >= 5) return 1;
  return 0;
}
function CrownBadge({ points, size = 10 }) {
  const count = crownCount(points);
  if (count === 0) return null;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 1 }} title={`${points} Punkte`}>
      {Array.from({ length: count }).map((_, i) => (
        <Crown key={i} size={size} style={{ color: "#FFC15E", fill: "#FFC15E" }} />
      ))}
    </span>
  );
}

function totalTaskPoints(tasks) {
  return (tasks || []).filter((t) => t.completed).reduce((s, t) => s + t.points, 0);
}
function taskPointsOnDate(tasks, dateKey) {
  return (tasks || []).filter((t) => t.completed && t.completedAt === dateKey).reduce((s, t) => s + t.points, 0);
}
function taskPointsInRange(tasks, dateKeys) {
  return (tasks || []).filter((t) => t.completed && dateKeys.includes(t.completedAt)).reduce((s, t) => s + t.points, 0);
}

/* ============================================================
   DATE HELPERS
   ============================================================ */
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => toKey(new Date());
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const keyToDate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const dayLabel = (k) => keyToDate(k).toLocaleDateString("de-DE", { weekday: "short" });
const shortDate = (k) => keyToDate(k).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
const longDate = (k) => keyToDate(k).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const WEEKDAY_LABELS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day; // Woche beginnt Montag
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function isoWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
}

/* ============================================================
   POINTS / STREAK ENGINE
   ============================================================ */
const DIFFICULTY_BASE = { leicht: 2, mittel: 5, schwer: 10 };
const DIFFICULTY_LABELS = { leicht: "Leicht", mittel: "Mittel", schwer: "Schwer" };
const DIFFICULTY_COLORS = { leicht: COLORS.mint, mittel: COLORS.ember2, schwer: COLORS.coral };

function streakPoints(day, base = 10) {
  if (day <= 0) return 0;
  if (day === 1) return base;
  return Math.round(base * (1 + (Math.min(day * 2, 20) + Math.sqrt(Math.max(day - 10, 0)) * 5) / 10));
}

// Meilensteine: einmaliger Bonus pro Streak-Lauf, wenn die Streak diese
// Länge erreicht. Der Bonus wird mit der Schwierigkeit des Habits skaliert,
// damit "Schwer"-Habits die Streak-Konstanz stärker belohnen als "Leicht".
const STREAK_MILESTONES = [
  { days: 3, mult: 2 },
  { days: 7, mult: 5 },
  { days: 14, mult: 10 },
  { days: 30, mult: 20 },
  { days: 60, mult: 40 },
  { days: 100, mult: 75 },
  { days: 200, mult: 150 },
  { days: 365, mult: 300 },
];
function milestoneBonus(days, base) {
  const m = STREAK_MILESTONES.find((x) => x.days === days);
  return m ? Math.round(base * m.mult) : 0;
}
function nextMilestoneFor(currentStreak) {
  return STREAK_MILESTONES.find((m) => m.days > currentStreak) || null;
}

function isSuccess(habit, value) {
  if (value === undefined || value === null || value === false) return false;
  if (habit.trackingType === "boolean") return value === true;
  if (habit.trackingType === "count") return Number(value) >= Number(habit.target || 1);
  if (habit.trackingType === "time") return Number(value) >= Number(habit.target || 1);
  if (habit.trackingType === "value") return typeof value === "number" && !Number.isNaN(value);
  return false;
}

function dayStatus(habit, entries, dateKey) {
  const v = entries?.[dateKey]?.[habit.id];
  if (v === undefined || v === null) return "empty";
  return isSuccess(habit, v) ? "success" : "fail";
}

// Findet den frühesten Tag, an dem für diesen Habit rückwirkend ein Eintrag
// gemacht wurde (auch vor dem ursprünglichen Startdatum) - so zählen
// nachträglich abgehakte Tage korrekt in Streak & Punkte hinein.
function earliestTrackedDate(habit, entries) {
  let earliest = null;
  for (const dateKey in entries) {
    if (entries[dateKey] && entries[dateKey][habit.id] !== undefined) {
      if (!earliest || dateKey < earliest) earliest = dateKey;
    }
  }
  return earliest;
}

// Simuliert einen Habit chronologisch ab Erstellung (bzw. ab dem frühesten
// rückwirkenden Eintrag) und liefert tägliche Streak-/Punktewerte.
// Positive und negative Streaks wachsen symmetrisch: je länger am Stück
// erfüllt bzw. nicht erfüllt wurde, desto größer der Punktegewinn/-verlust.
function simulateHabit(habit, entries, untilKey) {
  const base = DIFFICULTY_BASE[habit.difficulty] || DIFFICULTY_BASE.mittel;
  const startKey = habit.startDate || habit.createdAt;
  const earliest = earliestTrackedDate(habit, entries);
  const effectiveStartKey = earliest && earliest < startKey ? earliest : startKey;
  const start = keyToDate(effectiveStartKey);
  const end = keyToDate(untilKey);
  let cursor = new Date(start);
  let streak = 0;
  let negStreak = 0;
  let longest = 0;
  let longestNeg = 0;
  let totalSuccess = 0;
  let totalFail = 0;
  let points = 0;
  let totalMilestoneBonus = 0;
  let totalNegativeMilestonePenalty = 0;
  const daily = [];

  while (cursor <= end) {
    const k = toKey(cursor);
    const status = dayStatus(habit, entries, k);
    let delta = 0;
    let milestoneHit = 0;
    let negMilestoneHit = 0;
    let dayPoints = 0;
    let bonusPoints = 0;
    let malusPoints = 0;
    if (status === "success") {
      streak += 1;
      negStreak = 0;
      dayPoints = streakPoints(streak, base);
      const bonus = milestoneBonus(streak, base);
      if (bonus > 0) { bonusPoints = bonus; totalMilestoneBonus += bonus; milestoneHit = streak; }
      delta = dayPoints + bonusPoints;
      points += delta;
      totalSuccess += 1;
      if (streak > longest) longest = streak;
    } else if (status === "fail") {
      negStreak += 1;
      streak = 0;
      dayPoints = -streakPoints(negStreak, base);
      const malus = milestoneBonus(negStreak, base);
      if (malus > 0) { malusPoints = -malus; totalNegativeMilestonePenalty += malus; negMilestoneHit = negStreak; }
      delta = dayPoints + malusPoints;
      points += delta;
      totalFail += 1;
      if (negStreak > longestNeg) longestNeg = negStreak;
    } else {
      // "empty": nur heute zählt als "noch offen" (bricht nichts).
      // Vergangene ungetrackte Tage sind neutral (0 Punkte), brechen aber
      // sowohl positive als auch negative Streaks.
      if (k !== todayKey()) {
        streak = 0;
        negStreak = 0;
      }
    }
    daily.push({ date: k, status, streak, negStreak, delta, points, milestoneHit, negMilestoneHit, dayPoints, bonusPoints, malusPoints });
    cursor = addDays(cursor, 1);
  }

  const trackedDays = totalSuccess + totalFail;
  const successRate = trackedDays > 0 ? Math.round((totalSuccess / trackedDays) * 100) : 0;
  const nextMilestone = nextMilestoneFor(streak);

  return {
    daily,
    currentStreak: streak,
    currentNegStreak: negStreak,
    longestStreak: longest,
    longestNegStreak: longestNeg,
    totalSuccess,
    totalFail,
    successRate,
    totalPoints: points,
    totalMilestoneBonus,
    totalNegativeMilestonePenalty,
    nextMilestone: nextMilestone ? { days: nextMilestone.days, daysLeft: nextMilestone.days - streak, bonus: milestoneBonus(nextMilestone.days, base) } : null,
  };
}

function windowSum(dailyTotals, size) {
  let best = -Infinity;
  for (let i = 0; i <= dailyTotals.length - size; i++) {
    let sum = 0;
    for (let j = i; j < i + size; j++) sum += dailyTotals[j].points;
    if (sum > best) best = sum;
  }
  return best === -Infinity ? 0 : best;
}
function lastWindowSum(dailyTotals, size) {
  const slice = dailyTotals.slice(-size);
  return slice.reduce((a, d) => a + d.points, 0);
}

/* ============================================================
   PERSISTENT STORAGE HOOK
   ============================================================ */
function useLifeOSData() {
  const [habits, setHabits] = useState([]);
  const [entries, setEntries] = useState({});
  const [achievements, setAchievements] = useState([]);
  const [coach, setCoach] = useState(null);
  const [journal, setJournal] = useState({});
  const [weeklyReports, setWeeklyReports] = useState({});
  const [goals, setGoals] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [error, setError] = useState(null);

  const loadAll = useCallback(async ({ silent } = {}) => {
    if (silent) setRefreshing(true);
    try {
      const [h, e, a, c, j, w, g, t, cat] = await Promise.allSettled([
        window.storage.get("los-habits"),
        window.storage.get("los-entries"),
        window.storage.get("los-achievements"),
        window.storage.get("los-coach"),
        window.storage.get("los-journal"),
        window.storage.get("los-weekly-reports"),
        window.storage.get("los-goals"),
        window.storage.get("los-tasks"),
        window.storage.get("los-categories"),
      ]);
      setHabits(h.status === "fulfilled" && h.value ? JSON.parse(h.value.value) : []);
      setEntries(e.status === "fulfilled" && e.value ? JSON.parse(e.value.value) : {});
      setAchievements(a.status === "fulfilled" && a.value ? JSON.parse(a.value.value) : []);
      setCoach(c.status === "fulfilled" && c.value ? JSON.parse(c.value.value) : null);
      setJournal(j.status === "fulfilled" && j.value ? JSON.parse(j.value.value) : {});
      setWeeklyReports(w.status === "fulfilled" && w.value ? JSON.parse(w.value.value) : {});
      setGoals(g.status === "fulfilled" && g.value ? JSON.parse(g.value.value) : []);
      setTasks(t.status === "fulfilled" && t.value ? JSON.parse(t.value.value) : []);
      setCategories(cat.status === "fulfilled" && cat.value ? JSON.parse(cat.value.value) : []);
      setError(null);
    } catch (err) {
      setError("Deine Daten konnten nicht geladen werden.");
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
  }, []);

  useEffect(() => {
    loadAll();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const refresh = useCallback(() => loadAll({ silent: true }), [loadAll]);

  const persistHabits = useCallback(async (next) => {
    setHabits(next);
    try { await window.storage.set("los-habits", JSON.stringify(next)); } catch {}
  }, []);
  const persistEntries = useCallback(async (next) => {
    setEntries(next);
    try { await window.storage.set("los-entries", JSON.stringify(next)); } catch {}
  }, []);
  const persistAchievements = useCallback(async (next) => {
    setAchievements(next);
    try { await window.storage.set("los-achievements", JSON.stringify(next)); } catch {}
  }, []);
  const persistCoach = useCallback(async (next) => {
    setCoach(next);
    try { await window.storage.set("los-coach", JSON.stringify(next)); } catch {}
  }, []);
  const persistJournal = useCallback(async (next) => {
    setJournal(next);
    try { await window.storage.set("los-journal", JSON.stringify(next)); } catch {}
  }, []);
  const persistWeeklyReports = useCallback(async (next) => {
    setWeeklyReports(next);
    try { await window.storage.set("los-weekly-reports", JSON.stringify(next)); } catch {}
  }, []);
  const persistGoals = useCallback(async (next) => {
    setGoals(next);
    try { await window.storage.set("los-goals", JSON.stringify(next)); } catch {}
  }, []);
  const persistTasks = useCallback(async (next) => {
    setTasks(next);
    try { await window.storage.set("los-tasks", JSON.stringify(next)); } catch {}
  }, []);
  const persistCategories = useCallback(async (next) => {
    setCategories(next);
    try { await window.storage.set("los-categories", JSON.stringify(next)); } catch {}
  }, []);

  return {
    habits, entries, achievements, coach, journal, weeklyReports, goals, tasks, categories, loading, refreshing, error,
    persistHabits, persistEntries, persistAchievements, persistCoach, persistJournal, persistWeeklyReports, persistGoals, persistTasks, persistCategories,
    refresh,
  };
}

function EmberDot({ level, size = 9, negative = false }) {
  // level 0..1 -> Glut-Intensität (positiv) bzw. Intensität von "nicht erfüllt" (negativ)
  const glow = 4 + level * 14;
  let bg = COLORS.borderSoft;
  if (level > 0) bg = negative ? COLORS.coral : `linear-gradient(135deg, ${COLORS.ember1}, ${COLORS.ember2})`;
  return (
    <div style={{
      width: size, height: size, borderRadius: 3, background: bg,
      boxShadow: level > 0 && !negative ? `0 0 ${glow}px rgba(255,122,69,${0.25 + level * 0.35})` : "none",
      opacity: level <= 0 ? 0.5 : negative ? 0.85 : 1,
    }} />
  );
}

   ============================================================ */
function Confetti({ trigger }) {
  const pieces = useMemo(() => Array.from({ length: 26 }, (_, i) => ({
    id: i,
    left: 45 + Math.random() * 10,
    delay: Math.random() * 0.15,
    dur: 0.9 + Math.random() * 0.6,
    dx: (Math.random() - 0.5) * 220,
    rot: Math.random() * 360,
    color: [COLORS.ember1, COLORS.ember2, COLORS.mint, COLORS.violet, COLORS.coral][i % 5],
  })), [trigger]);

  if (!trigger) return null;
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 200, overflow: "hidden" }}>
      {pieces.map((p) => (
        <span key={p.id + "-" + trigger} style={{
          position: "absolute", top: "40%", left: `${p.left}%`, width: 7, height: 10,
          background: p.color, borderRadius: 2,
          animation: `los-confetti ${p.dur}s ease-out ${p.delay}s forwards`,
          "--dx": `${p.dx}px`, "--rot": `${p.rot}deg`,
        }} />
      ))}
    </div>
  );
}

function CategoryPicker({ value, categories, onChange, onAddCategory }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");

  const confirmAdd = () => {
    const trimmed = newName.trim();
    setAdding(false);
    setNewName("");
    if (!trimmed) return;
    if (!categories.includes(trimmed)) onAddCategory(trimmed);
    onChange(trimmed);
  };

  if (adding) {
    return (
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <input
          autoFocus style={{ ...inputStyle, marginBottom: 0, flex: 1 }}
          value={newName} onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") confirmAdd(); if (e.key === "Escape") { setAdding(false); setNewName(""); } }}

        <button type="button" onClick={confirmAdd} style={primaryBtn}>OK</button>
        <button type="button" onClick={() => { setAdding(false); setNewName(""); }} style={ghostBtn}>Abbrechen</button>
      </div>
    );
  }

  return (
    <select
      value={value || ""}
      onChange={(e) => (e.target.value === "__new__" ? setAdding(true) : onChange(e.target.value))}
      style={{ ...inputStyle, cursor: "pointer" }}

      {categories.map((c) => <option key={c} value={c}>{c}</option>)}

    </select>
  );
}

/* ============================================================
   DATE PICKER (Monats-Kalender als Popover)
   ============================================================ */
function DatePicker({ value, onChange, placeholder = "Datum wählen" }) {
  const [open, setOpen] = useState(false);
  const [viewMonth, setViewMonth] = useState(() => startOfMonth(value ? keyToDate(value) : new Date()));
  const [coords, setCoords] = useState(null);
  const wrapRef = useRef(null);
  const btnRef = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  useEffect(() => {
    if (!open) return;
    const close = () => setOpen(false);
    window.addEventListener("scroll", close, true);
    window.addEventListener("resize", close);
    return () => { window.removeEventListener("scroll", close, true); window.removeEventListener("resize", close); };
  }, [open]);

  const openPicker = () => {
    setViewMonth(startOfMonth(value ? keyToDate(value) : new Date()));
    if (btnRef.current) {
      const rect = btnRef.current.getBoundingClientRect();
      const width = 260;
      const popoverHeight = 340;
      const spaceBelow = window.innerHeight - rect.bottom;
      const openUpward = spaceBelow < popoverHeight && rect.top > popoverHeight;
      setCoords({
        top: openUpward ? Math.max(12, rect.top - popoverHeight - 6) : rect.bottom + 6,
        left: Math.max(12, Math.min(rect.left, window.innerWidth - width - 12)),
        width: rect.width,
      });
    }
    setOpen((o) => !o);
  };

  const monthLabel = viewMonth.toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  const firstWeekday = (viewMonth.getDay() + 6) % 7; // Montag = 0
  const totalDays = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d));

  return (
    <div ref={wrapRef} style={{ marginBottom: 14 }}>
      <button
        ref={btnRef}
        type="button"
        onClick={openPicker}
        style={{
          ...inputStyle, marginBottom: 0, textAlign: "left", cursor: "pointer", width: "100%",
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}
      >
        <span style={{ color: value ? COLORS.text : COLORS.textFaint }}>{value ? longDate(value) : placeholder}</span>
        <CalendarDays size={15} style={{ color: COLORS.textFaint, flexShrink: 0 }} />
      </button>

      {open && coords && (
        <div style={{
          position: "fixed", top: coords.top, left: coords.left, zIndex: 500, width: 260,
          background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 12,
          padding: 12, boxShadow: "0 20px 40px rgba(0,0,0,0.45)",
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <IconButton onClick={() => setViewMonth((m) => new Date(m.getFullYear(), m.getMonth() - 1, 1))} title="Vorheriger Monat"><ChevronLeft size={14} /></IconButton>
            <span style={{ fontSize: 12.5, fontWeight: 600, textTransform: "capitalize" }}>{monthLabel}</span>
            <IconButton onClick={() => setViewMonth((m) => new Date(m.getFullYear(), m.getMonth() + 1, 1))} title="Nächster Monat"><ChevronRight size={14} /></IconButton>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 4 }}>
            {WEEKDAY_LABELS.map((l) => (
              <div key={l} style={{ fontSize: 9.5, fontWeight: 700, textAlign: "center", color: COLORS.textFaint }}>{l}</div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: value ? 10 : 0 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const k = toKey(d);
              const isSelected = k === value;
              const isToday = k === todayKey();
              return (
                <button
                  key={i} type="button"
                  onClick={() => { onChange(k); setOpen(false); }}
                  style={{
                    aspectRatio: "1", borderRadius: 7, fontSize: 12, cursor: "pointer",
                    fontFamily: "JetBrains Mono, monospace",
                    border: isSelected ? `1.5px solid ${COLORS.violet}` : isToday ? `1px solid ${COLORS.textMuted}` : "1px solid transparent",
                    background: isSelected ? COLORS.violet + "26" : "transparent",
                    color: isSelected ? COLORS.text : COLORS.textMuted,
                  }}
                >
                  {d.getDate()}
                </button>
              );
            })}
          </div>

          {value && (
            <button type="button" onClick={() => { onChange(""); setOpen(false); }} style={{ ...ghostBtn, width: "100%", padding: "6px 0", fontSize: 12 }}>
              Datum entfernen
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   HABIT ROW (Dashboard / Habits list)
   ============================================================ */
function HabitRow({ habit, entries, onToggle, onOpenDetail, onEdit, celebrateId }) {
  const isMobile = useIsMobile();
  const stats = useMemo(() => simulateHabit(habit, entries, todayKey()), [habit, entries]);
  const Icon = iconFor(habit.icon);
  const status = dayStatus(habit, entries, todayKey());
  const isDone = status === "success";
  const isFailed = status === "fail";
  const dotCount = isMobile ? 7 : 14;
  const last14 = useMemo(() => {
    const days = [];
    for (let i = dotCount - 1; i >= 0; i--) days.push(toKey(addDays(new Date(), -i)));
    return days;
  }, [dotCount]);

  const handleClick = () => {
    if (habit.trackingType === "boolean") {
      onToggle(habit.id, todayKey(), isDone ? undefined : true);
    } else {
      onOpenDetail(habit);
    }
  };
  const handleFail = () => {
    onToggle(habit.id, todayKey(), isFailed ? undefined : false);
  };

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: isMobile ? 8 : 14, padding: isMobile ? "12px 10px" : "14px 16px",
      background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14,
      position: "relative", overflow: "hidden",
    }}>
      {celebrateId === habit.id && <Confetti trigger={celebrateId + "_" + Date.now()} />}
      <div onClick={() => onOpenDetail(habit)} style={{
        width: 40, height: 40, borderRadius: 11, display: "flex", alignItems: "center", justifyContent: "center",
        background: habit.color + "22", color: habit.color, flexShrink: 0, cursor: "pointer",
      }}>
        <Icon size={19} />
      </div>

      <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => onOpenDetail(habit)}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontWeight: 600, fontSize: 14.5 }}>{habit.name}</span>
          {habit.difficulty && (
            <span style={{
              fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 6,
              color: DIFFICULTY_COLORS[habit.difficulty], background: DIFFICULTY_COLORS[habit.difficulty] + "1f",
              textTransform: "uppercase", letterSpacing: "0.03em",
            }}>{DIFFICULTY_LABELS[habit.difficulty]}</span>
          )}
          {stats.currentStreak > 0 && (
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, fontWeight: 600,
              color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace",
            }}>
              <Flame size={11} style={{ color: COLORS.ember1 }} /> {stats.currentStreak}
            </span>
          )}
          {stats.currentNegStreak > 0 && (
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, fontWeight: 600,
              color: COLORS.coral, fontFamily: "JetBrains Mono, monospace",
            }}>
              <TrendingDown size={11} style={{ color: COLORS.coral }} /> {stats.currentNegStreak}
            </span>
          )}
        </div>
        <div style={{ display: "flex", gap: 3, marginTop: 7 }}>
          {last14.map((k) => {
            const st = dayStatus(habit, entries, k);
            const posLevel = Math.min(1, stats.currentStreak / 20) + 0.3;
            const negLevel = Math.min(1, stats.currentNegStreak / 20) + 0.3;
            const size = isMobile ? 7 : 9;
            if (st === "success") return <EmberDot key={k} level={Math.max(posLevel, 0.35)} size={size} />;
            if (st === "fail") return <EmberDot key={k} level={Math.max(negLevel, 0.35)} negative size={size} />;
            return <EmberDot key={k} level={0} size={size} />;
          })}
        </div>
      </div>

      {!isMobile && (
        <div style={{ textAlign: "right", flexShrink: 0, fontFamily: "JetBrains Mono, monospace" }}>
          <div style={{ fontSize: 11, color: COLORS.textFaint }}>Erfolgsquote</div>
          <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.textMuted }}>{stats.successRate}%</div>
        </div>
      )}

      {habit.trackingType === "boolean" && (
        <button onClick={handleFail} style={{
          width: 38, height: 38, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
          border: isFailed ? "none" : `1.5px solid ${COLORS.border}`,
          background: isFailed ? `linear-gradient(135deg, ${COLORS.coral}, #E14D72)` : "transparent",
          color: isFailed ? "#2B0810" : COLORS.textMuted,
          display: "flex", alignItems: "center", justifyContent: "center", transition: "all .15s",
        }}>
          <X size={18} strokeWidth={2.8} />
        </button>
      )}

      <button onClick={handleClick} style={{
        width: 38, height: 38, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
        border: isDone ? "none" : `1.5px solid ${COLORS.border}`,
        background: isDone ? `linear-gradient(135deg, ${COLORS.mint}, #2DBE83)` : "transparent",
        color: isDone ? "#0A1F14" : COLORS.textMuted,
        display: "flex", alignItems: "center", justifyContent: "center", transition: "all .15s",
      }}>
        <Check size={18} strokeWidth={2.8} />
      </button>

      <IconButton onClick={() => onEdit(habit)} title="Bearbeiten"><Pencil size={14} /></IconButton>
    </div>
  );
}

/* ============================================================
   HABIT DETAIL (Kalender + Historie)
   ============================================================ */
function HabitDetail({ habit, entries, onClose, onToggle }) {
  const isMobile = useIsMobile();
  const stats = useMemo(() => simulateHabit(habit, entries, todayKey()), [habit, entries]);
  const dailyMap = useMemo(() => Object.fromEntries(stats.daily.map((d) => [d.date, d])), [stats]);
  const Icon = iconFor(habit.icon);

  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [selectedDay, setSelectedDay] = useState(todayKey());

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const weekRangeLabel = `${shortDate(weekDays[0])} – ${shortDate(weekDays[6])} ${keyToDate(weekDays[6]).getFullYear()}`;
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);

  const selectedVal = entries?.[selectedDay]?.[habit.id];
  const [dayInput, setDayInput] = useState(selectedVal === undefined ? "" : String(selectedVal));
  useEffect(() => {
    setDayInput(selectedVal === undefined ? "" : String(selectedVal));
  }, [habit.id, selectedDay, selectedVal]);

  const confirmValue = () => {
    if (dayInput === "") return;
    onToggle(habit.id, selectedDay, Number(dayInput));
  };

  // Werteverlauf: alle numerischen Einträge dieses Habits chronologisch,
  // für die Auswertung "wie entwickeln sich die Zahlen" (z. B. Gewicht)
  const valueSeries = useMemo(() => {
    if (habit.trackingType === "boolean") return [];
    return Object.keys(entries)
      .filter((dateKey) => typeof entries[dateKey]?.[habit.id] === "number")
      .sort()
      .map((dateKey) => ({ date: dateKey, label: shortDate(dateKey), value: entries[dateKey][habit.id] }));
  }, [habit.id, habit.trackingType, entries]);

  const valueStats = useMemo(() => {
    if (valueSeries.length === 0) return null;
    const values = valueSeries.map((v) => v.value);
    const first = values[0];
    const last = values[values.length - 1];
    const min = Math.min(...values);
    const max = Math.max(...values);
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    return { first, last, min, max, avg, change: last - first };
  }, [valueSeries]);

  const statusColor = { success: habit.color, fail: COLORS.coral, empty: COLORS.borderSoft };
  const isFuture = (k) => k > todayKey();

  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={{ ...modalStyle, maxWidth: 620 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
            <div style={{ width: 42, height: 42, borderRadius: 12, background: habit.color + "22", color: habit.color, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon size={20} />
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>{habit.name}</h2>
                {habit.difficulty && (
                  <span style={{
                    fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 6,
                    color: DIFFICULTY_COLORS[habit.difficulty], background: DIFFICULTY_COLORS[habit.difficulty] + "1f",
                    textTransform: "uppercase", letterSpacing: "0.03em",
                  }}>{DIFFICULTY_LABELS[habit.difficulty]}</span>
                )}
              </div>
              {habit.description && <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 2 }}>{habit.description}</div>}
            </div>
          </div>
          <IconButton onClick={onClose}><X size={16} /></IconButton>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(2, 1fr)" : "repeat(4, 1fr)", gap: 10, marginBottom: 10 }}>
          <StatCard
            label="Aktuelle Streak"
            value={stats.currentStreak > 0 ? stats.currentStreak : (stats.currentNegStreak > 0 ? -stats.currentNegStreak : 0)}
            suffix="Tage"
            accent={stats.currentStreak > 0 ? COLORS.ember1 : stats.currentNegStreak > 0 ? COLORS.coral : COLORS.textFaint}
          />
          <StatCard label="Längste Streak" value={stats.longestStreak} suffix="Tage" accent={COLORS.ember2} />
          <StatCard label="Erfolgsquote" value={stats.successRate} suffix="%" accent={COLORS.mint} />
          <StatCard label="Punkte" value={stats.totalPoints} suffix="" accent={stats.totalPoints < 0 ? COLORS.coral : COLORS.violet} />
        </div>

        <div style={{
          background: `linear-gradient(135deg, ${COLORS.ember1}14, ${COLORS.ember2}0a)`,
          border: `1px solid ${COLORS.ember1}33`, borderRadius: 12, padding: "12px 14px", marginBottom: 20,
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: (stats.nextMilestone || stats.totalNegativeMilestonePenalty > 0) ? 8 : 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <Award size={15} style={{ color: COLORS.ember2 }} />
              <span style={{ fontSize: 12.5, fontWeight: 600 }}>Streak-Bonus verdient</span>
            </div>
            <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 14, fontWeight: 700, color: COLORS.ember2 }}>
              +{stats.totalMilestoneBonus}
            </span>
          </div>
          {stats.totalNegativeMilestonePenalty > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: stats.nextMilestone ? 8 : 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <TrendingDown size={15} style={{ color: COLORS.coral }} />
                <span style={{ fontSize: 12.5, fontWeight: 600 }}>Streak-Strafe kassiert</span>
              </div>
              <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 14, fontWeight: 700, color: COLORS.coral }}>
                -{stats.totalNegativeMilestonePenalty}
              </span>
            </div>
          )}
          {stats.nextMilestone && (
            <>
              <div style={{ height: 6, borderRadius: 4, background: COLORS.bgSoft, overflow: "hidden", marginBottom: 6 }}>
                <div style={{
                  height: "100%", borderRadius: 4,
                  width: `${Math.min(100, Math.round((stats.currentStreak / stats.nextMilestone.days) * 100))}%`,
                  background: `linear-gradient(90deg, ${COLORS.ember1}, ${COLORS.ember2})`,
                }} />
              </div>
              <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>
                Noch <strong style={{ color: COLORS.text }}>{stats.nextMilestone.daysLeft}</strong> {stats.nextMilestone.daysLeft === 1 ? "Tag" : "Tage"} bis {stats.nextMilestone.days}-Tage-Streak · Bonus <strong style={{ color: COLORS.ember2 }}>+{stats.nextMilestone.bonus}</strong> Punkte
              </div>
            </>
          )}
        </div>

        {/* Kalender: Kalenderwoche zum Durchklicken */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>Kalender</span>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <IconButton onClick={() => setWeekStart(addDays(weekStart, -7))} title="Vorherige Woche"><ChevronLeft size={14} /></IconButton>
            <span style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, minWidth: 128, textAlign: "center", fontFamily: "JetBrains Mono, monospace" }}>
              KW {isoWeekNumber(keyToDate(weekDays[0]))} · {weekRangeLabel}
            </span>
            <IconButton onClick={() => setWeekStart(addDays(weekStart, 7))} title="Nächste Woche"><ChevronRight size={14} /></IconButton>
            {!isCurrentWeek && (
              <button onClick={() => { setWeekStart(startOfWeek(new Date())); setSelectedDay(todayKey()); }} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Heute</button>
            )}
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: isMobile ? 4 : 6, marginBottom: 12 }}>
          {weekDays.map((k, i) => {
            const st = dayStatus(habit, entries, k);
            const isToday = k === todayKey();
            const isSelected = k === selectedDay;
            const weekend = i >= 5;
            const future = isFuture(k);
            const d = keyToDate(k);
            const dayData = dailyMap[k];
            const showPoints = dayData && (st === "success" || st === "fail");
            return (
              <div key={k}>
                <div style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: weekend ? COLORS.ember2 : COLORS.textFaint, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>
                  {WEEKDAY_LABELS[i]}
                </div>
                <button
                  onClick={() => !future && setSelectedDay(k)}
                  disabled={future}
                  title={`${shortDate(k)} · ${st}${dayData ? ` · ${dayData.dayPoints >= 0 ? "+" : ""}${dayData.dayPoints}${dayData.bonusPoints > 0 ? ` + ${dayData.bonusPoints} Bonus` : ""}${dayData.malusPoints < 0 ? ` ${dayData.malusPoints} Strafe` : ""} Punkte` : ""}`}
                  style={{
                    width: "100%", aspectRatio: "1", borderRadius: 11, cursor: future ? "default" : "pointer",
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", gap: 1,
                    background: st === "success" ? habit.color + "2e" : st === "fail" ? statusColor.fail + "26" : weekend ? COLORS.bgSoft : COLORS.surfaceRaised,
                    border: isSelected ? `2px solid ${habit.color}` : isToday ? `1.5px solid ${COLORS.textMuted}` : `1px solid ${COLORS.borderSoft}`,
                    opacity: future ? 0.35 : 1,
                    transition: "all .15s",
                  }}>
                  <span style={{
                    fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, lineHeight: 1,
                    color: st === "success" ? habit.color : st === "fail" ? statusColor.fail : COLORS.text,
                  }}>
                    {d.getDate()}
                  </span>
                  {showPoints && (
                    <span style={{
                      fontFamily: "JetBrains Mono, monospace", fontSize: 9.5, fontWeight: 600, lineHeight: 1,
                      color: dayData.dayPoints > 0 ? habit.color : dayData.dayPoints < 0 ? statusColor.fail : COLORS.textFaint,
                    }}>
                      {dayData.dayPoints >= 0 ? "+" : ""}{dayData.dayPoints}
                    </span>
                  )}
                  {dayData && dayData.bonusPoints > 0 && (
                    <span style={{
                      fontFamily: "JetBrains Mono, monospace", fontSize: 8.5, fontWeight: 700, lineHeight: 1,
                      color: COLORS.ember2,
                    }}>
                      +{dayData.bonusPoints} 🎁
                    </span>
                  )}
                  {dayData && dayData.malusPoints < 0 && (
                    <span style={{
                      fontFamily: "JetBrains Mono, monospace", fontSize: 8.5, fontWeight: 700, lineHeight: 1,
                      color: statusColor.fail,
                    }}>
                      {dayData.malusPoints} ⚠️
                    </span>
                  )}
                  {st === "success" && <Flame size={10} style={{ position: "absolute", top: 4, right: 4, color: habit.color }} />}
                  {st === "fail" && <TrendingDown size={10} style={{ position: "absolute", top: 4, right: 4, color: statusColor.fail }} />}
                </button>
              </div>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 14, marginBottom: 18, fontSize: 11, color: COLORS.textFaint, flexWrap: "wrap" }}>
          <LegendDot color={habit.color} label="Erfüllt" />
          <LegendDot color={statusColor.fail} label="Nicht erfüllt" />
          <LegendDot color={COLORS.ember2} label="Wochenende" />
        </div>

        {/* Editor für den ausgewählten Tag */}
        <div style={{ background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: 14 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>
            {selectedDay === todayKey() ? "Heute" : longDate(selectedDay)}
          </div>

          {habit.trackingType === "boolean" ? (
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => onToggle(habit.id, selectedDay, true)} style={{
                ...ghostBtn, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                border: `1px solid ${selectedVal === true ? habit.color : COLORS.border}`,
                background: selectedVal === true ? habit.color + "1f" : "transparent",
                color: selectedVal === true ? habit.color : COLORS.textMuted,
              }}><Check size={14} /> Erfüllt</button>
              <button onClick={() => onToggle(habit.id, selectedDay, false)} style={{
                ...ghostBtn, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                border: `1px solid ${selectedVal === false ? COLORS.coral : COLORS.border}`,
                background: selectedVal === false ? COLORS.coral + "1f" : "transparent",
                color: selectedVal === false ? COLORS.coral : COLORS.textMuted,
              }}><TrendingDown size={14} /> Nicht erfüllt</button>
              <button onClick={() => onToggle(habit.id, selectedDay, undefined)} style={{ ...ghostBtn, flex: 1 }}>Zurücksetzen</button>
            </div>
          ) : (
            <>
              <div style={{ fontSize: 11, color: COLORS.textFaint, marginBottom: 8 }}>
                {habit.trackingType === "value"
                  ? `Messwert${habit.unit ? ` in ${habit.unit}` : ""} – jede Zahl zählt als erfüllt`
                  : `${habit.unit || (habit.trackingType === "time" ? "Minuten" : "Einheiten")} · Ziel ${habit.target}`}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input type="number" step="any" style={{ ...inputStyle, marginBottom: 0 }}
                  value={dayInput}
                  onChange={(e) => setDayInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") confirmValue(); }}
                  placeholder={habit.trackingType === "value" ? (habit.unit || "0") : "0"} />
                <button onClick={confirmValue} disabled={dayInput === ""} style={{ ...primaryBtn, opacity: dayInput === "" ? 0.5 : 1, cursor: dayInput === "" ? "not-allowed" : "pointer" }}>
                  Übernehmen
                </button>
                <button onClick={() => { onToggle(habit.id, selectedDay, false); setDayInput(""); }} style={{
                  ...ghostBtn, display: "flex", alignItems: "center", gap: 6,
                  color: selectedVal === false ? COLORS.coral : COLORS.textMuted,
                  border: `1px solid ${selectedVal === false ? COLORS.coral : COLORS.border}`,
                }}><TrendingDown size={14} /> Nicht erfüllt</button>
              </div>
              {selectedVal !== undefined && selectedVal !== false && (
                <div style={{ fontSize: 11.5, color: COLORS.textFaint, marginTop: 8 }}>
                  Eingetragen: {selectedVal} {habit.unit || (habit.trackingType === "time" ? "Minuten" : "")}
                </div>
              )}
            </>
          )}
        </div>

        {habit.trackingType !== "boolean" && (
          <div style={{ marginTop: 20 }}>
            <SectionLabel>Verlauf</SectionLabel>
            {!valueStats ? (
              <div style={{ color: COLORS.textFaint, fontSize: 12.5, background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: 14 }}>
                Trage mindestens zwei Werte ein, um zu sehen, wie sich die Zahlen entwickeln.
              </div>
            ) : (
              <div style={{ background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: 14 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 14 }}>
                  <MiniStat label="Aktuell" value={valueStats.last} unit={habit.unit} />
                  <MiniStat label="Ø Schnitt" value={Math.round(valueStats.avg * 10) / 10} unit={habit.unit} />
                  <MiniStat label="Min" value={valueStats.min} unit={habit.unit} />
                  <MiniStat label="Max" value={valueStats.max} unit={habit.unit} />
                </div>
                <div style={{ fontSize: 11.5, color: COLORS.textMuted, marginBottom: 10 }}>
                  {valueStats.change === 0 ? "Unverändert" : valueStats.change > 0 ? "Anstieg" : "Rückgang"} seit dem ersten Eintrag:{" "}
                  <strong style={{ color: valueStats.change === 0 ? COLORS.text : valueStats.change > 0 ? COLORS.ember2 : COLORS.mint }}>
                    {valueStats.change > 0 ? "+" : ""}{Math.round(valueStats.change * 10) / 10} {habit.unit}
                  </strong>
                </div>
                <ResponsiveContainer width="100%" height={160}>
                  <LineChart data={valueSeries}>
                    <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
                    <XAxis dataKey="label" tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={{ stroke: COLORS.border }} tickLine={false} minTickGap={24} />
                    <YAxis domain={["auto", "auto"]} tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} width={36} />
                    <Tooltip contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} labelStyle={{ color: COLORS.text }} formatter={(v) => [`${v} ${habit.unit || ""}`, "Wert"]} />
                    <Line type="monotone" dataKey="value" stroke={habit.color} strokeWidth={2.5} dot={{ r: 2.5, fill: habit.color }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function LegendDot({ color, label }) {
  return <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: color, display: "inline-block" }} />{label}</span>;
}

function StatCard({ label, value, suffix, accent }) {
  return (
    <div style={{ background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
      <div style={{ fontSize: 10.5, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>{label}</div>
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600, color: accent }}>
        {value}<span style={{ fontSize: 12, color: COLORS.textFaint, marginLeft: 3, fontFamily: "Inter, sans-serif" }}>{suffix}</span>
      </div>
    </div>
  );
}

function MiniStat({ label, value, unit }) {
  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 9, padding: "8px 9px", textAlign: "center" }}>
      <div style={{ fontSize: 9.5, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 2 }}>{label}</div>
      <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13.5, fontWeight: 600, color: COLORS.text }}>
        {value}<span style={{ fontSize: 10, color: COLORS.textFaint, marginLeft: 2 }}>{unit}</span>
      </div>
    </div>
  );
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function motivationLine(active, entries, allStats) {
  const done = active.filter((h) => dayStatus(h, entries, todayKey()) === "success").length;
  const remaining = active.length - done;
  if (active.length === 0) return "Leg los und erstelle deinen ersten Habit.";
  if (remaining === 0) return "Perfekter Tag – alle Habits erfüllt. 🔥";
  const bestStreak = Math.max(0, ...allStats.map((s) => s.currentStreak));
  if (remaining === 1) return "Nur noch ein Habit bis zu deinem perfekten Tag.";
  if (bestStreak >= 7) return `Deine ${bestStreak}-Tage-Streak läuft noch. Nicht abbrechen!`;
  return `Noch ${remaining} Habits offen – du schaffst das.`;
}

function Dashboard({
  habits, entries, onToggle, onOpenDetail, onEdit, onCreate, celebrateId, coach, onOpenCoach, hasCoach,
  goals, tasks, persistGoals, persistTasks, onOpenTasks, onOpenGoals, onCreateTask, onCreateGoal,
}) {
  const active = habits;
  const allStats = useMemo(() => active.map((h) => simulateHabit(h, entries, todayKey())), [active, entries]);
  const totalToday = useMemo(() => {
    const k = todayKey();
    const habitPart = allStats.reduce((sum, s) => sum + (s.daily.find((d) => d.date === k)?.delta || 0), 0);
    return habitPart + goalPointsOnDate(goals, k) + taskPointsOnDate(tasks, k);
  }, [allStats, goals, tasks]);
  const totalAll = useMemo(() => allStats.reduce((s, st) => s + st.totalPoints, 0) + totalGoalPoints(goals) + totalTaskPoints(tasks), [allStats, goals, tasks]);
  const totalWeek = useMemo(() => {
    const keys = Array.from({ length: 7 }, (_, i) => toKey(addDays(new Date(), -i)));
    const habitPart = allStats.reduce((s, st) => s + st.daily.filter((d) => keys.includes(d.date)).reduce((a, d) => a + d.delta, 0), 0);
    return habitPart + goalPointsInRange(goals, keys) + taskPointsInRange(tasks, keys);
  }, [allStats, goals, tasks]);
  const topStreaks = [...active].map((h, i) => ({ h, s: allStats[i] })).filter((x) => x.s.currentStreak > 0).sort((a, b) => b.s.currentStreak - a.s.currentStreak).slice(0, 5);

  const weekKeys = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(startOfWeek(new Date()), i))), []);
  const todayTasks = useMemo(() => (tasks || []).filter((t) => !t.completed && t.dueDate === todayKey()), [tasks]);
  const weekTasks = useMemo(() => (tasks || [])
    .filter((t) => !t.completed && t.dueDate && t.dueDate !== todayKey() && weekKeys.includes(t.dueDate))
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate)), [tasks, weekKeys]);
  const openGoals = (goals || []).filter((g) => !g.achieved);

  const completeTask = (task) => {
    persistTasks((tasks || []).map((t) => t.id === task.id ? { ...t, completed: true, completedAt: todayKey() } : t));
  };
  const achieveGoal = (goal) => {
    persistGoals((goals || []).map((g) => g.id === goal.id ? { ...g, achieved: true, achievedAt: todayKey() } : g));
  };

  return (
    <div>
      <div style={{ marginBottom: 26 }}>
        <div style={{ fontSize: 13, color: COLORS.textFaint, marginBottom: 4 }}>{new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 30, fontWeight: 600, margin: 0 }}>
          Guten Tag. <span style={{ color: COLORS.ember2 }}>{totalToday > 0 ? `+${totalToday}` : totalToday} Punkte heute</span>
        </h1>
        <p style={{ color: COLORS.textMuted, fontSize: 14.5, marginTop: 6 }}>{motivationLine(active, entries, allStats)}</p>
      </div>

      {hasCoach && coach?.quote && (
        <button onClick={onOpenCoach} style={{
          display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", cursor: "pointer",
          background: `linear-gradient(135deg, ${COLORS.violet}14, ${COLORS.ember1}0a)`,
          border: `1px solid ${COLORS.violet}33`, borderRadius: 14, padding: "12px 14px", marginBottom: 24,
        }}>
          <div style={{
            width: 26, height: 26, borderRadius: 8, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
            background: `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.ember1})`,
          }}>
            <Brain size={13} style={{ color: "#fff" }} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.violet, marginBottom: 2, letterSpacing: "0.03em" }}>DEIN COACH</div>
            <div style={{
              fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: 14.5, color: COLORS.text,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>
              „{coach.quote}"
            </div>
          </div>
        </button>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 26 }}>
        <StatCard label="Punkte heute" value={totalToday} suffix="" accent={COLORS.ember2} />
        <StatCard label="Punkte diese Woche" value={totalWeek} suffix="" accent={COLORS.violet} />
        <StatCard label="Gesamtpunkte" value={totalAll} suffix="" accent={COLORS.mint} />
      </div>

      {/* AUFGABEN: heute fällig + diese Woche fällig */}
      <div style={{ marginBottom: 26 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <SectionLabel>Aufgaben</SectionLabel>
          <button onClick={onOpenTasks} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Alle Aufgaben</button>
        </div>
        {todayTasks.length === 0 && weekTasks.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint, background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
            Keine Aufgaben mit Termin diese Woche.
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {todayTasks.length > 0 && (
              <div>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.ember2, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 6 }}>Heute fällig</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {todayTasks.map((t) => <DashTaskRow key={t.id} task={t} onComplete={() => completeTask(t)} highlight />)}
                </div>
              </div>
            )}
            {weekTasks.length > 0 && (
              <div style={{ marginTop: todayTasks.length > 0 ? 10 : 0 }}>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 6 }}>Diese Woche fällig</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {weekTasks.map((t) => <DashTaskRow key={t.id} task={t} onComplete={() => completeTask(t)} />)}
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {topStreaks.length > 0 && (
        <div style={{ marginBottom: 26 }}>
          <SectionLabel>Beste Streaks</SectionLabel>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {topStreaks.map(({ h, s }) => {
              const Icon = iconFor(h.icon);
              return (
                <div key={h.id} style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderRadius: 10,
                  background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`,
                }}>
                  <Icon size={14} style={{ color: h.color }} />
                  <span style={{ fontSize: 13, fontWeight: 500 }}>{h.name}</span>
                  <span style={{ display: "flex", alignItems: "center", gap: 3, color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 600 }}>
                    <Flame size={11} style={{ color: COLORS.ember1 }} />{s.currentStreak}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <SectionLabel>Habits heute</SectionLabel>
        <button onClick={onCreate} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6, padding: "7px 12px" }}>
          <Plus size={14} /> Habit
        </button>
      </div>

      {active.length === 0 ? (
        <EmptyState onCreate={onCreate} />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 18, marginBottom: 26 }}>
          {groupHabitsByCategory(
            [...active].sort((a, b) => {
              const aDone = dayStatus(a, entries, todayKey()) === "success" ? 1 : 0;
              const bDone = dayStatus(b, entries, todayKey()) === "success" ? 1 : 0;
              return aDone - bDone;
            })
          ).map(({ category, habits: groupHabits }) => (
            <div key={category}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: categoryColor(category) }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{category}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {groupHabits.map((h) => (
                  <HabitRow key={h.id} habit={h} entries={entries} onToggle={onToggle} onOpenDetail={onOpenDetail} onEdit={onEdit} celebrateId={celebrateId} />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ZIELE: offene Goals im Überblick */}
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <SectionLabel>Ziele</SectionLabel>
          <button onClick={onOpenGoals} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Alle Ziele</button>
        </div>
        {openGoals.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint, background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
            Keine offenen Ziele.
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {openGoals.map((g) => (
              <div key={g.id} style={{
                display: "flex", alignItems: "center", gap: 10, padding: "9px 12px",
                background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 10,
              }}>
                <button onClick={() => achieveGoal(g)} style={{
                  width: 22, height: 22, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
                  border: `1.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textMuted,
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>
                  <Check size={12} strokeWidth={2.8} />
                </button>
                <Target size={13} style={{ color: COLORS.violet, flexShrink: 0 }} />
                <span style={{ flex: 1, fontSize: 13, fontWeight: 500, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.title}</span>
                <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace", flexShrink: 0 }}>{g.points} Pkt.</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function DashTaskRow({ task, onComplete, highlight }) {
  const overdue = task.dueDate && task.dueDate < todayKey();
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 10, padding: "9px 12px",
      background: COLORS.surface, border: `1px solid ${highlight ? COLORS.ember1 + "44" : COLORS.borderSoft}`, borderRadius: 10,
    }}>
      <button onClick={onComplete} style={{
        width: 22, height: 22, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
        border: `1.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textMuted,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Check size={12} strokeWidth={2.8} />
      </button>
      <ClipboardList size={13} style={{ color: overdue ? COLORS.coral : COLORS.textFaint, flexShrink: 0 }} />
      <span style={{ flex: 1, fontSize: 13, fontWeight: 500, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{task.title}</span>
      {task.dueDate && (
        <span style={{ fontSize: 10.5, fontWeight: 600, color: overdue ? COLORS.coral : COLORS.textFaint, fontFamily: "JetBrains Mono, monospace", flexShrink: 0 }}>
          {shortDate(task.dueDate)}
        </span>
      )}
      <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace", flexShrink: 0, display: "flex", alignItems: "center", gap: 3 }}>
        {task.points} Pkt. <CrownBadge points={task.points} size={9} />
      </span>
    </div>
  );
}

function SectionLabel({ children }) {
  return <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>{children}</div>;
}

function EmptyState({ onCreate }) {
  return (
    <div style={{
      textAlign: "center", padding: "48px 20px", border: `1px dashed ${COLORS.border}`, borderRadius: 16, color: COLORS.textMuted,
    }}>
      <Flame size={28} style={{ color: COLORS.ember1, marginBottom: 10 }} />
      <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text, marginBottom: 4 }}>Noch keine Habits</div>
      <div style={{ fontSize: 13, marginBottom: 16 }}>Erstelle deinen ersten Habit und starte deine erste Streak.</div>
      <button onClick={onCreate} style={primaryBtn}>Ersten Habit erstellen</button>
    </div>
  );
}
