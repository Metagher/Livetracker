        <label style={labelStyle}>Gruppen (mehrere möglich)</label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 14 }}>
          {(groups || []).length === 0 ? <span style={{ fontSize: 12, color: COLORS.textFaint }}>Lege Gruppen unter Einstellungen an.</span> : (groups || []).map((group) => {
            const selected = personGroupIds.includes(group);
            return <button key={group} type="button" onClick={() => setPersonGroupIds((current) => selected ? current.filter((item) => item !== group) : [...current, group])} style={{
              padding: "7px 10px", borderRadius: 8, cursor: "pointer", fontSize: 12,
              border: `1px solid ${selected ? categoryColor(group) : COLORS.border}`,
              color: selected ? COLORS.text : COLORS.textMuted, background: selected ? categoryColor(group) + "1f" : "transparent",
            }}>{selected ? "✓ " : ""}{group}</button>;
          })}
        </div>

        <label style={labelStyle}>Geburtsdatum (optional)</label>
        <input type="date" max={todayKey()} value={birthday} onChange={(e) => {
          setBirthday(e.target.value);
          if (!e.target.value) setBirthdayYearConfirmed(false);
        }} style={{ ...inputStyle, marginBottom: 8 }} />
        <label style={{
          display: "flex", alignItems: "center", gap: 9, marginBottom: 14,
          color: birthday ? COLORS.textMuted : COLORS.textFaint, cursor: birthday ? "pointer" : "not-allowed",
        }}>
          <input
            type="checkbox"
            checked={birthdayYearConfirmed}
            disabled={!birthday}
            onChange={(e) => setBirthdayYearConfirmed(e.target.checked)}
            style={{ width: 17, height: 17, margin: 0 }}
          />
          <span>
            <strong style={{ display: "block", fontSize: 12.5, color: birthday ? COLORS.text : COLORS.textFaint }}>Geburtsjahr ist sicher</strong>
            <span style={{ display: "block", fontSize: 11, marginTop: 2 }}>Nicht auswählen, wenn du dir beim Jahr nicht sicher bist.</span>
          </span>
        </label>

        <label style={labelStyle}>Infos (optional)</label>
        <textarea
          style={{ ...inputStyle, minHeight: 100, resize: "vertical", fontFamily: "Inter, sans-serif" }}
          value={info}
          onChange={(e) => setInfo(e.target.value)}
          placeholder="Wie ihr euch kennt, was euch wichtig ist, Vorlieben …"
        />

        <label style={{
          display: "flex", alignItems: "center", gap: 10, padding: "11px 12px", marginBottom: 14,
          borderRadius: 10, background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, cursor: "pointer",
        }}>
          <input type="checkbox" checked={meetingTrackingEnabled} onChange={(e) => setMeetingTrackingEnabled(e.target.checked)} style={{ width: 17, height: 17, margin: 0 }} />
          <span>
            <strong style={{ display: "block", fontSize: 12.5 }}>Treffen für diese Person zählen</strong>
            <span style={{ display: "block", fontSize: 11, color: COLORS.textFaint, marginTop: 2 }}>Deaktivieren, wenn diese Person nicht in Treffen-Statistiken erscheinen soll.</span>
          </span>
        </label>

        <label style={labelStyle}>Farbe</label>
        <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
          {HABIT_COLORS.map((c) => (
            <button key={c} onClick={() => setColor(c)} style={{
              width: 26, height: 26, borderRadius: "50%", background: c, cursor: "pointer",
              border: color === c ? `2px solid ${COLORS.text}` : "2px solid transparent",
              boxShadow: color === c ? `0 0 0 2px ${COLORS.bg}` : "none",
            }} />
          ))}
        </div>

        {initial && (
          <>
            <label style={labelStyle}>Verbindungen</label>
            {relationships.length === 0 ? (
              <div style={{ fontSize: 12, color: COLORS.textFaint, marginBottom: 10 }}>Noch keine Verbindungen eingetragen.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                {relationships.map((r) => {
                  const target = (persons || []).find((p) => p.id === r.personId);
                  return (
                    <div key={r.personId} style={{
                      display: "flex", alignItems: "center", gap: 8, padding: "7px 10px",
                      background: COLORS.bgSoft, borderRadius: 9, fontSize: 12.5,
                    }}>
                      <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        <strong>{relationshipLabel(r.type)}</strong> {target ? target.name : "(gelöschte Person)"}
                      </span>
                      <IconButton onClick={() => onRemoveRelationship(initial.id, r.personId)} title="Entfernen" danger><X size={13} /></IconButton>
                    </div>
                  );
                })}
              </div>
            )}

            {otherPersons.length === 0 ? (
              <div style={{ fontSize: 11.5, color: COLORS.textFaint, marginBottom: 6 }}>Lege weitere Personen an, um Verbindungen einzutragen.</div>
            ) : (
              <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
                <select value={newRelType} onChange={(e) => setNewRelType(e.target.value)} style={{ ...inputStyle, marginBottom: 0, flex: "1 1 150px", cursor: "pointer" }}>
                  {RELATIONSHIP_TYPES.map((r) => <option key={r.key} value={r.key}>{r.label}</option>)}
                </select>
                <select value={newRelTarget} onChange={(e) => setNewRelTarget(e.target.value)} style={{ ...inputStyle, marginBottom: 0, flex: "1 1 150px", cursor: "pointer" }}>
                  <option value="">Person wählen …</option>
                  {otherPersons.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <button
                  type="button"
                  disabled={!newRelTarget}
                  onClick={() => { onAddRelationship(initial.id, newRelTarget, newRelType); setNewRelTarget(""); }}
                  style={{ ...primaryBtn, opacity: newRelTarget ? 1 : 0.5, cursor: newRelTarget ? "pointer" : "not-allowed" }}
                >
                  Hinzufügen
                </button>
              </div>
            )}
          </>
        )}
      </div>

        <div style={modalFooterStyle}>
          {initial ? (
            <button onClick={() => (confirmDelete ? onDelete(initial.id) : setConfirmDelete(true))} style={{
              ...ghostBtn, color: COLORS.coral, display: "flex", alignItems: "center", gap: 6,
              border: `1px solid ${confirmDelete ? COLORS.coral : COLORS.border}`,
              background: confirmDelete ? COLORS.coral + "1f" : "transparent",
            }}>
              <Trash2 size={14} /> {confirmDelete ? "Wirklich löschen?" : "Löschen"}
            </button>
          ) : <span />}
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={onClose} style={ghostBtn}>Abbrechen</button>
            <button
              disabled={!canSave}
              onClick={() => onSave({
                id: initial?.id || `person_${Date.now()}`,
                name: name.trim(), info: info.trim(), groups: personGroupIds, category: personGroupIds[0] || "", birthday: birthday || null, birthdayYearConfirmed: birthday ? birthdayYearConfirmed : false, color, meetingTrackingEnabled,
                meetings: initial?.meetings || [],
                relationships,
                dismissedRelationshipSuggestions: (livePerson || initial)?.dismissedRelationshipSuggestions || [],
                createdAt: initial?.createdAt || todayKey(),
              })}
              style={{ ...primaryBtn, opacity: canSave ? 1 : 0.5, cursor: canSave ? "pointer" : "not-allowed" }}
            >
              Speichern
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   @section HABIT-ROW — Einzeiliger Habit-Eintrag mit Abhaken (Dashboard + Habits-Liste)
   HABIT ROW (Dashboard / Habits list)
   ============================================================ */
function HabitRow({ habit, entries, stats, isMobile, onToggle, onOpenDetail, onEdit, celebrateId }) {
  const currentDateKey = stats.daily.at(-1)?.date || todayKey();
  const Icon = iconFor(habit.icon);
  const status = dayStatus(habit, entries, currentDateKey);
  const isDone = status === "success";
  const isFailed = status === "fail";
  const dotCount = isMobile ? 7 : 14;
  const last14 = useMemo(() => {
    const days = [];
    for (let i = dotCount - 1; i >= 0; i--) days.push(toKey(addDays(keyToDate(currentDateKey), -i)));
    return days;
  }, [dotCount, currentDateKey]);

  const handleClick = () => {
    if (habit.trackingType === "boolean") {
      onToggle(habit.id, currentDateKey, isDone || isFailed ? undefined : true);
    } else {
      onOpenDetail(habit);
    }
  };
  const handleFail = () => {
    onToggle(habit.id, currentDateKey, isFailed ? undefined : false);
  };

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: isMobile ? 8 : 14, padding: isMobile ? "12px 10px" : "14px 16px",
      background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14,
      position: "relative", overflow: "hidden",
    }}>
      {celebrateId === habit.id && <Confetti trigger={celebrateId + "_" + Date.now()} />}
      <div onClick={() => onOpenDetail(habit)} style={{
        width: 40, height: 40, borderRadius: 11, display: "flex", alignItems: "center", justifyContent: "center",
        background: habit.color + "22", color: habit.color, flexShrink: 0, cursor: "pointer",
      }}>
        <Icon size={19} />
      </div>

      <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => onOpenDetail(habit)}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontWeight: 600, fontSize: 14.5 }}>{habit.name}</span>
          {habit.difficulty && (
            <span style={{
              fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 6,
              color: DIFFICULTY_COLORS[habit.difficulty], background: DIFFICULTY_COLORS[habit.difficulty] + "1f",
              textTransform: "uppercase", letterSpacing: "0.03em",
            }}>{DIFFICULTY_LABELS[habit.difficulty]}</span>
          )}
          {stats.currentStreak > 0 && (
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, fontWeight: 600,
              color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace",
            }}>
              <Flame size={11} style={{ color: COLORS.ember1 }} /> {stats.currentStreak}
            </span>
          )}
          {stats.currentNegStreak > 0 && (
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, fontWeight: 600,
              color: COLORS.coral, fontFamily: "JetBrains Mono, monospace",
            }}>
              <TrendingDown size={11} style={{ color: COLORS.coral }} /> {stats.currentNegStreak}
            </span>
          )}
          {stats.longestStreak > 0 && (
            <span
              title="Beste Streak jemals"
              style={{
                display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, fontWeight: 600,
                color: COLORS.textFaint, fontFamily: "JetBrains Mono, monospace",
              }}
            >
              <Award size={11} style={{ color: COLORS.ember2 }} /> {stats.longestStreak}
            </span>
          )}
        </div>
        <div style={{ display: "flex", gap: 3, marginTop: 7 }}>
          {last14.map((k) => {
            const st = dayStatus(habit, entries, k);
            const posLevel = Math.min(1, stats.currentStreak / 20) + 0.3;
            const negLevel = Math.min(1, stats.currentNegStreak / 20) + 0.3;
            const size = isMobile ? 7 : 9;
            if (st === "success") return <EmberDot key={k} level={Math.max(posLevel, 0.35)} size={size} />;
            if (st === "fail") return <EmberDot key={k} level={Math.max(negLevel, 0.35)} negative size={size} />;
            if (st === "skip") return <EmberDot key={k} level={1} skip size={size} />;
            return <EmberDot key={k} level={0} size={size} />;
          })}
        </div>
      </div>

      {!isMobile && (
        <div style={{ textAlign: "right", flexShrink: 0, fontFamily: "JetBrains Mono, monospace" }}>
          <div style={{ fontSize: 11, color: COLORS.textFaint }}>Erfolgsquote</div>
          <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.textMuted }}>{stats.successRate}%</div>
        </div>
      )}

      {habit.trackingType === "boolean" && !isFailed && (
        <button onClick={handleFail} style={{
          width: 38, height: 38, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
          border: isFailed ? "none" : `1.5px solid ${COLORS.border}`,
          background: isFailed ? `linear-gradient(135deg, ${COLORS.coral}, #E14D72)` : "transparent",
          color: isFailed ? "#2B0810" : COLORS.textMuted,
          display: "flex", alignItems: "center", justifyContent: "center", transition: "all .15s",
        }}>
          <X size={18} strokeWidth={2.8} />
        </button>
      )}

      <button onClick={handleClick} style={{
        width: 38, height: 38, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
        border: isDone || isFailed ? "none" : `1.5px solid ${COLORS.border}`,
        background: isDone ? `linear-gradient(135deg, ${COLORS.mint}, #2DBE83)` : isFailed ? `linear-gradient(135deg, ${COLORS.coral}, #E14D72)` : "transparent",
        color: isDone ? "#0A1F14" : isFailed ? "#2B0810" : COLORS.textMuted,
        display: "flex", alignItems: "center", justifyContent: "center", transition: "all .15s",
      }}>
        {isFailed ? <X size={18} strokeWidth={2.8} /> : <Check size={18} strokeWidth={2.8} />}
      </button>

      <IconButton onClick={() => onEdit(habit)} title="Bearbeiten"><Pencil size={14} /></IconButton>
    </div>
  );
}

/* ============================================================
   @section HABIT-DETAIL — Kalenderansicht + Historie/Werte-Eingabe für einen Habit
   HABIT DETAIL (Kalender + Historie)
   ============================================================ */
function HabitDetail({ habit, entries, onClose, onToggle }) {
  const isMobile = useIsMobile();
  const stats = useMemo(() => simulateHabit(habit, entries, todayKey()), [habit, entries]);
  const dailyMap = useMemo(() => Object.fromEntries(stats.daily.map((d) => [d.date, d])), [stats]);
  const Icon = iconFor(habit.icon);
  const viewport = useVisualViewport();

  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [selectedDay, setSelectedDay] = useState(todayKey());

  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i))), [weekStart]);
  const weekRangeLabel = `${shortDate(weekDays[0])} – ${shortDate(weekDays[6])} ${keyToDate(weekDays[6]).getFullYear()}`;
  const isCurrentWeek = toKey(startOfWeek(new Date())) === toKey(weekStart);

  const selectedVal = entries?.[selectedDay]?.[habit.id];
  const [dayInput, setDayInput] = useState(selectedVal === undefined ? "" : String(selectedVal));
  useEffect(() => {
    setDayInput(selectedVal === undefined ? "" : String(selectedVal));
  }, [habit.id, selectedDay, selectedVal]);

  const confirmValue = () => {
    if (dayInput === "") return;
    onToggle(habit.id, selectedDay, Number(dayInput));
  };

  // Werteverlauf: alle numerischen Einträge dieses Habits chronologisch,
  // für die Auswertung "wie entwickeln sich die Zahlen" (z. B. Gewicht)
  const valueSeries = useMemo(() => {
    // "clock" speichert Minuten seit Mitternacht - als Zahlenverlauf-Chart
    // ohne Uhrzeit-Formatierung wenig aussagekräftig, daher hier ausgeklammert.
    if (habit.trackingType === "boolean" || habit.trackingType === "clock") return [];
    return Object.keys(entries)
      .filter((dateKey) => typeof entries[dateKey]?.[habit.id] === "number")
      .sort()
      .map((dateKey) => ({ date: dateKey, label: shortDate(dateKey), value: entries[dateKey][habit.id] }));
  }, [habit.id, habit.trackingType, entries]);

  const valueStats = useMemo(() => {
    if (valueSeries.length === 0) return null;
    const values = valueSeries.map((v) => v.value);
    const first = values[0];
    const last = values[values.length - 1];
    const min = Math.min(...values);
    const max = Math.max(...values);
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    return { first, last, min, max, avg, change: last - first };
  }, [valueSeries]);

  const statusColor = { success: habit.color, fail: COLORS.coral, empty: COLORS.borderSoft };
  const isFuture = (k) => k > todayKey();

  return (
    <div style={{ ...overlayStyle, height: viewport.height, top: viewport.top }} onClick={onClose}>
      <div style={{ ...modalStyle, maxWidth: 620 }} onClick={(e) => e.stopPropagation()}>
      <div style={modalBodyStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
            <div style={{ width: 42, height: 42, borderRadius: 12, background: habit.color + "22", color: habit.color, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon size={20} />
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>{habit.name}</h2>
                {habit.difficulty && (
                  <span style={{
                    fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 6,
                    color: DIFFICULTY_COLORS[habit.difficulty], background: DIFFICULTY_COLORS[habit.difficulty] + "1f",
                    textTransform: "uppercase", letterSpacing: "0.03em",
                  }}>{DIFFICULTY_LABELS[habit.difficulty]}</span>
                )}
              </div>
              {habit.description && <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 2 }}>{habit.description}</div>}
            </div>
          </div>
          <IconButton onClick={onClose}><X size={16} /></IconButton>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(2, 1fr)" : "repeat(4, 1fr)", gap: 10, marginBottom: 10 }}>
          <StatCard
            label="Aktuelle Streak"
            value={stats.currentStreak > 0 ? stats.currentStreak : (stats.currentNegStreak > 0 ? -stats.currentNegStreak : 0)}
            suffix="Tage"
            accent={stats.currentStreak > 0 ? COLORS.ember1 : stats.currentNegStreak > 0 ? COLORS.coral : COLORS.textFaint}
          />
          <StatCard label="Längste Streak" value={stats.longestStreak} suffix="Tage" accent={COLORS.ember2} />
          <StatCard label="Erfolgsquote" value={stats.successRate} suffix="%" accent={COLORS.mint} />
          <StatCard label="Punkte" value={stats.totalPoints} suffix="" accent={stats.totalPoints < 0 ? COLORS.coral : COLORS.violet} />
        </div>

        <div style={{
          background: `linear-gradient(135deg, ${COLORS.ember1}14, ${COLORS.ember2}0a)`,
          border: `1px solid ${COLORS.ember1}33`, borderRadius: 12, padding: "12px 14px", marginBottom: 20,
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: (stats.nextMilestone || stats.totalNegativeMilestonePenalty > 0) ? 8 : 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <Award size={15} style={{ color: COLORS.ember2 }} />
              <span style={{ fontSize: 12.5, fontWeight: 600 }}>Streak-Bonus verdient</span>
            </div>
            <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 14, fontWeight: 700, color: COLORS.ember2 }}>
              +{stats.totalMilestoneBonus}
            </span>
          </div>
          {stats.totalNegativeMilestonePenalty > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: stats.nextMilestone ? 8 : 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <TrendingDown size={15} style={{ color: COLORS.coral }} />
                <span style={{ fontSize: 12.5, fontWeight: 600 }}>Streak-Strafe kassiert</span>
              </div>
              <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 14, fontWeight: 700, color: COLORS.coral }}>
                -{stats.totalNegativeMilestonePenalty}
              </span>
            </div>
          )}
          {stats.nextMilestone && (
            <>
              <div style={{ height: 6, borderRadius: 4, background: COLORS.bgSoft, overflow: "hidden", marginBottom: 6 }}>
                <div style={{
                  height: "100%", borderRadius: 4,
                  width: `${Math.min(100, Math.round((stats.currentStreak / stats.nextMilestone.days) * 100))}%`,
                  background: `linear-gradient(90deg, ${COLORS.ember1}, ${COLORS.ember2})`,
                }} />
              </div>
              <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>
                Noch <strong style={{ color: COLORS.text }}>{stats.nextMilestone.daysLeft}</strong> {stats.nextMilestone.daysLeft === 1 ? "Tag" : "Tage"} bis {stats.nextMilestone.days}-Tage-Streak · Bonus <strong style={{ color: COLORS.ember2 }}>+{stats.nextMilestone.bonus}</strong> Punkte
              </div>
            </>
          )}
        </div>

        {/* Kalender: Kalenderwoche zum Durchklicken */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>Kalender</span>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <IconButton onClick={() => setWeekStart(addDays(weekStart, -7))} title="Vorherige Woche"><ChevronLeft size={14} /></IconButton>
            <span style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.textMuted, minWidth: 128, textAlign: "center", fontFamily: "JetBrains Mono, monospace" }}>
              KW {isoWeekNumber(keyToDate(weekDays[0]))} · {weekRangeLabel}
            </span>
            <IconButton onClick={() => setWeekStart(addDays(weekStart, 7))} title="Nächste Woche"><ChevronRight size={14} /></IconButton>
            {!isCurrentWeek && (
              <button onClick={() => { setWeekStart(startOfWeek(new Date())); setSelectedDay(todayKey()); }} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Heute</button>
            )}
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: isMobile ? 4 : 6, marginBottom: 12 }}>
          {weekDays.map((k, i) => {
            const st = dayStatus(habit, entries, k);
            const isToday = k === todayKey();
            const isSelected = k === selectedDay;
            const weekend = i >= 5;
            const future = isFuture(k);
            const d = keyToDate(k);
            const dayData = dailyMap[k];
            const showPoints = dayData && (st === "success" || st === "fail");
            return (
              <div key={k}>
                <div style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: weekend ? COLORS.ember2 : COLORS.textFaint, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>
                  {WEEKDAY_LABELS[i]}
                </div>
                <button
                  onClick={() => !future && setSelectedDay(k)}
                  disabled={future}
                  title={`${shortDate(k)} · ${st}${dayData ? ` · ${dayData.dayPoints >= 0 ? "+" : ""}${dayData.dayPoints}${dayData.bonusPoints > 0 ? ` + ${dayData.bonusPoints} Bonus` : ""}${dayData.malusPoints < 0 ? ` ${dayData.malusPoints} Strafe` : ""} Punkte` : ""}`}
                  style={{
                    width: "100%", aspectRatio: "1", borderRadius: 11, cursor: future ? "default" : "pointer",
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", gap: 1,
                    background: st === "success" ? habit.color + "2e" : st === "fail" ? statusColor.fail + "26" : st === "skip" ? COLORS.violet + "22" : weekend ? COLORS.bgSoft : COLORS.surfaceRaised,
                    border: isSelected ? `2px solid ${habit.color}` : isToday ? `1.5px solid ${COLORS.textMuted}` : `1px solid ${COLORS.borderSoft}`,
                    opacity: future ? 0.35 : 1,
                    transition: "all .15s",
                  }}>
                  <span style={{
                    fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, lineHeight: 1,
                    color: st === "success" ? habit.color : st === "fail" ? statusColor.fail : st === "skip" ? COLORS.violet : COLORS.text,
                  }}>
                    {d.getDate()}
                  </span>
                  {showPoints && (
                    <span style={{
                      fontFamily: "JetBrains Mono, monospace", fontSize: 9.5, fontWeight: 600, lineHeight: 1,
                      color: dayData.dayPoints > 0 ? habit.color : dayData.dayPoints < 0 ? statusColor.fail : COLORS.textFaint,
                    }}>
                      {dayData.dayPoints >= 0 ? "+" : ""}{dayData.dayPoints}
                    </span>
                  )}
                  {dayData && dayData.bonusPoints > 0 && (
                    <span style={{
                      fontFamily: "JetBrains Mono, monospace", fontSize: 8.5, fontWeight: 700, lineHeight: 1,
                      color: COLORS.ember2,
                    }}>
                      +{dayData.bonusPoints} 🎁
                    </span>
                  )}
                  {dayData && dayData.malusPoints < 0 && (
                    <span style={{
                      fontFamily: "JetBrains Mono, monospace", fontSize: 8.5, fontWeight: 700, lineHeight: 1,
                      color: statusColor.fail,
                    }}>
                      {dayData.malusPoints} ⚠️
                    </span>
                  )}
                  {st === "success" && <Flame size={10} style={{ position: "absolute", top: 4, right: 4, color: habit.color }} />}
                  {st === "fail" && <TrendingDown size={10} style={{ position: "absolute", top: 4, right: 4, color: statusColor.fail }} />}
                  {st === "skip" && <span style={{ position: "absolute", top: 3, right: 3, fontSize: 9 }}>🌴</span>}
                </button>
              </div>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 14, marginBottom: 18, fontSize: 11, color: COLORS.textFaint, flexWrap: "wrap" }}>
          <LegendDot color={habit.color} label="Erfüllt" />
          <LegendDot color={statusColor.fail} label="Nicht erfüllt" />
          <LegendDot color={COLORS.violet} label="Übersprungen" />
          <LegendDot color={COLORS.ember2} label="Wochenende" />
        </div>

        {/* Editor für den ausgewählten Tag */}
        <div style={{ background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
            <div style={{ fontSize: 12.5, fontWeight: 600 }}>
              {selectedDay === todayKey() ? "Heute" : longDate(selectedDay)}
            </div>
            <button
              onClick={() => onToggle(habit.id, selectedDay, selectedVal === SKIP_VALUE ? undefined : SKIP_VALUE)}
              style={{
                ...ghostBtn, padding: "5px 10px", fontSize: 11.5, display: "flex", alignItems: "center", gap: 5,
                border: `1px solid ${selectedVal === SKIP_VALUE ? COLORS.violet : COLORS.border}`,
                background: selectedVal === SKIP_VALUE ? COLORS.violet + "1f" : "transparent",
                color: selectedVal === SKIP_VALUE ? COLORS.violet : COLORS.textMuted,
              }}
            >
              🌴 {selectedVal === SKIP_VALUE ? "Übersprungen" : "Überspringen"}
            </button>
          </div>

          {selectedVal === SKIP_VALUE ? (
            <div style={{ fontSize: 12, color: COLORS.textMuted, lineHeight: 1.6 }}>
              Dieser Tag zählt als nicht existent (z. B. Urlaub) - Streak und Punkte bleiben unverändert. Klick erneut auf "Übersprungen", um das rückgängig zu machen.
            </div>
          ) : habit.trackingType === "boolean" ? (
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => onToggle(habit.id, selectedDay, true)} style={{
                ...ghostBtn, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                border: `1px solid ${selectedVal === true ? habit.color : COLORS.border}`,
                background: selectedVal === true ? habit.color + "1f" : "transparent",
                color: selectedVal === true ? habit.color : COLORS.textMuted,
              }}><Check size={14} /> Erfüllt</button>
              <button onClick={() => onToggle(habit.id, selectedDay, false)} style={{
                ...ghostBtn, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                border: `1px solid ${selectedVal === false ? COLORS.coral : COLORS.border}`,
                background: selectedVal === false ? COLORS.coral + "1f" : "transparent",
                color: selectedVal === false ? COLORS.coral : COLORS.textMuted,
              }}><TrendingDown size={14} /> Nicht erfüllt</button>
              <button onClick={() => onToggle(habit.id, selectedDay, undefined)} style={{ ...ghostBtn, flex: 1 }}>Zurücksetzen</button>
            </div>
          ) : habit.trackingType === "clock" ? (
            <>
              <div style={{ fontSize: 11, color: COLORS.textFaint, marginBottom: 8 }}>
                Erfüllt, wenn die Uhrzeit {habit.timeDirection === "after" ? "größer" : "kleiner"} ist als {minutesToClock(habit.target)} Uhr
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  type="time" style={{ ...inputStyle, marginBottom: 0 }}
                  value={dayInput !== "" ? minutesToClock(Number(dayInput)) : ""}
                  onChange={(e) => { const m = clockToMinutes(e.target.value); setDayInput(m === null ? "" : String(m)); }}
                />
                <button onClick={confirmValue} disabled={dayInput === ""} style={{ ...primaryBtn, opacity: dayInput === "" ? 0.5 : 1, cursor: dayInput === "" ? "not-allowed" : "pointer" }}>
                  Übernehmen
                </button>
                <button onClick={() => { onToggle(habit.id, selectedDay, false); setDayInput(""); }} style={{
                  ...ghostBtn, display: "flex", alignItems: "center", gap: 6,
                  color: selectedVal === false ? COLORS.coral : COLORS.textMuted,
                  border: `1px solid ${selectedVal === false ? COLORS.coral : COLORS.border}`,
                }}><TrendingDown size={14} /> Nicht erfüllt</button>
              </div>
              {typeof selectedVal === "number" && (
                <div style={{ fontSize: 11.5, color: COLORS.textFaint, marginTop: 8 }}>
                  Eingetragen: {minutesToClock(selectedVal)} Uhr
                </div>
              )}
            </>
          ) : (
            <>
              <div style={{ fontSize: 11, color: COLORS.textFaint, marginBottom: 8 }}>
                {habit.trackingType === "value"
                  ? `Messwert${habit.unit ? ` in ${habit.unit}` : ""} – jede Zahl zählt als erfüllt`
                  : `${habit.unit || (habit.trackingType === "time" ? "Minuten" : "Einheiten")} · Ziel ${habit.target}`}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input type="number" step="any" style={{ ...inputStyle, marginBottom: 0 }}
                  value={dayInput}
                  onChange={(e) => setDayInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") confirmValue(); }}
                  placeholder={habit.trackingType === "value" ? (habit.unit || "0") : "0"} />
                <button onClick={confirmValue} disabled={dayInput === ""} style={{ ...primaryBtn, opacity: dayInput === "" ? 0.5 : 1, cursor: dayInput === "" ? "not-allowed" : "pointer" }}>
                  Übernehmen
                </button>
                <button onClick={() => { onToggle(habit.id, selectedDay, false); setDayInput(""); }} style={{
                  ...ghostBtn, display: "flex", alignItems: "center", gap: 6,
                  color: selectedVal === false ? COLORS.coral : COLORS.textMuted,
                  border: `1px solid ${selectedVal === false ? COLORS.coral : COLORS.border}`,
                }}><TrendingDown size={14} /> Nicht erfüllt</button>
              </div>
              {selectedVal !== undefined && selectedVal !== false && (
                <div style={{ fontSize: 11.5, color: COLORS.textFaint, marginTop: 8 }}>
                  Eingetragen: {selectedVal} {habit.unit || (habit.trackingType === "time" ? "Minuten" : "")}
                </div>
              )}
            </>
          )}
        </div>

        {habit.trackingType !== "boolean" && habit.trackingType !== "clock" && (
          <div style={{ marginTop: 20 }}>
            <SectionLabel>Verlauf</SectionLabel>
            {!valueStats ? (
              <div style={{ color: COLORS.textFaint, fontSize: 12.5, background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: 14 }}>
                Trage mindestens zwei Werte ein, um zu sehen, wie sich die Zahlen entwickeln.
              </div>
            ) : (
              <div style={{ background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: 14 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 14 }}>
                  <MiniStat label="Aktuell" value={valueStats.last} unit={habit.unit} />
                  <MiniStat label="Ø Schnitt" value={Math.round(valueStats.avg * 10) / 10} unit={habit.unit} />
                  <MiniStat label="Min" value={valueStats.min} unit={habit.unit} />
                  <MiniStat label="Max" value={valueStats.max} unit={habit.unit} />
                </div>
                <div style={{ fontSize: 11.5, color: COLORS.textMuted, marginBottom: 10 }}>
                  {valueStats.change === 0 ? "Unverändert" : valueStats.change > 0 ? "Anstieg" : "Rückgang"} seit dem ersten Eintrag:{" "}
                  <strong style={{ color: valueStats.change === 0 ? COLORS.text : valueStats.change > 0 ? COLORS.ember2 : COLORS.mint }}>
                    {valueStats.change > 0 ? "+" : ""}{Math.round(valueStats.change * 10) / 10} {habit.unit}
                  </strong>
                </div>
                <ResponsiveContainer width="100%" height={160}>
                  <LineChart data={valueSeries}>
                    <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
                    <XAxis dataKey="label" tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={{ stroke: COLORS.border }} tickLine={false} minTickGap={24} />
                    <YAxis domain={["auto", "auto"]} tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} width={36} />
                    <Tooltip contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} labelStyle={{ color: COLORS.text }} formatter={(v) => [`${v} ${habit.unit || ""}`, "Wert"]} />
                    <Line type="monotone" dataKey="value" stroke={habit.color} strokeWidth={2.5} dot={{ r: 2.5, fill: habit.color }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            )}
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

function LegendDot({ color, label }) {
  return <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: color, display: "inline-block" }} />{label}</span>;
}

function StatCard({ label, value, suffix, accent }) {
  return (
    <div style={{ background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
      <div style={{ fontSize: 10.5, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>{label}</div>
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 600, color: accent }}>
        {value}<span style={{ fontSize: 12, color: COLORS.textFaint, marginLeft: 3, fontFamily: "Inter, sans-serif" }}>{suffix}</span>
      </div>
    </div>
  );
}

function MiniStat({ label, value, unit }) {
  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 9, padding: "8px 9px", textAlign: "center" }}>
      <div style={{ fontSize: 9.5, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 2 }}>{label}</div>
      <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13.5, fontWeight: 600, color: COLORS.text }}>
        {value}<span style={{ fontSize: 10, color: COLORS.textFaint, marginLeft: 2 }}>{unit}</span>
      </div>
    </div>
  );
}

/* ============================================================
   @section DASHBOARD — Startseite: Punkte, Coach-Teaser, Geburtstage, Aufgaben, Habits
   ============================================================ */
function motivationLine(active, entries, allStats, dateKey = todayKey()) {
  const done = active.filter((h) => dayStatus(h, entries, dateKey) === "success").length;
  const remaining = active.length - done;
  if (active.length === 0) return "Leg los und erstelle deinen ersten Habit.";
  if (remaining === 0) return "Perfekter Tag – alle Habits erfüllt. 🔥";
  const bestStreak = Math.max(0, ...allStats.map((s) => s.currentStreak));
  if (remaining === 1) return "Nur noch ein Habit bis zu deinem perfekten Tag.";
  if (bestStreak >= 7) return `Deine ${bestStreak}-Tage-Streak läuft noch. Nicht abbrechen!`;
  return `Noch ${remaining} Habits offen – du schaffst das.`;
}

function Dashboard({
  habits, entries, onToggle, onOpenDetail, onEdit, onCreate, celebrateId, coach, onOpenCoach, hasCoach,
  goals, tasks, persons, persistTasks, onOpenTasks, moods, persistMoods, onOpenMood, allStats, statsByHabitId, isMobile, currentDateKey,
}) {
  const active = habits;
  const totalToday = useMemo(() => {
    const k = currentDateKey;
    const habitPart = allStats.reduce((sum, s) => sum + (s.daily.find((d) => d.date === k)?.delta || 0), 0);
    return habitPart + goalPointsOnDate(goals, k) + taskPointsOnDate(tasks, k);
  }, [allStats, goals, tasks]);
  const totalAll = useMemo(() => allStats.reduce((s, st) => s + st.totalPoints, 0) + totalGoalPoints(goals) + totalTaskPoints(tasks), [allStats, goals, tasks]);
  const totalWeek = useMemo(() => {
    const keys = Array.from({ length: 7 }, (_, i) => toKey(addDays(new Date(), -i)));
    const habitPart = allStats.reduce((s, st) => s + st.daily.filter((d) => keys.includes(d.date)).reduce((a, d) => a + d.delta, 0), 0);
    return habitPart + goalPointsInRange(goals, keys) + taskPointsInRange(tasks, keys);
  }, [allStats, goals, tasks]);
  const topStreaks = [...active].map((h, i) => ({ h, s: allStats[i] })).filter((x) => x.s.currentStreak > 0).sort((a, b) => b.s.currentStreak - a.s.currentStreak).slice(0, 5);

  const weekKeys = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(startOfWeek(keyToDate(currentDateKey)), i))), [currentDateKey]);
  const todayTasks = useMemo(() => (tasks || []).filter((t) => !t.completed && t.dueDate === currentDateKey), [tasks, currentDateKey]);
  const weekTasks = useMemo(() => (tasks || [])
    .filter((t) => !t.completed && t.dueDate && t.dueDate !== currentDateKey && weekKeys.includes(t.dueDate))
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate)), [tasks, weekKeys]);
  const upcomingBirthdays = useMemo(() => {
    const currentDate = keyToDate(currentDateKey);
    return (persons || [])
      .filter((p) => p.birthday && isValidDateKey(p.birthday) && keyToDate(p.birthday) <= currentDate)
      .map((p) => ({ person: p, days: daysUntilBirthday(p.birthday, currentDate), nextAge: p.birthdayYearConfirmed === true ? ageAtNextBirthday(p.birthday, currentDate) : null }))
      .filter((x) => x.days <= 14)
      .sort((a, b) => a.days - b.days);
  }, [persons, currentDateKey]);

  const completeTask = (task) => {
    persistTasks((tasks || []).map((t) => t.id === task.id ? { ...t, completed: true, completedAt: currentDateKey } : t));
  };

  return (
    <div>
      <div style={{ marginBottom: 26 }}>
        <div style={{ fontSize: 13, color: COLORS.textFaint, marginBottom: 4 }}>{new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 30, fontWeight: 600, margin: 0 }}>
          Guten Tag. <span style={{ color: COLORS.ember2 }}>{totalToday > 0 ? `+${totalToday}` : totalToday} Punkte heute</span>
        </h1>
        <p style={{ color: COLORS.textMuted, fontSize: 14.5, marginTop: 6 }}>{motivationLine(active, entries, allStats, currentDateKey)}</p>
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 16, marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}><SectionLabel>Wie geht es dir heute?</SectionLabel><button onClick={onOpenMood} style={{ ...ghostBtn, padding: "5px 9px", fontSize: 10.5 }}>Zum Verlauf</button></div>
        <MoodInput dateKey={currentDateKey} moods={moods} persistMoods={persistMoods} compact />
      </div>

      {hasCoach && coach?.quote && (
        <button onClick={onOpenCoach} style={{
          display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", cursor: "pointer",
          background: `linear-gradient(135deg, ${COLORS.violet}14, ${COLORS.ember1}0a)`,
          border: `1px solid ${COLORS.violet}33`, borderRadius: 14, padding: "12px 14px", marginBottom: 24,
        }}>
          <div style={{
            width: 26, height: 26, borderRadius: 8, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
            background: `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.ember1})`,
          }}>
            <Brain size={13} style={{ color: "#fff" }} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.violet, marginBottom: 2, letterSpacing: "0.03em" }}>DEIN COACH</div>
            <div style={{
              fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: 14.5, color: COLORS.text,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>
              „{coach.quote}"
            </div>
          </div>
        </button>
      )}

      {upcomingBirthdays.length > 0 && (
        <div style={{
          display: "flex", flexDirection: "column", gap: 8, marginBottom: 24,
          background: `linear-gradient(135deg, ${COLORS.ember1}14, ${COLORS.ember2}0a)`,
          border: `1px solid ${COLORS.ember2}33`, borderRadius: 14, padding: "12px 14px",
        }}>
          <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.ember2, letterSpacing: "0.03em" }}>GEBURTSTAGE</div>
          {upcomingBirthdays.map(({ person, days, nextAge }) => (
            <div key={person.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5 }}>
              <span>🎂</span>
              <span style={{ fontWeight: 600, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{person.name}</span>
              <span style={{ color: COLORS.textMuted, fontSize: 12, flexShrink: 0 }}>
                {days === 0 ? `heute${nextAge !== null ? ` · wird ${nextAge}` : ""}` : days === 1 ? `morgen${nextAge !== null ? ` · wird ${nextAge}` : ""}` : `in ${days} Tagen${nextAge !== null ? ` · wird ${nextAge}` : ""}`}
              </span>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 26 }}>
        <StatCard label="Punkte heute" value={totalToday} suffix="" accent={COLORS.ember2} />
        <StatCard label="Punkte diese Woche" value={totalWeek} suffix="" accent={COLORS.violet} />
        <StatCard label="Gesamtpunkte" value={totalAll} suffix="" accent={COLORS.mint} />
      </div>

      {/* AUFGABEN: heute fällig + diese Woche fällig */}
      <div style={{ marginBottom: 26 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <SectionLabel>Aufgaben</SectionLabel>
          <button onClick={onOpenTasks} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5 }}>Alle Aufgaben</button>
        </div>
        {todayTasks.length === 0 && weekTasks.length === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint, background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 12, padding: "12px 14px" }}>
            Keine Aufgaben mit Termin diese Woche.
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {todayTasks.length > 0 && (
              <div>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.ember2, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 6 }}>Heute fällig</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {todayTasks.map((t) => <DashTaskRow key={t.id} task={t} onComplete={() => completeTask(t)} highlight />)}
                </div>
              </div>
            )}
            {weekTasks.length > 0 && (
              <div style={{ marginTop: todayTasks.length > 0 ? 10 : 0 }}>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 6 }}>Diese Woche fällig</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {weekTasks.map((t) => <DashTaskRow key={t.id} task={t} onComplete={() => completeTask(t)} />)}
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {topStreaks.length > 0 && (
        <div style={{ marginBottom: 26 }}>
          <SectionLabel>Beste Streaks</SectionLabel>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {topStreaks.map(({ h, s }) => {
              const Icon = iconFor(h.icon);
              return (
                <div key={h.id} style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderRadius: 10,
                  background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`,
                }}>
                  <Icon size={14} style={{ color: h.color }} />
                  <span style={{ fontSize: 13, fontWeight: 500 }}>{h.name}</span>
                  <span style={{ display: "flex", alignItems: "center", gap: 3, color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace", fontSize: 12, fontWeight: 600 }}>
                    <Flame size={11} style={{ color: COLORS.ember1 }} />{s.currentStreak}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <SectionLabel>Habits heute</SectionLabel>
        <button onClick={onCreate} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6, padding: "7px 12px" }}>
          <Plus size={14} /> Habit
        </button>
      </div>

      {active.length === 0 ? (
        <EmptyState onCreate={onCreate} />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 18, marginBottom: 26 }}>
          {groupHabitsByCategory(
            [...active].sort((a, b) => {
              const aDone = dayStatus(a, entries, currentDateKey) === "success" ? 1 : 0;
              const bDone = dayStatus(b, entries, currentDateKey) === "success" ? 1 : 0;
              return aDone - bDone;
            })
          ).map(({ category, habits: groupHabits }) => (
            <div key={category}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: categoryColor(category) }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{category}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {groupHabits.map((h) => (
                  <HabitRow key={h.id} habit={h} entries={entries} stats={statsByHabitId[h.id]} isMobile={isMobile} onToggle={onToggle} onOpenDetail={onOpenDetail} onEdit={onEdit} celebrateId={celebrateId} />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DashTaskRow({ task, onComplete, highlight }) {
  const overdue = task.dueDate && task.dueDate < todayKey();
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 10, padding: "9px 12px",
      background: COLORS.surface, border: `1px solid ${highlight ? COLORS.ember1 + "44" : COLORS.borderSoft}`, borderRadius: 10,
    }}>
      <button onClick={onComplete} style={{
        width: 22, height: 22, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
        border: `1.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textMuted,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Check size={12} strokeWidth={2.8} />
      </button>
      <ClipboardList size={13} style={{ color: overdue ? COLORS.coral : COLORS.textFaint, flexShrink: 0 }} />
      <span style={{ flex: 1, fontSize: 13, fontWeight: 500, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{task.title}</span>
      {task.dueDate && (
        <span style={{ fontSize: 10.5, fontWeight: 600, color: overdue ? COLORS.coral : COLORS.textFaint, fontFamily: "JetBrains Mono, monospace", flexShrink: 0 }}>
          {shortDate(task.dueDate)}
        </span>
      )}
      <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.ember2, fontFamily: "JetBrains Mono, monospace", flexShrink: 0, display: "flex", alignItems: "center", gap: 3 }}>
        {task.points} Pkt. <CrownBadge points={task.points} size={9} />
      </span>
    </div>
  );
}

function alphaHex(ratio) {
  return Math.round(Math.max(0, Math.min(1, ratio)) * 255).toString(16).padStart(2, "0");
}

// Kumuliert die Aktivitäts-Heatmap pro Kalenderwoche (statt pro Tag), damit sich das
// ganze Jahr ohne horizontales Scrollen auf einen Blick zeigen lässt.
function buildYearWeeklyHeatmap(year, dailyStatusMap) {
  const jan1 = new Date(year, 0, 1);
  const dec31 = new Date(year, 11, 31);
  const gridStart = startOfWeek(jan1);
  const gridEnd = startOfWeek(dec31);
  const weeks = [];
  let cursor = new Date(gridStart);
  while (cursor <= gridEnd) {
    let success = 0, fail = 0;
    for (let d = 0; d < 7; d++) {
      const s = dailyStatusMap[toKey(addDays(cursor, d))];
      if (s) { success += s.success; fail += s.fail; }
    }
    const tracked = success + fail;
    weeks.push({
      weekStart: toKey(cursor),
      weekNum: isoWeekNumber(cursor),
      ratio: tracked > 0 ? success / tracked : null,
      tracked,
    });
    cursor = addDays(cursor, 7);
  }
  return weeks;
}

/* ============================================================
   @section PROGRESS-PAGE — "Fortschritt": Recharts-Diagramme + Erfolge-Grid
   PROGRESS PAGE (Diagramme + Erfolge)
   ============================================================ */
function ProgressPage({ habits, entries, achievements, goals, tasks, persons, allStats, isMobile }) {
  const active = habits;
  const [rangeDays, setRangeDays] = useState(30);

  const dailyPointsMap = useMemo(() => {
    const map = {};
    allStats.forEach((s) => s.daily.forEach((d) => {
      map[d.date] = (map[d.date] || 0) + d.delta;
    }));
    (goals || []).filter((g) => g.achieved && g.achievedAt).forEach((g) => {
      map[g.achievedAt] = (map[g.achievedAt] || 0) + g.points;
    });
    (tasks || []).filter((t) => t.completed && t.completedAt).forEach((t) => {
      map[t.completedAt] = (map[t.completedAt] || 0) + t.points;
    });
    return map;
  }, [allStats, goals, tasks]);

  const combinedDaily = useMemo(() => {
    const keys = Object.keys(dailyPointsMap).sort();
    let running = 0;
    return keys.map((k) => {
      running += dailyPointsMap[k];
      return { key: k, date: shortDate(k), points: dailyPointsMap[k], total: running };
    });
  }, [dailyPointsMap]);

  const [viewYear, setViewYear] = useState(() => new Date().getFullYear());
  const currentYear = new Date().getFullYear();
  const MONTH_LABELS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  const yearData = useMemo(() => {
    const monthMap = {};
    Object.keys(dailyPointsMap).forEach((k) => {
      const ym = k.slice(0, 7);
      monthMap[ym] = (monthMap[ym] || 0) + dailyPointsMap[k];
    });
    const months = Array.from({ length: 12 }, (_, i) => ({
      month: i,
      points: monthMap[`${viewYear}-${pad(i + 1)}`] || 0,
    }));
    const yearTotal = months.reduce((s, m) => s + m.points, 0);
    return { months, yearTotal };
  }, [dailyPointsMap, viewYear]);

  // Erfüllungsquote pro Tag (success/fail je Habit, "empty" zählt nicht mit) - Basis
  // für die Wochen-Trendlinie und die Jahres-Heatmap.
  const dailyStatusMap = useMemo(() => {
    const map = {};
    allStats.forEach((s) => s.daily.forEach((d) => {
      if (d.status === "empty") return;
      if (d.status === "skip") return;
      if (!map[d.date]) map[d.date] = { success: 0, fail: 0 };
      map[d.date][d.status] += 1;
    }));
    return map;
  }, [allStats]);

  const periodAnalysis = useMemo(() => {
    const today = new Date();
    const isValidProgressDate = (key) => {
      if (typeof key !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
      const date = keyToDate(key);
      return !Number.isNaN(date.getTime()) && toKey(date) === key && key <= todayKey();
    };
    const allTrackedKeys = [
      ...Object.keys(dailyStatusMap),
      ...(persons || []).filter((person) => person.meetingTrackingEnabled !== false).flatMap((person) => person.meetings || []),
      ...(tasks || []).map((task) => task.completedAt).filter(Boolean),
      ...(goals || []).map((goal) => goal.achievedAt).filter(Boolean),
    ].filter(isValidProgressDate).sort();
    // "thisWeek"/"lastWeek" sind Kalenderwochen (Mo-So) und enden - anders als
    // die Tage-Presets - nicht zwangsläufig heute: "letzte Woche" endet am
    // vergangenen Sonntag, nicht heute. Daher eigener endKey statt todayKey().
    const isWeekPreset = rangeDays === "thisWeek" || rangeDays === "lastWeek";
    const thisMonday = startOfWeek(today);
    const weekStart = rangeDays === "lastWeek" ? addDays(thisMonday, -7) : thisMonday;
    const startKey = isWeekPreset
      ? toKey(weekStart)
      : rangeDays === "all"
        ? (allTrackedKeys[0] || todayKey())
        : toKey(addDays(today, -(rangeDays - 1)));
    const endKey = rangeDays === "lastWeek" ? toKey(addDays(weekStart, 6)) : todayKey();
    const calendarDays = isWeekPreset
      ? 7
      : rangeDays === "all"
        ? Math.max(1, Math.round((keyToDate(todayKey()) - keyToDate(startKey)) / 86400000) + 1)
        : rangeDays;
    const previousStartKey = rangeDays === "all" ? null : toKey(addDays(keyToDate(startKey), -calendarDays));
    const previousEndKey = rangeDays === "all" ? null : toKey(addDays(keyToDate(startKey), -1));

    const summarize = (from, to) => {
      let success = 0, fail = 0, activeDays = 0, points = 0;
      Object.entries(dailyStatusMap).forEach(([key, value]) => {
        if (key < from || key > to) return;
        success += value.success;
        fail += value.fail;
        if (value.success + value.fail > 0) activeDays += 1;
      });
      Object.entries(dailyPointsMap).forEach(([key, value]) => {
        if (key >= from && key <= to) points += value;
      });
      const tracked = success + fail;
      return { success, fail, tracked, activeDays, points, rate: tracked ? Math.round(success / tracked * 100) : null };
    };

    const current = summarize(startKey, endKey);
    const previous = previousStartKey ? summarize(previousStartKey, previousEndKey) : null;
    const rateDelta = current.rate !== null && previous && previous.rate !== null ? current.rate - previous.rate : null;

    const habitRows = active.map((habit, index) => {
      const currentDays = allStats[index].daily.filter((d) => d.date >= startKey && d.date <= endKey && d.status !== "empty");
      const previousDays = previousStartKey
        ? allStats[index].daily.filter((d) => d.date >= previousStartKey && d.date <= previousEndKey && d.status !== "empty")
        : [];
      const success = currentDays.filter((d) => d.status === "success").length;
      const previousSuccess = previousDays.filter((d) => d.status === "success").length;
      const rate = currentDays.length ? Math.round(success / currentDays.length * 100) : null;
      const previousRate = previousDays.length ? Math.round(previousSuccess / previousDays.length * 100) : null;
      return {
        habit, stats: allStats[index], tracked: currentDays.length, success, rate, previousRate,
        delta: rate !== null && previousRate !== null ? rate - previousRate : null,
      };
    }).filter((row) => row.tracked > 0).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));

    // Wiederverwendet die in habitRows bereits berechneten currentDays/success-Werte,
    // statt sie hier über indexOf + einen zweiten Filter-Durchlauf neu zu berechnen.
    const categoryMap = {};
    habitRows.forEach((row) => {
      const category = categoryOf(row.habit);
      if (!categoryMap[category]) categoryMap[category] = { category, success: 0, tracked: 0 };
      categoryMap[category].success += row.success;
      categoryMap[category].tracked += row.tracked;
    });
    const categories = Object.values(categoryMap)
      .map((item) => ({ ...item, rate: item.tracked ? Math.round(item.success / item.tracked * 100) : 0 }))
      .sort((a, b) => b.rate - a.rate);

    const completedTasks = (tasks || []).filter((task) => task.completedAt >= startKey && task.completedAt <= endKey).length;
    const achievedGoals = (goals || []).filter((goal) => goal.achievedAt >= startKey && goal.achievedAt <= endKey).length;
    const meetings = (persons || []).filter((person) => person.meetingTrackingEnabled !== false).reduce((sum, person) => sum + (person.meetings || []).filter((date) => date >= startKey && date <= endKey).length, 0);
    return { startKey, endKey, calendarDays, current, previous, rateDelta, habitRows, categories, completedTasks, achievedGoals, meetings };
  }, [rangeDays, dailyStatusMap, dailyPointsMap, active, allStats, tasks, goals, persons]);

  const meetingAnalysis = useMemo(() => {
    const startKey = periodAnalysis.startKey;
    const endKey = periodAnalysis.endKey;
    const useWeeks = rangeDays === "thisWeek" || rangeDays === "lastWeek" || (typeof rangeDays === "number" && rangeDays <= 90);
    const startDate = keyToDate(startKey);
    const totalMonths = (new Date().getFullYear() - startDate.getFullYear()) * 12 + new Date().getMonth() - startDate.getMonth() + 1;
    // Bei sehr langen Gesamtzeiträumen verhindert eine Jahresaggregation
    // hunderte oder tausende Diagrammbalken, ohne Treffen wegzulassen.
    const useYears = rangeDays === "all" && totalMonths > 120;
    const meetingPersons = (persons || []).filter((person) => person.meetingTrackingEnabled !== false);
    const meetingDates = meetingPersons.flatMap((person) => person.meetings || []);
    const rangeMeetingDates = meetingDates.filter((date) => date >= startKey && date <= endKey);
    const rows = meetingPersons.map((person) => {
      const dates = (person.meetings || []).filter((date) => date >= startKey && date <= endKey);
      return { person, count: dates.length, lastDate: dates.slice().sort().at(-1) || null };
    }).filter((row) => row.count > 0).sort((a, b) => b.count - a.count || a.person.name.localeCompare(b.person.name, "de"));

    const previousCount = periodAnalysis.previous
      ? meetingDates.filter((date) => date >= toKey(addDays(keyToDate(startKey), -periodAnalysis.calendarDays)) && date < startKey).length
      : null;
    const currentCount = rows.reduce((sum, row) => sum + row.count, 0);

    const buckets = [];
    if (useWeeks) {
      const counts = {};
      rangeMeetingDates.forEach((date) => { const key = toKey(startOfWeek(keyToDate(date))); counts[key] = (counts[key] || 0) + 1; });
      let cursor = startOfWeek(keyToDate(startKey));
      while (cursor <= keyToDate(endKey)) {
        const bucketStart = toKey(cursor);
        const bucketEnd = toKey(addDays(cursor, 6));
        const count = counts[bucketStart] || 0;
        buckets.push({ key: bucketStart, label: `KW ${isoWeekNumber(cursor)}`, fullLabel: `${shortDate(bucketStart)} – ${shortDate(bucketEnd)}`, treffen: count });
        cursor = addDays(cursor, 7);
      }
    } else if (!useYears) {
      const counts = {};
      rangeMeetingDates.forEach((date) => { const key = date.slice(0, 7); counts[key] = (counts[key] || 0) + 1; });
      let cursor = startOfMonth(keyToDate(startKey));
      while (cursor <= keyToDate(endKey)) {
        const prefix = toKey(cursor).slice(0, 7);
        const count = counts[prefix] || 0;
        buckets.push({ key: prefix, label: cursor.toLocaleDateString("de-DE", { month: "short", year: "2-digit" }), fullLabel: cursor.toLocaleDateString("de-DE", { month: "long", year: "numeric" }), treffen: count });
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      }
    } else {
      const counts = {};
      rangeMeetingDates.forEach((date) => { const key = date.slice(0, 4); counts[key] = (counts[key] || 0) + 1; });
      for (let year = startDate.getFullYear(); year <= new Date().getFullYear(); year++) {
        const prefix = String(year);
        const count = counts[prefix] || 0;
        buckets.push({ key: prefix, label: prefix, fullLabel: prefix, treffen: count });
      }
    }
    return { rows, buckets, currentCount, previousCount, delta: previousCount === null ? null : currentCount - previousCount };
  }, [persons, periodAnalysis.startKey, periodAnalysis.calendarDays, periodAnalysis.previous, rangeDays]);

  const weeklySuccessRate = useMemo(() => {
    // An periodAnalysis.endKey verankert statt an "heute", damit bei "letzte
    // Woche" der letzte Balken auch wirklich die letzte Woche zeigt.
    const lastVisibleWeekStart = startOfWeek(keyToDate(periodAnalysis.endKey));
    return Array.from({ length: 12 }, (_, i) => {
      const wStart = addDays(lastVisibleWeekStart, -7 * (11 - i));
      const wEnd = addDays(wStart, 6);
      if (toKey(wEnd) < periodAnalysis.startKey) return null;
      let success = 0, fail = 0;
      for (let d = 0; d < 7; d++) {
        const key = toKey(addDays(wStart, d));
        if (key < periodAnalysis.startKey || key > periodAnalysis.endKey) continue;
        const s = dailyStatusMap[key];
        if (s) { success += s.success; fail += s.fail; }
      }
      const tracked = success + fail;
      return { week: `KW ${isoWeekNumber(wStart)}`, rate: tracked > 0 ? Math.round((success / tracked) * 100) : null, tracked };
    }).filter(Boolean);
  }, [dailyStatusMap, periodAnalysis.startKey, periodAnalysis.endKey]);

  const filteredDailyStatusMap = useMemo(() => Object.fromEntries(
    Object.entries(dailyStatusMap).filter(([key]) => key >= periodAnalysis.startKey && key <= periodAnalysis.endKey)
  ), [dailyStatusMap, periodAnalysis.startKey, periodAnalysis.endKey]);
  const yearWeeklyHeatmap = useMemo(() => buildYearWeeklyHeatmap(viewYear, filteredDailyStatusMap), [viewYear, filteredDailyStatusMap]);

  const monthlyCategoryStats = useMemo(() => {
    const monthMaps = Array.from({ length: 12 }, () => ({}));
    const addPoints = (date, category, points) => {
      if (!date || date < periodAnalysis.startKey || date > periodAnalysis.endKey || !date.startsWith(String(viewYear))) return;
      const month = Number(date.slice(5, 7)) - 1;
      if (month < 0 || month > 11 || !points) return;
      monthMaps[month][category] = (monthMaps[month][category] || 0) + points;
    };
    active.forEach((habit, index) => {
      const category = categoryOf(habit);
      allStats[index].daily.forEach((day) => addPoints(day.date, category, day.delta));
    });
    (tasks || []).forEach((task) => { if (task.completed) addPoints(task.completedAt, categoryOf(task), task.points); });
    (goals || []).forEach((goal) => { if (goal.achieved) addPoints(goal.achievedAt, categoryOf(goal), goal.points); });
    return monthMaps.map((map) => Object.entries(map).map(([category, points]) => ({ category, points })).sort((a, b) => b.points - a.points));
  }, [active, allStats, tasks, goals, viewYear, periodAnalysis.startKey, periodAnalysis.endKey]);
  const [hoveredMonth, setHoveredMonth] = useState(null);

  const achievedGoals = (goals || []).filter((g) => g.achieved && g.achievedAt >= periodAnalysis.startKey && g.achievedAt <= periodAnalysis.endKey).sort((a, b) => (b.achievedAt || "").localeCompare(a.achievedAt || ""));
  const openGoalsCount = (goals || []).filter((g) => !g.achieved).length;
  const goalPointsSum = achievedGoals.reduce((s, g) => s + g.points, 0);
  const filteredYearData = useMemo(() => {
    const months = yearData.months.map((month) => {
      const prefix = `${viewYear}-${pad(month.month + 1)}`;
      const points = Object.entries(dailyPointsMap).filter(([key]) => key.startsWith(prefix) && key >= periodAnalysis.startKey && key <= periodAnalysis.endKey).reduce((sum, [, value]) => sum + value, 0);
      return { ...month, points };
    });
    return { months, yearTotal: months.reduce((sum, month) => sum + month.points, 0) };
  }, [yearData, viewYear, dailyPointsMap, periodAnalysis.startKey, periodAnalysis.endKey]);
  const filteredMaxAbsMonthPoints = Math.max(1, ...filteredYearData.months.map((month) => Math.abs(month.points)));
  const periodAchievements = achievements.filter((achievement) => achievement.date >= periodAnalysis.startKey && achievement.date <= periodAnalysis.endKey);
  const periodPointsSeries = useMemo(() => {
    let running = 0;
    const series = Object.keys(dailyPointsMap).sort()
      .filter((key) => key >= periodAnalysis.startKey && key <= periodAnalysis.endKey)
      .map((key) => {
        running += dailyPointsMap[key];
        return { key, date: shortDate(key), points: dailyPointsMap[key], total: running };
      });
    if (series.length <= 500) return series;
    const step = Math.ceil(series.length / 500);
    const reduced = series.filter((_, index) => index % step === 0);
    const last = series[series.length - 1];
    if (reduced[reduced.length - 1]?.key !== last.key) reduced.push(last);
    return reduced;
  }, [dailyPointsMap, periodAnalysis.startKey, periodAnalysis.endKey]);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
        <div>
          <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Fortschritt</h1>
          <div style={{ fontSize: 12.5, color: COLORS.textFaint, marginTop: 4 }}>Was wird besser, wo stagnierst du und welche Lebensbereiche brauchen Aufmerksamkeit?</div>
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {[{ value: "thisWeek", label: "Diese Woche" }, { value: "lastWeek", label: "Letzte Woche" }, { value: 30, label: "30 Tage" }, { value: 90, label: "90 Tage" }, { value: 365, label: "1 Jahr" }, { value: "all", label: "Gesamt" }].map((option) => (
            <button key={option.value} onClick={() => setRangeDays(option.value)} style={{
              ...ghostBtn, padding: "7px 10px", fontSize: 11.5,
              color: rangeDays === option.value ? COLORS.ember2 : COLORS.textMuted,
              borderColor: rangeDays === option.value ? COLORS.ember2 : COLORS.border,
              background: rangeDays === option.value ? COLORS.ember2 + "14" : "transparent",
            }}>{option.label}</button>
          ))}
        </div>
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <SectionLabel>Deine Entwicklung im gewählten Zeitraum</SectionLabel>
        <div style={{ fontSize: 12, color: COLORS.textFaint, marginTop: -4, marginBottom: 14 }}>
          {shortDate(periodAnalysis.startKey)} bis heute{periodAnalysis.previous ? " · Veränderung gegenüber dem gleich langen Zeitraum davor" : ""}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(2, 1fr)" : "repeat(4, 1fr)", gap: 10, marginBottom: 16 }}>
          <StatCard label="Erfüllungsquote" value={periodAnalysis.current.rate ?? "–"} suffix={periodAnalysis.current.rate === null ? "" : "%"} accent={COLORS.mint} />
          <StatCard label="Trend zur Vorperiode" value={periodAnalysis.rateDelta === null ? "–" : `${periodAnalysis.rateDelta > 0 ? "+" : ""}${periodAnalysis.rateDelta}`} suffix={periodAnalysis.rateDelta === null ? "" : " %-Pkt."} accent={periodAnalysis.rateDelta === null ? COLORS.textFaint : periodAnalysis.rateDelta >= 0 ? COLORS.mint : COLORS.coral} />
          <StatCard label="Aktive Tage" value={periodAnalysis.current.activeDays} suffix={`/ ${periodAnalysis.calendarDays}`} accent={COLORS.violet} />
          <StatCard label="Punkte im Zeitraum" value={periodAnalysis.current.points >= 0 ? `+${periodAnalysis.current.points}` : periodAnalysis.current.points} suffix="" accent={periodAnalysis.current.points >= 0 ? COLORS.ember2 : COLORS.coral} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(2, 1fr)" : "repeat(5, 1fr)", gap: 8 }}>
          <div style={{ padding: "9px 11px", background: COLORS.bgSoft, borderRadius: 9, fontSize: 12, color: COLORS.textMuted }}><strong style={{ color: COLORS.mint }}>{periodAnalysis.current.success}</strong> erfüllt</div>
          <div style={{ padding: "9px 11px", background: COLORS.bgSoft, borderRadius: 9, fontSize: 12, color: COLORS.textMuted }}><strong style={{ color: COLORS.coral }}>{periodAnalysis.current.fail}</strong> nicht erfüllt</div>
          <div style={{ padding: "9px 11px", background: COLORS.bgSoft, borderRadius: 9, fontSize: 12, color: COLORS.textMuted }}><strong style={{ color: COLORS.violet }}>{periodAnalysis.completedTasks}</strong> Tasks erledigt</div>
          <div style={{ padding: "9px 11px", background: COLORS.bgSoft, borderRadius: 9, fontSize: 12, color: COLORS.textMuted }}><strong style={{ color: COLORS.ember2 }}>{periodAnalysis.achievedGoals}</strong> Ziele erreicht</div>
          <div style={{ padding: "9px 11px", background: COLORS.bgSoft, borderRadius: 9, fontSize: 12, color: COLORS.textMuted }}><strong style={{ color: COLORS.mint }}>{periodAnalysis.meetings}</strong> Treffen</div>
        </div>
      </div>

      {periodAnalysis.categories.length > 0 && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
          <SectionLabel>Lebensbereiche im Vergleich</SectionLabel>

          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

              <div key={category.category}>

                  <span style={{ fontFamily: "JetBrains Mono, monospace", color: COLORS.textMuted }}>{category.rate}% · {category.tracked} Einträge</span>
                </div>
                <div style={{ height: 8, background: COLORS.bgSoft, borderRadius: 5, overflow: "hidden" }}><div style={{ height: "100%", width: `${category.rate}%`, background: categoryColor(category.category), borderRadius: 5 }} /></div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <SectionLabel>Soziale Kontakte und Treffen</SectionLabel>

        </p>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(2, 1fr)" : "repeat(3, 1fr)", gap: 10, marginBottom: 16 }}>

          <StatCard label="Getroffene Personen" value={meetingAnalysis.rows.length} suffix="" accent={COLORS.violet} />
          <StatCard
            label="Zur Vorperiode"
            value={meetingAnalysis.delta === null ? "–" : `${meetingAnalysis.delta > 0 ? "+" : ""}${meetingAnalysis.delta}`}
            suffix=" Treffen"
            accent={meetingAnalysis.delta === null ? COLORS.textFaint : meetingAnalysis.delta >= 0 ? COLORS.mint : COLORS.coral}
          />
        </div>

        {meetingAnalysis.currentCount === 0 ? (
          <div style={{ fontSize: 12.5, color: COLORS.textFaint, padding: "14px", background: COLORS.bgSoft, borderRadius: 10 }}>
            In diesem Zeitraum sind noch keine Treffen eingetragen.
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "minmax(0, 1.35fr) minmax(240px, .65fr)", gap: 18 }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Zeitverlauf</div>
              <ResponsiveContainer width="100%" height={210}>
                <BarChart data={meetingAnalysis.buckets} margin={{ top: 8, right: 4, left: -25, bottom: 0 }}>
                  <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
                  <XAxis dataKey="label" tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} minTickGap={18} />
                  <YAxis allowDecimals={false} tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} />
                  <Tooltip
                    contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }}
                    labelFormatter={(_, payload) => payload?.[0]?.payload?.fullLabel || ""}
                    formatter={(value) => [value, "Treffen"]}

                </BarChart>
              </ResponsiveContainer>
            </div>

            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Nach Person</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {meetingAnalysis.rows.map((row) => {
                  const maxCount = meetingAnalysis.rows[0]?.count || 1;
                  return (
                    <div key={row.person.id}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginBottom: 4 }}>
                        <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600, minWidth: 0 }}>
                          <Users size={12} style={{ color: row.person.color || COLORS.violet, flexShrink: 0 }} />
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{row.person.name}</span>
                        </span>
                        <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 11.5, color: COLORS.textMuted, flexShrink: 0 }}>{row.count}×</span>
                      </div>
                      <div style={{ height: 6, background: COLORS.bgSoft, borderRadius: 4, overflow: "hidden" }}>
                        <div style={{ height: "100%", width: `${Math.max(4, row.count / maxCount * 100)}%`, background: row.person.color || COLORS.violet, borderRadius: 4 }} />
                      </div>
                      {row.lastDate && <div style={{ fontSize: 10.5, color: COLORS.textFaint, marginTop: 3 }}>Zuletzt: {shortDate(row.lastDate)}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}
      </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
        <SectionLabel>Punkteentwicklung im gewählten Zeitraum</SectionLabel>
        <p style={{ fontSize: 12, color: COLORS.textFaint, marginTop: -4, marginBottom: 12 }}>
          Balken = Punkte des jeweiligen Tages, Linie = Punktesumme im gewählten Zeitraum.
        </p>
        <ResponsiveContainer width="100%" height={240}>
          <ComposedChart data={periodPointsSeries}>
            <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
            <XAxis dataKey="date" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} minTickGap={30} />
            <YAxis tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={false} tickLine={false} />
            <Tooltip
              contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }}
              labelStyle={{ color: COLORS.text }}
              formatter={(value, name) => [`${value >= 0 ? "+" : ""}${value}`, name === "points" ? "Tagespunkte" : "Summe"]}
            />
            <Bar dataKey="points" radius={[4, 4, 0, 0]} maxBarSize={28}>
              {periodPointsSeries.map((d) => <Cell key={d.key} fill={d.points >= 0 ? COLORS.ember2 : COLORS.coral} />)}
            </Bar>
            <Line type="monotone" dataKey="total" stroke={COLORS.violet} strokeWidth={2.5} dot={false} />

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>

        <p style={{ fontSize: 12, color: COLORS.textFaint, marginTop: -4, marginBottom: 12 }}>
