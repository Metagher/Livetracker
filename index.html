function MeetingHistory({ person, onAddMeeting, onDeleteMeeting }) {
  const [confirmIndex, setConfirmIndex] = useState(null);
  const [meetingDate, setMeetingDate] = useState(todayKey());
  const meetings = (person.meetings || [])
    .map((date, index) => ({ date, index }))
    .sort((a, b) => b.date.localeCompare(a.date) || b.index - a.index);

  // Die letzten zwölf Kalendermonate werden immer gezeigt, auch Monate ohne
  // Treffen. So ist eine Entwicklung statt nur einer Liste erkennbar.
  const monthlyData = useMemo(() => {
    const now = new Date();
    return Array.from({ length: 12 }, (_, offset) => {
      const date = new Date(now.getFullYear(), now.getMonth() - 11 + offset, 1);
      const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      return {
        key,
        label: date.toLocaleDateString("de-DE", { month: "short" }),
        fullLabel: date.toLocaleDateString("de-DE", { month: "long", year: "numeric" }),
        treffen: meetings.filter((meeting) => meeting.date.startsWith(key)).length,
      };
    });
  }, [person.meetings]);

  return (
    <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, padding: "16px", cursor: "default" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
        Treffen im Zeitverlauf
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <input type="date" max={todayKey()} value={meetingDate} onChange={(e) => setMeetingDate(e.target.value)} style={{ ...inputStyle, width: "auto", flex: "1 1 170px", marginBottom: 0 }} />
        <button disabled={!meetingDate || meetingDate > todayKey()} onClick={() => onAddMeeting(meetingDate)} style={{ ...primaryBtn, opacity: !meetingDate || meetingDate > todayKey() ? 0.5 : 1 }}>Treffen eintragen</button>
      </div>
      {meetings.length === 0 ? (
        <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch keine Treffen eingetragen.</div>
      ) : (
        <>
          <div style={{ width: "100%", height: 180, marginBottom: 14 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={monthlyData} margin={{ top: 8, right: 4, left: -26, bottom: 0 }}>
                <CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} />
                <XAxis dataKey="label" stroke={COLORS.textFaint} fontSize={10} tickLine={false} axisLine={false} />
                <YAxis allowDecimals={false} stroke={COLORS.textFaint} fontSize={10} tickLine={false} axisLine={false} />
                <Tooltip
                  contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }}
                  labelFormatter={(_, payload) => payload?.[0]?.payload?.fullLabel || ""}
                  formatter={(value) => [value, value === 1 ? "Treffen" : "Treffen"]}
                />
                <Bar dataKey="treffen" fill={person.color || COLORS.mint} radius={[5, 5, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {meetings.map((meeting) => (
              <div key={`${meeting.date}-${meeting.index}`} style={{
                display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
                padding: "8px 10px", borderRadius: 9, background: COLORS.bgSoft,
              }}>
                <span style={{ fontSize: 12.5, color: COLORS.textMuted }}>{longDate(meeting.date)}</span>
                {confirmIndex === meeting.index ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <button onClick={() => setConfirmIndex(null)} style={{ ...ghostBtn, padding: "5px 8px", fontSize: 11 }}>Abbrechen</button>
                    <button onClick={() => { onDeleteMeeting(meeting.index); setConfirmIndex(null); }} style={{
                      ...ghostBtn, padding: "5px 8px", fontSize: 11, color: COLORS.coral, borderColor: COLORS.coral,
                    }}>Löschen</button>
                  </div>
                ) : (
                  <IconButton onClick={() => setConfirmIndex(meeting.index)} title="Treffen löschen" danger><Trash2 size={13} /></IconButton>
                )}
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   @section PERSON-NETWORK-VIEW — Kreisförmige Verbindungs-Visualisierung aller Personen
   Kein generationsweises Stammbaum-Layout (das bräuchte eine eigene Baum-Layout-
   Logik), sondern ein Beziehungsnetz: alle Personen kreisförmig angeordnet,
   Verbindungen als beschriftete Linien dazwischen. Klick auf eine Person öffnet
   direkt deren Bearbeiten-Modal.
   ============================================================ */
function LegacyPersonNetworkView({ persons, title = "Verbindungen", onClose, onEditPerson }) {
  const viewport = useVisualViewport();
  const [viewMode, setViewMode] = useState("all");
  // Alle Verbindungspaare auf einmal (dedupliziert, da jede Verbindung bei
  // beiden Personen gespeichert ist) - Alternative zum Fokus-Baum, der immer
  // nur die Familie einer Person zeigt.
  const allEdges = useMemo(() => {
    const seen = new Set();
    const edges = [];
    persons.forEach((p) => (p.relationships || []).forEach((r) => {
      const key = [p.id, r.personId].sort().join("|");
      if (seen.has(key)) return;
      const other = persons.find((x) => x.id === r.personId);
      if (!other) return;
      seen.add(key);
      edges.push({ a: p, b: other, label: relationshipLabel(r.type) });
    }));
    return edges.sort((x, y) => x.a.name.localeCompare(y.a.name, "de"));
  }, [persons]);
  const [focusId, setFocusId] = useState(() => persons.find((person) => (person.relationships || []).length > 0)?.id || persons[0]?.id || "");
  useEffect(() => { if (!persons.some((person) => person.id === focusId)) setFocusId(persons[0]?.id || ""); }, [persons, focusId]);
  const tree = useMemo(() => {
    const focus = persons.find((person) => person.id === focusId);
    const findPerson = (id) => persons.find((person) => person.id === id);
    const related = (person, types) => (person?.relationships || []).filter((relationship) => types.includes(relationship.type)).map((relationship) => findPerson(relationship.personId)).filter(Boolean);
    if (!focus) return null;
    // Der gespeicherte Typ beschreibt die Rolle der Fokusperson gegenüber dem
    // Ziel: `child` bedeutet also, dass das Ziel ein Elternteil der Fokusperson ist.
    const parents = related(focus, ["child"]);
    const children = related(focus, ["parent"]);
    const grandparents = [...new Map(parents.flatMap((parent) => related(parent, ["child"])).map((person) => [person.id, person])).values()];
    const grandchildren = [...new Map(children.flatMap((child) => related(child, ["parent"])).map((person) => [person.id, person])).values()];
    return { focus, grandparents, parents, partners: related(focus, ["partner"]), siblings: related(focus, ["sibling"]), children, grandchildren };
  }, [persons, focusId]);

  const PersonNode = ({ person, central = false }) => <button onClick={() => setFocusId(person.id)} onDoubleClick={() => onEditPerson(person)} title="Antippen: fokussieren · Doppeltippen: bearbeiten" style={{
    minWidth: central ? 150 : 120, maxWidth: 180, padding: central ? "12px 14px" : "9px 11px", borderRadius: 12,
    border: `2px solid ${central ? person.color : person.color + "88"}`, background: central ? person.color + "25" : COLORS.surface,
    color: COLORS.text, cursor: "pointer", boxShadow: central ? `0 0 0 3px ${person.color}18` : "none",
  }}><span style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 7 }}><span style={{ width: 24, height: 24, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center", background: person.color + "33", color: person.color, fontWeight: 700, fontSize: 11 }}>{(person.name || "?").trim().charAt(0).toUpperCase()}</span><strong style={{ fontSize: 12.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{person.name}</strong></span></button>;
  const Generation = ({ label, people }) => people.length > 0 && <div style={{ textAlign: "center" }}><div style={{ fontSize: 9.5, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 7 }}>{label}</div><div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8 }}>{people.map((person) => <PersonNode key={person.id} person={person} />)}</div></div>;
  const connector = <div style={{ width: 2, height: 22, background: COLORS.border, margin: "5px auto", borderRadius: 2 }} />;

  return (
    <div style={{ ...overlayStyle, height: viewport.height, top: viewport.top }} onClick={onClose}>
      <div style={{ ...modalStyle, maxWidth: 760 }} onClick={(e) => e.stopPropagation()}>
        <div style={modalBodyStyle}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
            <div>
              <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 600, margin: 0 }}>{title}</h2>
              <p style={{ fontSize: 12, color: COLORS.textFaint, margin: "4px 0 0" }}>
                {viewMode === "all" ? "Alle Verbindungen auf einen Blick." : "Familienbaum einer einzelnen Fokusperson."}
              </p>
            </div>
            <IconButton onClick={onClose}><X size={16} /></IconButton>
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <ToggleChip active={viewMode === "all"} onClick={() => setViewMode("all")}>Alle Verbindungen</ToggleChip>
            <ToggleChip active={viewMode === "tree"} onClick={() => setViewMode("tree")}>Familienbaum</ToggleChip>
          </div>

          {viewMode === "all" ? (
            allEdges.length === 0 ? (
              <div style={{ color: COLORS.textFaint, textAlign: "center", padding: 20 }}>Noch keine Verbindungen eingetragen.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {allEdges.map((edge, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: COLORS.bgSoft, borderRadius: 10, flexWrap: "wrap" }}>
                    <PersonNode person={edge.a} />
                    <span style={{ fontSize: 11.5, color: COLORS.textMuted, flexShrink: 0 }}>{edge.label}</span>
                    <PersonNode person={edge.b} />
                  </div>
                ))}
              </div>
            )
          ) : (
            <>
              <div style={{ marginBottom: 16 }}><label style={labelStyle}>Fokusperson</label><select value={focusId} onChange={(e) => setFocusId(e.target.value)} style={{ ...inputStyle, marginBottom: 0, cursor: "pointer" }}>{persons.map((person) => <option key={person.id} value={person.id}>{person.name}</option>)}</select></div>
              {!tree ? <div style={{ color: COLORS.textFaint, textAlign: "center", padding: 20 }}>Keine Person verfügbar.</div> : <div style={{ overflowX: "auto", padding: "6px 0 12px" }}><div style={{ minWidth: 330, display: "flex", flexDirection: "column", alignItems: "stretch" }}>
                <Generation label="Großeltern" people={tree.grandparents} />
                {tree.grandparents.length > 0 && connector}
                <Generation label="Eltern" people={tree.parents} />
                {tree.parents.length > 0 && connector}
                <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "center", flexWrap: "wrap", gap: 18 }}>
                  {tree.siblings.length > 0 && <Generation label="Geschwister" people={tree.siblings} />}
                  <div style={{ textAlign: "center" }}><div style={{ fontSize: 9.5, fontWeight: 700, color: COLORS.ember2, textTransform: "uppercase", marginBottom: 7 }}>Fokus</div><PersonNode person={tree.focus} central /></div>
                  {tree.partners.length > 0 && <Generation label="Partner/in" people={tree.partners} />}
                </div>
                {tree.children.length > 0 && connector}
                <Generation label="Kinder" people={tree.children} />
                {tree.grandchildren.length > 0 && connector}
                <Generation label="Enkel" people={tree.grandchildren} />
                {tree.grandparents.length + tree.parents.length + tree.partners.length + tree.siblings.length + tree.children.length + tree.grandchildren.length === 0 && <div style={{ fontSize: 12.5, color: COLORS.textFaint, textAlign: "center", marginTop: 16 }}>Für diese Person sind noch keine familiären Verbindungen eingetragen.</div>}
              </div></div>}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Fokusbasierter Explorer: kürzeste Beziehungswege werden in lesbaren Ebenen
   statt als überlagerte Linien dargestellt. */
function PersonNetworkView({ persons, title = "Verbindungen", onClose, onEditPerson }) {
  const viewport = useVisualViewport();
  const isMobile = useIsMobile();
  const [mode, setMode] = useState("explore");
  const [focusId, setFocusId] = useState(() => persons.find((person) => (person.relationships || []).length)?.id || persons[0]?.id || "");
  const [depth, setDepth] = useState(2);
  const [search, setSearch] = useState("");
  const [networkZoom, setNetworkZoom] = useState(() => window.innerWidth <= 760 ? 0.9 : 1);
  const networkScrollRef = useRef(null);
  const byId = useMemo(() => new Map(persons.map((person) => [person.id, person])), [persons]);
  const relationshipPriority = (type) => {
    if (["partner", "parent", "child"].includes(type)) return 0;
    if (["sibling", "grandparent", "grandchild"].includes(type)) return 1;
    if (["auntUncle", "nibling", "cousin"].includes(type)) return 2;
    return 3;
  };
  const relationshipTier = (type) => ["direkt", "nah", "erweitert", "sonstig"][relationshipPriority(type)];
  const relationshipColor = (typeOrPriority) => {
    const priority = typeof typeOrPriority === "number" ? typeOrPriority : relationshipPriority(typeOrPriority);
    return [COLORS.ember2, COLORS.violet, COLORS.mint, COLORS.textFaint][priority] || COLORS.textFaint;
  };
  const generationDelta = (type) => {
    if (type === "child") return -1;
    if (type === "grandchild") return -2;
    if (type === "nibling") return -1;
    if (type === "parent") return 1;
    if (type === "grandparent") return 2;
    if (type === "auntUncle") return 1;
    return 0;
  };
  useEffect(() => { if (!byId.has(focusId)) setFocusId(persons[0]?.id || ""); }, [byId, focusId, persons]);

  const edges = useMemo(() => {
    const seen = new Set();
    return persons.flatMap((person) => (person.relationships || []).flatMap((relationship) => {
      const other = byId.get(relationship.personId);
      const key = [person.id, relationship.personId].sort().join("|");
      if (!other || seen.has(key)) return [];
      seen.add(key);
      return [{ source: person, target: other, type: relationship.type }];
    })).sort((a, b) => a.source.name.localeCompare(b.source.name, "de") || a.target.name.localeCompare(b.target.name, "de"));
  }, [persons, byId]);

  const network = useMemo(() => {
    const focus = byId.get(focusId);
    if (!focus) return { focus: null, layers: [], hasMore: false };
    const visited = new Set([focus.id]);
    const queue = [{ person: focus, level: 0, generation: 0, path: [focus.name] }];
    const layers = [];
    let hasMore = false;
    while (queue.length) {
      const current = queue.shift();
      const nextRelationships = (current.person.relationships || [])
        .filter((relationship) => byId.has(relationship.personId) && !visited.has(relationship.personId))
        .sort((a, b) => relationshipPriority(a.type) - relationshipPriority(b.type) || (byId.get(a.personId)?.name || "").localeCompare(byId.get(b.personId)?.name || "", "de"));
      if (current.level >= depth) { if (nextRelationships.length) hasMore = true; continue; }
      nextRelationships.forEach((relationship) => {
        const person = byId.get(relationship.personId);
        visited.add(person.id);
        const item = { person, via: current.person, type: relationship.type, priority: relationshipPriority(relationship.type), level: current.level + 1, generation: current.generation + generationDelta(relationship.type), path: [...current.path, person.name] };
        if (!layers[item.level - 1]) layers[item.level - 1] = [];
        layers[item.level - 1].push(item);
        queue.push(item);
      });
    }
    layers.forEach((layer) => layer.sort((a, b) => a.priority - b.priority || a.via.name.localeCompare(b.via.name, "de") || a.person.name.localeCompare(b.person.name, "de")));
    return { focus, layers, hasMore };
  }, [byId, focusId, depth]);

  const radialNetwork = useMemo(() => {
    if (!network.focus) return { size: 520, positions: new Map(), treeEdges: [], displayEdges: [], radii: [] };
    const radii = [];
    let previousRadius = 0;
    network.layers.forEach((layer, index) => {
      const count = layer?.length || 0;
      const circumferenceRadius = count > 1 ? (count * 82) / (2 * Math.PI) : 0;
      const radius = Math.max((index + 1) * 112, previousRadius + 92, circumferenceRadius + 35);
      radii.push(radius);
      previousRadius = radius;
    });
    const outerRadius = Math.max(160, radii[radii.length - 1] || 0);
    const size = Math.max(520, Math.ceil((outerRadius + 95) * 2));
    const center = size / 2;
    const positions = new Map([[network.focus.id, { x: center, y: center, person: network.focus, level: 0 }]]);
    const treeEdges = [];
    network.layers.forEach((layer, levelIndex) => {
      const count = layer?.length || 0;
      // Ab der zweiten Ebene liegen Personen desselben Astes nebeneinander.
      // Die Reihenfolge der Äste folgt der Position ihrer Bezugsperson auf dem
      // vorherigen Ring; innerhalb eines Astes steht direkte Familie zuerst.
      const orderedLayer = [...(layer || [])].sort((a, b) => {
        const aVia = positions.get(a.via.id);
        const bVia = positions.get(b.via.id);
        const aAngle = aVia ? (Math.atan2(aVia.y - center, aVia.x - center) + Math.PI * 2.5) % (Math.PI * 2) : 0;
        const bAngle = bVia ? (Math.atan2(bVia.y - center, bVia.x - center) + Math.PI * 2.5) % (Math.PI * 2) : 0;
        return aAngle - bAngle || a.priority - b.priority || a.person.name.localeCompare(b.person.name, "de");
      });
      orderedLayer.forEach((item, itemIndex) => {
        const angleOffset = -Math.PI / 2;
        const angle = angleOffset + (itemIndex * Math.PI * 2) / Math.max(1, count);
        const position = {
          x: center + Math.cos(angle) * radii[levelIndex],
          y: center + Math.sin(angle) * radii[levelIndex],
          person: item.person,
          level: levelIndex + 1,
          priority: item.priority,
        };
        positions.set(item.person.id, position);
        treeEdges.push({ fromId: item.via.id, toId: item.person.id, type: item.type });
      });
    });
    const treeKeys = new Set(treeEdges.map((edge) => [edge.fromId, edge.toId].sort().join("|")));
    const displayEdges = edges
      .filter((edge) => positions.has(edge.source.id) && positions.has(edge.target.id))
      .map((edge) => ({ ...edge, priority: relationshipPriority(edge.type), isTreeEdge: treeKeys.has([edge.source.id, edge.target.id].sort().join("|")) }))
      .sort((a, b) => b.priority - a.priority || Number(a.isTreeEdge) - Number(b.isTreeEdge));
    return { size, center, positions, treeEdges, displayEdges, radii };
  }, [network, edges]);

  const familyTree = useMemo(() => {
    if (!network.focus) return { width: 560, height: 420, positions: new Map(), displayEdges: [], rows: [], focusX: 280, focusY: 210 };
    const items = [
      { person: network.focus, generation: 0, level: 0, priority: -1, type: null, via: null },
      ...network.layers.flatMap((layer) => layer || []),
    ];
    const grouped = new Map();
    items.forEach((item) => {
      if (!grouped.has(item.generation)) grouped.set(item.generation, []);
      grouped.get(item.generation).push(item);
    });
    const generations = [...grouped.keys()].sort((a, b) => a - b);
    const maxRowCount = Math.max(1, ...generations.map((generation) => grouped.get(generation).length));
    const nodeSpacing = 148;
    const rowSpacing = 132;
    const width = Math.max(560, maxRowCount * nodeSpacing + 150);
    const height = Math.max(420, (generations.length - 1) * rowSpacing + 120);
    const centerX = width / 2;
    const positions = new Map();
    const rows = [];

    generations.forEach((generation, rowIndex) => {
      const y = 60 + rowIndex * rowSpacing;
      const rowItems = [...grouped.get(generation)].sort((a, b) => {
        if (a.person.id === network.focus.id) return 0;
        if (b.person.id === network.focus.id) return 0;
        return a.priority - b.priority || (a.via?.name || "").localeCompare(b.via?.name || "", "de") || a.person.name.localeCompare(b.person.name, "de");
      });
      const focusItem = rowItems.find((item) => item.person.id === network.focus.id);
      const otherItems = rowItems.filter((item) => item.person.id !== network.focus.id);
      if (focusItem) positions.set(focusItem.person.id, { x: centerX, y, ...focusItem });
      const leftItems = [];
      const rightItems = [];
      otherItems.forEach((item, index) => {
        const prefersRight = item.type === "partner" || item.type === "friend";
        const prefersLeft = item.type === "sibling" || item.type === "cousin";
        if (prefersRight && rightItems.length <= leftItems.length) rightItems.push(item);
        else if (prefersLeft && leftItems.length <= rightItems.length) leftItems.push(item);
        else (leftItems.length <= rightItems.length ? leftItems : rightItems).push(item);
      });
      if (!focusItem) {
        rowItems.forEach((item, index) => positions.set(item.person.id, { x: centerX + (index - (rowItems.length - 1) / 2) * nodeSpacing, y, ...item }));
      } else {
        leftItems.forEach((item, index) => positions.set(item.person.id, { x: centerX - (index + 1) * nodeSpacing, y, ...item }));
        rightItems.forEach((item, index) => positions.set(item.person.id, { x: centerX + (index + 1) * nodeSpacing, y, ...item }));
      }
      rows.push({ generation, y, count: rowItems.length });
    });

    const displayEdges = edges
      .filter((edge) => positions.has(edge.source.id) && positions.has(edge.target.id))
      .map((edge) => ({ ...edge, priority: relationshipPriority(edge.type) }))
      .sort((a, b) => b.priority - a.priority);
    const focusPosition = positions.get(network.focus.id) || { x: centerX, y: height / 2 };
    return { width, height, positions, displayEdges, rows, focusX: focusPosition.x, focusY: focusPosition.y };
  }, [network, edges]);

  // Nach Fokus-, Tiefen- oder Zoomänderungen liegt die Fokusperson auch auf
  // kleinen Displays wieder in der Mitte des sichtbaren Ausschnitts.
  useEffect(() => {
    const container = networkScrollRef.current;
    if (!container || mode !== "explore") return;
    const frame = requestAnimationFrame(() => {
      container.scrollLeft = Math.max(0, familyTree.focusX * networkZoom - container.clientWidth / 2);
      container.scrollTop = Math.max(0, familyTree.focusY * networkZoom - container.clientHeight / 2);
    });
    return () => cancelAnimationFrame(frame);
  }, [focusId, depth, networkZoom, mode, familyTree.width, familyTree.height]);

  const filteredEdges = useMemo(() => {
    const query = search.trim().toLocaleLowerCase("de");
    return query ? edges.filter((edge) => `${edge.source.name} ${edge.target.name} ${relationshipLabel(edge.type)}`.toLocaleLowerCase("de").includes(query)) : edges;
  }, [edges, search]);

  const Avatar = ({ person, size = 30, connectionType = null }) => {
    const color = connectionType === null ? COLORS.textMuted : relationshipColor(connectionType);
    return <span style={{ width: size, height: size, borderRadius: "50%", flexShrink: 0, display: "inline-flex", alignItems: "center", justifyContent: "center", background: color + "25", color, fontWeight: 700, fontSize: 11 }}>{(person.name || "?").trim().charAt(0).toUpperCase()}</span>;
  };
  const PersonCard = ({ item }) => <div style={{ minWidth: 0, padding: "11px 12px", borderRadius: 11, background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}` }}>
    <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
      <Avatar person={item.person} connectionType={item.type} />
      <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.person.name}</div><div style={{ fontSize: 10.5, color: COLORS.textFaint, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>über {item.via.name} · {relationshipLabel(item.type)}</div></div>
      <IconButton onClick={() => onEditPerson(item.person)} title="Person bearbeiten"><Pencil size={13} /></IconButton>
    </div>
    <button onClick={() => setFocusId(item.person.id)} title={item.path.join(" → ")} style={{ width: "100%", marginTop: 9, padding: "6px 8px", borderRadius: 7, border: `1px solid ${COLORS.borderSoft}`, background: COLORS.bgSoft, color: COLORS.textMuted, cursor: "pointer", fontSize: 10.5, textAlign: "left", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.path.join(" → ")} <ChevronRight size={11} style={{ verticalAlign: "-2px" }} /></button>
  </div>;

  return <div style={{ ...overlayStyle, height: viewport.height, top: viewport.top }} onClick={onClose}>
    <div style={{ ...modalStyle, maxWidth: 820 }} onClick={(event) => event.stopPropagation()}><div style={{ ...modalBodyStyle, padding: isMobile ? 14 : 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 16 }}><div><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 600, margin: 0 }}>{title}</h2><p style={{ fontSize: 12, color: COLORS.textFaint, margin: "4px 0 0" }}>Familienbeziehungen nach Generationen und Ästen.</p></div><IconButton onClick={onClose}><X size={16} /></IconButton></div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}><ToggleChip active={mode === "explore"} onClick={() => setMode("explore")}>Stammbaum</ToggleChip><ToggleChip active={mode === "list"} onClick={() => setMode("list")}>Alle Beziehungen</ToggleChip></div>

      {mode === "explore" ? <>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 10, flexWrap: "wrap", marginBottom: 18 }}>
          <div style={{ flex: "1 1 220px" }}><label style={labelStyle}>Ausgangspunkt</label><select value={focusId} onChange={(event) => setFocusId(event.target.value)} style={{ ...inputStyle, marginBottom: 0, cursor: "pointer" }}>{[...persons].sort((a, b) => a.name.localeCompare(b.name, "de")).map((person) => <option key={person.id} value={person.id}>{person.name}</option>)}</select></div>
          <div><label style={labelStyle}>Ebenen</label><div style={{ display: "flex", gap: 5 }}>{[1, 2, 3, 4].map((value) => <ToggleChip key={value} active={depth === value} onClick={() => setDepth(value)}>{value}</ToggleChip>)}</div></div>
        </div>
        {!network.focus ? <div style={{ color: COLORS.textFaint, textAlign: "center", padding: 20 }}>Keine Person verfügbar.</div> : <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 11, padding: "13px 14px", borderRadius: 12, background: COLORS.textMuted + "12", border: `1px solid ${COLORS.border}` }}><Avatar person={network.focus} size={36} /><div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 10, fontWeight: 700, color: COLORS.textMuted, textTransform: "uppercase" }}>Ausgangspunkt</div><div style={{ fontSize: 15, fontWeight: 600, marginTop: 2 }}>{network.focus.name}</div></div><button onClick={() => onEditPerson(network.focus)} style={{ ...ghostBtn, padding: "7px 9px", fontSize: 11.5 }}><Pencil size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />Bearbeiten</button></div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", fontSize: 10.5, color: COLORS.textFaint }}>
            {network.layers.map((layer, index) => layer?.length > 0 && <span key={index} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style={{ width: 17, height: 17, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center", background: COLORS.surfaceRaised, color: COLORS.textMuted, fontFamily: "JetBrains Mono, monospace", fontSize: 8.5 }}>{index + 1}</span>{index === 0 ? "Direkt" : `Ebene ${index + 1}`} · {layer.length}</span>)}
            <span style={{ marginLeft: "auto" }}>Person antippen, um sie zu zentrieren</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", fontSize: 10.5, color: COLORS.textFaint, marginTop: -10 }}>
            <span style={{ color: COLORS.ember2 }}>━━ direkte Familie</span>
            <span style={{ color: COLORS.violet }}>━━ nahe Familie</span>
            <span style={{ color: COLORS.mint }}>┄┄ erweiterte Familie</span>
            <span style={{ opacity: 0.65 }}>┈┈ sonstige</span>
          </div>
          {network.layers.some((layer) => layer?.length) && <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: -7 }}>
              <span style={{ fontSize: 10.5, color: COLORS.textFaint }}>{isMobile ? "Mit einem Finger verschieben" : "Ansicht verschieben oder zoomen"}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <button onClick={() => setNetworkZoom((value) => Math.max(0.65, Math.round((value - 0.15) * 100) / 100))} disabled={networkZoom <= 0.65} aria-label="Netz verkleinern" style={{ ...ghostBtn, width: isMobile ? 36 : 31, height: isMobile ? 36 : 31, padding: 0, fontSize: 19, opacity: networkZoom <= 0.65 ? 0.45 : 1 }}>−</button>
                <button onClick={() => setNetworkZoom(isMobile ? 0.9 : 1)} style={{ ...ghostBtn, minWidth: 58, height: isMobile ? 36 : 31, padding: "0 8px", fontFamily: "JetBrains Mono, monospace", fontSize: 10.5 }}>{Math.round(networkZoom * 100)}%</button>
                <button onClick={() => setNetworkZoom((value) => Math.min(1.75, Math.round((value + 0.15) * 100) / 100))} disabled={networkZoom >= 1.75} aria-label="Netz vergrößern" style={{ ...ghostBtn, width: isMobile ? 36 : 31, height: isMobile ? 36 : 31, padding: 0, fontSize: 19, opacity: networkZoom >= 1.75 ? 0.45 : 1 }}>+</button>
              </div>
            </div>
            <div ref={networkScrollRef} style={{ width: "100%", overflow: "auto", WebkitOverflowScrolling: "touch", touchAction: "pan-x pan-y", overscrollBehavior: "contain", borderRadius: 12, background: COLORS.bgSoft, border: `1px solid ${COLORS.borderSoft}`, maxHeight: isMobile ? "56vh" : "min(62vh, 680px)" }}>
            <svg viewBox={`0 0 ${familyTree.width} ${familyTree.height}`} width={familyTree.width * networkZoom} height={familyTree.height * networkZoom} role="img" aria-label={`Stammbaum von ${network.focus.name}`} style={{ display: "block", maxWidth: "none", margin: "0 auto" }}>
              {familyTree.rows.map((row) => {
                const label = row.generation === 0 ? "Fokus-Ebene" : row.generation === -1 ? "Eltern-Ebene" : row.generation === -2 ? "Großeltern-Ebene" : row.generation === 1 ? "Kinder-Ebene" : row.generation === 2 ? "Enkel-Ebene" : row.generation < 0 ? `${Math.abs(row.generation)} Generationen darüber` : `${row.generation} Generationen darunter`;
                return <g key={row.generation}>
                  <line x1="18" y1={row.y} x2={familyTree.width - 18} y2={row.y} stroke={row.generation === 0 ? COLORS.border : COLORS.borderSoft} strokeWidth="1" strokeDasharray={row.generation === 0 ? undefined : "4 7"} />
                  <rect x="18" y={row.y - 53} width="118" height="20" rx="7" fill={COLORS.surfaceRaised} />
                  <text x="27" y={row.y - 39} fill={row.generation === 0 ? COLORS.textMuted : COLORS.textFaint} fontSize="10" fontWeight="600">{label}</text>
                </g>;
              })}
              {familyTree.displayEdges.map((edge) => {
                const from = familyTree.positions.get(edge.source.id);
                const to = familyTree.positions.get(edge.target.id);
                const stroke = relationshipColor(edge.priority);
                const strokeWidth = edge.priority === 0 ? 3.2 : edge.priority === 1 ? 2.2 : edge.priority === 2 ? 1.45 : 1;
                const dash = edge.priority === 2 ? "5 4" : edge.priority === 3 ? "2 5" : undefined;
                const sameGeneration = Math.abs(from.y - to.y) < 2;
                const middleY = (from.y + to.y) / 2;
                const path = sameGeneration
                  ? `M ${from.x} ${from.y} C ${from.x} ${from.y - 42}, ${to.x} ${to.y - 42}, ${to.x} ${to.y}`
                  : `M ${from.x} ${from.y} L ${from.x} ${middleY} L ${to.x} ${middleY} L ${to.x} ${to.y}`;
                return <path key={[edge.source.id, edge.target.id].sort().join("|")} d={path} fill="none" stroke={stroke} strokeWidth={strokeWidth} strokeDasharray={dash} opacity={edge.priority <= 1 ? 0.85 : 0.56} strokeLinejoin="round"><title>{edge.source.name} · {relationshipLabel(edge.type)} · {edge.target.name} ({relationshipTier(edge.type)})</title></path>;
              })}
              {[...familyTree.positions.values()].map((position) => {
                const central = position.person.id === network.focus.id;
                const nodeColor = central ? COLORS.textMuted : relationshipColor(position.priority);
                const displayName = position.person.name.length > 18 ? position.person.name.slice(0, 17) + "…" : position.person.name;
                return <g key={position.person.id} onClick={() => setFocusId(position.person.id)} style={{ cursor: "pointer" }}>
                  <title>{position.person.name}{central ? " · Mittelpunkt" : " · antippen zum Zentrieren"}</title>
                  <rect x={position.x - 58} y={position.y - 27} width="116" height="54" rx="11" fill={COLORS.surface} stroke={nodeColor} strokeWidth={central ? 3.5 : 2.2} />
                  <circle cx={position.x - 38} cy={position.y} r="14" fill={nodeColor + "2b"} />
                  <text x={position.x - 38} y={position.y + 4} textAnchor="middle" fill={nodeColor} fontSize="11.5" fontWeight="700">{(position.person.name || "?").trim().charAt(0).toUpperCase()}</text>
                  <text x={position.x - 17} y={position.y + 4} fill={COLORS.text} fontSize="10.5" fontWeight={central ? "700" : "600"}>{displayName}</text>
                </g>;
              })}
            </svg>
          </div></>}
          {network.layers.every((layer) => !layer?.length) && <div style={{ color: COLORS.textFaint, textAlign: "center", padding: 18 }}>Für diese Person sind noch keine Verbindungen eingetragen.</div>}
          {network.hasMore && <div style={{ fontSize: 11.5, color: COLORS.textFaint, textAlign: "center" }}>Weitere Personen sind verbunden. Erhöhe die Anzahl der Ebenen, um sie anzuzeigen.</div>}
        </div>}
      </> : <>
        <input value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Person oder Beziehung suchen …" style={{ ...inputStyle, marginBottom: 14 }} />
        {filteredEdges.length === 0 ? <div style={{ color: COLORS.textFaint, textAlign: "center", padding: 20 }}>{edges.length ? "Keine passende Verbindung gefunden." : "Noch keine Verbindungen eingetragen."}</div> : <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>{filteredEdges.map((edge) => <div key={[edge.source.id, edge.target.id].sort().join("|")} style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) auto minmax(0, 1fr)", alignItems: "center", gap: 8, padding: "10px 11px", background: COLORS.bgSoft, borderRadius: 10 }}><button onClick={() => { setFocusId(edge.source.id); setMode("explore"); }} style={{ border: "none", background: "transparent", color: COLORS.text, cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 7, minWidth: 0, textAlign: "left" }}><Avatar person={edge.source} size={26} connectionType={edge.type} /><span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 12.5, fontWeight: 600 }}>{edge.source.name}</span></button><span style={{ fontSize: 10.5, color: relationshipColor(edge.type), textAlign: "center" }}>{relationshipLabel(edge.type)}</span><button onClick={() => { setFocusId(edge.target.id); setMode("explore"); }} style={{ border: "none", background: "transparent", color: COLORS.text, cursor: "pointer", padding: 0, display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 7, minWidth: 0 }}><span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 12.5, fontWeight: 600 }}>{edge.target.name}</span><Avatar person={edge.target} size={26} connectionType={edge.type} /></button></div>)}</div>}
      </>}
    </div></div>
  </div>;
}

/* ============================================================
   @section NOTES-PAGE — Notizen in Ordnern, Rich-Text-Inhalt (wiederverwendet RichTextEditor)
   NOTIZEN
   ============================================================ */
const NO_FOLDER = "Ohne Ordner";

function formatNoteTimestamp(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const isToday = toKey(d) === todayKey();
  const datePart = isToday ? "Heute" : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  const timePart = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  return `${datePart}, ${timePart}`;
}

function NoteModal({ initial, folders, defaultFolder, onClose, onSave, onDelete }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [folder, setFolder] = useState(initial?.folder || (defaultFolder && defaultFolder !== NO_FOLDER ? defaultFolder : ""));
  const [confirmDelete, setConfirmDelete] = useState(false);
  const editorRef = useRef(null);
  const viewport = useVisualViewport();

  useEffect(() => {
    if (editorRef.current) editorRef.current.innerHTML = initial?.content || "";
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const canSave = title.trim().length > 0;

  const handleSave = () => {
    const html = editorRef.current ? editorRef.current.innerHTML : (initial?.content || "");
    const now = new Date().toISOString();
    onSave({
      id: initial?.id || `note_${Date.now()}`,
      title: title.trim(),
      folder: folder || "",
      content: html,
      createdAt: initial?.createdAt || now,
      updatedAt: now,
    });
  };

  return (
    <div style={{ ...overlayStyle, height: viewport.height, top: viewport.top }} onClick={onClose}>
      <div style={{ ...modalStyle, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
      <div style={modalBodyStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 600, margin: 0 }}>
            {initial ? "Notiz bearbeiten" : "Neue Notiz"}
          </h2>
          <IconButton onClick={onClose}><X size={16} /></IconButton>
        </div>

        <label style={labelStyle}>Titel</label>
        <input style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="z. B. Ideen, Einkaufsliste, Rezept …" autoFocus />

        <label style={labelStyle}>Ordner</label>
        <select value={folder} onChange={(e) => setFolder(e.target.value)} style={{ ...inputStyle, cursor: "pointer" }}>
          <option value="">{NO_FOLDER}</option>
          {(folders || []).map((f) => <option key={f} value={f}>{f}</option>)}
        </select>

        <label style={labelStyle}>Inhalt</label>
        <RichTextEditor editorRef={editorRef} />

        {initial?.updatedAt && (
          <div style={{ fontSize: 11, color: COLORS.textFaint, marginTop: 10 }}>Zuletzt geändert: {formatNoteTimestamp(initial.updatedAt)}</div>
        )}
      </div>

        <div style={modalFooterStyle}>
          {initial ? (
            <button onClick={() => (confirmDelete ? onDelete(initial.id) : setConfirmDelete(true))} style={{
              ...ghostBtn, color: COLORS.coral, display: "flex", alignItems: "center", gap: 6,
              border: `1px solid ${confirmDelete ? COLORS.coral : COLORS.border}`,
              background: confirmDelete ? COLORS.coral + "1f" : "transparent",
            }}>
              <Trash2 size={14} /> {confirmDelete ? "Wirklich löschen?" : "Löschen"}
            </button>
          ) : <span />}
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={onClose} style={ghostBtn}>Abbrechen</button>
            <button disabled={!canSave} onClick={handleSave} style={{ ...primaryBtn, opacity: canSave ? 1 : 0.5, cursor: canSave ? "pointer" : "not-allowed" }}>
              Speichern
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function NoteRow({ note, onEdit }) {
  const preview = stripHtml(note.content).slice(0, 140);
  return (
    <div onClick={onEdit} style={{
      display: "flex", flexDirection: "column", gap: 4, padding: "13px 15px", cursor: "pointer",
      background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 14,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <span style={{ fontWeight: 600, fontSize: 14.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{note.title}</span>
        <span style={{ fontSize: 10.5, color: COLORS.textFaint, flexShrink: 0 }}>{formatNoteTimestamp(note.updatedAt || note.createdAt)}</span>
      </div>
      {preview && <div style={{ fontSize: 12.5, color: COLORS.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{preview}</div>}

function NotesPage({ notes, persistNotes, noteFolders, persistNoteFolders }) {
  const [showModal, setShowModal] = useState(false);
  const [modalNote, setModalNote] = useState(undefined);
  const [activeFolder, setActiveFolder] = useState("all");
  const [addingFolder, setAddingFolder] = useState(false);
  const [newFolderName, setNewFolderName] = useState("");
  const [renamingFolder, setRenamingFolder] = useState(false);
  const [renameValue, setRenameValue] = useState("");
  const [confirmDeleteFolder, setConfirmDeleteFolder] = useState(false);

  const notesList = notes || [];
  const folders = noteFolders || [];

  const counts = useMemo(() => {
    const map = {};
    notesList.forEach((n) => { const f = n.folder || NO_FOLDER; map[f] = (map[f] || 0) + 1; });
    return map;
  }, [notesList]);

  const filtered = useMemo(() => {
    let list = notesList;
    if (activeFolder !== "all") {
      const wanted = activeFolder === NO_FOLDER ? "" : activeFolder;
      list = list.filter((n) => (n.folder || "") === wanted);
    }
    return [...list].sort((a, b) => (b.updatedAt || b.createdAt || "").localeCompare(a.updatedAt || a.createdAt || ""));
  }, [notesList, activeFolder]);

  const addFolder = () => {
    const trimmed = newFolderName.trim();
    setAddingFolder(false);
    setNewFolderName("");
    if (!trimmed || folders.includes(trimmed)) return;
    persistNoteFolders([...folders, trimmed]);
    setActiveFolder(trimmed);
  };

  const startRename = () => {
    setRenameValue(activeFolder);
    setRenamingFolder(true);
  };

  const confirmRename = () => {
    const trimmed = renameValue.trim();
    setRenamingFolder(false);
    if (!trimmed || trimmed === activeFolder || folders.includes(trimmed)) return;
    persistNoteFolders(folders.map((f) => (f === activeFolder ? trimmed : f)));
    persistNotes(notesList.map((n) => (n.folder === activeFolder ? { ...n, folder: trimmed } : n)));
    setActiveFolder(trimmed);
  };

  const deleteFolder = () => {
    if (!confirmDeleteFolder) { setConfirmDeleteFolder(true); return; }
    persistNoteFolders(folders.filter((f) => f !== activeFolder));
    persistNotes(notesList.map((n) => (n.folder === activeFolder ? { ...n, folder: "" } : n)));
    setActiveFolder("all");
    setConfirmDeleteFolder(false);
  };

  const handleSave = (note) => {
    const exists = notesList.some((n) => n.id === note.id);
    const next = exists ? notesList.map((n) => (n.id === note.id ? note : n)) : [...notesList, note];
    persistNotes(next);
    setShowModal(false);
    setModalNote(undefined);
  };

  const handleDelete = (id) => {
    persistNotes(notesList.filter((n) => n.id !== id));
    setShowModal(false);
    setModalNote(undefined);
  };

  const folderChips = ["all", ...folders, ...(counts[NO_FOLDER] ? [NO_FOLDER] : [])];

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Notizen</h1>
        <button onClick={() => { setModalNote(undefined); setShowModal(true); }} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 6 }}>
          <Plus size={15} /> Neue Notiz
        </button>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
        {folderChips.map((f) => {
          const active = activeFolder === f;
          const label = f === "all" ? "Alle" : f;
          return (
            <button key={f} onClick={() => { setActiveFolder(f); setRenamingFolder(false); setConfirmDeleteFolder(false); }} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 9, cursor: "pointer", fontSize: 12.5,
              border: `1px solid ${active ? COLORS.violet : COLORS.border}`,
              color: active ? COLORS.text : COLORS.textMuted, background: active ? COLORS.violet + "1f" : "transparent",
            }}>
              <Folder size={12} /> {label}
              <span style={{ fontSize: 10.5, color: COLORS.textFaint }}>{f === "all" ? notesList.length : (counts[f] || 0)}</span>
            </button>
          );
        })}
        {addingFolder ? (
          <div style={{ display: "flex", gap: 6 }}>
            <input
              autoFocus style={{ ...inputStyle, marginBottom: 0, width: 150, padding: "7px 10px" }}
              value={newFolderName} onChange={(e) => setNewFolderName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") addFolder(); if (e.key === "Escape") { setAddingFolder(false); setNewFolderName(""); } }}
              placeholder="Ordnername"
            />
            <button type="button" onClick={addFolder} style={{ ...ghostBtn, padding: "7px 10px", fontSize: 11.5 }}>OK</button>
            <button type="button" onClick={() => { setAddingFolder(false); setNewFolderName(""); }} style={{ ...ghostBtn, padding: "7px 10px", fontSize: 11.5 }}>Abbrechen</button>
          </div>
        ) : (
          <button onClick={() => setAddingFolder(true)} style={{ ...ghostBtn, padding: "7px 12px", fontSize: 12.5, display: "flex", alignItems: "center", gap: 6 }}>
            <Plus size={12} /> Ordner
          </button>
        )}
      </div>

      {activeFolder !== "all" && activeFolder !== NO_FOLDER && folders.includes(activeFolder) && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
          {renamingFolder ? (
            <>
              <input
                autoFocus style={{ ...inputStyle, marginBottom: 0, width: 180, padding: "7px 10px" }}
                value={renameValue} onChange={(e) => setRenameValue(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") confirmRename(); if (e.key === "Escape") setRenamingFolder(false); }}
              />
              <button onClick={confirmRename} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5 }}>Speichern</button>
              <button onClick={() => setRenamingFolder(false)} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5 }}>Abbrechen</button>
            </>
          ) : (
            <>
              <IconButton onClick={startRename} title="Ordner umbenennen"><Pencil size={13} /></IconButton>
              <IconButton onClick={deleteFolder} title="Ordner löschen" danger><Trash2 size={13} /></IconButton>
              {confirmDeleteFolder && <span style={{ fontSize: 11.5, color: COLORS.coral }}>Nochmal klicken zum Löschen (Notizen bleiben erhalten)</span>}
            </>
          )}
        </div>
      )}

      {filtered.length === 0 ? (
        <div style={{ textAlign: "center", padding: "48px 20px", border: `1px dashed ${COLORS.border}`, borderRadius: 16, color: COLORS.textMuted }}>
          <FileText size={28} style={{ color: COLORS.violet, marginBottom: 10 }} />
          <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text, marginBottom: 4 }}>
            {notesList.length === 0 ? "Noch keine Notizen" : "Keine Notizen in diesem Ordner"}
          </div>
          <div style={{ fontSize: 13, marginBottom: 16 }}>Halte Ideen, Listen oder Gedanken fest und organisiere sie in Ordnern.</div>
          <button onClick={() => { setModalNote(undefined); setShowModal(true); }} style={primaryBtn}>Erste Notiz anlegen</button>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {filtered.map((n) => (
            <NoteRow key={n.id} note={n} onEdit={() => { setModalNote(n); setShowModal(true); }} />
          ))}
        </div>
      )}

      {showModal && (
        <NoteModal
          initial={modalNote}
          folders={folders}
          defaultFolder={activeFolder}
          onClose={() => { setShowModal(false); setModalNote(undefined); }}
          onSave={handleSave}
          onDelete={handleDelete}
        />
      )}
    </div>
  );
}

/* ============================================================
   @section SETTINGS-PAGE — Export/Import (JSON), Kategorie-Verwaltung, Supabase/Anthropic-Key (ConnectionSettings)
   EINSTELLUNGEN / DATENSICHERUNG
   Export als JSON-Download, Import mit Vorschau + Bestätigung
   ============================================================ */
function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadJSON(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function SettingsPage({
  habits, entries, achievements, coach, journal, weeklyReports, goals, tasks, persons, categories, personGroups, moods, consumables, shoppingList, notes, noteFolders,
  persistHabits, persistEntries, persistAchievements, persistCoach, persistJournal, persistWeeklyReports, persistGoals, persistTasks, persistPersons, persistCategories, persistPersonGroups, persistMoods, persistConsumables, persistShoppingList, persistNotes, persistNoteFolders,
  onAnthropicKeyChange,
}) {
  const fileInputRef = useRef(null);
  const [pendingImport, setPendingImport] = useState(null);
  const [importError, setImportError] = useState(null);
  const [importSuccess, setImportSuccess] = useState(false);

  const handleExport = () => {
    const payload = {
      app: "life-os", version: 1, exportedAt: new Date().toISOString(),
      data: { habits, entries, achievements, coach, journal, weeklyReports, goals, tasks, persons, categories, personGroups, moods, consumables, shoppingList, notes, noteFolders },
    };
    downloadJSON(`life-os-backup-${todayKey()}.json`, payload);
  };

  // Excel-Export: mehrere Tabellenblätter mit "flachen" Zeilen (ein Wert pro
  // Zelle) statt der verschachtelten JSON-Sicherung, damit sich die Daten in
  // Excel direkt filtern/sortieren/pivotieren lassen.
  const handleExcelExport = () => {
    const wb = XLSX.utils.book_new();
    const addSheet = (name, rows) => {
      const safeRows = rows && rows.length > 0 ? rows : [{ Hinweis: "Keine Daten vorhanden" }];
      const ws = XLSX.utils.json_to_sheet(safeRows);
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
    };

    const formatValue = (habit, raw) => {
      if (raw === undefined || raw === null) return "";
      if (raw === SKIP_VALUE) return "Übersprungen";
      if (habit.trackingType === "boolean") return raw === true ? "Ja" : "Nein";
      if (habit.trackingType === "clock" && typeof raw === "number") return minutesToClock(raw);
      return raw;
    };

    const habitsSheet = (habits || []).map((h) => {
      const stats = simulateHabit(h, entries, todayKey());
      return {
        Name: h.name, Kategorie: h.category || "", Schwierigkeit: DIFFICULTY_LABELS[h.difficulty] || h.difficulty,
        "Tracking-Art": h.trackingType, Zielwert: h.trackingType === "clock" ? minutesToClock(h.target) : h.target,
        Einheit: h.unit || "", Beschreibung: h.description || "", Erstellt: h.createdAt || "",
        "Aktuelle Streak": stats.currentStreak, "Beste Streak": stats.longestStreak,
        "Erfolgsquote (%)": stats.successRate, Gesamtpunkte: stats.totalPoints,
      };
    });

    const entriesSheet = [];
    (habits || []).forEach((h) => {
      const stats = simulateHabit(h, entries, todayKey());
      stats.daily.forEach((d) => {
        if (d.status === "empty") return;
        entriesSheet.push({
          Datum: d.date, Habit: h.name, Kategorie: h.category || "",
          Wert: formatValue(h, entries?.[d.date]?.[h.id]),
          Status: d.status === "success" ? "Erfüllt" : d.status === "fail" ? "Nicht erfüllt" : "Übersprungen",
          Punkte: d.delta,
        });
      });
    });
    entriesSheet.sort((a, b) => a.Datum.localeCompare(b.Datum));

    const tasksSheet = (tasks || []).map((t) => ({
      Titel: t.title, Kategorie: t.category || "", Punkte: t.points, Erledigt: t.completed ? "Ja" : "Nein",
      "Erledigt am": t.completedAt || "", "Fällig am": t.dueDate || "", Beschreibung: t.content || "",
    }));

    const goalsSheet = (goals || []).map((g) => ({
      Titel: g.title, Kategorie: g.category || "", Punkte: g.points, Erreicht: g.achieved ? "Ja" : "Nein",
      "Erreicht am": g.achievedAt || "", Beschreibung: g.description || "",
    }));

    const personsSheet = (persons || []).map((p) => {
      const stats = personStats(p);
      const groupLabel = (p.groups && p.groups.length ? p.groups : p.category ? [p.category] : []).join(", ");
      return {
        Name: p.name, Gruppe: groupLabel, Geburtstag: p.birthday || "", "Geburtsjahr sicher": p.birthday ? (p.birthdayYearConfirmed === true ? "Ja" : "Nein") : "", Info: p.info || "",
        "Treffen gesamt": stats.total, "Zuletzt getroffen": stats.lastMet || "",
      };
    });

    const meetingsSheet = [];
    (persons || []).forEach((p) => (p.meetings || []).forEach((date) => meetingsSheet.push({ Datum: date, Person: p.name })));
    meetingsSheet.sort((a, b) => a.Datum.localeCompare(b.Datum));

    const relationshipsSheet = [];
    const seenPairs = new Set();
    (persons || []).forEach((p) => (p.relationships || []).forEach((r) => {
      const pairKey = [p.id, r.personId].sort().join("|");
      if (seenPairs.has(pairKey)) return;
      seenPairs.add(pairKey);
      const target = (persons || []).find((x) => x.id === r.personId);
      relationshipsSheet.push({ Person: p.name, Beziehung: relationshipLabel(r.type), "Verbunden mit": target ? target.name : "(gelöscht)" });
    }));

    const journalSheet = Object.keys(journal || {}).sort().map((k) => ({
      Datum: k, Text: stripHtml(journal[k]?.text), "Coach-Feedback": journal[k]?.feedback || "",
    })).filter((row) => row.Text || row["Coach-Feedback"]);

    const moodSheet = Object.keys(moods || {}).sort().map((k) => ({
      Datum: k, Fitness: moods[k].fitness || "", Stimmung: moods[k].mood || "", Gesamt: overallMood(moods[k]) ?? "",
    }));

    const achievementsSheet = (achievements || []).map((a) => ({
      Erfolg: (ACHIEVEMENT_DEFS.find((d) => d.id === a.id) || {}).label || a.id, Datum: a.date,
    }));

    const weeklyReportsSheet = Object.entries(weeklyReports || {}).map(([week, r]) => ({
      Woche: week, Zeitraum: r.weekStart && r.weekEnd ? `${shortDate(r.weekStart)} - ${shortDate(r.weekEnd)}` : "",
      Bericht: r.text || "", "Erstellt am": r.generatedAt ? new Date(r.generatedAt).toLocaleString("de-DE") : "",
    }));

    const consumablesSheet = [];
    (consumables || []).forEach((area) => (area.items || []).forEach((item) => {
      consumablesSheet.push({ Bereich: area.name, Artikel: item.name, Verfügbar: item.available ? "Ja" : "Nein", Angelegt: item.createdAt || "" });
    }));

    const shoppingSheet = (shoppingList || []).map((entry) => ({
      Artikel: entry.name, Erledigt: entry.completed ? "Ja" : "Nein", "Erledigt am": entry.completedAt || "",
    }));

    const notesSheet = (notes || []).map((n) => ({
      Titel: n.title, Ordner: n.folder || NO_FOLDER, Inhalt: stripHtml(n.content),
      Erstellt: n.createdAt ? new Date(n.createdAt).toLocaleString("de-DE") : "",
      "Zuletzt geändert": n.updatedAt ? new Date(n.updatedAt).toLocaleString("de-DE") : "",
    }));

    addSheet("Habits", habitsSheet);
    addSheet("Habit-Einträge", entriesSheet);
    addSheet("Aufgaben", tasksSheet);
    addSheet("Ziele", goalsSheet);
    addSheet("Personen", personsSheet);
    addSheet("Treffen", meetingsSheet);
    addSheet("Verbindungen", relationshipsSheet);
    addSheet("Journal", journalSheet);
    addSheet("Stimmung", moodSheet);
    addSheet("Erfolge", achievementsSheet);
    addSheet("Wochenberichte", weeklyReportsSheet);
    addSheet("Vorräte", consumablesSheet);
    addSheet("Einkaufsliste", shoppingSheet);
    addSheet("Notizen", notesSheet);

    XLSX.writeFile(wb, `lifetracker-export-${todayKey()}.xlsx`);
  };

  const handleFileSelect = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError(null);
    setImportSuccess(false);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const data = parsed && typeof parsed === "object" && parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
        if (!data || typeof data !== "object") throw new Error("invalid");
        setPendingImport(data);
      } catch {
        setImportError("Diese Datei konnte nicht gelesen werden. Ist es eine gültige Life-OS-Sicherung (.json)?");
      }
    };
    reader.onerror = () => setImportError("Die Datei konnte nicht gelesen werden.");
    reader.readAsText(file);
    e.target.value = "";
  };

  const cancelImport = () => setPendingImport(null);

  const confirmImport = async () => {
    if (!pendingImport) return;
    await persistHabits(Array.isArray(pendingImport.habits) ? pendingImport.habits : []);
    await persistEntries(pendingImport.entries && typeof pendingImport.entries === "object" ? pendingImport.entries : {});
    await persistAchievements(Array.isArray(pendingImport.achievements) ? pendingImport.achievements : []);
    await persistCoach(pendingImport.coach || null);
    await persistJournal(pendingImport.journal && typeof pendingImport.journal === "object" ? pendingImport.journal : {});
    await persistWeeklyReports(pendingImport.weeklyReports && typeof pendingImport.weeklyReports === "object" ? pendingImport.weeklyReports : {});
    await persistGoals(Array.isArray(pendingImport.goals) ? pendingImport.goals : []);
    await persistTasks(Array.isArray(pendingImport.tasks) ? pendingImport.tasks : []);
    await persistPersons(Array.isArray(pendingImport.persons) ? pendingImport.persons : []);
    await persistCategories(Array.isArray(pendingImport.categories) ? pendingImport.categories : []);
    await persistPersonGroups(Array.isArray(pendingImport.personGroups) ? pendingImport.personGroups : []);
    await persistMoods(pendingImport.moods && typeof pendingImport.moods === "object" ? pendingImport.moods : {});
    await persistConsumables(Array.isArray(pendingImport.consumables) ? pendingImport.consumables : []);
    await persistShoppingList(Array.isArray(pendingImport.shoppingList) ? pendingImport.shoppingList : []);
    await persistNotes(Array.isArray(pendingImport.notes) ? pendingImport.notes : []);
    await persistNoteFolders(Array.isArray(pendingImport.noteFolders) ? pendingImport.noteFolders : []);

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>

            <Download size={15} style={{ color: COLORS.mint }} />

          <span style={{ fontWeight: 700, fontSize: 14.5 }}>Daten exportieren</span>
        </div>
        <p style={{ fontSize: 13, color: COLORS.textMuted, lineHeight: 1.6, marginBottom: 14 }}>
          Lädt eine JSON-Datei mit allen deinen Habits, Einträgen, Zielen, Aufgaben, Personen, Journal- und Coach-Daten herunter. Damit kannst du deine Daten sichern oder auf ein anderes Gerät übertragen.
        </p>
        <button onClick={handleExport} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 7 }}>
          <Download size={14} /> Daten exportieren
        </button>

        <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, marginTop: 16, paddingTop: 16 }}>
          <p style={{ fontSize: 13, color: COLORS.textMuted, lineHeight: 1.6, marginBottom: 14 }}>
            Excel-Datei (.xlsx) mit einem Tabellenblatt je Datenbereich (u. a. Habit-Einträge, Aufgaben, Ziele, Personen,
            Treffen, Journal, Stimmung) - zum Auswerten, Filtern und Pivotieren. Für eine Wiederherstellung in der App
            nutze stattdessen die JSON-Sicherung oben.
          </p>
          <button onClick={handleExcelExport} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 7 }}>
            <Download size={14} /> Excel exportieren (.xlsx)

        </div>

      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
          <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.violet + "1f" }}>
            <Upload size={15} style={{ color: COLORS.violet }} />

          <span style={{ fontWeight: 700, fontSize: 14.5 }}>Daten importieren</span>

        <p style={{ fontSize: 13, color: COLORS.textMuted, lineHeight: 1.6, marginBottom: 14 }}>

        {pendingImport && (
          <div style={{

            <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 10, lineHeight: 1.6 }}>
              Gefunden: {counts.habits} Habits, {counts.goals} Ziele, {counts.tasks} Aufgaben, {counts.shopping} Einkäufe, {counts.persons} Personen, {counts.journalDays} Journal-Tage.

      />

        persons={persons} persistPersons={persistPersons}
      />

      <ConnectionSettings onKeyChange={onAnthropicKeyChange} />
    </div>
  );
}

/* ============================================================
   @section DATA-VALIDATION — findet + bereinigt verwaiste Daten in Supabase
   (Tages-Einträge gelöschter Habits, goalIds gelöschter Ziele, Personen-
   Verbindungen zu gelöschten Personen). Die Löschpfade selbst räumen diese
   Fälle inzwischen direkt auf; dieses Tool ist für bereits bestehende
   Altlasten aus der Zeit davor bzw. als Sicherheitsnetz gedacht.
   ============================================================ */
function DataValidation({ habits, entries, persistEntries, goals, persistHabits, persons, persistPersons }) {
  const [result, setResult] = useState(null);
  const [cleaning, setCleaning] = useState(false);
  const [cleaned, setCleaned] = useState(false);

  const analyze = () => {
    const habitIds = new Set(habits.map((h) => h.id));
    const goalIds = new Set(goals.map((g) => g.id));
    const personIds = new Set(persons.map((p) => p.id));

    let orphanedEntries = 0;
    Object.values(entries).forEach((day) => {
      Object.keys(day || {}).forEach((habitId) => { if (!habitIds.has(habitId)) orphanedEntries += 1; });
    });

    let orphanedGoalRefs = 0;
    habits.forEach((h) => (h.goalIds || []).forEach((gid) => { if (!goalIds.has(gid)) orphanedGoalRefs += 1; }));

    let orphanedRelationships = 0;
    persons.forEach((p) => (p.relationships || []).forEach((r) => { if (!personIds.has(r.personId)) orphanedRelationships += 1; }));

    setCleaned(false);
    setResult({ orphanedEntries, orphanedGoalRefs, orphanedRelationships });
  };

  const cleanUp = async () => {
    setCleaning(true);
    const habitIds = new Set(habits.map((h) => h.id));
    const goalIds = new Set(goals.map((g) => g.id));
    const personIds = new Set(persons.map((p) => p.id));

    const nextEntries = {};
    Object.keys(entries).forEach((dateKey) => {
      const day = {};
      Object.keys(entries[dateKey] || {}).forEach((habitId) => {
        if (habitIds.has(habitId)) day[habitId] = entries[dateKey][habitId];
      });
      if (Object.keys(day).length > 0) nextEntries[dateKey] = day;
    });

    await persistEntries(nextEntries);
    await persistHabits(habits.map((h) => ({ ...h, goalIds: (h.goalIds || []).filter((gid) => goalIds.has(gid)) })));
    await persistPersons(persons.map((p) => ({ ...p, relationships: (p.relationships || []).filter((r) => personIds.has(r.personId)) })));

    setCleaning(false);
    setCleaned(true);
    setResult(null);
  };

  const totalIssues = result ? result.orphanedEntries + result.orphanedGoalRefs + result.orphanedRelationships : 0;

  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginTop: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
        <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.coral + "1f" }}>
          <RefreshCw size={15} style={{ color: COLORS.coral }} />
        </div>
        <span style={{ fontWeight: 700, fontSize: 14.5 }}>Datenvalidierung</span>
      </div>
      <p style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
        Prüft, ob in Supabase noch verwaiste Daten von gelöschten Habits, Zielen oder Personen herumliegen (z. B. Tages-Einträge eines längst gelöschten Habits), und räumt sie auf Wunsch auf.
      </p>

      <button onClick={analyze} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 7 }}>
        <RefreshCw size={14} /> Daten prüfen
      </button>

      {cleaned && (
        <div style={{ display: "flex", alignItems: "center", gap: 7, color: COLORS.mint, fontSize: 12.5, marginTop: 12 }}>
          <Check size={14} /> Bereinigung abgeschlossen.
        </div>
      )}

      {result && (
        totalIssues === 0 ? (
          <div style={{ display: "flex", alignItems: "center", gap: 7, color: COLORS.mint, fontSize: 12.5, marginTop: 12 }}>
            <Check size={14} /> Keine verwaisten Daten gefunden.
          </div>
        ) : (
          <div style={{ marginTop: 14, padding: 14, borderRadius: 12, background: COLORS.coral + "0f", border: `1px solid ${COLORS.coral}44` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8, color: COLORS.coral, fontWeight: 700, fontSize: 13 }}>
              <AlertTriangle size={15} /> {totalIssues} verwaiste {totalIssues === 1 ? "Eintrag" : "Einträge"} gefunden
            </div>
            <ul style={{ margin: "0 0 12px", paddingLeft: 18, fontSize: 12.5, color: COLORS.textMuted, lineHeight: 1.7 }}>
              {result.orphanedEntries > 0 && <li>{result.orphanedEntries}× Tages-Eintrag eines gelöschten Habits</li>}
              {result.orphanedGoalRefs > 0 && <li>{result.orphanedGoalRefs}× Habit verweist auf ein gelöschtes Ziel</li>}
              {result.orphanedRelationships > 0 && <li>{result.orphanedRelationships}× Personen-Verbindung zeigt auf eine gelöschte Person</li>}
            </ul>
            <button onClick={cleanUp} disabled={cleaning} style={{ ...primaryBtn, background: `linear-gradient(135deg, ${COLORS.coral}, #FF9B85)`, color: "#2B0810", opacity: cleaning ? 0.6 : 1 }}>
              {cleaning ? "Bereinige …" : "Jetzt bereinigen"}
            </button>
          </div>
        )
      )}
    </div>
  );
}

function CategoryManager({ categories, persistCategories, habits, tasks, goals, persistHabits, persistTasks, persistGoals }) {
  const [newCat, setNewCat] = useState("");
  const [renaming, setRenaming] = useState(null);
  const [renameValue, setRenameValue] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null);

  const addCategory = () => {
    const trimmed = newCat.trim();
    setNewCat("");
    if (!trimmed || categories.includes(trimmed)) return;
    persistCategories([...categories, trimmed]);
  };

  const startRename = (cat) => { setRenaming(cat); setRenameValue(cat); };
  const confirmRename = () => {
    const trimmed = renameValue.trim();
    setRenaming(null);
    if (!trimmed || trimmed === renaming || categories.some((category) => category !== renaming && category === trimmed)) return;
    persistCategories(categories.map((c) => (c === renaming ? trimmed : c)));
    persistHabits(habits.map((h) => (h.category === renaming ? { ...h, category: trimmed } : h)));
    persistTasks(tasks.map((t) => (t.category === renaming ? { ...t, category: trimmed } : t)));
    persistGoals(goals.map((g) => (g.category === renaming ? { ...g, category: trimmed } : g)));
  };

  const deleteCategory = (cat) => {
    persistCategories(categories.filter((c) => c !== cat));
    persistHabits(habits.map((habit) => habit.category === cat ? { ...habit, category: "" } : habit));
    persistTasks(tasks.map((task) => task.category === cat ? { ...task, category: "" } : task));
    persistGoals(goals.map((goal) => goal.category === cat ? { ...goal, category: "" } : goal));
    setConfirmDelete(null);
  };

  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginTop: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
        <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.mint + "1f" }}>
          <ListChecks size={15} style={{ color: COLORS.mint }} />
        </div>
        <span style={{ fontWeight: 700, fontSize: 14.5 }}>Kategorien verwalten</span>
      </div>
      <p style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
        Zentrale Liste der Kategorien für Habits, Aufgaben und Ziele. Umbenennen aktualisiert automatisch alle Einträge, die diese Kategorie nutzen.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <input
          style={{ ...inputStyle, marginBottom: 0, flex: 1 }} value={newCat}
          onChange={(e) => setNewCat(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addCategory(); }}
          placeholder="Neue Kategorie"
        />
        <button onClick={addCategory} style={primaryBtn}>Hinzufügen</button>
      </div>

      {categories.length === 0 ? (
        <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch keine Kategorien angelegt.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {categories.map((cat) => (
            <div key={cat} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: categoryColor(cat), flexShrink: 0 }} />
              {renaming === cat ? (
                <>
                  <input
                    autoFocus style={{ ...inputStyle, marginBottom: 0, flex: 1 }} value={renameValue}
                    onChange={(e) => setRenameValue(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") confirmRename(); if (e.key === "Escape") setRenaming(null); }}
                  />
                  <button onClick={confirmRename} style={{ ...primaryBtn, padding: "6px 12px" }}>OK</button>
                  <button onClick={() => setRenaming(null)} style={{ ...ghostBtn, padding: "6px 12px" }}>Abbrechen</button>
                </>
              ) : (
                <>
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{cat}</span>
                  <IconButton onClick={() => startRename(cat)} title="Umbenennen"><Pencil size={13} /></IconButton>
                  {confirmDelete === cat ? (
                    <button onClick={() => deleteCategory(cat)} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5, color: COLORS.coral, border: `1px solid ${COLORS.coral}` }}>
                      Wirklich löschen?
                    </button>
                  ) : (
                    <IconButton onClick={() => setConfirmDelete(cat)} title="Löschen" danger><Trash2 size={13} /></IconButton>
                  )}
                </>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   @section PERSON-GROUP-MANAGER — eigene, von Habits/Tasks/Zielen getrennte Gruppen-Liste für Personen
   ============================================================ */
function PersonGroupManager({ groups, persistGroups, persons, persistPersons }) {
  const [newGroup, setNewGroup] = useState("");
  const [renaming, setRenaming] = useState(null);
  const [renameValue, setRenameValue] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null);

  const addGroup = () => {
    const trimmed = newGroup.trim();
    setNewGroup("");
    if (!trimmed || groups.includes(trimmed)) return;
    persistGroups([...groups, trimmed]);
  };

  const startRename = (g) => { setRenaming(g); setRenameValue(g); };
  const confirmRename = () => {
    const trimmed = renameValue.trim();
    setRenaming(null);
    if (!trimmed || trimmed === renaming || groups.some((group) => group !== renaming && group === trimmed)) return;
    persistGroups(groups.map((g) => (g === renaming ? trimmed : g)));
    persistPersons(persons.map((p) => {
      const assigned = p.groups || (p.category ? [p.category] : []);
      const nextGroups = assigned.map((group) => group === renaming ? trimmed : group);
      return { ...p, groups: [...new Set(nextGroups)], category: nextGroups[0] || "" };
    }));
  };

  const deleteGroup = (g) => {
    persistGroups(groups.filter((x) => x !== g));
    persistPersons(persons.map((p) => {
      const nextGroups = (p.groups || (p.category ? [p.category] : [])).filter((group) => group !== g);
      return { ...p, groups: nextGroups, category: nextGroups[0] || "" };
    }));
    setConfirmDelete(null);
  };

  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginTop: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
        <div style={{ width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.violet + "1f" }}>
          <Users size={15} style={{ color: COLORS.violet }} />
        </div>
        <span style={{ fontWeight: 700, fontSize: 14.5 }}>Personen-Gruppen verwalten</span>
      </div>
      <p style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
        Eigene Gruppen-Liste nur für Personen, getrennt von den Kategorien oben. Umbenennen aktualisiert automatisch alle Personen, die diese Gruppe nutzen.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <input
          style={{ ...inputStyle, marginBottom: 0, flex: 1 }} value={newGroup}
          onChange={(e) => setNewGroup(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addGroup(); }}
          placeholder="Neue Gruppe"
        />
        <button onClick={addGroup} style={primaryBtn}>Hinzufügen</button>
      </div>

      {groups.length === 0 ? (
        <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch keine Gruppen angelegt.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {groups.map((g) => (
            <div key={g} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bgSoft, borderRadius: 9 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: categoryColor(g), flexShrink: 0 }} />
              {renaming === g ? (
                <>
                  <input
                    autoFocus style={{ ...inputStyle, marginBottom: 0, flex: 1 }} value={renameValue}
                    onChange={(e) => setRenameValue(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") confirmRename(); if (e.key === "Escape") setRenaming(null); }}
                  />
                  <button onClick={confirmRename} style={{ ...primaryBtn, padding: "6px 12px" }}>OK</button>
                  <button onClick={() => setRenaming(null)} style={{ ...ghostBtn, padding: "6px 12px" }}>Abbrechen</button>
                </>
              ) : (
                <>
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{g}</span>
                  <IconButton onClick={() => startRename(g)} title="Umbenennen"><Pencil size={13} /></IconButton>
                  {confirmDelete === g ? (
                    <button onClick={() => deleteGroup(g)} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5, color: COLORS.coral, border: `1px solid ${COLORS.coral}` }}>
                      Wirklich löschen?
                    </button>
                  ) : (
                    <IconButton onClick={() => setConfirmDelete(g)} title="Löschen" danger><Trash2 size={13} /></IconButton>
                  )}
                </>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


function ConnectionSettings({ onKeyChange }) {

  const saveKey = () => {
    setConfig({ ...existing, anthropicKey });
    setSaved(true);

    localStorage.removeItem(CONFIG_KEY);

      <input
