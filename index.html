}
function ConsumablesPage({ consumables, persistConsumables, shoppingList, persistShoppingList }) {
  const [newArea, setNewArea] = useState("");
  const [productNames, setProductNames] = useState({});
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [historyTarget, setHistoryTarget] = useState(null);
  const addArea = () => {
    const name = newArea.trim(); if (!name) return;
    persistConsumables([...consumables, { id: `area_${Date.now()}`, name, items: [], createdAt: todayKey() }]); setNewArea("");
  };
  const addProduct = (areaId) => {
    const name = (productNames[areaId] || "").trim(); if (!name) return;
    persistConsumables(consumables.map((area) => area.id === areaId ? { ...area, items: [...(area.items || []), { id: `consumable_${Date.now()}`, name, available: true, createdAt: todayKey(), history: [{ date: todayKey(), available: true }] }] } : area));
    setProductNames({ ...productNames, [areaId]: "" });
  };
  const toggleProduct = (area, item) => {
    const available = !item.available;
    persistConsumables(consumables.map((candidate) => candidate.id === area.id ? { ...candidate, items: (candidate.items || []).map((product) => product.id === item.id ? { ...product, available, history: [...(product.history || []), { date: todayKey(), available }] } : product) } : candidate));
    if (!available) {
      const hasOpenPurchase = shoppingList.some((entry) => entry.sourceConsumableId === item.id && !entry.completed);
      if (!hasOpenPurchase) persistShoppingList([...shoppingList, createConsumableShoppingItem(area, item)]);
    } else {
      persistShoppingList(shoppingList.map((entry) => entry.sourceConsumableId === item.id && !entry.completed ? { ...entry, completed: true, completedAt: todayKey() } : entry));
    }
  };
  const deleteProduct = (areaId, itemId) => {
    persistConsumables(consumables.map((area) => area.id === areaId ? { ...area, items: (area.items || []).filter((item) => item.id !== itemId) } : area));
    persistShoppingList(shoppingList.filter((entry) => entry.sourceConsumableId !== itemId)); setConfirmDelete(null);
  };
  const deleteArea = (areaId) => {
    const itemIds = new Set((consumables.find((area) => area.id === areaId)?.items || []).map((item) => item.id));
    persistConsumables(consumables.filter((area) => area.id !== areaId));
    persistShoppingList(shoppingList.filter((entry) => !itemIds.has(entry.sourceConsumableId))); setConfirmDelete(null);
  };
  const changeHistory = (areaId, itemId, change) => {
    const area = consumables.find((candidate) => candidate.id === areaId);
    const previousItem = area?.items?.find((item) => item.id === itemId);
    if (!area || !previousItem) return;
    const history = change([...(previousItem.history || [])]);
    const latest = history.filter((event) => isValidDateKey(event.date)).slice().sort((a, b) => a.date.localeCompare(b.date)).at(-1);
    const available = latest ? latest.available : previousItem.available;
    persistConsumables(consumables.map((candidate) => candidate.id === areaId ? { ...candidate, items: (candidate.items || []).map((item) => item.id === itemId ? { ...item, history, available } : item) } : candidate));
    if (available !== previousItem.available) {
      if (!available) {
        const hasOpenPurchase = shoppingList.some((entry) => entry.sourceConsumableId === itemId && !entry.completed);
        if (!hasOpenPurchase) persistShoppingList([...shoppingList, createConsumableShoppingItem(area, previousItem)]);
      } else persistShoppingList(shoppingList.map((entry) => entry.sourceConsumableId === itemId && !entry.completed ? { ...entry, completed: true, completedAt: todayKey() } : entry));
    }
  };
  const currentHistoryItem = historyTarget ? consumables.find((area) => area.id === historyTarget.areaId)?.items?.find((item) => item.id === historyTarget.itemId) : null;
  return <div>
    <div style={{ marginBottom: 20 }}><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Verbrauchsartikel</h1><div style={{ fontSize: 12.5, color: COLORS.textFaint, marginTop: 4 }}>Bestände nach Bereichen verwalten und rechtzeitig nachkaufen.</div></div>
    <div style={{ display: "flex", gap: 8, marginBottom: 20 }}><input value={newArea} onChange={(e) => setNewArea(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addArea()} placeholder="Neuer Bereich, z. B. Sporttasche" style={{ ...inputStyle, marginBottom: 0 }} /><button onClick={addArea} style={primaryBtn}><Plus size={14} /> Bereich</button></div>
    {consumables.length === 0 ? <div style={{ textAlign: "center", padding: "42px 20px", border: `1px dashed ${COLORS.border}`, borderRadius: 16, color: COLORS.textMuted }}>Lege deinen ersten Bereich und anschließend die enthaltenen Produkte an.</div> : <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {consumables.map((area) => <div key={area.id} style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}><Droplet size={16} style={{ color: COLORS.violet }} /><strong style={{ flex: 1 }}>{area.name}</strong>{confirmDelete === area.id ? <button onClick={() => deleteArea(area.id)} style={{ ...ghostBtn, padding: "5px 8px", color: COLORS.coral, borderColor: COLORS.coral }}>Wirklich löschen?</button> : <IconButton onClick={() => setConfirmDelete(area.id)} title="Bereich löschen" danger><Trash2 size={13} /></IconButton>}</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}><input value={productNames[area.id] || ""} onChange={(e) => setProductNames({ ...productNames, [area.id]: e.target.value })} onKeyDown={(e) => e.key === "Enter" && addProduct(area.id)} placeholder="Produkt hinzufügen" style={{ ...inputStyle, marginBottom: 0 }} /><button onClick={() => addProduct(area.id)} style={{ ...ghostBtn, flexShrink: 0 }}><Plus size={13} /></button></div>
        {(area.items || []).length === 0 ? <div style={{ fontSize: 12, color: COLORS.textFaint }}>Noch keine Produkte.</div> : <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>{area.items.map((item) => {
          const avg = consumableAverageDays(item); return <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 11px", background: COLORS.bgSoft, borderRadius: 10 }}>
            <button onClick={() => toggleProduct(area, item)} style={{ width: 30, height: 30, borderRadius: "50%", border: `1px solid ${item.available ? COLORS.mint : COLORS.coral}`, background: item.available ? COLORS.mint + "22" : COLORS.coral + "22", color: item.available ? COLORS.mint : COLORS.coral, cursor: "pointer" }}>{item.available ? <Check size={15} /> : <X size={15} />}</button>
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13.5, fontWeight: 600 }}>{item.name}</div><div style={{ fontSize: 11, color: COLORS.textFaint }}>{item.available ? "Vorhanden" : "Nicht vorhanden · Beschaffungs-Task erstellt"} · Ø Haltbarkeit: {avg === null ? "noch nicht berechenbar" : `${avg} Tage`}</div></div>
            <IconButton onClick={() => setHistoryTarget({ areaId: area.id, itemId: item.id })} title="Verlauf bearbeiten"><CalendarDays size={13} /></IconButton>
            {confirmDelete === item.id ? <button onClick={() => deleteProduct(area.id, item.id)} style={{ ...ghostBtn, padding: "5px 8px", color: COLORS.coral }}>Löschen?</button> : <IconButton onClick={() => setConfirmDelete(item.id)} title="Produkt löschen" danger><Trash2 size={13} /></IconButton>}
          </div>;
        })}</div>}
      </div>)}
    </div>}
    {currentHistoryItem && <ConsumableHistoryModal item={currentHistoryItem} onClose={() => setHistoryTarget(null)} onUpdate={(index, event) => changeHistory(historyTarget.areaId, historyTarget.itemId, (history) => history.map((entry, entryIndex) => entryIndex === index ? event : entry))} onDelete={(index) => changeHistory(historyTarget.areaId, historyTarget.itemId, (history) => history.filter((_, entryIndex) => entryIndex !== index))} />}
  </div>;
}

/* ============================================================
   @section MOOD-PAGE — tägliches Fitness- und Stimmungsgefühl
   Wie bei Habits gibt es eine Erfassungs-Streak (Tage in Folge mit Eintrag,
   "heute" bricht sie noch nicht) und eine kleine Konfetti-Belohnung, wenn
   ein Tag komplett (Fitness + Stimmung) erfasst wird - damit sich das
   Eintragen genauso lohnend anfühlt wie beim Rest der App.
   ============================================================ */
const MOOD_SCALE = [
  { value: 1, label: "Sehr niedrig", emoji: "😞" }, { value: 2, label: "Niedrig", emoji: "😕" },
  { value: 3, label: "Mittel", emoji: "😐" }, { value: 4, label: "Gut", emoji: "🙂" }, { value: 5, label: "Sehr gut", emoji: "😄" },
];
function overallMood(entry) {
  return entry?.fitness && entry?.mood ? Math.round(((entry.fitness + entry.mood) / 2) * 10) / 10 : null;
}
function moodEmojiFor(value) {
  if (value === null || value === undefined) return "✨";
  const rounded = Math.min(5, Math.max(1, Math.round(value)));
  return (MOOD_SCALE.find((m) => m.value === rounded) || {}).emoji || "✨";
}
function moodColorFor(value) {
  if (value === null) return COLORS.textFaint;
  if (value >= 4) return COLORS.mint;
  if (value < 2.5) return COLORS.coral;
  return COLORS.ember2;
}
// Tage in Folge mit vollständigem Eintrag (Fitness + Stimmung), analog zur
// Habit-Streak: "heute" bricht die Streak noch nicht, solange sie offen ist.
function moodLoggingStreak(moods) {
  let streak = 0;
  let cursor = new Date();
  if (overallMood(moods[toKey(cursor)]) === null) cursor = addDays(cursor, -1);
  while (overallMood(moods[toKey(cursor)]) !== null) {
    streak += 1;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function moodAverage(moods, dateKeys) {
  const values = dateKeys.map((k) => overallMood(moods[k])).filter((v) => v !== null);
  if (values.length === 0) return null;
  return Math.round((values.reduce((a, b) => a + b, 0) / values.length) * 10) / 10;
}

function MoodInput({ dateKey, moods, persistMoods, compact = false, onComplete }) {
  const entry = moods[dateKey] || {};
  const saveValue = (field, value) => {
    const wasComplete = overallMood(entry) !== null;
    const nextEntry = { ...entry, [field]: value };
    persistMoods({ ...moods, [dateKey]: nextEntry });
    if (!wasComplete && overallMood(nextEntry) !== null) onComplete?.();
  };
  const total = overallMood(entry);
  const totalColor = moodColorFor(total);
  const scale = (field, title, color) => <div style={{ flex: "1 1 260px" }}>
    <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>{title}</div>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 6 }}>
      {MOOD_SCALE.map((item) => {
        const active = entry[field] === item.value;
        return (
          <button key={item.value} title={item.label} onClick={() => saveValue(field, item.value)} style={{
            padding: compact ? "8px 2px" : "10px 3px", borderRadius: 10, cursor: "pointer", fontSize: compact ? 19 : 22,
            border: `1.5px solid ${active ? color : COLORS.border}`,
            background: active ? color + "22" : COLORS.bgSoft,
            boxShadow: active ? `0 0 14px ${color}55` : "none",
            transform: active ? "scale(1.06)" : "scale(1)",
            transition: "all .15s",
          }}>{item.emoji}<span style={{ display: "block", fontSize: 9.5, fontWeight: active ? 700 : 500, color: active ? color : COLORS.textFaint, marginTop: 3 }}>{item.value}</span></button>
        );
      })}
    </div>
  </div>;
  return <div>
    <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
      {scale("fitness", "A. Wie fit fühlst du dich?", COLORS.mint)}
      {scale("mood", "B. Wie ist deine Stimmung?", COLORS.violet)}
    </div>
    <div style={{
      marginTop: 12, padding: "10px 14px", borderRadius: 10, display: "flex", justifyContent: "space-between", alignItems: "center",
      background: total === null ? COLORS.bgSoft : totalColor + "14", border: `1px solid ${total === null ? COLORS.borderSoft : totalColor + "44"}`,
    }}>
      <span style={{ fontSize: 12, color: COLORS.textMuted, display: "flex", alignItems: "center", gap: 6 }}>
        <span style={{ fontSize: 16 }}>{moodEmojiFor(total)}</span> Gesamtstimmung
      </span>
      <strong style={{ fontFamily: "Fraunces, serif", fontSize: 20, color: totalColor }}>{total === null ? "–" : `${total} / 5`}</strong>
    </div>
  </div>;
}

function MoodPage({ moods, persistMoods, currentDateKey }) {
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [celebrate, setCelebrate] = useState(false);
  const series = useMemo(() => Object.keys(moods).sort().slice(-60).map((date) => ({ date: shortDate(date), fitness: moods[date].fitness || null, mood: moods[date].mood || null, overall: overallMood(moods[date]) })), [moods]);

  const streak = useMemo(() => moodLoggingStreak(moods), [moods]);
  const weekKeys = useMemo(() => Array.from({ length: 7 }, (_, i) => toKey(addDays(startOfWeek(keyToDate(currentDateKey)), i))), [currentDateKey]);
  const lastWeekKeys = useMemo(() => weekKeys.map((k) => toKey(addDays(keyToDate(k), -7))), [weekKeys]);
  const weekAvg = moodAverage(moods, weekKeys);
  const lastWeekAvg = moodAverage(moods, lastWeekKeys);
  const monthAvg = useMemo(() => {
    const prefix = currentDateKey.slice(0, 7);
    return moodAverage(moods, Object.keys(moods).filter((k) => k.startsWith(prefix)));
  }, [moods, currentDateKey]);
  const bestDay = useMemo(() => {
    const prefix = currentDateKey.slice(0, 7);
    const entries = Object.keys(moods).filter((k) => k.startsWith(prefix)).map((k) => ({ date: k, value: overallMood(moods[k]) })).filter((e) => e.value !== null);
    return entries.length ? entries.reduce((best, e) => (e.value > best.value ? e : best)) : null;
  }, [moods, currentDateKey]);

  const todayOverall = overallMood(moods[currentDateKey]);
  const heroEmoji = moodEmojiFor(todayOverall);
  const heroLine = todayOverall !== null
    ? `Heute fühlst du dich bei ${todayOverall} / 5 - ${todayOverall >= 4 ? "richtig gut, schön zu sehen!" : todayOverall < 2.5 ? "sei heute besonders gut zu dir." : "so lala, das ist völlig okay."}`
    : weekAvg !== null && lastWeekAvg !== null && weekAvg !== lastWeekAvg
      ? (weekAvg > lastWeekAvg ? "Aufwärtstrend gegenüber letzter Woche 📈 - trag auch heute ein." : "Etwas gedrückter als letzte Woche - trag ein, wie es dir heute geht.")
      : "Noch nichts für heute erfasst - wie fühlst du dich gerade?";

  return <div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
      <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Stimmung</h1><div style={{ fontSize: 12.5, color: COLORS.textFaint, marginTop: 4 }}>Körperliches Gefühl und Stimmung getrennt erfassen.</div></div>
      <input type="date" max={todayKey()} value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} style={{ ...inputStyle, width: "auto", marginBottom: 0 }} />
    </div>

    <div style={{
      position: "relative", display: "flex", alignItems: "center", gap: 14, marginBottom: 16, padding: "14px 16px", borderRadius: 14,
      background: `linear-gradient(135deg, ${COLORS.violet}14, ${COLORS.mint}0a)`, border: `1px solid ${COLORS.violet}33`, overflow: "hidden",
    }}>
      {celebrate && <Confetti trigger={"mood_" + Date.now()} />}
      <div style={{ fontSize: 38, lineHeight: 1, flexShrink: 0 }}>{heroEmoji}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.4 }}>{heroLine}</div>
        {streak > 0 && (
          <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4, display: "flex", alignItems: "center", gap: 4 }}>
            <Flame size={12} style={{ color: COLORS.ember1 }} /> {streak} {streak === 1 ? "Tag" : "Tage"} in Folge erfasst
          </div>
        )}
      </div>
    </div>

    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10, marginBottom: 16 }}>
      <StatCard label="Erfassungs-Streak" value={streak} suffix={streak === 1 ? "Tag" : "Tage"} accent={COLORS.ember2} />
      <StatCard label="Ø diese Woche" value={weekAvg ?? "–"} suffix={weekAvg === null ? "" : "/ 5"} accent={moodColorFor(weekAvg)} />
      <StatCard label="Ø diesen Monat" value={monthAvg ?? "–"} suffix={monthAvg === null ? "" : "/ 5"} accent={moodColorFor(monthAvg)} />
      <StatCard label="Bester Tag (Monat)" value={bestDay ? bestDay.value : "–"} suffix={bestDay ? `· ${shortDate(bestDay.date)}` : ""} accent={COLORS.mint} />
    </div>

    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18, marginBottom: 16 }}>
      <SectionLabel>{selectedDate === todayKey() ? "Heute" : longDate(selectedDate)}</SectionLabel>
      <MoodInput
        dateKey={selectedDate} moods={moods} persistMoods={persistMoods}
        onComplete={selectedDate === todayKey() ? () => { setCelebrate(true); setTimeout(() => setCelebrate(false), 1200); } : undefined}
      />
    </div>
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.borderSoft}`, borderRadius: 16, padding: 18 }}>
      <SectionLabel>Stimmungsverlauf</SectionLabel>
      {series.length === 0 ? <div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Noch keine Stimmung eingetragen.</div> : <ResponsiveContainer width="100%" height={240}><LineChart data={series}><CartesianGrid stroke={COLORS.borderSoft} strokeDasharray="3 3" vertical={false} /><XAxis dataKey="date" tick={{ fill: COLORS.textFaint, fontSize: 10 }} minTickGap={24} /><YAxis domain={[1, 5]} ticks={[1,2,3,4,5]} tick={{ fill: COLORS.textFaint, fontSize: 10 }} /><Tooltip contentStyle={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`, borderRadius: 8 }} /><Line type="monotone" dataKey="fitness" name="Fitness" stroke={COLORS.mint} strokeWidth={2} connectNulls /><Line type="monotone" dataKey="mood" name="Stimmung" stroke={COLORS.violet} strokeWidth={2} connectNulls /><Line type="monotone" dataKey="overall" name="Gesamt" stroke={COLORS.ember2} strokeWidth={3} dot={{ r: 3, fill: COLORS.ember2 }} connectNulls /></LineChart></ResponsiveContainer>}
    </div>
  </div>;
}

/* ============================================================
   @section PERSONS-PAGE — Personenverwaltung: Klick zählt ein Treffen, pro Person eine Auswertung
   PERSONEN
   Ein Klick auf eine Person zählt ein Treffen (Datum wird gespeichert).
   Pro Person gibt es eine Auswertung (Treffen gesamt/Woche/Monat, zuletzt
   getroffen) sowie ein freies Info-Feld für Notizen zur Person.
   Verbindungen zwischen Personen (person.relationships = [{personId, type}])
   sind bidirektional: wird bei A "Elternteil von B" eingetragen, entsteht bei
   B automatisch "Kind von A". Gender-neutral gehalten (kein Geschlechtsfeld
   nötig), damit auch nicht-familiäre Verbindungen (Freund/in) abbildbar sind.
   ============================================================ */
const RELATIONSHIP_TYPES = [
  { key: "parent", label: "Elternteil von", inverseKey: "child" },
  { key: "child", label: "Kind von", inverseKey: "parent" },
  { key: "sibling", label: "Geschwister von", inverseKey: "sibling" },
  { key: "partner", label: "Partner/in von", inverseKey: "partner" },
  { key: "grandparent", label: "Großelternteil von", inverseKey: "grandchild" },
  { key: "grandchild", label: "Enkelkind von", inverseKey: "grandparent" },
  { key: "auntUncle", label: "Onkel/Tante von", inverseKey: "nibling" },
  { key: "nibling", label: "Neffe/Nichte von", inverseKey: "auntUncle" },
  { key: "cousin", label: "Cousin/Cousine von", inverseKey: "cousin" },
  { key: "friend", label: "Freund/in von", inverseKey: "friend" },
];
function relationshipLabel(key) {
  return (RELATIONSHIP_TYPES.find((r) => r.key === key) || {}).label || key;
}
function inverseRelationshipKey(key) {
  return (RELATIONSHIP_TYPES.find((r) => r.key === key) || {}).inverseKey || key;
}

function personStats(person) {
  const meetings = (person.meetings || []).slice().sort();
  const total = meetings.length;
  const lastMet = total > 0 ? meetings[meetings.length - 1] : null;
  const weekStart = toKey(startOfWeek(new Date()));
  const monthStart = toKey(startOfMonth(new Date()));
  const thisWeek = meetings.filter((k) => k >= weekStart).length;
  const thisMonth = meetings.filter((k) => k >= monthStart).length;
  return { total, lastMet, thisWeek, thisMonth };
}

// Tage bis zum nächsten Geburtstag (0 = heute), unabhängig vom gespeicherten Jahrgang.
// Ein Geburtstag am 29. Februar fällt in Nicht-Schaltjahren auf den 28. Februar,
// statt (durch JS-Datumsüberlauf) fälschlich auf den 1. März zu rutschen.
function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}
function daysUntilBirthday(birthday, today = new Date()) {
  if (!birthday) return null;
  const b = keyToDate(birthday);
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const dayInYear = (y) => (b.getMonth() === 1 && b.getDate() === 29 && !isLeapYear(y)) ? 28 : b.getDate();
  let next = new Date(todayMid.getFullYear(), b.getMonth(), dayInYear(todayMid.getFullYear()));
  if (next < todayMid) next = new Date(todayMid.getFullYear() + 1, b.getMonth(), dayInYear(todayMid.getFullYear() + 1));
  return Math.round((next - todayMid) / 86400000);
}
function birthdayAge(birthday, today = new Date()) {
  if (!birthday || !isValidDateKey(birthday)) return null;
  const born = keyToDate(birthday);
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (born > todayMid) return null;
  const observedDay = born.getMonth() === 1 && born.getDate() === 29 && !isLeapYear(todayMid.getFullYear()) ? 28 : born.getDate();
  const birthdayThisYear = new Date(todayMid.getFullYear(), born.getMonth(), observedDay);
  return todayMid.getFullYear() - born.getFullYear() - (todayMid < birthdayThisYear ? 1 : 0);
}
function ageAtNextBirthday(birthday, today = new Date()) {
  if (!birthday || !isValidDateKey(birthday)) return null;
  const born = keyToDate(birthday);
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (born > todayMid) return null;
  const dayInYear = (year) => born.getMonth() === 1 && born.getDate() === 29 && !isLeapYear(year) ? 28 : born.getDate();
  let birthdayYear = todayMid.getFullYear();
  if (new Date(birthdayYear, born.getMonth(), dayInYear(birthdayYear)) < todayMid) birthdayYear += 1;
  return birthdayYear - born.getFullYear();
}

function PersonsPage({ persons, persistPersons, personGroups, onAddPersonGroup }) {
  const [showModal, setShowModal] = useState(false);
  const [modalPerson, setModalPerson] = useState(undefined);
  const [celebrateId, setCelebrateId] = useState(null);
  const [showNetwork, setShowNetwork] = useState(false);
  const [networkGroup, setNetworkGroup] = useState(null);
  const [pendingMeeting, setPendingMeeting] = useState(null);
  const [pendingGroupMeeting, setPendingGroupMeeting] = useState(null);
  const [relationshipSuggestions, setRelationshipSuggestions] = useState([]);

  const trackedPersons = persons.filter((p) => p.meetingTrackingEnabled !== false);
  const totalMeetings = trackedPersons.reduce((s, p) => s + (p.meetings || []).length, 0);
  const metTodayCount = trackedPersons.filter((p) => (p.meetings || []).includes(todayKey())).length;
  const relationshipCount = persons.reduce((s, p) => s + (p.relationships || []).length, 0) / 2;

  const handleSave = (person) => {
    const exists = persons.some((p) => p.id === person.id);
    const next = exists ? persons.map((p) => (p.id === person.id ? person : p)) : [...persons, person];
    persistPersons(next);
    setShowModal(false);
    setModalPerson(undefined);
  };

  const handleDelete = (id) => {
    // Entfernt die Person + räumt Verbindungen auf, die von anderen Personen noch auf sie zeigen
    const next = persons.filter((p) => p.id !== id).map((p) => ({
      ...p, relationships: (p.relationships || []).filter((r) => r.personId !== id),
      dismissedRelationshipSuggestions: (p.dismissedRelationshipSuggestions || []).filter((suggestion) => suggestion.personId !== id),
    }));
    persistPersons(next);
    setShowModal(false);
    setModalPerson(undefined);
  };

  const saveMeetingForPeople = (personIds, date) => {
    const selectedIds = new Set(personIds);
    const next = persons.map((p) => (selectedIds.has(p.id) ? { ...p, meetings: [...(p.meetings || []), date] } : p));
    persistPersons(next);
    setCelebrateId(personIds[0]);
    setTimeout(() => setCelebrateId(null), 1200);
  };

  const logMeeting = (person, date = todayKey()) => {
    if (person.meetingTrackingEnabled === false || !date || date > todayKey()) return;
    const connectedPeople = (person.relationships || []).flatMap((relationship) => {
      const connectedPerson = persons.find((candidate) => candidate.id === relationship.personId);
      return connectedPerson && connectedPerson.meetingTrackingEnabled !== false
        ? [{ person: connectedPerson, relationshipType: relationship.type }]
        : [];
    }).sort((a, b) => a.person.name.localeCompare(b.person.name, "de"));

    if (connectedPeople.length === 0) {
      saveMeetingForPeople([person.id], date);
      return;
    }
    setPendingMeeting({ person, date, connectedPeople, selectedIds: [] });
  };

  const confirmMeeting = () => {
    if (!pendingMeeting) return;
    saveMeetingForPeople([pendingMeeting.person.id, ...pendingMeeting.selectedIds], pendingMeeting.date);
    setPendingMeeting(null);
  };

  const confirmGroupMeeting = () => {
    if (!pendingGroupMeeting) return;
    const memberIds = pendingGroupMeeting.people
      .filter((person) => person.meetingTrackingEnabled !== false)
      .map((person) => person.id);
    if (memberIds.length > 0) saveMeetingForPeople(memberIds, pendingGroupMeeting.date);
    setPendingGroupMeeting(null);
  };

  // Löscht genau ein Treffen anhand seiner Position. Das ist wichtig, weil an
  // demselben Tag mehrere Treffen eingetragen sein können.
  const deleteMeeting = (personId, meetingIndex) => {
    const next = persons.map((p) => {
      if (p.id !== personId) return p;
      return { ...p, meetings: (p.meetings || []).filter((_, index) => index !== meetingIndex) };
    });
    persistPersons(next);
  };

  // Baut eine bidirektionale Verbindung auf, ohne mögliche Folgebeziehungen zu
  // prüfen. Diese Variante wird auch für ausdrücklich bestätigte Vorschläge genutzt.
  const addRelationshipDirectly = (personId, targetId, type, sourcePersons = persons) => {
    if (!targetId || personId === targetId) return;
    const inverseType = inverseRelationshipKey(type);
    const next = sourcePersons.map((p) => {
      if (p.id === personId) {
        const rels = (p.relationships || []).filter((r) => r.personId !== targetId);
        return {
          ...p,
          relationships: [...rels, { personId: targetId, type }],
          dismissedRelationshipSuggestions: (p.dismissedRelationshipSuggestions || []).filter((suggestion) => suggestion.personId !== targetId),
        };
      }
      if (p.id === targetId) {
        const rels = (p.relationships || []).filter((r) => r.personId !== personId);
        return {
          ...p,
          relationships: [...rels, { personId, type: inverseType }],
          dismissedRelationshipSuggestions: (p.dismissedRelationshipSuggestions || []).filter((suggestion) => suggestion.personId !== personId),
        };
      }
      return p;
    });
    persistPersons(next);
    return next;
  };

  // Sammelt wahrscheinliche Familienbeziehungen, die sich aus einer neuen
  // Eltern-/Kind-Verbindung ergeben. Bestehende Verbindungen werden nie ersetzt.
  const legacyInferredRelationships = (sourcePersons, personId, targetId, type) => {
    if (type !== "parent" && type !== "child") return [];
    const parentId = type === "parent" ? personId : targetId;
    const childId = type === "parent" ? targetId : personId;
    const byId = new Map(sourcePersons.map((person) => [person.id, person]));
    const parent = byId.get(parentId);
    const child = byId.get(childId);
    if (!parent || !child) return [];
    const hasConnection = (aId, bId) => (byId.get(aId)?.relationships || []).some((relationship) => relationship.personId === bId);
    const suggestions = [];
    const seen = new Set();
    const suggest = (sourceId, destinationId, suggestedType, reason) => {
      const key = [sourceId, destinationId].sort().join("|");
      if (sourceId === destinationId || seen.has(key) || hasConnection(sourceId, destinationId)) return;
      seen.add(key);
      suggestions.push({ personId: sourceId, targetId: destinationId, type: suggestedType, reason });
    };

    // Partner des Elternteils könnten ebenfalls Elternteil des Kindes sein.
    (parent.relationships || []).filter((relationship) => relationship.type === "partner").forEach((relationship) => {
      suggest(relationship.personId, childId, "parent", `${byId.get(relationship.personId)?.name || "Die Partnerperson"} ist mit ${parent.name} verbunden.`);
    });
    // Bereits vorhandene Kinder desselben Elternteils könnten Geschwister sein.
    (parent.relationships || []).filter((relationship) => relationship.type === "parent" && relationship.personId !== childId).forEach((relationship) => {
      suggest(childId, relationship.personId, "sibling", `Beide sind als Kinder von ${parent.name} eingetragen.`);
    });
    // Eltern des neuen Elternteils könnten Großeltern des Kindes sein.
    (parent.relationships || []).filter((relationship) => relationship.type === "child").forEach((relationship) => {
      suggest(relationship.personId, childId, "grandparent", `${byId.get(relationship.personId)?.name || "Die Person"} ist Elternteil von ${parent.name}.`);
    });
    // Hat das neue Kind selbst Kinder, könnte das neue Elternteil deren Großelternteil sein.
    (child.relationships || []).filter((relationship) => relationship.type === "parent").forEach((relationship) => {
      suggest(parentId, relationship.personId, "grandparent", `${child.name} ist als Elternteil dieser Person eingetragen.`);
    });
    return suggestions;
  };

  const RELATIONSHIP_COMPOSITIONS = {
    "parent|parent": "grandparent",
    "child|child": "grandchild",
    "sibling|parent": "auntUncle",
    "child|sibling": "nibling",
    "sibling|child": "child",
    "parent|sibling": "parent",
    "child|auntUncle": "cousin",
    "nibling|parent": "cousin",
    "auntUncle|child": "sibling",
    "parent|nibling": "sibling",
    "sibling|nibling": "nibling",
    "nibling|sibling": "nibling",
    "child|grandparent": "auntUncle",
  };

  // Prüft Beziehungsketten A -> B -> C rund um die gerade hinzugefügte
  // Verbindung. Jede Ableitung bleibt wegen möglicher Patchwork-, Halb- oder
  // Stiefbeziehungen ein einzeln zu bestätigender Vorschlag.
  const inferredRelationships = (sourcePersons, personId, targetId, type) => {
    const byId = new Map(sourcePersons.map((person) => [person.id, person]));
    if (!byId.has(personId) || !byId.has(targetId)) return [];
    const hasConnection = (aId, bId) => (byId.get(aId)?.relationships || []).some((relationship) => relationship.personId === bId);
    const wasDismissed = (aId, bId, suggestedType) => {
      const direct = (byId.get(aId)?.dismissedRelationshipSuggestions || []).some((suggestion) => suggestion.personId === bId && suggestion.type === suggestedType);
      const inverse = (byId.get(bId)?.dismissedRelationshipSuggestions || []).some((suggestion) => suggestion.personId === aId && suggestion.type === inverseRelationshipKey(suggestedType));
      return direct || inverse;
    };
    const suggestions = [];
    const seen = new Set();
    const suggest = (sourceId, destinationId, suggestedType, reason) => {
      const key = [sourceId, destinationId].sort().join("|");
      if (sourceId === destinationId || seen.has(key) || hasConnection(sourceId, destinationId) || wasDismissed(sourceId, destinationId, suggestedType)) return;
      seen.add(key);
      suggestions.push({ personId: sourceId, targetId: destinationId, type: suggestedType, reason });
    };
    const compose = (firstFrom, middleId, firstType, secondTo, secondType) => {
      const resultType = RELATIONSHIP_COMPOSITIONS[`${firstType}|${secondType}`];
      if (!resultType) return;
      const firstName = byId.get(firstFrom)?.name || "Person 1";
      const middleName = byId.get(middleId)?.name || "die verbundene Person";
      const secondName = byId.get(secondTo)?.name || "Person 2";
      suggest(firstFrom, secondTo, resultType, `${firstName} ist „${relationshipLabel(firstType)}“ ${middleName}; ${middleName} ist „${relationshipLabel(secondType)}“ ${secondName}.`);
    };

    // Die neue Kante in beiden Richtungen sowohl am Anfang als auch am Ende
    // einer Zweierkette prüfen. Bestätigte Ergebnisse werden anschließend
    // erneut geprüft, wodurch auch Cousin-/Onkel-Ketten über mehrere Schritte entstehen.
    const newEdges = [
      { from: personId, to: targetId, type },
      { from: targetId, to: personId, type: inverseRelationshipKey(type) },
    ];
    newEdges.forEach((edge) => {
      (byId.get(edge.to)?.relationships || []).forEach((nextRelationship) => {
        if (nextRelationship.personId !== edge.from) compose(edge.from, edge.to, edge.type, nextRelationship.personId, nextRelationship.type);
      });
      sourcePersons.forEach((candidate) => (candidate.relationships || []).forEach((previousRelationship) => {
        if (previousRelationship.personId === edge.from && candidate.id !== edge.to) {
          compose(candidate.id, edge.from, previousRelationship.type, edge.to, edge.type);
        }
      }));
    });

    // Partner als möglicher weiterer Elternteil sowie Kinder desselben
    // Elternteils als mögliche Geschwister sind keine sichere Transitivität.
    if (type === "parent" || type === "child") {
      const parentId = type === "parent" ? personId : targetId;
      const childId = type === "parent" ? targetId : personId;
      const parent = byId.get(parentId);
      (parent.relationships || []).filter((relationship) => relationship.type === "partner").forEach((relationship) => {
        suggest(relationship.personId, childId, "parent", `${byId.get(relationship.personId)?.name || "Die Partnerperson"} ist mit ${parent.name} verbunden.`);
      });
      (parent.relationships || []).filter((relationship) => relationship.type === "parent" && relationship.personId !== childId).forEach((relationship) => {
        suggest(childId, relationship.personId, "sibling", `Beide sind als Kinder von ${parent.name} eingetragen.`);
      });
    }
    return suggestions;
  };

  // Trägt die gewünschte Verbindung ein und stellt danach alle daraus
  // abgeleiteten Vorschläge nacheinander zur Bestätigung bereit.
  const addRelationship = (personId, targetId, type) => {
    if (!targetId || personId === targetId) return;
    const next = addRelationshipDirectly(personId, targetId, type);
    if (!next) return;
    const suggestions = inferredRelationships(next, personId, targetId, type);
    if (suggestions.length) setRelationshipSuggestions((current) => [...current, ...suggestions]);
  };

  const answerRelationshipSuggestion = (accepted) => {
    const current = relationshipSuggestions[0];
    if (!current) return;
    if (!accepted) {
      const inverseType = inverseRelationshipKey(current.type);
      const nextPersons = persons.map((person) => {
        if (person.id !== current.personId && person.id !== current.targetId) return person;
        const otherId = person.id === current.personId ? current.targetId : current.personId;
        const rejectedType = person.id === current.personId ? current.type : inverseType;
        const existing = (person.dismissedRelationshipSuggestions || []).filter((suggestion) => !(suggestion.personId === otherId && suggestion.type === rejectedType));
        return { ...person, dismissedRelationshipSuggestions: [...existing, { personId: otherId, type: rejectedType }] };
      });
      persistPersons(nextPersons);
      setRelationshipSuggestions((suggestions) => suggestions.slice(1));
      return;
    }
    const nextPersons = addRelationshipDirectly(current.personId, current.targetId, current.type);
    const followUps = nextPersons ? inferredRelationships(nextPersons, current.personId, current.targetId, current.type) : [];
    setRelationshipSuggestions((suggestions) => {
      const combined = [...suggestions.slice(1), ...followUps];
      const seen = new Set();
      return combined.filter((suggestion) => {
        const key = [suggestion.personId, suggestion.targetId].sort().join("|");
        const alreadyConnected = (nextPersons?.find((person) => person.id === suggestion.personId)?.relationships || []).some((relationship) => relationship.personId === suggestion.targetId);
        if (alreadyConnected || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    });
  };

  const removeRelationship = (personId, targetId) => {
    const next = persons.map((p) => {
      if (p.id === personId) return { ...p, relationships: (p.relationships || []).filter((r) => r.personId !== targetId) };
      if (p.id === targetId) return { ...p, relationships: (p.relationships || []).filter((r) => r.personId !== personId) };
      return p;
    });
    persistPersons(next);
  };

  const sorted = [...persons].sort((a, b) => a.name.localeCompare(b.name, "de"));
  const grouped = useMemo(() => {
    const map = {};
    sorted.forEach((person) => {
      const assignedGroups = person.groups || (person.category ? [person.category] : []);
      const effectiveGroups = assignedGroups.length ? assignedGroups : [UNCATEGORIZED];
      effectiveGroups.forEach((group) => { if (!map[group]) map[group] = []; map[group].push(person); });
    });
    return Object.keys(map).sort((a, b) => a === UNCATEGORIZED ? 1 : b === UNCATEGORIZED ? -1 : a.localeCompare(b, "de")).map((category) => ({ category, habits: map[category] }));
  }, [persons]);
  const networkPersons = useMemo(() => {
    if (!networkGroup) return persons;
    const members = persons.filter((person) => (person.groups || (person.category ? [person.category] : [])).includes(networkGroup));
    const visibleIds = new Set(members.map((person) => person.id));
    members.forEach((person) => (person.relationships || []).forEach((relationship) => visibleIds.add(relationship.personId)));
    return persons.filter((person) => visibleIds.has(person.id));
  }, [persons, networkGroup]);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, margin: 0 }}>Personen</h1>
        <div style={{ display: "flex", gap: 10 }}>
          {persons.length > 1 && (
            <button onClick={() => { setNetworkGroup(null); setShowNetwork(true); }} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6 }}>
              <Users size={15} /> Verbindungen
            </button>
          )}
          <button onClick={() => { setModalPerson(undefined); setShowModal(true); }} style={{ ...primaryBtn, display: "flex", alignItems: "center", gap: 6 }}>
            <Plus size={15} /> Neue Person
          </button>
        </div>
      </div>

      {persons.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 12, marginBottom: 26 }}>
          <StatCard label="Personen" value={persons.length} suffix="" accent={COLORS.violet} />
          <StatCard label="Treffen gesamt" value={totalMeetings} suffix="" accent={COLORS.mint} />
          <StatCard label="Heute getroffen" value={metTodayCount} suffix="" accent={COLORS.ember2} />
          {relationshipCount > 0 && <StatCard label="Verbindungen" value={relationshipCount} suffix="" accent={COLORS.coral} />}
        </div>
      )}

      {persons.length === 0 ? (
        <div style={{ textAlign: "center", padding: "48px 20px", border: `1px dashed ${COLORS.border}`, borderRadius: 16, color: COLORS.textMuted }}>
          <Users size={28} style={{ color: COLORS.violet, marginBottom: 10 }} />
          <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text, marginBottom: 4 }}>Noch keine Personen</div>
          <div style={{ fontSize: 13, marginBottom: 16 }}>Leg Personen an und halte über die Treffen-Schaltfläche fest, wann ihr euch seht.</div>
          <button onClick={() => { setModalPerson(undefined); setShowModal(true); }} style={primaryBtn}>Erste Person anlegen</button>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          {grouped.map(({ category, habits: groupPersons }) => (
            <div key={category}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8, flexWrap: "wrap" }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: categoryColor(category) }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{category}</span>
                {category !== UNCATEGORIZED && groupPersons.some((person) => person.meetingTrackingEnabled !== false) && (
                  <button onClick={() => setPendingGroupMeeting({ groupName: category, people: groupPersons, date: todayKey() })} style={{ ...primaryBtn, marginLeft: "auto", padding: "5px 8px", fontSize: 10.5, display: "flex", alignItems: "center", gap: 5 }}>
                    <Plus size={11} /> Gruppentreffen
                  </button>
                )}
                {category !== UNCATEGORIZED && groupPersons.length > 1 && <button onClick={() => { setNetworkGroup(category); setShowNetwork(true); }} style={{ ...ghostBtn, padding: "5px 8px", fontSize: 10.5, display: "flex", alignItems: "center", gap: 5 }}><Users size={11} /> Verbindungen</button>}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {groupPersons.map((p) => (
                  <PersonRow
                    key={p.id}
                    person={p}
                    celebrating={celebrateId === p.id}
                    onLogMeeting={(date) => logMeeting(p, date)}
                    onDeleteMeeting={(meetingIndex) => deleteMeeting(p.id, meetingIndex)}
                    onEdit={() => { setModalPerson(p); setShowModal(true); }}
                  />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {showModal && (
        <PersonModal
          initial={modalPerson}
          groups={personGroups}
          onAddGroup={onAddPersonGroup}
          persons={persons}
          onAddRelationship={addRelationship}
          onRemoveRelationship={removeRelationship}
          onClose={() => { setShowModal(false); setModalPerson(undefined); }}
          onSave={handleSave}
          onDelete={handleDelete}
        />
      )}

      {showNetwork && (
        <PersonNetworkView
          persons={networkPersons}
          title={networkGroup ? `Verbindungen · ${networkGroup}` : "Verbindungen"}
          onClose={() => { setShowNetwork(false); setNetworkGroup(null); }}
          onEditPerson={(p) => { setShowNetwork(false); setNetworkGroup(null); setModalPerson(p); setShowModal(true); }}
        />
      )}

      {pendingMeeting && (
        <MeetingPeopleModal
          meeting={pendingMeeting}
          onChange={(selectedIds) => setPendingMeeting((current) => current ? { ...current, selectedIds } : current)}
          onClose={() => setPendingMeeting(null)}
          onConfirm={confirmMeeting}
        />
      )}

      {pendingGroupMeeting && (
        <GroupMeetingModal
          meeting={pendingGroupMeeting}
          onDateChange={(date) => setPendingGroupMeeting((current) => current ? { ...current, date } : current)}
          onClose={() => setPendingGroupMeeting(null)}
          onConfirm={confirmGroupMeeting}
        />
      )}

      {relationshipSuggestions.length > 0 && (
        <RelationshipSuggestionModal
          suggestion={relationshipSuggestions[0]}
          persons={persons}
          remaining={relationshipSuggestions.length}
          onAnswer={answerRelationshipSuggestion}
        />
      )}
    </div>
  );
}
